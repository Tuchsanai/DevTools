006)"><text x="0" y="14.365332031249999" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#c92a2a" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ความจริงเรื่องความปลอดภัยที่ต้องพูดพร้อมกันเสมอ</text></g><g transform="translate(50 334) rotate(0 334.86767578125 25.875)"><text x="0" y="12.67529296875" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#5b6b7f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">• :ro ทำให้ “ไฟล์ socket” อ่านอย่างเดียว แต่ไม่ได้ทำให้ Docker API เป็น read-only</text><text x="0" y="29.92529296875" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#5b6b7f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">• ใครเข้าถึง Docker API ได้ = สั่งสร้าง container ที่ mount ทั้งเครื่องได้ = เท่ากับ root ของโฮสต์</text><text x="0" y="47.17529296875" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#5b6b7f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">• งานจริงจึงใช้ socket proxy ที่กรอง endpoint (เช่น อนุญาตเฉพาะ GET /containers) แทนการ mount ตรง</text></g><g transform="translate(30 466) rotate(0 375.578125 9.199999999999989)"><text x="0" y="13.5203125" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#0b2545" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ไม่มี provider = ไม่มี dynamic config : Traefik ที่รันเปล่า ๆ ตอบ 404 ทุก request เพราะไม่มี router ให้เลือกเลย</text></g></svg>