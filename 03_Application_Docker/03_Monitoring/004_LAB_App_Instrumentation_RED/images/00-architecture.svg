<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="'DejaVu Sans','Noto Sans Thai',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="700" fill="#f8fafc"/>
  <text x="30" y="42" font-size="24" font-weight="700" fill="#0f172a">LAB 4 — App Instrumentation &amp; RED Method</text>
  <text x="30" y="68" font-size="15" fill="#475569">แอปวัดตัวเอง → Prometheus ดึงไปเก็บ → PromQL คำนวณ RED → Grafana วาด (compose project: monlab4, network: monnet)</text>

  <!-- classroom box -->
  <rect x="24" y="90" width="1072" height="580" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="44" y="116" font-size="13" font-weight="700" fill="#64748b">classroom container (tuchsanai/devtools:2569_1) — Docker-in-Docker</text>

  <!-- loadgen -->
  <rect x="52" y="150" width="190" height="130" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="147" y="178" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">monlab4-loadgen</text>
  <text x="147" y="200" font-size="12" fill="#047857" text-anchor="middle">python:3.13-alpine</text>
  <text x="66" y="224" font-size="12" fill="#065f46">RPS=10 · SEED=2569</text>
  <text x="66" y="243" font-size="12" fill="#065f46">ERROR_MIX=0.20</text>
  <text x="66" y="262" font-size="12" fill="#065f46">SLOW_MIX=0.10</text>

  <!-- app -->
  <rect x="322" y="130" width="250" height="240" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="447" y="158" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">monlab4-app :8000</text>
  <text x="447" y="178" font-size="12" fill="#1d4ed8" text-anchor="middle">http.server + prometheus_client 0.26.0</text>
  <line x1="338" y1="190" x2="556" y2="190" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="338" y="210" font-size="12" fill="#1e3a8a">GET /                     เร็วมาก</text>
  <text x="338" y="229" font-size="12" fill="#1e3a8a">GET /api/items            20–120 ms</text>
  <text x="338" y="248" font-size="12" fill="#1e3a8a">GET /api/items/&lt;id&gt;       10–50 ms</text>
  <text x="338" y="267" font-size="12" fill="#1e3a8a">GET /api/slow             0.7–1.9 s</text>
  <text x="338" y="286" font-size="12" fill="#1e3a8a">GET /api/error            500 ครึ่งหนึ่ง</text>
  <text x="338" y="305" font-size="12" fill="#1e3a8a">GET /healthz</text>
  <line x1="338" y1="318" x2="556" y2="318" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="338" y="338" font-size="12" font-weight="700" fill="#b45309">GET /metrics  ← หน้าที่พ่นตัวเลข</text>
  <text x="338" y="357" font-size="11" fill="#1d4ed8">label endpoint = template เท่านั้น</text>

  <!-- metric box under app -->
  <rect x="322" y="392" width="250" height="160" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="447" y="416" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">มิเตอร์ 4 ตัวในแอป</text>
  <text x="332" y="440" font-size="10.5" fill="#92400e">Counter   app_requests_total</text>
  <text x="334" y="456" font-size="10" fill="#b45309">          labels: method, endpoint, status</text>
  <text x="332" y="477" font-size="10.5" fill="#92400e">Histogram app_request_duration_seconds</text>
  <text x="334" y="493" font-size="10" fill="#b45309">          labels: endpoint · 9 buckets</text>
  <text x="332" y="514" font-size="10.5" fill="#92400e">Gauge     app_inflight_requests</text>
  <text x="332" y="535" font-size="10.5" fill="#92400e">Gauge     app_build_info{version}</text>

  <!-- prometheus -->
  <rect x="652" y="150" width="200" height="150" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="752" y="178" font-size="16" font-weight="700" fill="#9f1239" text-anchor="middle">monlab4-prometheus</text>
  <text x="752" y="198" font-size="12" fill="#be123c" text-anchor="middle">prom/prometheus:v3.7.3</text>
  <text x="666" y="224" font-size="12" fill="#9f1239">:9090 · scrape_interval 5s</text>
  <text x="666" y="245" font-size="12" fill="#9f1239">job: app → app:8000</text>
  <text x="666" y="266" font-size="12" fill="#9f1239">job: prometheus (ตัวเอง)</text>
  <text x="666" y="287" font-size="12" fill="#9f1239">TSDB: volume prom-data</text>

  <!-- grafana -->
  <rect x="902" y="150" width="170" height="150" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="987" y="178" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="middle">monlab4-grafana</text>
  <text x="987" y="198" font-size="12" fill="#6d28d9" text-anchor="middle">grafana:12.3.1</text>
  <text x="916" y="224" font-size="12" fill="#5b21b6">:3000</text>
  <text x="916" y="245" font-size="12" fill="#5b21b6">datasource uid</text>
  <text x="916" y="264" font-size="12" font-weight="700" fill="#5b21b6">monprom</text>
  <text x="916" y="285" font-size="12" fill="#5b21b6">dashboard as code</text>

  <!-- RED box -->
  <rect x="652" y="340" width="420" height="180" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="862" y="366" font-size="14" font-weight="700" fill="#115e59" text-anchor="middle">PromQL ที่แปลง metric ดิบ → RED</text>
  <text x="666" y="392" font-size="12" font-weight="700" fill="#0f766e">R</text>
  <text x="690" y="392" font-size="11.5" fill="#115e59">sum(rate(app_requests_total[1m]))</text>
  <text x="666" y="424" font-size="12" font-weight="700" fill="#0f766e">E</text>
  <text x="690" y="424" font-size="11.5" fill="#115e59">sum(rate(app_requests_total{status=~"5.."}[1m]))</text>
  <text x="690" y="442" font-size="11.5" fill="#115e59">  / sum(rate(app_requests_total[1m]))</text>
  <text x="666" y="474" font-size="12" font-weight="700" fill="#0f766e">D</text>
  <text x="690" y="474" font-size="11.5" fill="#115e59">histogram_quantile(0.95, sum by (le) (</text>
  <text x="690" y="492" font-size="11.5" fill="#115e59">  rate(app_request_duration_seconds_bucket[5m])))</text>

  <!-- arrows -->
  <line x1="242" y1="215" x2="316" y2="215" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="279" y="205" font-size="11" fill="#047857" text-anchor="middle">HTTP</text>
  <text x="279" y="238" font-size="11" fill="#047857" text-anchor="middle">10 req/s</text>

  <path d="M 646 230 L 578 230" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="612" y="220" font-size="11" fill="#1d4ed8" text-anchor="middle">pull</text>
  <text x="612" y="253" font-size="10.5" fill="#1d4ed8" text-anchor="middle">GET /metrics</text>
  <text x="612" y="268" font-size="10.5" fill="#1d4ed8" text-anchor="middle">ทุก 5 วินาที</text>

  <line x1="852" y1="225" x2="896" y2="225" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="874" y="215" font-size="10.5" fill="#6d28d9" text-anchor="middle">query</text>

  <line x1="752" y1="300" x2="752" y2="334" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- cardinality warning -->
  <rect x="52" y="330" width="250" height="190" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="177" y="356" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">ช่วง "ทำให้พังแล้วแก้"</text>
  <text x="66" y="382" font-size="12" fill="#991b1b">RAW_PATH_LABEL=1</text>
  <text x="66" y="404" font-size="11.5" fill="#991b1b">→ label = path ดิบ</text>
  <text x="66" y="424" font-size="11.5" fill="#991b1b">→ /api/items/1, /2, /3 ...</text>
  <text x="66" y="444" font-size="11.5" fill="#991b1b">→ 1 id = 1 series ใหม่</text>
  <line x1="66" y1="458" x2="288" y2="458" stroke="#fecaca" stroke-width="1.5"/>
  <text x="66" y="478" font-size="11.5" fill="#991b1b">วัดด้วย:</text>
  <text x="66" y="496" font-size="10.5" fill="#7f1d1d">count(count by (endpoint)(</text>
  <text x="66" y="511" font-size="10.5" fill="#7f1d1d">  app_requests_total))</text>

  <path d="M 302 425 L 316 425" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#arrowOrange)"/>

  <!-- footer legend -->
  <text x="44" y="592" font-size="12" fill="#475569">ทิศทางข้อมูล: loadgen ยิงโหลด → แอปวัดตัวเองระหว่างตอบ request → Prometheus <tspan font-weight="700">ดึง (pull)</tspan> จาก /metrics ทุก 5 วินาที → PromQL คำนวณ RED → Grafana แสดงผล</text>
  <text x="44" y="614" font-size="12" fill="#475569">port ที่เปิดออกมาที่เครื่องเรียน: <tspan font-weight="700">8000</tspan> (แอป) · <tspan font-weight="700">9090</tspan> (Prometheus) · <tspan font-weight="700">3000</tspan> (Grafana) — loadgen ไม่เปิด port เพราะเป็นฝั่งยิงอย่างเดียว</text>
  <text x="44" y="636" font-size="12" fill="#475569">แอปรันเป็น <tspan font-weight="700">process เดียว</tspan> (ThreadingHTTPServer) เพื่อให้ registry ของ prometheus_client มีชุดเดียว — หลาย worker process จะทำให้ counter กระโดด</text>
</svg>
