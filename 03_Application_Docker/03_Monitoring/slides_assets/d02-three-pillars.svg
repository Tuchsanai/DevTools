03.513671875 13.799999999999997)"><text x="0" y="20.280468749999997" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#c2410c" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">LOGS — เหตุการณ์</text></g><g transform="translate(785 102) rotate(0 107.341796875 13.799999999999997)"><text x="0" y="20.280468749999997" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#6741d9" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">TRACES — เส้นทาง</text></g><g transform="translate(45 147) rotate(0 112.953125 117.29999999999998)"><text x="0" y="14.365332031249999" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ตอบคำถามว่า</text><text x="0" y="33.915332031249996" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">"ตอนนี้เป็นอย่างไร?"</text><text x="0" y="53.46533203124999" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="0" y="73.01533203124998" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">• ตัวเลขตามเวลา (time series)</text><text x="0" y="92.56533203125" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">• เล็ก เก็บย้อนหลังได้นาน</text><text x="0" y="112.11533203124998" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">• เหมาะกับ dashboard + alert</text><text x="0" y="131.66533203125" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">• ตอบไม่ได้ว่า "ทำไม"</text><text x="0" y="151.21533203124997" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="0" y="170.76533203124998" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">เครื่องมือ :</text><text x="0" y="190.31533203125" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Prometheus + Grafana</text><text x="0" y="209.86533203124998" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="0" y="229.41533203124996" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ชุดนี้เน้นเสานี้</text></g><g transform="translate(415 147) rotate(0 96.796142578125 117.29999999999998)"><text x="0" y="14.365332031249999" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ตอบคำถามว่า</text><text x="0" y="33.915332031249996" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">"เกิดอะไรขึ้นกันแน่?"</text><text x="0" y="53.46533203124999" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="0" y="73.01533203124998" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">• ข้อความรายเหตุการณ์</text><text x="0" y="92.56533203125" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">• มีรายละเอียด stack trace</text><text x="0" y="112.11533203124998" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">• กินที่เก็บมากกว่า</text><text x="0" y="131.66533203125" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">• ค้นหาช้ากว่า metrics</text><text x="0" y="151.21533203124997" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="0" y="170.76533203124998" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">เครื่องมือ :</text><text x="0" y="190.31533203125" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Loki / ELK</text><text x="0" y="209.86533203124998" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="0" y="229.41533203124996" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">(นอกขอบเขตชุดนี้)</text></g><g transform="translate(785 147) rotate(0 103.1494140625 117.29999999999998)"><text x="0" y="14.365332031249999" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ตอบคำถามว่า</text><text x="0" y="33.915332031249996" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">"request นี้ช้าตรงไหน?"</text><text x="0" y="53.46533203124999" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="0" y="73.01533203124998" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">• ตาม request ข้าม service</text><text x="0" y="92.56533203125" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">• เห็นเวลาของแต่ละช่วง</text><text x="0" y="112.11533203124998" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">• จำเป็นเมื่อมี microservices</text><text x="0" y="131.66533203125" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">• ต้องแก้โค้ดให้ส่ง context</text><text x="0" y="151.21533203124997" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="0" y="170.76533203124998" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">เครื่องมือ :</text><text x="0" y="190.31533203125" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Tempo / Jaeger</text><text x="0" y="209.86533203124998" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="0" y="229.41533203124996" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">(นอกขอบเขตชุดนี้)</text></g><g stroke-linecap="round" transform="translate(20 437) rotate(0 540 35)"><path d="M0 0 L1080 0 L1080 70 L0 70" stroke="none" stroke-width="0" fill="#ebfbee"/><path d="M0 0 C341.89 0, 683.79 0, 1080 0 M0 0 C241.01 0, 482.03 0, 1080 0 M1080 0 C1080 27.64, 1080 55.28, 1080 70 M1080 0 C1080 20.84, 1080 41.69, 1080 70 M1080 70 C688.24 70, 296.48 70, 0 70 M1080 70 C669.36 70, 258.72 70, 0 70 M0 70 C0 42.02, 0 14.04, 0 0 M0 70 C0 54.02, 0 38.04, 0 0" stroke="#2f9e44" stroke-width="2" fill="none"/></g><g transform="translate(68.5 459.5) rotate(0 491.5 12.5)"><text x="491.5" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#2f9e44" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">เริ่มจาก Metrics เสมอ : มันตอบได้ว่า "มีอะไรผิดปกติ ตั้งแต่เมื่อไร ที่ไหน" — แล้วค่อยขุดต่อด้วย Logs / Traces</text></g></svg>