<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 527" width="1130" height="527"><!-- svg-source:excalidraw --><metadata/><defs><style class="style-fonts">
      @font-face { font-family: Excalifont; src: url(data:font/woff2;base64,); }</style></defs><rect x="0" y="0" width="1130" height="527" fill="#ffffff"/><g transform="translate(10 10) rotate(0 362.5166015625 16.099999999999998)"><text x="0" y="23.660546874999998" font-family="Helvetica, Segoe UI Emoji" font-size="28px" fill="#0b2545" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">SLI / SLO / Error Budget — ตั้งเป้าเป็นตัวเลขที่เถียงกันไม่ได้</text></g><g stroke-linecap="round" transform="translate(10 92) rotate(0 177.5 80)"><path d="M0 0 L355 0 L355 160 L0 160" stroke="none" stroke-width="0" fill="#d0ebff"/><path d="M0 0 C105.95 0, 211.91 0, 355 0 M0 0 C129 0, 258 0, 355 0 M355 0 C355 50.14, 355 100.27, 355 160 M355 0 C355 47.92, 355 95.84, 355 160 M355 160 C218.11 160, 81.22 160, 0 160 M355 160 C281.74 160, 208.47 160, 0 160 M0 160 C0 119.69, 0 79.38, 0 0 M0 160 C0 127.91, 0 95.82, 0 0" stroke="#1864ab" stroke-width="2" fill="none"/></g><g transform="translate(74.5 97) rotate(0 113 75)"><text x="113" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#1864ab" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">SLI — ตัววัด</text><text x="113" y="42.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#1864ab" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="113" y="67.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#1864ab" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">"สัดส่วน request ที่สำเร็จ</text><text x="113" y="92.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#1864ab" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">และเร็วกว่า 1 วินาที"</text><text x="113" y="117.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#1864ab" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="113" y="142.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#1864ab" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">คือ PromQL หนึ่งบรรทัด</text></g><g stroke-linecap="round" transform="translate(385 92) rotate(0 177.5 80)"><path d="M0 0 L355 0 L355 160 L0 160" stroke="none" stroke-width="0" fill="#ffe8cc"/><path d="M0 0 C119.6 0, 239.19 0, 355 0 M0 0 C78.37 0, 156.74 0, 355 0 M355 0 C355 50.76, 355 101.51, 355 160 M355 0 C355 46.54, 355 93.08, 355 160 M355 160 C214.08 160, 73.17 160, 0 160 M355 160 C276.49 160, 197.99 160, 0 160 M0 160 C0 105.99, 0 51.98, 0 0 M0 160 C0 116.03, 0 72.06, 0 0" stroke="#e8590c" stroke-width="2" fill="none"/></g><g transform="translate(476.01171875 97) rotate(0 86.48828125 75)"><text x="86.48828125" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e8590c" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">SLO — เป้าหมาย</text><text x="86.48828125" y="42.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e8590c" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="86.48828125" y="67.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e8590c" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">"SLI ต้อง ≥ 99.9%</text><text x="86.48828125" y="92.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e8590c" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">วัดต่อเนื่อง 30 วัน"</text><text x="86.48828125" y="117.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e8590c" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="86.48828125" y="142.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e8590c" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">คือสัญญาที่ทีมให้ไว้</text></g><g stroke-linecap="round" transform="translate(760 92) rotate(0 180 80)"><path d="M0 0 L360 0 L360 160 L0 160" stroke="none" stroke-width="0" fill="#ffe3e3"/><path d="M0 0 C102.18 0, 204.35 0, 360 0 M0 0 C94.33 0, 188.65 0, 360 0 M360 0 C360 42.8, 360 85.61, 360 160 M360 0 C360 42.1, 360 84.2, 360 160 M360 160 C226.51 160, 93.03 160, 0 160 M360 160 C247.82 160, 135.63 160, 0 160 M0 160 C0 115.08, 0 70.16, 0 0 M0 160 C0 117.21, 0 74.42, 0 0" stroke="#c92a2a" stroke-width="2" fill="none"/></g><g transform="translate(816.5 97) rotate(0 123.5 75)"><text x="123.5" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#c92a2a" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Error Budget — โควตาพัง</text><text x="123.5" y="42.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#c92a2a" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="123.5" y="67.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#c92a2a" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">100% − 99.9% = 0.1%</text><text x="123.5" y="92.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#c92a2a" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ของ 30 วัน = 43 นาที</text><text x="123.5" y="117.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#c92a2a" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="123.5" y="142.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#c92a2a" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">คือ "งบ" ที่ใช้ได้ต่อเดือน</text></g><g transform="translate(10 257) rotate(0 106.6728515625 10.925000000000011)"><text x="0" y="16.055371093749997" font-family="Helvetica, Segoe UI Emoji" font-size="19px" fill="#16212f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">งบพังของเดือนนี้ (43 นาที)</text></g><g stroke-linecap="round" transform="translate(10 292) rotate(0 210 27.5)"><path d="M0 0 L420 0 L420 55 L0 55" stroke="none" stroke-width="0" fill="#ffe3e3"/><path d="M0 0 C85.3 0, 170.6 0, 420 0 M0 0 C147.1 0, 294.2 0, 420 0 M420 0 C420 13.75, 420 27.49, 420 55 M420 0 C420 16.69, 420 33.38, 420 55 M420 55 C267.74 55, 115.48 55, 0 55 M420 55 C313.76 55, 207.52 55, 0 55 M0 55 C0 34.88, 0 14.75, 0 0 M0 55 C0 43.2, 0 31.4, 0 0" stroke="#c92a2a" stroke-width="2" fill="none"/></g><g transform="translate(138 307) rotate(0 82 12.5)"><text x="82" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#c92a2a" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ใช้ไปแล้ว 28 นาที</text></g><g stroke-linecap="round" transform="translate(430 292) rotate(0 345 27.5)"><path d="M0 0 L690 0 L690 55 L0 55" stroke="none" stroke-width="0" fill="#ebfbee"/><path d="M0 0 C230.81 0, 461.62 0, 690 0 M0 0 C247.44 0, 494.89 0, 690 0 M690 0 C690 12, 690 24, 690 55 M690 0 C690 19.06, 690 38.12, 690 55 M690 55 C427.32 55, 164.65 55, 0 55 M690 55 C500.36 55, 310.72 55, 0 55 M0 55 C0 43.57, 0 32.14, 0 0 M0 55 C0 33.27, 0 11.53, 0 0" stroke="#2f9e44" stroke-width="2" fill="none"/></g><g transform="translate(715.5 307) rotate(0 59.5 12.5)"><text x="59.5" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#2f9e44" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">เหลือ 15 นาที</text></g><g stroke-linecap="round" transform="translate(10 382) rotate(0 555 67.5)"><path d="M0 0 L1110 0 L1110 135 L0 135" stroke="none" stroke-width="0" fill="#e7f5ff"/><path d="M0 0 C367.62 0, 735.24 0, 1110 0 M0 0 C265.13 0, 530.26 0, 1110 0 M1110 0 C1110 32.68, 1110 65.37, 1110 135 M1110 0 C1110 42.98, 1110 85.97, 1110 135 M1110 135 C708.73 135, 307.47 135, 0 135 M1110 135 C773.77 135, 437.54 135, 0 135 M0 135 C0 102.64, 0 70.27, 0 0 M0 135 C0 84.16, 0 33.32, 0 0" stroke="#1864ab" stroke-width="2" fill="none"/></g><g transform="translate(77 387) rotate(0 488 62.5)"><text x="488" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#1864ab" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ทำไมต้องมีงบ : ระบบที่ไม่เคยพังเลย = ลงทุนเกินจำเป็น (99.99% แพงกว่า 99.9% หลายเท่า)</text><text x="488" y="42.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#1864ab" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Error budget เปลี่ยนคำถามจาก "ห้ามพัง" เป็น "พังได้เท่าไร แล้วเราจะใช้โควตานั้นทำอะไร"</text><text x="488" y="67.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#1864ab" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="488" y="92.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#1864ab" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">งบเหลือเยอะ → ปล่อยฟีเจอร์ใหม่ได้เร็ว กล้าทดลอง       งบใกล้หมด → หยุดปล่อยของ หันมาแก้ความเสถียรก่อน</text><text x="488" y="117.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#1864ab" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">และมันคือเหตุผลว่าทำไม alert ควรผูกกับ "อาการที่ผู้ใช้เจอ" ไม่ใช่ "CPU สูง" ที่ผู้ใช้อาจไม่รู้สึกอะไรเลย</text></g></svg>