<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Kanban board showing work flow, WIP limits, lead time, and cycle time</title>
  <desc id="desc">A five-column Kanban board with task cards, work-in-progress badges, timing brackets, a flow arrow, and six core Kanban practices.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#18181b" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1c5cab"/>
    </marker>
    <style>
      text { font-family: 'IBM Plex Sans Thai','Noto Sans Thai',Sarabun,system-ui,sans-serif; fill: #18181b; }
      .heading { font-size: 22px; font-weight: 700; }
      .card-title { font-size: 18px; font-weight: 600; }
      .badge { font-size: 18px; font-weight: 700; }
      .annotation { font-size: 19px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#fafafa"/>

  <!-- Board -->
  <g filter="url(#shadow)">
    <rect x="40" y="48" width="1200" height="398" rx="18" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <path d="M58 48 H1222 A18 18 0 0 1 1240 66 V108 H40 V66 A18 18 0 0 1 58 48 Z" fill="#eef5fd"/>
    <line x1="40" y1="108" x2="1240" y2="108" stroke="#b6c8de" stroke-width="2"/>
    <line x1="280" y1="48" x2="280" y2="446" stroke="#d4d4d8" stroke-width="2"/>
    <line x1="520" y1="48" x2="520" y2="446" stroke="#d4d4d8" stroke-width="2"/>
    <line x1="760" y1="48" x2="760" y2="446" stroke="#d4d4d8" stroke-width="2"/>
    <line x1="1000" y1="48" x2="1000" y2="446" stroke="#d4d4d8" stroke-width="2"/>
  </g>

  <!-- Column headings -->
  <g class="heading">
    <text x="64" y="86">Backlog</text>
    <text x="304" y="86">To Do</text>
    <text x="544" y="75">In Progress<tspan x="544" dy="22" font-size="18">(WIP 3)</tspan></text>
    <text x="784" y="75">Review<tspan x="784" dy="22" font-size="18">(WIP 2)</tspan></text>
    <text x="1024" y="86">Done</text>
  </g>

  <!-- WIP badges -->
  <g class="badge">
    <rect x="678" y="61" width="62" height="32" rx="16" fill="#fff4d6" stroke="#86590a" stroke-width="2"/>
    <text x="709" y="84" text-anchor="middle" fill="#86590a">3/3</text>
    <rect x="918" y="61" width="62" height="32" rx="16" fill="#eaf7ea" stroke="#116b11" stroke-width="2"/>
    <text x="949" y="84" text-anchor="middle" fill="#116b11">1/2</text>
  </g>

  <!-- Backlog cards -->
  <g>
    <g filter="url(#shadow)">
      <rect x="62" y="128" width="196" height="62" rx="10" fill="#ffffff" stroke="#d4d4d8"/>
      <rect x="62" y="128" width="9" height="62" rx="5" fill="#1c5cab"/>
    </g>
    <text class="card-title" x="84" y="166">Map user needs</text>
    <g filter="url(#shadow)">
      <rect x="62" y="206" width="196" height="62" rx="10" fill="#ffffff" stroke="#d4d4d8"/>
      <rect x="62" y="206" width="9" height="62" rx="5" fill="#2a78d6"/>
    </g>
    <text class="card-title" x="84" y="244">Draft metrics</text>
    <g filter="url(#shadow)">
      <rect x="62" y="284" width="196" height="62" rx="10" fill="#ffffff" stroke="#d4d4d8"/>
      <rect x="62" y="284" width="9" height="62" rx="5" fill="#116b11"/>
    </g>
    <text class="card-title" x="84" y="322">Audit content</text>
    <g filter="url(#shadow)">
      <rect x="62" y="362" width="196" height="62" rx="10" fill="#ffffff" stroke="#d4d4d8"/>
      <rect x="62" y="362" width="9" height="62" rx="5" fill="#86590a"/>
    </g>
    <text class="card-title" x="84" y="400">Plan release</text>
  </g>

  <!-- To Do cards -->
  <g>
    <g filter="url(#shadow)">
      <rect x="302" y="128" width="196" height="62" rx="10" fill="#ffffff" stroke="#d4d4d8"/>
      <rect x="302" y="128" width="9" height="62" rx="5" fill="#2a78d6"/>
    </g>
    <text class="card-title" x="324" y="166">Design states</text>
    <g filter="url(#shadow)">
      <rect x="302" y="206" width="196" height="62" rx="10" fill="#ffffff" stroke="#d4d4d8"/>
      <rect x="302" y="206" width="9" height="62" rx="5" fill="#a32222"/>
    </g>
    <text class="card-title" x="324" y="244">Fix login edge</text>
    <g filter="url(#shadow)">
      <rect x="302" y="284" width="196" height="62" rx="10" fill="#ffffff" stroke="#d4d4d8"/>
      <rect x="302" y="284" width="9" height="62" rx="5" fill="#116b11"/>
    </g>
    <text class="card-title" x="324" y="322">Write help copy</text>
  </g>

  <!-- In Progress cards -->
  <g>
    <g filter="url(#shadow)">
      <rect x="542" y="128" width="196" height="62" rx="10" fill="#ffffff" stroke="#d4d4d8"/>
      <rect x="542" y="128" width="9" height="62" rx="5" fill="#1c5cab"/>
    </g>
    <text class="card-title" x="564" y="166">Build dashboard</text>
    <g filter="url(#shadow)">
      <rect x="542" y="206" width="196" height="62" rx="10" fill="#ffffff" stroke="#d4d4d8"/>
      <rect x="542" y="206" width="9" height="62" rx="5" fill="#86590a"/>
    </g>
    <text class="card-title" x="564" y="244">Connect API</text>
    <g filter="url(#shadow)">
      <rect x="542" y="284" width="196" height="62" rx="10" fill="#ffffff" stroke="#d4d4d8"/>
      <rect x="542" y="284" width="9" height="62" rx="5" fill="#a32222"/>
    </g>
    <text class="card-title" x="564" y="322">Resolve timeout</text>
  </g>

  <!-- Review cards -->
  <g>
    <g filter="url(#shadow)">
      <rect x="782" y="128" width="196" height="62" rx="10" fill="#ffffff" stroke="#d4d4d8"/>
      <rect x="782" y="128" width="9" height="62" rx="5" fill="#116b11"/>
    </g>
    <text class="card-title" x="804" y="166">Test checkout</text>
    <g filter="url(#shadow)">
      <rect x="782" y="206" width="196" height="62" rx="10" fill="#ffffff" stroke="#d4d4d8"/>
      <rect x="782" y="206" width="9" height="62" rx="5" fill="#2a78d6"/>
    </g>
    <text class="card-title" x="804" y="244">Review policy</text>
  </g>

  <!-- Done cards -->
  <g>
    <g filter="url(#shadow)">
      <rect x="1022" y="128" width="196" height="62" rx="10" fill="#f8fcf8" stroke="#b7d7b7"/>
      <rect x="1022" y="128" width="9" height="62" rx="5" fill="#116b11"/>
    </g>
    <text class="card-title" x="1044" y="166">Ship navigation</text>
    <g filter="url(#shadow)">
      <rect x="1022" y="206" width="196" height="62" rx="10" fill="#f8fcf8" stroke="#b7d7b7"/>
      <rect x="1022" y="206" width="9" height="62" rx="5" fill="#116b11"/>
    </g>
    <text class="card-title" x="1044" y="244">Publish notes</text>
    <g filter="url(#shadow)">
      <rect x="1022" y="284" width="196" height="62" rx="10" fill="#f8fcf8" stroke="#b7d7b7"/>
      <rect x="1022" y="284" width="9" height="62" rx="5" fill="#116b11"/>
    </g>
    <text class="card-title" x="1044" y="322">Close defects</text>
  </g>

  <!-- Timing brackets -->
  <g fill="none" stroke="#52525b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M302 470 v12 q0 8 8 8 h900 q8 0 8-8 v-12"/>
    <path d="M542 515 v12 q0 8 8 8 h660 q8 0 8-8 v-12"/>
  </g>
  <g class="annotation" fill="#52525b">
    <rect x="706" y="477" width="108" height="26" rx="13" fill="#fafafa"/>
    <text x="760" y="497" text-anchor="middle">Lead time</text>
    <rect x="822" y="522" width="116" height="26" rx="13" fill="#fafafa"/>
    <text x="880" y="542" text-anchor="middle">Cycle time</text>
  </g>

  <!-- Flow arrow -->
  <g>
    <line x1="78" y1="584" x2="1200" y2="584" stroke="#1c5cab" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowhead)"/>
    <rect x="600" y="567" width="80" height="34" rx="17" fill="#fafafa"/>
    <text x="640" y="591" text-anchor="middle" font-size="20" font-weight="700" fill="#1c5cab">Flow</text>
  </g>

  <!-- Kanban principles callout -->
  <g filter="url(#shadow)">
    <rect x="88" y="628" width="1104" height="60" rx="14" fill="#eef5fd" stroke="#b6c8de" stroke-width="2"/>
  </g>
  <text x="640" y="666" text-anchor="middle" font-size="19" font-weight="600" fill="#18181b">Visualize · Limit WIP · Manage flow · Explicit policies · Feedback loops · Improve</text>
</svg>
