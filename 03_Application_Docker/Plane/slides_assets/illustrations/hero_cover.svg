<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Paper plane flying through Kanban columns</title>
  <desc id="desc">A white and sky-blue paper plane travels upward through three translucent Kanban panels, leaving a dotted blue trail on a dark background.</desc>
  <defs>
    <radialGradient id="ambientGlow" cx="82%" cy="40%" r="58%">
      <stop offset="0" stop-color="#1c5cab" stop-opacity="0.2"/>
      <stop offset="0.62" stop-color="#1c5cab" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#1c5cab" stop-opacity="0"/>
    </radialGradient>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <filter id="planeShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- Dark slide surface and restrained blue atmosphere -->
  <rect width="1280" height="720" fill="#18181b"/>
  <rect width="1280" height="720" fill="url(#ambientGlow)"/>

  <!-- Dotted flight trail, kept low on the open title side -->
  <path d="M78 650 C250 635 394 676 520 625 C635 579 671 499 741 445 C832 374 930 322 1084 190"
        fill="none" stroke="#2a78d6" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="1 24" opacity="0.75"/>
  <path d="M500 632 C612 597 662 516 737 456"
        fill="none" stroke="#86b6ef" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="1 19" opacity="0.55"/>

  <!-- Three translucent Kanban rails, concentrated on the right -->
  <g filter="url(#panelShadow)">
    <g>
      <rect x="714" y="176" width="158" height="390" rx="25" fill="#27272a" fill-opacity="0.72" stroke="#3f3f46" stroke-width="2"/>
      <rect x="736" y="204" width="70" height="7" rx="3.5" fill="#2a78d6" opacity="0.9"/>
      <rect x="736" y="235" width="114" height="68" rx="13" fill="#18181b" fill-opacity="0.32" stroke="#3f3f46" stroke-width="2"/>
      <rect x="752" y="253" width="68" height="6" rx="3" fill="#52525b"/>
      <rect x="752" y="272" width="43" height="6" rx="3" fill="#3f3f46"/>
      <rect x="736" y="320" width="114" height="68" rx="13" fill="#18181b" fill-opacity="0.26" stroke="#3f3f46" stroke-width="2"/>
      <rect x="752" y="338" width="75" height="6" rx="3" fill="#52525b"/>
      <rect x="752" y="357" width="52" height="6" rx="3" fill="#3f3f46"/>
      <rect x="736" y="405" width="114" height="68" rx="13" fill="#18181b" fill-opacity="0.2" stroke="#3f3f46" stroke-width="2"/>
      <rect x="752" y="423" width="61" height="6" rx="3" fill="#52525b"/>
      <rect x="752" y="442" width="76" height="6" rx="3" fill="#3f3f46"/>
    </g>

    <g>
      <rect x="890" y="128" width="158" height="390" rx="25" fill="#27272a" fill-opacity="0.76" stroke="#3f3f46" stroke-width="2"/>
      <rect x="912" y="156" width="70" height="7" rx="3.5" fill="#86b6ef" opacity="0.92"/>
      <rect x="912" y="187" width="114" height="68" rx="13" fill="#18181b" fill-opacity="0.32" stroke="#3f3f46" stroke-width="2"/>
      <rect x="928" y="205" width="72" height="6" rx="3" fill="#52525b"/>
      <rect x="928" y="224" width="47" height="6" rx="3" fill="#3f3f46"/>
      <rect x="912" y="272" width="114" height="68" rx="13" fill="#18181b" fill-opacity="0.26" stroke="#3f3f46" stroke-width="2"/>
      <rect x="928" y="290" width="60" height="6" rx="3" fill="#52525b"/>
      <rect x="928" y="309" width="78" height="6" rx="3" fill="#3f3f46"/>
      <rect x="912" y="357" width="114" height="68" rx="13" fill="#18181b" fill-opacity="0.2" stroke="#3f3f46" stroke-width="2"/>
      <rect x="928" y="375" width="79" height="6" rx="3" fill="#52525b"/>
      <rect x="928" y="394" width="50" height="6" rx="3" fill="#3f3f46"/>
    </g>

    <g>
      <rect x="1066" y="80" width="158" height="390" rx="25" fill="#27272a" fill-opacity="0.8" stroke="#3f3f46" stroke-width="2"/>
      <rect x="1088" y="108" width="70" height="7" rx="3.5" fill="#2a78d6" opacity="0.9"/>
      <rect x="1088" y="139" width="114" height="68" rx="13" fill="#18181b" fill-opacity="0.32" stroke="#3f3f46" stroke-width="2"/>
      <rect x="1104" y="157" width="66" height="6" rx="3" fill="#52525b"/>
      <rect x="1104" y="176" width="43" height="6" rx="3" fill="#3f3f46"/>
      <rect x="1088" y="224" width="114" height="68" rx="13" fill="#18181b" fill-opacity="0.26" stroke="#3f3f46" stroke-width="2"/>
      <rect x="1104" y="242" width="76" height="6" rx="3" fill="#52525b"/>
      <rect x="1104" y="261" width="55" height="6" rx="3" fill="#3f3f46"/>
      <rect x="1088" y="309" width="114" height="68" rx="13" fill="#18181b" fill-opacity="0.2" stroke="#3f3f46" stroke-width="2"/>
      <rect x="1104" y="327" width="59" height="6" rx="3" fill="#52525b"/>
      <rect x="1104" y="346" width="78" height="6" rx="3" fill="#3f3f46"/>
    </g>
  </g>

  <!-- Floating workflow chips -->
  <g font-family="'IBM Plex Sans Thai','Noto Sans Thai',Sarabun,system-ui,sans-serif" font-size="18" font-weight="600" fill="#d4d4d8">
    <g transform="translate(690 148)">
      <rect width="112" height="42" rx="21" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
      <circle cx="22" cy="21" r="5" fill="#86b6ef"/>
      <text x="36" y="27">Backlog</text>
    </g>
    <g transform="translate(872 102)">
      <rect width="101" height="42" rx="21" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
      <circle cx="22" cy="21" r="5" fill="#2a78d6"/>
      <text x="36" y="27">Sprint</text>
    </g>
    <g transform="translate(1092 434)">
      <rect width="92" height="42" rx="21" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
      <circle cx="22" cy="21" r="5" fill="#86b6ef"/>
      <text x="36" y="27">Done</text>
    </g>
  </g>

  <!-- Stylized plane above the rails -->
  <g transform="translate(1016 222) rotate(-31)" filter="url(#planeShadow)">
    <path d="M-133 -35 L142 -2 L-78 78 L-42 14 Z" fill="#fafafa" stroke="#d4d4d8" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-133 -35 L-42 14 L142 -2 Z" fill="#ffffff"/>
    <path d="M-42 14 L142 -2 L-38 48 Z" fill="#86b6ef"/>
    <path d="M-78 78 L-42 14 L-38 48 Z" fill="#2a78d6"/>
    <path d="M-42 14 L18 38 L142 -2 Z" fill="#1c5cab" opacity="0.42"/>
    <path d="M-42 14 L142 -2" fill="none" stroke="#fafafa" stroke-width="3" stroke-linecap="round" opacity="0.82"/>
  </g>

  <!-- A few nearby particles reinforce forward motion -->
  <g fill="#86b6ef">
    <circle cx="1194" cy="119" r="4" opacity="0.8"/>
    <circle cx="1226" cy="95" r="2.5" opacity="0.55"/>
    <circle cx="1168" cy="144" r="2" opacity="0.48"/>
  </g>
</svg>
