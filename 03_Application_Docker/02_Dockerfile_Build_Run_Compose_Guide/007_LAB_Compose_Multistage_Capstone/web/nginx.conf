# server block เดียวสำหรับเสิร์ฟ static artifact และส่งต่อคำขอ API
server {
  # รับคำขอ HTTP ภายใน container ที่พอร์ต 80
  listen 80;
  # รับทุก hostname เพราะ Compose เข้าถึง container ผ่านชื่อ service
  server_name _;
  # กำหนด document root ของ nginx official image
  root /usr/share/nginx/html;
  # ใช้ artifact index.html เป็นหน้าเริ่มต้น
  index index.html;

  # endpoint เบาไว้เช็กว่า nginx ยังตอบอยู่ (curl http://localhost:8187/healthz)
  # หมายเหตุ: แล็บนี้ยังไม่ได้ประกาศ healthcheck: ให้ service web ใน compose.yaml
  # ถ้าจะเพิ่มเอง ใช้ test: ["CMD","wget","-qO-","http://127.0.0.1/healthz"]
  location = /healthz {
    return 200 'web-ok';
    add_header Content-Type text/plain;
  }

  # ส่งต่อทุก /api/... ไปยัง service ชื่อ api ผ่าน DNS ภายในของ Docker Compose
  location /api/ {
    # 127.0.0.11 คือ DNS ของ Docker; valid=10s บังคับให้ถาม IP ใหม่ทุก 10 วินาที
    # (ถ้าไม่ใส่ nginx จะจำ IP ตอน start ครั้งเดียว พอ recreate api แล้วจะได้ 502)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_service api;
    # ตัดคำว่า /api ออก ทำให้ /api/stats กลายเป็น /stats ที่ฝั่ง Flask
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_service:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  # เสิร์ฟไฟล์ที่พบและ fallback ไปหน้า dashboard สำหรับ path อื่น
  location / {
    try_files $uri $uri/ /index.html;
  }
}
