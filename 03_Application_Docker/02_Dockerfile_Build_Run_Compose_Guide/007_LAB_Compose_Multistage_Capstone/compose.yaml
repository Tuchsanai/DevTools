# compose.yaml ของ project "devopsboard" — LAB 7 (capstone)
# ทุกอย่างที่เคยสั่งด้วย docker run หลายบรรทัด ถูกประกาศไว้ในไฟล์เดียวนี้
services:
  # บริการเว็บส่วนหน้า (multi-stage build → nginx เสิร์ฟ static + reverse proxy /api/)
  web:
    # สร้างอิมเมจจาก multi-stage Dockerfile ในโฟลเดอร์ web
    build:
      context: ./web
    # ชื่อและแท็กอิมเมจของเว็บ
    image: devopsboard-web:1.0
    # เปิดเว็บที่พอร์ต 8187 ของเครื่อง
    ports:
      - "8187:80"
    # เชื่อมทั้งเครือข่ายหน้าเว็บและหลังบ้าน
    networks:
      - frontend
      - backend
    # เริ่มเว็บเมื่อ API พร้อมใช้งานแล้ว
    depends_on:
      api:
        condition: service_healthy
    # เริ่มใหม่อัตโนมัติเมื่อหยุดโดยไม่ตั้งใจ
    restart: unless-stopped

  # บริการ Flask API
  api:
    # สร้างอิมเมจจากโฟลเดอร์ api
    build:
      context: ./api
    # ชื่อและแท็กอิมเมจของ API
    image: devopsboard-api:1.0
    # เปิด API ที่พอร์ต 8087 ของเครื่อง
    ports:
      - "8087:5000"
    # ต้องอยู่ frontend ด้วย ไม่งั้น ports: 8087 ข้างบนจะไม่ทำงาน
    # (backend ตั้ง internal: true → publish port ออก host ไม่ได้)
    networks:
      - frontend
      - backend
    # โหลดค่าคอนฟิกและข้อมูลลับจากไฟล์ env
    env_file:
      - .env.app
    # ค่านี้ทับ APP_ENV จาก env_file
    environment:
      APP_ENV: production
    # รอฐานข้อมูลและ Redis พร้อมก่อนเริ่ม API
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # เริ่มใหม่อัตโนมัติเมื่อหยุดโดยไม่ตั้งใจ
    restart: unless-stopped
    # ตรวจว่า endpoint สุขภาพของ API ตอบ HTTP 200
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # บริการแคชและตัวนับจำนวนเข้าชม
  redis:
    # ใช้อิมเมจ Redis รุ่นเล็ก
    image: redis:7-alpine
    # เก็บข้อมูล Redis แบบถาวร
    volumes:
      - redisdata:/data
    # ไม่เปิดพอร์ตออกนอกเครือข่ายหลังบ้าน
    networks:
      - backend
    # ตรวจว่า Redis ตอบคำสั่ง ping
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # เริ่มใหม่อัตโนมัติเมื่อหยุดโดยไม่ตั้งใจ
    restart: unless-stopped

  # บริการฐานข้อมูล PostgreSQL
  db:
    # ใช้อิมเมจ PostgreSQL 17 รุ่นเล็ก
    image: postgres:17-alpine
    # รับรหัสผ่านและค่าฐานข้อมูลจากไฟล์ env
    env_file:
      - .env.app
    # กำหนดชื่อฐานข้อมูลและผู้ใช้ให้ชัดเจน
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
    # เก็บข้อมูลถาวรและเมานต์สคริปต์ตั้งต้นแบบอ่านอย่างเดียว
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    # ไม่เปิดพอร์ตออกนอกเครือข่ายหลังบ้าน
    networks:
      - backend
    # ตรวจว่าฐานข้อมูล appdb พร้อมรับการเชื่อมต่อ
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    # เริ่มใหม่อัตโนมัติเมื่อหยุดโดยไม่ตั้งใจ
    restart: unless-stopped

# volume ชื่อถาวรสำหรับ PostgreSQL และ Redis
volumes:
  pgdata:
  redisdata:

# แยกเครือข่ายหน้าเว็บออกจากเครือข่ายหลังบ้าน
networks:
  frontend:
  backend:
    # ปิดการเข้าถึงภายนอกจากเครือข่ายหลังบ้าน
    internal: true
