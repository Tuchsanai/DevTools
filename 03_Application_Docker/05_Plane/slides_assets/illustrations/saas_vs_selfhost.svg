<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SaaS cloud versus self-hosted Docker applications</title>
  <desc id="desc">A lecture illustration comparing vendor-managed SaaS with a self-hosted Docker stack, including users, data ownership, operations, licensing, upgrades, and backups.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#18181b" flood-opacity="0.10"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#18181b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#116b11"/>
    </marker>
    <style>
      text { font-family: 'IBM Plex Sans Thai','Noto Sans Thai',Sarabun,system-ui,sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #18181b; }
      .subtitle { font-size: 19px; font-weight: 500; fill: #52525b; }
      .label { font-size: 18px; font-weight: 700; fill: #18181b; }
      .chip { font-size: 18px; font-weight: 600; fill: #18181b; }
      .tiny { font-size: 18px; font-weight: 600; fill: #52525b; }
      .containerText { font-size: 18px; font-weight: 700; fill: #18181b; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#fafafa"/>

  <!-- SaaS panel -->
  <rect x="28" y="28" width="584" height="664" rx="28" fill="#ffffff" stroke="#bcd7f4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="28" y="28" width="584" height="10" rx="5" fill="#1c5cab"/>
  <text x="58" y="82" class="title">SaaS (cloud)</text>
  <text x="58" y="112" class="subtitle">The vendor operates the application</text>

  <!-- SaaS connection arrows -->
  <g fill="none" stroke="#2a78d6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)" opacity="0.9">
    <path d="M 126 371 C 150 308, 205 286, 260 264"/>
    <path d="M 300 371 C 302 326, 309 294, 315 270"/>
    <path d="M 474 371 C 452 310, 410 286, 370 265"/>
  </g>

  <!-- Cloud and vendor building -->
  <g filter="url(#smallShadow)">
    <path d="M 227 247 C 207 245, 192 229, 192 209 C 192 185, 211 166, 235 166 C 245 138, 271 120, 302 120 C 341 120, 371 149, 373 186 C 397 187, 416 207, 416 231 C 416 252, 399 269, 378 269 L 229 269 C 212 269, 199 259, 196 246" fill="#eaf4ff" stroke="#2a78d6" stroke-width="4"/>
    <rect x="267" y="164" width="76" height="82" rx="8" fill="#ffffff" stroke="#1c5cab" stroke-width="4"/>
    <path d="M 258 169 L 305 140 L 352 169 Z" fill="#1c5cab"/>
    <rect x="296" y="211" width="18" height="35" rx="3" fill="#2a78d6"/>
    <g fill="#bcd7f4" stroke="#1c5cab" stroke-width="2">
      <rect x="278" y="178" width="13" height="13" rx="2"/>
      <rect x="319" y="178" width="13" height="13" rx="2"/>
      <rect x="278" y="200" width="13" height="13" rx="2"/>
      <rect x="319" y="200" width="13" height="13" rx="2"/>
    </g>
  </g>
  <rect x="245" y="280" width="150" height="34" rx="17" fill="#eaf4ff"/>
  <text x="320" y="303" text-anchor="middle" class="label" fill="#1c5cab">vendor cloud</text>

  <!-- SaaS laptops -->
  <g>
    <g transform="translate(82 367)">
      <rect x="0" y="0" width="88" height="56" rx="7" fill="#ffffff" stroke="#1c5cab" stroke-width="4"/>
      <rect x="9" y="9" width="70" height="38" rx="3" fill="#dcecff"/>
      <path d="M -8 58 H 96 L 84 70 H 4 Z" fill="#1c5cab"/>
      <circle cx="44" cy="28" r="9" fill="#2a78d6"/>
    </g>
    <g transform="translate(256 367)">
      <rect x="0" y="0" width="88" height="56" rx="7" fill="#ffffff" stroke="#1c5cab" stroke-width="4"/>
      <rect x="9" y="9" width="70" height="38" rx="3" fill="#dcecff"/>
      <path d="M -8 58 H 96 L 84 70 H 4 Z" fill="#1c5cab"/>
      <circle cx="44" cy="28" r="9" fill="#2a78d6"/>
    </g>
    <g transform="translate(430 367)">
      <rect x="0" y="0" width="88" height="56" rx="7" fill="#ffffff" stroke="#1c5cab" stroke-width="4"/>
      <rect x="9" y="9" width="70" height="38" rx="3" fill="#dcecff"/>
      <path d="M -8 58 H 96 L 84 70 H 4 Z" fill="#1c5cab"/>
      <circle cx="44" cy="28" r="9" fill="#2a78d6"/>
    </g>
  </g>
  <text x="300" y="466" text-anchor="middle" class="tiny">your team connects over the internet</text>

  <!-- SaaS chips -->
  <g>
    <rect x="58" y="500" width="250" height="58" rx="16" fill="#e8f5e8" stroke="#78b878" stroke-width="2"/>
    <circle cx="83" cy="529" r="10" fill="#116b11"/>
    <path d="M 78 529 L 82 533 L 89 524" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="101" y="535" class="chip">no ops work</text>

    <rect x="320" y="500" width="262" height="58" rx="16" fill="#fff3d9" stroke="#d6a94f" stroke-width="2"/>
    <circle cx="345" cy="529" r="11" fill="#86590a"/>
    <text x="345" y="536" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">$</text>
    <text x="365" y="535" class="chip">subscription per user</text>

    <rect x="58" y="570" width="250" height="72" rx="16" fill="#fdeaea" stroke="#d17b7b" stroke-width="2"/>
    <path d="M 74 598 h 20 v 19 h -20 z M 78 598 v -5 a 6 6 0 0 1 12 0 v 5" fill="none" stroke="#a32222" stroke-width="3"/>
    <text x="105" y="600" class="chip">vendor holds</text>
    <text x="105" y="624" class="chip">the data</text>

    <rect x="320" y="570" width="262" height="72" rx="16" fill="#eaf4ff" stroke="#86b7ea" stroke-width="2"/>
    <path d="M 340 611 a 13 13 0 1 1 18 4" fill="none" stroke="#1c5cab" stroke-width="3" stroke-linecap="round"/>
    <path d="M 356 607 l 4 9 l -9 1" fill="none" stroke="#1c5cab" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="372" y="612" class="chip">updates automatic</text>
  </g>

  <!-- Self-hosted panel -->
  <rect x="668" y="28" width="584" height="664" rx="28" fill="#ffffff" stroke="#b7d9b7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="668" y="28" width="584" height="10" rx="5" fill="#116b11"/>
  <text x="698" y="82" class="title">Self-hosted (your Docker)</text>
  <text x="698" y="112" class="subtitle">You operate the application stack</text>

  <!-- Self-hosted connection arrows -->
  <g fill="none" stroke="#116b11" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowGreen)" opacity="0.9">
    <path d="M 756 393 C 790 345, 843 315, 895 285"/>
    <path d="M 913 393 C 927 348, 944 322, 954 298"/>
    <path d="M 1102 393 C 1081 348, 1055 321, 1028 297"/>
  </g>

  <!-- Docker server rack -->
  <g filter="url(#smallShadow)">
    <rect x="887" y="142" width="170" height="180" rx="14" fill="#eff8ef" stroke="#116b11" stroke-width="4"/>
    <rect x="899" y="154" width="146" height="156" rx="8" fill="#ffffff" stroke="#78b878" stroke-width="2"/>
    <g>
      <rect x="910" y="166" width="57" height="36" rx="7" fill="#dcecff" stroke="#1c5cab" stroke-width="2"/>
      <text x="938.5" y="190" text-anchor="middle" class="containerText">web</text>
      <rect x="977" y="166" width="57" height="36" rx="7" fill="#dcecff" stroke="#1c5cab" stroke-width="2"/>
      <text x="1005.5" y="190" text-anchor="middle" class="containerText">api</text>
      <rect x="910" y="213" width="124" height="36" rx="7" fill="#e8f5e8" stroke="#116b11" stroke-width="2"/>
      <text x="972" y="237" text-anchor="middle" class="containerText">worker</text>
      <rect x="910" y="260" width="57" height="36" rx="7" fill="#fff3d9" stroke="#86590a" stroke-width="2"/>
      <text x="938.5" y="284" text-anchor="middle" class="containerText">db</text>
      <rect x="977" y="260" width="57" height="36" rx="7" fill="#fdeaea" stroke="#a32222" stroke-width="2"/>
      <text x="1005.5" y="284" text-anchor="middle" class="containerText">queue</text>
    </g>
    <rect x="920" y="314" width="104" height="43" rx="8" fill="#52525b"/>
    <ellipse cx="972" cy="323" rx="38" ry="8" fill="#fafafa"/>
    <path d="M 934 323 V 345 C 934 351 951 356 972 356 C 993 356 1010 351 1010 345 V 323" fill="#fafafa" stroke="#52525b" stroke-width="2"/>
    <text x="972" y="347" text-anchor="middle" font-size="18" font-weight="700" fill="#18181b">storage</text>
  </g>
  <rect x="897" y="365" width="150" height="34" rx="17" fill="#e8f5e8"/>
  <text x="972" y="388" text-anchor="middle" class="label" fill="#116b11">your server</text>

  <!-- Self-hosted laptops -->
  <g>
    <g transform="translate(704 397)">
      <rect x="0" y="0" width="88" height="56" rx="7" fill="#ffffff" stroke="#116b11" stroke-width="4"/>
      <rect x="9" y="9" width="70" height="38" rx="3" fill="#e8f5e8"/>
      <path d="M -8 58 H 96 L 84 70 H 4 Z" fill="#116b11"/>
      <circle cx="44" cy="28" r="9" fill="#78b878"/>
    </g>
    <g transform="translate(874 397)">
      <rect x="0" y="0" width="88" height="56" rx="7" fill="#ffffff" stroke="#116b11" stroke-width="4"/>
      <rect x="9" y="9" width="70" height="38" rx="3" fill="#e8f5e8"/>
      <path d="M -8 58 H 96 L 84 70 H 4 Z" fill="#116b11"/>
      <circle cx="44" cy="28" r="9" fill="#78b878"/>
    </g>
    <g transform="translate(1044 397)">
      <rect x="0" y="0" width="88" height="56" rx="7" fill="#ffffff" stroke="#116b11" stroke-width="4"/>
      <rect x="9" y="9" width="70" height="38" rx="3" fill="#e8f5e8"/>
      <path d="M -8 58 H 96 L 84 70 H 4 Z" fill="#116b11"/>
      <circle cx="44" cy="28" r="9" fill="#78b878"/>
    </g>
  </g>
  <text x="918" y="493" text-anchor="middle" class="tiny">your team connects to your stack</text>

  <!-- Self-hosted chips -->
  <g>
    <rect x="698" y="515" width="250" height="58" rx="16" fill="#fff3d9" stroke="#d6a94f" stroke-width="2"/>
    <path d="M 715 536 h 20 v 16 h -20 z M 718 532 h 14" fill="none" stroke="#86590a" stroke-width="3" stroke-linecap="round"/>
    <text x="746" y="550" class="chip">you run it</text>

    <rect x="960" y="515" width="262" height="58" rx="16" fill="#e8f5e8" stroke="#78b878" stroke-width="2"/>
    <path d="M 978 538 h 20 v 19 h -20 z M 982 538 v -5 a 6 6 0 0 1 12 0 v 5" fill="none" stroke="#116b11" stroke-width="3"/>
    <text x="1008" y="550" class="chip">data stays with you</text>

    <rect x="698" y="585" width="250" height="58" rx="16" fill="#eaf4ff" stroke="#86b7ea" stroke-width="2"/>
    <path d="M 718 607 l 8 -7 l 8 7 v 13 l -8 7 l -8 -7 z" fill="none" stroke="#1c5cab" stroke-width="3"/>
    <text x="746" y="620" class="chip">AGPL open source</text>

    <rect x="960" y="585" width="262" height="72" rx="16" fill="#fdeaea" stroke="#d17b7b" stroke-width="2"/>
    <path d="M 978 616 a 12 12 0 1 1 17 5" fill="none" stroke="#a32222" stroke-width="3" stroke-linecap="round"/>
    <path d="M 993 613 l 4 9 l -9 1" fill="none" stroke="#a32222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1008" y="613" class="chip">you do upgrades</text>
    <text x="1008" y="638" class="chip">&amp; backups</text>
  </g>

  <!-- Balance scale between the two models -->
  <g filter="url(#smallShadow)">
    <circle cx="640" cy="370" r="47" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <path d="M 640 342 V 392 M 615 392 H 665 M 620 351 H 660" fill="none" stroke="#18181b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="640" cy="349" r="5" fill="#18181b"/>
    <path d="M 620 352 L 607 374 M 620 352 L 633 374 M 607 374 Q 620 389 633 374 Z" fill="#eaf4ff" stroke="#1c5cab" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 660 352 L 647 374 M 660 352 L 673 374 M 647 374 Q 660 389 673 374 Z" fill="#e8f5e8" stroke="#116b11" stroke-width="3" stroke-linejoin="round"/>
    <rect x="535" y="423" width="210" height="42" rx="21" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="640" y="451" text-anchor="middle" class="label">control vs convenience</text>
  </g>
</svg>
