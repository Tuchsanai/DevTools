<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Agile Manifesto (2001) — 4 values</title>
  <desc id="desc">Four balance scales show Agile Manifesto values, with the larger blue items on the left valued more than the smaller grey items on the right. A side panel lists three examples from the twelve principles.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#18181b" flood-opacity="0.10"/>
    </filter>
    <filter id="chipShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#18181b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#fafafa"/>
  <circle cx="1184" cy="47" r="76" fill="#2a78d6" opacity="0.06"/>
  <circle cx="93" cy="691" r="92" fill="#116b11" opacity="0.05"/>

  <g font-family="'IBM Plex Sans Thai','Noto Sans Thai',Sarabun,system-ui,sans-serif">
    <g aria-label="Heading">
      <rect x="48" y="32" width="8" height="47" rx="4" fill="#2a78d6"/>
      <text x="72" y="62" fill="#18181b" font-size="34" font-weight="700">Agile Manifesto (2001) — 4 values</text>
      <text x="72" y="87" fill="#52525b" font-size="18">A preference, not an exclusion</text>
    </g>

    <!-- Value 1 -->
    <g aria-label="Individuals and interactions over processes and tools">
      <rect x="48" y="111" width="870" height="112" rx="18" fill="#ffffff" stroke="#dbe3ee" filter="url(#shadow)"/>
      <circle cx="75" cy="137" r="14" fill="#1c5cab"/>
      <text x="75" y="144" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">1</text>

      <line x1="296" y1="170" x2="695" y2="146" stroke="#18181b" stroke-width="6" stroke-linecap="round"/>
      <circle cx="495" cy="158" r="8" fill="#86590a"/>
      <path d="M495 158 L467 202 L523 202 Z" fill="#86590a"/>
      <rect x="454" y="201" width="82" height="7" rx="3.5" fill="#86590a"/>
      <line x1="296" y1="170" x2="296" y2="182" stroke="#18181b" stroke-width="3"/>
      <line x1="695" y1="146" x2="695" y2="154" stroke="#18181b" stroke-width="3"/>

      <rect x="108" y="176" width="376" height="38" rx="12" fill="#eaf3ff" stroke="#2a78d6" stroke-width="2" filter="url(#chipShadow)"/>
      <text x="296" y="202" text-anchor="middle" fill="#1c5cab" font-size="23" font-weight="700">Individuals and interactions</text>
      <rect x="590" y="151" width="210" height="34" rx="11" fill="#f1f2f4" stroke="#c8cbd1"/>
      <text x="695" y="174" text-anchor="middle" fill="#52525b" font-size="18">processes and tools</text>
    </g>

    <!-- Value 2 -->
    <g aria-label="Working software over comprehensive documentation">
      <rect x="48" y="233" width="870" height="112" rx="18" fill="#ffffff" stroke="#dbe3ee" filter="url(#shadow)"/>
      <circle cx="75" cy="259" r="14" fill="#1c5cab"/>
      <text x="75" y="266" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">2</text>

      <line x1="296" y1="292" x2="695" y2="268" stroke="#18181b" stroke-width="6" stroke-linecap="round"/>
      <circle cx="495" cy="280" r="8" fill="#116b11"/>
      <path d="M495 280 L467 324 L523 324 Z" fill="#116b11"/>
      <rect x="454" y="323" width="82" height="7" rx="3.5" fill="#116b11"/>
      <line x1="296" y1="292" x2="296" y2="304" stroke="#18181b" stroke-width="3"/>
      <line x1="695" y1="268" x2="695" y2="276" stroke="#18181b" stroke-width="3"/>

      <rect x="142" y="298" width="308" height="38" rx="12" fill="#eaf3ff" stroke="#2a78d6" stroke-width="2" filter="url(#chipShadow)"/>
      <text x="296" y="324" text-anchor="middle" fill="#1c5cab" font-size="23" font-weight="700">Working software</text>
      <rect x="555" y="273" width="280" height="34" rx="11" fill="#f1f2f4" stroke="#c8cbd1"/>
      <text x="695" y="296" text-anchor="middle" fill="#52525b" font-size="18">comprehensive documentation</text>
    </g>

    <!-- Value 3 -->
    <g aria-label="Customer collaboration over contract negotiation">
      <rect x="48" y="355" width="870" height="112" rx="18" fill="#ffffff" stroke="#dbe3ee" filter="url(#shadow)"/>
      <circle cx="75" cy="381" r="14" fill="#1c5cab"/>
      <text x="75" y="388" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">3</text>

      <line x1="296" y1="414" x2="695" y2="390" stroke="#18181b" stroke-width="6" stroke-linecap="round"/>
      <circle cx="495" cy="402" r="8" fill="#86590a"/>
      <path d="M495 402 L467 446 L523 446 Z" fill="#86590a"/>
      <rect x="454" y="445" width="82" height="7" rx="3.5" fill="#86590a"/>
      <line x1="296" y1="414" x2="296" y2="426" stroke="#18181b" stroke-width="3"/>
      <line x1="695" y1="390" x2="695" y2="398" stroke="#18181b" stroke-width="3"/>

      <rect x="119" y="420" width="354" height="38" rx="12" fill="#eaf3ff" stroke="#2a78d6" stroke-width="2" filter="url(#chipShadow)"/>
      <text x="296" y="446" text-anchor="middle" fill="#1c5cab" font-size="23" font-weight="700">Customer collaboration</text>
      <rect x="581" y="395" width="228" height="34" rx="11" fill="#f1f2f4" stroke="#c8cbd1"/>
      <text x="695" y="418" text-anchor="middle" fill="#52525b" font-size="18">contract negotiation</text>
    </g>

    <!-- Value 4 -->
    <g aria-label="Responding to change over following a plan">
      <rect x="48" y="477" width="870" height="112" rx="18" fill="#ffffff" stroke="#dbe3ee" filter="url(#shadow)"/>
      <circle cx="75" cy="503" r="14" fill="#1c5cab"/>
      <text x="75" y="510" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">4</text>

      <line x1="296" y1="536" x2="695" y2="512" stroke="#18181b" stroke-width="6" stroke-linecap="round"/>
      <circle cx="495" cy="524" r="8" fill="#a32222"/>
      <path d="M495 524 L467 568 L523 568 Z" fill="#a32222"/>
      <rect x="454" y="567" width="82" height="7" rx="3.5" fill="#a32222"/>
      <line x1="296" y1="536" x2="296" y2="548" stroke="#18181b" stroke-width="3"/>
      <line x1="695" y1="512" x2="695" y2="520" stroke="#18181b" stroke-width="3"/>

      <rect x="113" y="542" width="366" height="38" rx="12" fill="#eaf3ff" stroke="#2a78d6" stroke-width="2" filter="url(#chipShadow)"/>
      <text x="296" y="568" text-anchor="middle" fill="#1c5cab" font-size="23" font-weight="700">Responding to change</text>
      <rect x="603" y="517" width="184" height="34" rx="11" fill="#f1f2f4" stroke="#c8cbd1"/>
      <text x="695" y="540" text-anchor="middle" fill="#52525b" font-size="18">following a plan</text>
    </g>

    <!-- Principles side panel -->
    <g aria-label="Examples from the 12 principles">
      <rect x="944" y="111" width="288" height="478" rx="22" fill="#eef6ef" stroke="#b9d6b9" filter="url(#shadow)"/>
      <rect x="966" y="133" width="160" height="39" rx="19.5" fill="#116b11"/>
      <text x="1046" y="159" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">12 principles</text>
      <text x="968" y="205" fill="#18181b" font-size="18" font-weight="600">Examples in practice</text>
      <line x1="968" y1="220" x2="1208" y2="220" stroke="#9fc49f" stroke-width="2"/>

      <circle cx="980" cy="256" r="7" fill="#2a78d6"/>
      <text x="998" y="251" fill="#18181b" font-size="19" font-weight="600">
        <tspan x="998" dy="0">Deliver working</tspan>
        <tspan x="998" dy="25">software frequently</tspan>
      </text>

      <circle cx="980" cy="340" r="7" fill="#86590a"/>
      <text x="998" y="335" fill="#18181b" font-size="19" font-weight="600">
        <tspan x="998" dy="0">Welcome changing</tspan>
        <tspan x="998" dy="25">requirements</tspan>
      </text>

      <circle cx="980" cy="424" r="7" fill="#a32222"/>
      <text x="998" y="419" fill="#18181b" font-size="19" font-weight="600">
        <tspan x="998" dy="0">Reflect and adjust</tspan>
        <tspan x="998" dy="25">regularly</tspan>
      </text>

      <path d="M970 509 C1010 486 1047 528 1084 505 C1120 482 1154 517 1204 488" fill="none" stroke="#116b11" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      <circle cx="970" cy="509" r="6" fill="#116b11"/>
      <circle cx="1084" cy="505" r="6" fill="#116b11"/>
      <circle cx="1204" cy="488" r="6" fill="#116b11"/>
      <text x="1088" y="553" text-anchor="middle" fill="#116b11" font-size="18" font-weight="700">Learn • adapt • improve</text>
    </g>

    <!-- Footnote -->
    <g aria-label="Manifesto qualification">
      <rect x="48" y="623" width="1184" height="61" rx="16" fill="#18181b"/>
      <circle cx="79" cy="653.5" r="12" fill="#2a78d6"/>
      <path d="M74 653 L78 657 L85 649" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="103" y="661" fill="#ffffff" font-size="20">while there is value in the items on the right, we value the items on the left more</text>
    </g>
  </g>
</svg>
