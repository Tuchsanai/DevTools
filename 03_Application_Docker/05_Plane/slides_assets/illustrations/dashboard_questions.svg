<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Tracking dashboard questions and metrics</title>
  <desc id="desc">A five-tile dashboard pairing delivery questions with burndown, cumulative flow, cycle time, velocity, and risk indicators.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#18181b" flood-opacity="0.10"/>
    </filter>
    <clipPath id="flowClip">
      <rect x="289" y="357" width="208" height="144" rx="10"/>
    </clipPath>
    <style>
      text { font-family: 'IBM Plex Sans Thai','Noto Sans Thai',Sarabun,system-ui,sans-serif; }
      .question { font-size: 22px; font-weight: 700; }
      .metric { font-size: 18px; font-weight: 700; letter-spacing: 0.02em; }
      .small { font-size: 18px; fill: #52525b; }
      .value { font-size: 36px; font-weight: 800; }
      .axis { stroke: #d4d4d8; stroke-width: 2; }
      .grid { stroke: #e4e4e7; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#fafafa"/>

  <!-- Header band -->
  <rect x="24" y="22" width="1232" height="76" rx="18" fill="#1c5cab"/>
  <circle cx="61" cy="60" r="17" fill="#ffffff" fill-opacity="0.16"/>
  <path d="M53 61l6 6 11-15" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="91" y="69" font-size="27" font-weight="700" fill="#ffffff">One question per metric — leading indicators on the left, lagging on the right</text>

  <!-- Direction cue -->
  <text x="24" y="133" font-size="18" font-weight="700" fill="#116b11">LEADING</text>
  <line x1="121" y1="127" x2="1162" y2="127" stroke="#a1a1aa" stroke-width="2"/>
  <path d="M1162 127l-12-7v14z" fill="#a1a1aa"/>
  <text x="1172" y="133" font-size="18" font-weight="700" fill="#52525b">LAGGING</text>

  <!-- Card 1: Burndown -->
  <g filter="url(#shadow)">
    <rect x="24" y="154" width="236" height="526" rx="18" fill="#ffffff" stroke="#e4e4e7"/>
  </g>
  <rect x="42" y="174" width="114" height="34" rx="17" fill="#e8f1fc"/>
  <circle cx="61" cy="191" r="6" fill="#1c5cab"/>
  <text class="metric" x="75" y="198" fill="#1c5cab">BURNDOWN</text>
  <text class="question" x="42" y="240">
    <tspan x="42" dy="0">Will we finish</tspan>
    <tspan x="42" dy="29">on time?</tspan>
  </text>
  <rect x="42" y="302" width="200" height="242" rx="12" fill="#f8fafc" stroke="#e4e4e7"/>
  <line class="grid" x1="58" y1="352" x2="226" y2="352"/>
  <line class="grid" x1="58" y1="414" x2="226" y2="414"/>
  <line class="grid" x1="58" y1="476" x2="226" y2="476"/>
  <line class="axis" x1="58" y1="322" x2="58" y2="510"/>
  <line class="axis" x1="58" y1="510" x2="226" y2="510"/>
  <path d="M61 334L220 498" fill="none" stroke="#a1a1aa" stroke-width="3" stroke-dasharray="8 7"/>
  <path d="M61 334L88 350L113 363L139 393L164 405L190 452L220 487" fill="none" stroke="#2a78d6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2a78d6">
    <circle cx="61" cy="334" r="5"/><circle cx="88" cy="350" r="5"/><circle cx="113" cy="363" r="5"/><circle cx="139" cy="393" r="5"/><circle cx="164" cy="405" r="5"/><circle cx="190" cy="452" r="5"/><circle cx="220" cy="487" r="5"/>
  </g>
  <text class="small" x="42" y="579">12 of 14 days</text>
  <rect x="42" y="604" width="200" height="49" rx="12" fill="#eef7ee"/>
  <circle cx="62" cy="629" r="7" fill="#116b11"/>
  <text x="77" y="636" font-size="19" font-weight="700" fill="#116b11">On track</text>

  <!-- Card 2: Cumulative flow -->
  <g filter="url(#shadow)">
    <rect x="271" y="154" width="236" height="526" rx="18" fill="#ffffff" stroke="#e4e4e7"/>
  </g>
  <rect x="289" y="174" width="200" height="34" rx="17" fill="#fff3d6"/>
  <circle cx="308" cy="191" r="6" fill="#86590a"/>
  <text class="metric" x="322" y="198" fill="#86590a">CUMULATIVE FLOW</text>
  <text class="question" x="289" y="240">
    <tspan x="289" dy="0">Where is the</tspan>
    <tspan x="289" dy="29">bottleneck?</tspan>
  </text>
  <rect x="289" y="302" width="200" height="242" rx="12" fill="#f8fafc" stroke="#e4e4e7"/>
  <g clip-path="url(#flowClip)">
    <path d="M289 501L289 474C325 468 356 455 388 451C424 446 455 438 497 419L497 501Z" fill="#116b11" fill-opacity="0.88"/>
    <path d="M289 474C325 468 356 455 388 451C424 446 455 438 497 419L497 356C457 369 422 382 388 395C352 409 319 425 289 434Z" fill="#2a78d6" fill-opacity="0.80"/>
    <path d="M289 434C319 425 352 409 388 395C422 382 457 369 497 356L497 326C457 334 421 341 387 354C351 366 319 384 289 394Z" fill="#86590a" fill-opacity="0.78"/>
  </g>
  <line class="axis" x1="301" y1="501" x2="485" y2="501"/>
  <path d="M391 351L456 329" stroke="#a32222" stroke-width="3" stroke-linecap="round"/>
  <circle cx="391" cy="351" r="6" fill="#a32222"/>
  <rect x="357" y="515" width="132" height="37" rx="10" fill="#fff0f0"/>
  <text x="369" y="541" font-size="18" font-weight="700" fill="#a32222">Review queue ↑</text>
  <g>
    <rect x="289" y="575" width="12" height="12" rx="3" fill="#86590a"/><text class="small" x="309" y="588">To do</text>
    <rect x="289" y="603" width="12" height="12" rx="3" fill="#2a78d6"/><text class="small" x="309" y="616">Review</text>
    <rect x="289" y="631" width="12" height="12" rx="3" fill="#116b11"/><text class="small" x="309" y="644">Done</text>
  </g>

  <!-- Card 3: Cycle time -->
  <g filter="url(#shadow)">
    <rect x="518" y="154" width="236" height="526" rx="18" fill="#ffffff" stroke="#e4e4e7"/>
  </g>
  <rect x="536" y="174" width="124" height="34" rx="17" fill="#e8f1fc"/>
  <circle cx="555" cy="191" r="6" fill="#1c5cab"/>
  <text class="metric" x="569" y="198" fill="#1c5cab">CYCLE TIME</text>
  <text class="question" x="536" y="240">
    <tspan x="536" dy="0">How long do</tspan>
    <tspan x="536" dy="29">items take?</tspan>
  </text>
  <rect x="536" y="302" width="200" height="242" rx="12" fill="#edf5fe" stroke="#c6ddf8"/>
  <text x="636" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#52525b">SERVICE LEVEL</text>
  <text x="636" y="410" text-anchor="middle" font-size="46" font-weight="800" fill="#1c5cab">85%</text>
  <text x="636" y="454" text-anchor="middle" font-size="31" font-weight="800" fill="#18181b">≤ 9 d</text>
  <line x1="564" y1="482" x2="708" y2="482" stroke="#bfdbfe" stroke-width="9" stroke-linecap="round"/>
  <line x1="564" y1="482" x2="686" y2="482" stroke="#2a78d6" stroke-width="9" stroke-linecap="round"/>
  <circle cx="686" cy="482" r="8" fill="#1c5cab"/>
  <text class="small" x="536" y="579">Past 30 days</text>
  <rect x="536" y="604" width="200" height="49" rx="12" fill="#f4f4f5"/>
  <text x="636" y="636" text-anchor="middle" font-size="19" font-weight="700" fill="#52525b">Target: 85% ≤ 10 d</text>

  <!-- Card 4: Velocity -->
  <g filter="url(#shadow)">
    <rect x="765" y="154" width="236" height="526" rx="18" fill="#ffffff" stroke="#e4e4e7"/>
  </g>
  <rect x="783" y="174" width="108" height="34" rx="17" fill="#eef7ee"/>
  <circle cx="802" cy="191" r="6" fill="#116b11"/>
  <text class="metric" x="816" y="198" fill="#116b11">VELOCITY</text>
  <text class="question" x="783" y="240">
    <tspan x="783" dy="0">Are we</tspan>
    <tspan x="783" dy="29">improving?</tspan>
  </text>
  <rect x="783" y="302" width="200" height="242" rx="12" fill="#f8fafc" stroke="#e4e4e7"/>
  <line class="grid" x1="799" y1="356" x2="967" y2="356"/>
  <line class="grid" x1="799" y1="414" x2="967" y2="414"/>
  <line class="axis" x1="799" y1="505" x2="967" y2="505"/>
  <g fill="#2a78d6">
    <rect x="807" y="445" width="19" height="60" rx="5"/>
    <rect x="835" y="426" width="19" height="79" rx="5"/>
    <rect x="863" y="437" width="19" height="68" rx="5"/>
    <rect x="891" y="398" width="19" height="107" rx="5"/>
    <rect x="919" y="378" width="19" height="127" rx="5"/>
    <rect x="947" y="351" width="19" height="154" rx="5" fill="#116b11"/>
  </g>
  <path d="M814 424L845 409L873 413L902 380L930 361L958 333" fill="none" stroke="#116b11" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M958 333l-13 2 9 9z" fill="#116b11"/>
  <text class="small" x="783" y="579">Last 6 iterations</text>
  <rect x="783" y="604" width="200" height="49" rx="12" fill="#eef7ee"/>
  <text x="883" y="636" text-anchor="middle" font-size="20" font-weight="800" fill="#116b11">+18% trend</text>

  <!-- Card 5: Risk list -->
  <g filter="url(#shadow)">
    <rect x="1012" y="154" width="244" height="526" rx="18" fill="#ffffff" stroke="#e4e4e7"/>
  </g>
  <rect x="1030" y="174" width="90" height="34" rx="17" fill="#fff0f0"/>
  <circle cx="1049" cy="191" r="6" fill="#a32222"/>
  <text class="metric" x="1063" y="198" fill="#a32222">RISK</text>
  <text class="question" x="1030" y="240">
    <tspan x="1030" dy="0">What is</tspan>
    <tspan x="1030" dy="29">at risk?</tspan>
  </text>
  <rect x="1030" y="302" width="208" height="296" rx="12" fill="#fffafa" stroke="#f0caca"/>

  <g>
    <circle cx="1051" cy="342" r="10" fill="#a32222"/>
    <text x="1051" y="349" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">!</text>
    <text x="1070" y="339" font-size="18" font-weight="700">API spec</text>
    <text class="small" x="1070" y="364">Blocked</text>
    <rect x="1168" y="326" width="54" height="34" rx="17" fill="#a32222"/>
    <text x="1195" y="350" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">12 d</text>
    <line x1="1046" y1="385" x2="1222" y2="385" stroke="#f0caca"/>
  </g>

  <g>
    <circle cx="1051" cy="424" r="10" fill="#a32222"/>
    <text x="1051" y="431" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">!</text>
    <text x="1070" y="421" font-size="18" font-weight="700">Data map</text>
    <text class="small" x="1070" y="446">No owner</text>
    <rect x="1168" y="408" width="54" height="34" rx="17" fill="#a32222"/>
    <text x="1195" y="432" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">10 d</text>
    <line x1="1046" y1="467" x2="1222" y2="467" stroke="#f0caca"/>
  </g>

  <g>
    <circle cx="1051" cy="506" r="10" fill="#a32222"/>
    <text x="1051" y="513" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">!</text>
    <text x="1070" y="503" font-size="18" font-weight="700">Load test</text>
    <text class="small" x="1070" y="528">Waiting</text>
    <rect x="1168" y="490" width="54" height="34" rx="17" fill="#a32222"/>
    <text x="1195" y="514" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">8 d</text>
  </g>

  <rect x="1030" y="616" width="208" height="40" rx="12" fill="#fff0f0"/>
  <text x="1134" y="643" text-anchor="middle" font-size="19" font-weight="800" fill="#a32222">3 aging flags</text>
</svg>
