<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Cone of Uncertainty</title>
  <desc id="desc">A chart showing estimate variability narrowing from four times high and one quarter times low during initial concept to one times at release.</desc>

  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#18181b" flood-opacity="0.10"/>
    </filter>
    <clipPath id="plotClip">
      <rect x="190" y="150" width="960" height="378" rx="8"/>
    </clipPath>
  </defs>

  <rect width="1280" height="720" fill="#fafafa"/>

  <g font-family="'IBM Plex Sans Thai','Noto Sans Thai',Sarabun,system-ui,sans-serif">
    <text x="72" y="68" fill="#18181b" font-size="34" font-weight="700">Cone of Uncertainty</text>
    <text x="72" y="99" fill="#52525b" font-size="19">Estimate ranges shrink as evidence replaces assumptions.</text>

    <!-- Plot background -->
    <rect x="190" y="150" width="960" height="378" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>

    <!-- Horizontal reference grid -->
    <g fill="none" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="5 7">
      <path d="M190 168H1150"/>
      <path d="M190 258H1150"/>
      <path d="M190 319H1150"/>
      <path d="M190 348H1150"/>
      <path d="M190 377H1150"/>
      <path d="M190 438H1150"/>
      <path d="M190 528H1150"/>
    </g>

    <!-- Phase guides -->
    <g fill="none" stroke="#e4e4e7" stroke-width="1">
      <path d="M190 150V528"/>
      <path d="M430 150V528"/>
      <path d="M670 150V528"/>
      <path d="M910 150V528"/>
      <path d="M1150 150V528"/>
    </g>

    <!-- Y-axis labels -->
    <g fill="#52525b" font-size="18" font-weight="600" text-anchor="end">
      <text x="168" y="174">4x</text>
      <text x="168" y="264">2x</text>
      <text x="168" y="325">1.25x</text>
      <text x="168" y="354" fill="#18181b">1x</text>
      <text x="168" y="383">0.8x</text>
      <text x="168" y="444">0.5x</text>
      <text x="168" y="534">0.25x</text>
    </g>
    <text x="44" y="339" fill="#18181b" font-size="20" font-weight="600" text-anchor="middle" transform="rotate(-90 44 339)">Estimate variability</text>

    <!-- Shaded uncertainty range -->
    <g clip-path="url(#plotClip)">
      <path d="M190 168
               C292 202 354 236 430 258
               C516 286 594 309 670 319
               C760 331 842 341 910 344
               C1000 347 1080 348 1150 348
               C1080 348 1000 349 910 352
               C842 355 760 365 670 377
               C594 387 516 410 430 438
               C354 460 292 494 190 528 Z"
            fill="#2a78d6" fill-opacity="0.16"/>
      <path d="M190 168
               C292 202 354 236 430 258
               C516 286 594 309 670 319
               C760 331 842 341 910 344
               C1000 347 1080 348 1150 348"
            fill="none" stroke="#1c5cab" stroke-width="5" stroke-linecap="round"/>
      <path d="M190 528
               C292 494 354 460 430 438
               C516 410 594 387 670 377
               C760 365 842 355 910 352
               C1000 349 1080 348 1150 348"
            fill="none" stroke="#1c5cab" stroke-width="5" stroke-linecap="round"/>
      <path d="M190 348H1150" fill="none" stroke="#116b11" stroke-width="2.5" stroke-dasharray="9 8"/>
    </g>

    <!-- Phase markers -->
    <g fill="#ffffff" stroke="#116b11" stroke-width="3">
      <circle cx="190" cy="348" r="6"/>
      <circle cx="430" cy="348" r="6"/>
      <circle cx="670" cy="348" r="6"/>
      <circle cx="910" cy="348" r="6"/>
      <circle cx="1150" cy="348" r="7" fill="#116b11"/>
    </g>

    <!-- Early estimate annotation -->
    <g filter="url(#softShadow)">
      <rect x="205" y="112" width="316" height="54" rx="14" fill="#fff7ed" stroke="#86590a" stroke-width="2"/>
    </g>
    <text x="229" y="146" fill="#86590a" font-size="20" font-weight="700">Early estimates can be off by 4x</text>
    <path d="M221 166L197 184" fill="none" stroke="#86590a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="194" cy="187" r="4" fill="#86590a"/>

    <!-- Learning annotation -->
    <g filter="url(#softShadow)">
      <rect x="536" y="218" width="260" height="52" rx="14" fill="#eff6ff" stroke="#2a78d6" stroke-width="2"/>
    </g>
    <text x="666" y="251" fill="#1c5cab" font-size="20" font-weight="700" text-anchor="middle">Re-estimate as you learn</text>
    <path d="M744 270C760 282 774 294 787 311" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M777 307L789 313L790 300" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Note box -->
    <g filter="url(#softShadow)">
      <rect x="876" y="78" width="310" height="70" rx="16" fill="#ffffff" stroke="#116b11" stroke-width="2"/>
    </g>
    <circle cx="906" cy="113" r="11" fill="#116b11"/>
    <path d="M901 113L905 117L912 108" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="928" y="108" fill="#18181b" font-size="19" font-weight="700">Relative points beat</text>
    <text x="928" y="132" fill="#18181b" font-size="19" font-weight="700">hours early on</text>

    <!-- X-axis -->
    <path d="M190 548H1150" fill="none" stroke="#18181b" stroke-width="2"/>
    <g fill="#18181b" font-size="18" font-weight="600" text-anchor="middle">
      <text x="190" y="583">Initial concept</text>
      <text x="430" y="583">Requirements</text>
      <text x="670" y="583">Design</text>
      <text x="910" y="583">Implementation</text>
      <text x="1150" y="583">Release</text>
    </g>

    <!-- Reading key -->
    <g transform="translate(190 632)">
      <rect width="20" height="20" rx="5" fill="#2a78d6" fill-opacity="0.18" stroke="#1c5cab" stroke-width="2"/>
      <text x="32" y="18" fill="#52525b" font-size="18">Plausible estimate range</text>
      <path d="M288 10H324" stroke="#116b11" stroke-width="2.5" stroke-dasharray="8 6"/>
      <text x="336" y="18" fill="#52525b" font-size="18">Current best estimate (1x)</text>
    </g>
  </g>
</svg>
