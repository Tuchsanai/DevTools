<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">User story and INVEST checklist</title>
  <desc id="desc">A user story index card surrounded by six INVEST principle chips, with acceptance criteria and story point options.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#18181b" flood-opacity="0.12"/>
    </filter>
    <filter id="chipShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#18181b" flood-opacity="0.09"/>
    </filter>
    <style>
      text { font-family: 'IBM Plex Sans Thai','Noto Sans Thai',Sarabun,system-ui,sans-serif; }
      .chip-label { font-size: 19px; font-weight: 650; fill: #18181b; }
      .chip-letter { font-size: 22px; font-weight: 800; }
      .criterion { font-size: 18px; font-weight: 500; fill: #18181b; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#fafafa"/>

  <!-- Quiet orbital guide keeps the six principles visually connected. -->
  <ellipse cx="640" cy="356" rx="522" ry="244" fill="none" stroke="#1c5cab" stroke-width="2" stroke-dasharray="3 12" stroke-linecap="round" opacity="0.14"/>

  <!-- Central index card -->
  <g filter="url(#softShadow)">
    <rect x="380" y="186" width="520" height="344" rx="22" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <rect x="380" y="186" width="10" height="344" rx="5" fill="#1c5cab"/>
  </g>
  <rect x="414" y="220" width="150" height="36" rx="18" fill="#e8f1fb"/>
  <text x="489" y="245" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="1.4" fill="#1c5cab">USER STORY</text>

  <text x="414" y="304" font-size="18" font-weight="500" fill="#18181b">
    <tspan>As a </tspan><tspan fill="#1c5cab" font-weight="750">&lt;user&gt;</tspan><tspan> I want </tspan><tspan fill="#116b11" font-weight="750">&lt;goal&gt;</tspan><tspan> so that </tspan><tspan fill="#a32222" font-weight="750">&lt;benefit&gt;</tspan>
  </text>
  <line x1="414" y1="326" x2="866" y2="326" stroke="#e4e4e7" stroke-width="2"/>

  <text x="414" y="363" font-size="20" font-weight="750" fill="#52525b">Acceptance criteria</text>

  <g aria-label="Acceptance criteria checklist">
    <rect x="414" y="386" width="22" height="22" rx="5" fill="#ffffff" stroke="#2a78d6" stroke-width="2.5"/>
    <text class="criterion" x="452" y="404">The outcome is observable</text>

    <rect x="414" y="428" width="22" height="22" rx="5" fill="#ffffff" stroke="#116b11" stroke-width="2.5"/>
    <text class="criterion" x="452" y="446">Happy path verified</text>

    <rect x="414" y="470" width="22" height="22" rx="5" fill="#ffffff" stroke="#86590a" stroke-width="2.5"/>
    <text class="criterion" x="452" y="488">Edge cases covered</text>
  </g>

  <!-- Left INVEST chips -->
  <g filter="url(#chipShadow)" aria-label="Independent">
    <rect x="76" y="166" width="220" height="56" rx="18" fill="#eef5fd" stroke="#1c5cab" stroke-width="2"/>
    <circle cx="108" cy="194" r="19" fill="#1c5cab"/>
    <path d="M100 194h16M108 186v16" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text class="chip-label" x="140" y="201"><tspan class="chip-letter" fill="#1c5cab">I</tspan><tspan dx="8">Independent</tspan></text>
  </g>

  <g filter="url(#chipShadow)" aria-label="Negotiable">
    <rect x="76" y="326" width="220" height="56" rx="18" fill="#fff7e6" stroke="#86590a" stroke-width="2"/>
    <circle cx="108" cy="354" r="19" fill="#86590a"/>
    <path d="M99 356l6-6 5 5 7-8M114 347h3v3" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="chip-label" x="140" y="361"><tspan class="chip-letter" fill="#86590a">N</tspan><tspan dx="8">Negotiable</tspan></text>
  </g>

  <g filter="url(#chipShadow)" aria-label="Valuable">
    <rect x="76" y="486" width="220" height="56" rx="18" fill="#edf8ed" stroke="#116b11" stroke-width="2"/>
    <circle cx="108" cy="514" r="19" fill="#116b11"/>
    <path d="M99 509l9 11 9-11z" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linejoin="round"/>
    <text class="chip-label" x="140" y="521"><tspan class="chip-letter" fill="#116b11">V</tspan><tspan dx="8">Valuable</tspan></text>
  </g>

  <!-- Right INVEST chips -->
  <g filter="url(#chipShadow)" aria-label="Estimable">
    <rect x="984" y="166" width="220" height="56" rx="18" fill="#eef5fd" stroke="#2a78d6" stroke-width="2"/>
    <circle cx="1016" cy="194" r="19" fill="#2a78d6"/>
    <path d="M1007 201l4-5 4 3 9-11" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="chip-label" x="1048" y="201"><tspan class="chip-letter" fill="#2a78d6">E</tspan><tspan dx="8">Estimable</tspan></text>
  </g>

  <g filter="url(#chipShadow)" aria-label="Small">
    <rect x="984" y="326" width="220" height="56" rx="18" fill="#f5f3ff" stroke="#1c5cab" stroke-width="2"/>
    <circle cx="1016" cy="354" r="19" fill="#1c5cab"/>
    <rect x="1009" y="347" width="14" height="14" rx="3" fill="none" stroke="#ffffff" stroke-width="2.3"/>
    <text class="chip-label" x="1048" y="361"><tspan class="chip-letter" fill="#1c5cab">S</tspan><tspan dx="8">Small</tspan></text>
  </g>

  <g filter="url(#chipShadow)" aria-label="Testable">
    <rect x="984" y="486" width="220" height="56" rx="18" fill="#fff0f0" stroke="#a32222" stroke-width="2"/>
    <circle cx="1016" cy="514" r="19" fill="#a32222"/>
    <path d="M1007 514l6 6 12-13" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="chip-label" x="1048" y="521"><tspan class="chip-letter" fill="#a32222">T</tspan><tspan dx="8">Testable</tspan></text>
  </g>

  <!-- Story points -->
  <g filter="url(#chipShadow)" aria-label="Story points: 1 2 3 5 8 13">
    <rect x="416" y="624" width="448" height="64" rx="32" fill="#18181b"/>
    <text x="446" y="664" font-size="19" font-weight="700" fill="#ffffff">Story points:</text>

    <circle cx="590" cy="656" r="18" fill="#2a78d6"/>
    <text x="590" y="663" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">1</text>
    <circle cx="636" cy="656" r="18" fill="#1c5cab"/>
    <text x="636" y="663" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">2</text>
    <circle cx="682" cy="656" r="18" fill="#116b11"/>
    <text x="682" y="663" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">3</text>
    <circle cx="728" cy="656" r="18" fill="#86590a"/>
    <text x="728" y="663" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">5</text>
    <circle cx="774" cy="656" r="18" fill="#a32222"/>
    <text x="774" y="663" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">8</text>
    <circle cx="824" cy="656" r="18" fill="#52525b" stroke="#a1a1aa" stroke-width="1"/>
    <text x="824" y="663" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">13</text>
  </g>
</svg>
