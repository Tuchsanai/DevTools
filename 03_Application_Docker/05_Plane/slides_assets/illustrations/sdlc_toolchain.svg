  <g fill="#18181b" font-family="'IBM Plex Sans Thai','Noto Sans Thai',Sarabun,system-ui,sans-serif" font-size="18" font-weight="600">
    <text x="514" y="375">IDE</text>
    <text x="512" y="485">Git / GitHub</text>
  </g>

  <!-- Testing tools -->
  <g filter="url(#tileShadow)">
    <rect x="640" y="326" width="176" height="96" rx="16" fill="#ffffff" stroke="#e0c690" stroke-width="2"/>
    <rect x="640" y="438" width="176" height="96" rx="16" fill="#ffffff" stroke="#e0c690" stroke-width="2"/>
