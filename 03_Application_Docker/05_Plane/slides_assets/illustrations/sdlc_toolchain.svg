  <g filter="url(#tileShadow)">
    <rect x="1032" y="326" width="176" height="96" rx="16" fill="#ffffff" stroke="#cfcfd3" stroke-width="2"/>
    <rect x="1032" y="438" width="176" height="96" rx="16" fill="#ffffff" stroke="#cfcfd3" stroke-width="2"/>
