<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Roles of applications across the software development life cycle</title>
  <desc id="desc">A project management and tracking application spans six connected SDLC phases: Requirements, Design, Implementation, Testing, Deployment, and Maintenance. Each phase lists two supporting application categories.</desc>

  <defs>
    <filter id="softShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#18181b" flood-opacity="0.10"/>
    </filter>
    <filter id="tileShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#18181b" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#fafafa"/>

  <!-- Cross-phase project management application -->
  <rect x="40" y="34" width="1200" height="96" rx="22" fill="#ffffff" stroke="#1c5cab" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="58" y="52" width="60" height="60" rx="16" fill="#e8f1fc"/>
  <g fill="none" stroke="#1c5cab" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="73" y="65" width="30" height="34" rx="4"/>
    <path d="M81 65v-4h14v4M80 77h16M80 86h11"/>
    <path d="M68 76h-3v30h30v-3"/>
  </g>
  <text x="138" y="75" fill="#18181b" font-family="'IBM Plex Sans Thai','Noto Sans Thai',Sarabun,system-ui,sans-serif" font-size="24" font-weight="700">Project management &amp; tracking app (Plane / Jira / Trello)</text>
  <text x="138" y="104" fill="#52525b" font-family="'IBM Plex Sans Thai','Noto Sans Thai',Sarabun,system-ui,sans-serif" font-size="19" font-weight="500">— single source of truth across all phases</text>

  <!-- Connectors from the shared application layer to every phase -->
  <g fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round">
    <path d="M138 130V171"/>
    <path d="M334 130V171"/>
    <path d="M530 130V171"/>
    <path d="M726 130V171"/>
    <path d="M922 130V171"/>
    <path d="M1118 130V171"/>
  </g>
  <g fill="#ffffff" stroke="#1c5cab" stroke-width="2">
    <circle cx="138" cy="171" r="5"/>
    <circle cx="334" cy="171" r="5"/>
    <circle cx="530" cy="171" r="5"/>
    <circle cx="726" cy="171" r="5"/>
    <circle cx="922" cy="171" r="5"/>
    <circle cx="1118" cy="171" r="5"/>
  </g>

