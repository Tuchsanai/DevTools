  <g filter="url(#tileShadow)">
    <rect x="248" y="326" width="176" height="96" rx="16" fill="#ffffff" stroke="#b8d2f2" stroke-width="2"/>
    <rect x="248" y="438" width="176" height="96" rx="16" fill="#ffffff" stroke="#b8d2f2" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#2a78d6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="264" y="353" width="15" height="13" rx="3"/><rect x="294" y="353" width="15" height="13" rx="3"/><rect x="279" y="380" width="15" height="13" rx="3"/>
    <path d="M279 359h15M286.5 366v14"/>
