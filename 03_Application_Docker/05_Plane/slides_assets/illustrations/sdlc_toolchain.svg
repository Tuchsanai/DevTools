  <g filter="url(#softShadow)">
    <path d="M40 184H236L260 239L236 294H40Z" fill="#1c5cab"/>
    <path d="M236 184H432L456 239L432 294H236L260 239Z" fill="#2a78d6"/>
    <path d="M432 184H628L652 239L628 294H432L456 239Z" fill="#116b11"/>
