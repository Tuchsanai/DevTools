  <g fill="#18181b" font-family="'IBM Plex Sans Thai','Noto Sans Thai',Sarabun,system-ui,sans-serif" font-size="18" font-weight="600">
    <text x="1097" y="375">Monitoring</text>
    <text x="1099" y="480">Support</text>
    <text x="1099" y="501">tickets</text>
  </g>

  <!-- Visual baseline -->
  <path d="M52 574H1208" fill="none" stroke="#e4e4e7" stroke-width="2"/>
  <g fill="#52525b" font-family="'IBM Plex Sans Thai','Noto Sans Thai',Sarabun,system-ui,sans-serif" font-size="18" text-anchor="middle">
    <text x="640" y="614">Specialized applications support each task; shared tracking keeps the lifecycle connected.</text>
  </g>
</svg>
