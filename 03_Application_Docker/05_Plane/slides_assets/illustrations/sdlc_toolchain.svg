  <!-- Deployment tools -->
  <g filter="url(#tileShadow)">
    <rect x="836" y="326" width="176" height="96" rx="16" fill="#ffffff" stroke="#e6b6b6" stroke-width="2"/>
    <rect x="836" y="438" width="176" height="96" rx="16" fill="#ffffff" stroke="#e6b6b6" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#a32222" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M854 368h35c-1 10-7 17-18 17-10 0-16-5-17-13Z"/>
    <path d="M860 359h8v8h-8zM870 359h8v8h-8zM880 359h8v8h-8zM870 350h8v8h-8z"/>
    <path d="M889 366c4-1 6-3 7-6 3 4 2 9-3 11"/>
