<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">ChongJai Café ใช้ Traefik เป็นประตูเดียว</title>
  <desc id="desc">Browser เข้าพอร์ต 8000 ไป Traefik แล้วแยกเว็บไป Next.js และ API ไป FastAPI ก่อนต่อ PostgreSQL ภายในเครือข่าย cafenet</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7a4b3a"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#382018" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1440" height="900" fill="#fffaf0"/>
  <circle cx="120" cy="110" r="180" fill="#ffd8a8" opacity=".35"/><circle cx="1330" cy="120" r="220" fill="#d0bfff" opacity=".22"/>
  <text x="720" y="78" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="44" font-weight="700" fill="#382018">ChongJai Café: ประตูเดียวของ LAB 1</text>
  <text x="720" y="122" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="24" fill="#744838">ทุก request เริ่มที่ Traefik ก่อนถูกส่งไป service ปลายทาง</text>
  <rect x="80" y="175" width="1280" height="610" rx="36" fill="#fff3bf" fill-opacity=".35" stroke="#d49a25" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="120" y="222" font-family="Tahoma, sans-serif" font-size="24" font-weight="700" fill="#744838">Docker host · publish เฉพาะ 8000 และ 8080</text>
  <g filter="url(#shadow)"><rect x="120" y="360" width="240" height="150" rx="26" fill="#a5d8ff" stroke="#4a9eed" stroke-width="4"/><text x="240" y="422" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="29" font-weight="700" fill="#163b5c">Browser</text><text x="240" y="463" text-anchor="middle" font-family="monospace" font-size="22" fill="#163b5c">localhost:8000</text></g>
  <path d="M360 435H475" stroke="#7a4b3a" stroke-width="6" marker-end="url(#arrow)"/><text x="418" y="412" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="21" fill="#744838">HTTP</text>
  <g filter="url(#shadow)"><rect x="485" y="315" width="275" height="240" rx="30" fill="#d0bfff" stroke="#8b5cf6" stroke-width="4"/><text x="622" y="390" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="34" font-weight="700" fill="#3f237a">Traefik</text><text x="622" y="430" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="23" fill="#3f237a">front door :80</text><text x="622" y="466" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="21" fill="#3f237a">dashboard :8080</text><rect x="535" y="492" width="175" height="38" rx="19" fill="#fff" fill-opacity=".65"/><text x="622" y="518" text-anchor="middle" font-family="monospace" font-size="17" fill="#3f237a">exposed=false</text></g>
  <path d="M760 382C825 382 835 300 900 300" fill="none" stroke="#7a4b3a" stroke-width="6" marker-end="url(#arrow)"/><text x="825" y="330" text-anchor="middle" font-family="monospace" font-size="23" fill="#744838">/</text>
  <g filter="url(#shadow)"><rect x="910" y="235" width="320" height="140" rx="26" fill="#ffd8a8" stroke="#f59e0b" stroke-width="4"/><text x="1070" y="294" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="30" font-weight="700" fill="#623d16">Next.js web</text><text x="1070" y="337" text-anchor="middle" font-family="monospace" font-size="21" fill="#623d16">:3000 · internal</text></g>
  <path d="M760 485C825 485 835 565 900 565" fill="none" stroke="#7a4b3a" stroke-width="6" marker-end="url(#arrow)"/><text x="830" y="545" text-anchor="middle" font-family="monospace" font-size="23" fill="#744838">/api</text>
  <g filter="url(#shadow)"><rect x="910" y="495" width="320" height="140" rx="26" fill="#b2f2bb" stroke="#22a552" stroke-width="4"/><text x="1070" y="554" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="30" font-weight="700" fill="#185b32">FastAPI api</text><text x="1070" y="597" text-anchor="middle" font-family="monospace" font-size="21" fill="#185b32">:8000 · internal</text></g>
  <path d="M1070 635V675" stroke="#7a4b3a" stroke-width="6" marker-end="url(#arrow)"/><text x="1110" y="667" font-family="Tahoma, sans-serif" font-size="20" fill="#744838">SQL</text>
  <g filter="url(#shadow)"><rect x="910" y="690" width="320" height="75" rx="24" fill="#c3fae8" stroke="#22a552" stroke-width="4"/><text x="1070" y="738" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="25" font-weight="700" fill="#185b32">PostgreSQL db · :5432 internal</text></g>
  <rect x="130" y="695" width="650" height="70" rx="22" fill="#fff" stroke="#dd7833" stroke-width="2"/><text x="455" y="724" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="21" font-weight="700" fill="#744838">web / api / db ไม่มี host port</text><text x="455" y="751" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="19" fill="#744838">service คุยกันด้วย Compose DNS บน cafenet</text>
</svg>
