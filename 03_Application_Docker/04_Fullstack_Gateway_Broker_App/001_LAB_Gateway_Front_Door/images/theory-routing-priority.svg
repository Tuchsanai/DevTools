<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Traefik เลือก route ด้วย PathPrefix และ priority</title>
  <desc id="desc">คำขอ /api/menu ตรงกับ /api priority 200 และ / priority 1 จึงเลือก API ส่วน /orders ตรงเฉพาะ / priority 1 จึงเลือกเว็บ</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7a4b3a"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#382018" flood-opacity=".12"/></filter></defs>
  <rect width="1440" height="900" fill="#fffaf0"/>
  <text x="720" y="74" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="42" font-weight="700" fill="#382018">PathPrefix + priority เลือกเส้นทางอย่างไร</text>
  <text x="720" y="116" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="23" fill="#744838">Traefik หา rule ที่ match ทั้งหมด แล้วให้เลข priority สูงกว่าชนะ</text>
  <rect x="70" y="160" width="1300" height="290" rx="32" fill="#edf7ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="105" y="205" font-family="Tahoma, sans-serif" font-size="24" font-weight="700" fill="#163b5c">กรณี A · GET /api/menu</text>
  <g filter="url(#shadow)"><rect x="115" y="255" width="250" height="100" rx="24" fill="#a5d8ff" stroke="#4a9eed" stroke-width="4"/><text x="240" y="315" text-anchor="middle" font-family="monospace" font-size="24" font-weight="700" fill="#163b5c">/api/menu</text></g>
  <path d="M365 305H475" stroke="#7a4b3a" stroke-width="6" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><polygon points="490,305 615,225 740,305 615,385" fill="#fff3bf" stroke="#d49a25" stroke-width="4"/><text x="615" y="296" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="22" font-weight="700" fill="#654d0a">rule ไหน</text><text x="615" y="328" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="22" font-weight="700" fill="#654d0a">match?</text></g>
  <path d="M740 280H845" stroke="#8b5cf6" stroke-width="6" marker-end="url(#arrow)"/><text x="792" y="260" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="19" fill="#3f237a">ทั้งคู่</text>
  <g filter="url(#shadow)"><rect x="855" y="218" width="250" height="85" rx="22" fill="#d0bfff" stroke="#8b5cf6" stroke-width="4"/><text x="980" y="253" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#3f237a">PathPrefix(`/api`)</text><text x="980" y="282" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="20" fill="#3f237a">priority 200</text><rect x="855" y="322" width="250" height="75" rx="22" fill="#ffd8a8" stroke="#f59e0b" stroke-width="3"/><text x="980" y="353" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#623d16">PathPrefix(`/`)</text><text x="980" y="380" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="19" fill="#623d16">priority 1</text></g>
  <path d="M1110 260H1215" stroke="#22a552" stroke-width="6" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="1225" y="220" width="110" height="85" rx="22" fill="#b2f2bb" stroke="#22a552" stroke-width="4"/><text x="1280" y="254" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="21" font-weight="700" fill="#185b32">API</text><text x="1280" y="282" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="17" fill="#185b32">200 ชนะ</text></g>
  <rect x="70" y="485" width="1300" height="290" rx="32" fill="#fff5e8" stroke="#f59e0b" stroke-width="2"/>
  <text x="105" y="530" font-family="Tahoma, sans-serif" font-size="24" font-weight="700" fill="#623d16">กรณี B · GET /orders</text>
  <g filter="url(#shadow)"><rect x="115" y="580" width="250" height="100" rx="24" fill="#a5d8ff" stroke="#4a9eed" stroke-width="4"/><text x="240" y="640" text-anchor="middle" font-family="monospace" font-size="24" font-weight="700" fill="#163b5c">/orders</text></g>
  <path d="M365 630H475" stroke="#7a4b3a" stroke-width="6" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><polygon points="490,630 615,550 740,630 615,710" fill="#fff3bf" stroke="#d49a25" stroke-width="4"/><text x="615" y="621" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="22" font-weight="700" fill="#654d0a">rule ไหน</text><text x="615" y="653" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="22" font-weight="700" fill="#654d0a">match?</text></g>
  <path d="M740 630H855" stroke="#f59e0b" stroke-width="6" marker-end="url(#arrow)"/><text x="798" y="606" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="19" fill="#623d16">เฉพาะ /</text>
  <g filter="url(#shadow)"><rect x="865" y="585" width="270" height="90" rx="22" fill="#ffd8a8" stroke="#f59e0b" stroke-width="4"/><text x="1000" y="623" text-anchor="middle" font-family="monospace" font-size="21" font-weight="700" fill="#623d16">PathPrefix(`/`)</text><text x="1000" y="654" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="20" fill="#623d16">priority 1</text></g>
  <path d="M1135 630H1215" stroke="#22a552" stroke-width="6" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="1225" y="585" width="110" height="90" rx="22" fill="#b2f2bb" stroke="#22a552" stroke-width="4"/><text x="1280" y="640" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="22" font-weight="700" fill="#185b32">WEB</text></g>
  <rect x="270" y="810" width="900" height="58" rx="25" fill="#382018"/><text x="720" y="848" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="22" font-weight="700" fill="#fff8e8">priority ไม่ได้เปลี่ยน URL — มันตัดสินเมื่อหลาย rule match พร้อมกัน</text>
</svg>
