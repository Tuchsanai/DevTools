<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">เส้นทางเปลี่ยนน้ำหนัก Canary จาก 90/10 ไป 50/50 และ 0/100</title>
  <desc id="desc">คำขอเข้าทาง Traefik แล้ว weighted service แบ่งไป API v1 และ v2 ตาม routes.yml ซึ่ง hot reload ได้โดยไม่ restart</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f7e7ce"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7a4328"/></marker>
  </defs>
  <rect width="1440" height="810" fill="url(#bg)"/>
  <text x="90" y="95" font-family="sans-serif" font-size="38" font-weight="800" fill="#3c2016">Canary release: เปลี่ยนสัดส่วน ไม่เปลี่ยน URL</text>
  <text x="90" y="135" font-family="sans-serif" font-size="21" fill="#755044">Traefik อ่าน dynamic/routes.yml ใหม่ทันที · application contract ของ v1/v2 เหมือนกัน</text>
  <g filter="url(#shadow)"><rect x="90" y="260" width="240" height="190" rx="32" fill="#3c2016"/><text x="210" y="330" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#fffaf0">ลูกค้า</text><text x="210" y="375" text-anchor="middle" font-family="monospace" font-size="22" fill="#f4b45f">localhost:8000</text><text x="210" y="412" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#ead8c3">URL เดียวตลอดการปล่อย</text></g>
  <path d="M330 355H495" stroke="#7a4328" stroke-width="7" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="510" y="215" width="330" height="280" rx="32" fill="#fff" stroke="#d5a05c" stroke-width="3"/><text x="675" y="280" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="800" fill="#3c2016">weighted@file</text><text x="675" y="322" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#755044">file provider watch=true</text><rect x="555" y="360" width="240" height="72" rx="18" fill="#f9e3c4"/><text x="675" y="390" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#7a4328">9:1 → 5:5 → 0:10</text><text x="675" y="418" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#755044">ไม่ restart Traefik</text></g>
  <path d="M840 300H1020" stroke="#7a4328" stroke-width="7" marker-end="url(#arrow)"/><path d="M840 415H1020" stroke="#d97706" stroke-width="7" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="1040" y="205" width="300" height="150" rx="30" fill="#6f4b3e"/><text x="1190" y="265" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#fff">API v1</text><text x="1190" y="308" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#f8e8d5">tagline เดิม · header 1</text><rect x="1040" y="390" width="300" height="150" rx="30" fill="#d97706"/><text x="1190" y="450" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#fff">API v2</text><text x="1190" y="493" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#fff4df">tagline ใหม่ · header 2</text></g>
  <g><rect x="115" y="630" width="360" height="84" rx="22" fill="#fff" stroke="#dbc4a7"/><text x="295" y="664" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#3c2016">90/10 · ทดลองกับกลุ่มเล็ก</text><text x="295" y="692" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#755044">v2 10–30 จาก 200 requests</text><rect x="540" y="630" width="360" height="84" rx="22" fill="#fff" stroke="#dbc4a7"/><text x="720" y="664" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#3c2016">50/50 · ขยายอย่างควบคุม</text><text x="720" y="692" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#755044">v2 80–120 จาก 200 requests</text><rect x="965" y="630" width="360" height="84" rx="22" fill="#fff" stroke="#dbc4a7"/><text x="1145" y="664" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#3c2016">0/100 · ปล่อยเต็ม</text><text x="1145" y="692" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#755044">ทุก response เป็น v2</text></g>
</svg>
