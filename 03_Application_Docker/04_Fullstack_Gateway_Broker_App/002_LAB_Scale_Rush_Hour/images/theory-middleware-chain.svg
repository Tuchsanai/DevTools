<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Router และ middleware chain ของ LAB2</title><desc id="desc">PathPrefix และ priority เลือก router ออเดอร์ผ่าน rate limit รายงานผ่าน basic auth ส่วน API อื่นไม่ผ่าน middleware และคำตอบ 401 429 เกิดที่ gateway</desc>
  <defs><style>text{font-family:Tahoma,"Noto Sans Thai",sans-serif;fill:#382018}.title{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#744838}.box{stroke-width:3}.label{font-size:21px;font-weight:700;text-anchor:middle}.small{font-size:16px;text-anchor:middle}.arrow{fill:none;stroke-width:4;stroke-linecap:round}.dash{stroke-dasharray:10 9}</style><marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs>
  <rect width="1280" height="720" rx="32" fill="#fffdf8"/><text x="640" y="54" class="title" text-anchor="middle">Router ตัดสินก่อน Middleware</text><text x="640" y="87" class="sub" text-anchor="middle">PathPrefix + priority เลือก policy chain เพียงเส้นเดียว</text>
  <rect x="40" y="275" width="180" height="95" rx="22" fill="#fff3bf" stroke="#f59e0b" class="box"/><text x="130" y="315" class="label">Request</text><text x="130" y="344" class="small">entrypoint :8000</text><path d="M220 322 H325" class="arrow" stroke="#f59e0b" marker-end="url(#arrow2)"/>
  <path d="M425 215 L525 322 L425 429 L325 322 Z" fill="#a5d8ff" stroke="#4a9eed" class="box"/><text x="425" y="313" class="label">Router</text><text x="425" y="341" class="small">priority</text>
  <path d="M500 250 L635 155" class="arrow" stroke="#8b5cf6" marker-end="url(#arrow2)"/><text x="555" y="186" class="small">orders · 320</text><rect x="635" y="112" width="225" height="88" rx="22" fill="#d0bfff" stroke="#8b5cf6" class="box"/><text x="747" y="148" class="label">orders-rate</text><text x="747" y="178" class="small">2/s · burst 5</text>
  <path d="M860 156 H1040" class="arrow" stroke="#22c55e" marker-end="url(#arrow2)"/><text x="950" y="139" class="small">ผ่าน</text><path d="M747 200 V246" class="arrow" stroke="#ef4444" marker-end="url(#arrow2)"/><rect x="675" y="246" width="145" height="70" rx="18" fill="#ffc9c9" stroke="#ef4444" class="box"/><text x="747" y="278" class="label">429</text><text x="747" y="301" class="small">gateway</text>
  <path d="M525 322 H635" class="arrow" stroke="#f59e0b" marker-end="url(#arrow2)"/><text x="580" y="304" class="small">report · 310</text><rect x="635" y="337" width="225" height="88" rx="22" fill="#ffd8a8" stroke="#f59e0b" class="box"/><text x="747" y="373" class="label">manager-auth</text><text x="747" y="403" class="small">basicAuth</text><path d="M860 381 L1040 322" class="arrow" stroke="#22c55e" marker-end="url(#arrow2)"/><path d="M747 425 V467" class="arrow" stroke="#ef4444" marker-end="url(#arrow2)"/><rect x="675" y="467" width="145" height="70" rx="18" fill="#ffc9c9" stroke="#ef4444" class="box"/><text x="747" y="499" class="label">401</text><text x="747" y="522" class="small">gateway</text>
  <path d="M490 400 C635 570 840 490 1040 360" class="arrow" stroke="#4a9eed" marker-end="url(#arrow2)"/><text x="560" y="530" class="small">API อื่น · priority 200 · ไม่มี middleware</text><rect x="1040" y="265" width="205" height="120" rx="24" fill="#b2f2bb" stroke="#22c55e" class="box"/><text x="1142" y="305" class="label">API replicas</text><text x="1142" y="337" class="small">201 / 200</text><text x="1142" y="363" class="small">มี app headers</text>
  <rect x="65" y="565" width="690" height="100" rx="22" fill="#fff3bf" stroke="#f59e0b" class="box"/><text x="410" y="603" class="label">401 / 429 ไม่มี X-Served-By และ X-Cafe-Api-Version</text><text x="410" y="637" class="small">นี่คือหลักฐานว่า Traefik ตอบก่อน request จะถึงบาริสต้า API</text><path d="M755 615 C890 595 900 480 820 500" class="arrow dash" stroke="#ef4444" marker-end="url(#arrow2)"/>
</svg>
