<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Scale และ active health check ของ Traefik</title>
  <desc id="desc">เบราว์เซอร์เข้า Traefik ที่ URL เดียว Traefik กระจายไป API สาม replicas และหยุดส่งไป replica ที่ health ตอบ 503 โดย container ยังทำงาน</desc>
  <defs><style>text{font-family:Tahoma,"Noto Sans Thai",sans-serif;fill:#382018}.title{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#744838}.box{stroke-width:3}.label{font-size:21px;font-weight:700;text-anchor:middle}.small{font-size:17px;text-anchor:middle}.arrow{fill:none;stroke-width:4;stroke-linecap:round}.dash{stroke-dasharray:10 9}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker><marker id="bar" markerWidth="8" markerHeight="12" refX="4" refY="6" orient="auto"><path d="M4,0 V12" stroke="#ef4444" stroke-width="3"/></marker></defs>
  <rect width="1280" height="720" rx="32" fill="#fffdf8"/><text x="640" y="55" class="title" text-anchor="middle">Scale + Active Health Check</text><text x="640" y="88" class="sub" text-anchor="middle">Traefik ส่ง traffic เฉพาะ replica ที่ตอบ health เป็น 200</text>
  <rect x="45" y="245" width="200" height="105" rx="22" fill="#fff3bf" stroke="#f59e0b" class="box"/><text x="145" y="287" class="label">Browser</text><text x="145" y="318" class="small">URL เดียว :8000</text>
  <path d="M245 298 H365" class="arrow" stroke="#f59e0b" marker-end="url(#arrow)"/><text x="305" y="282" class="small">GET /api</text>
  <rect x="365" y="205" width="245" height="185" rx="28" fill="#d0bfff" stroke="#8b5cf6" class="box"/><text x="487" y="265" class="label">Traefik</text><text x="487" y="300" class="small">load balancer</text><text x="487" y="331" class="small">check /api/health ทุก 3s</text>
  <rect x="825" y="110" width="285" height="92" rx="22" fill="#b2f2bb" stroke="#22c55e" class="box"/><text x="967" y="150" class="label">API replica 1</text><text x="967" y="179" class="small">200 · HEALTHY</text>
  <rect x="825" y="260" width="285" height="92" rx="22" fill="#ffc9c9" stroke="#ef4444" class="box"/><text x="967" y="300" class="label">API replica 2</text><text x="967" y="329" class="small">503 · DOWN แต่ยัง Running</text>
  <rect x="825" y="410" width="285" height="92" rx="22" fill="#b2f2bb" stroke="#22c55e" class="box"/><text x="967" y="450" class="label">API replica 3</text><text x="967" y="479" class="small">200 · HEALTHY</text>
  <path d="M610 245 L825 156" class="arrow" stroke="#22c55e" marker-end="url(#arrow)"/><path d="M610 298 H825" class="arrow dash" stroke="#ef4444" marker-end="url(#bar)"/><text x="715" y="285" class="small" fill="#ef4444">ถอนจากวง</text><path d="M610 352 L825 456" class="arrow" stroke="#22c55e" marker-end="url(#arrow)"/>
  <rect x="825" y="555" width="285" height="86" rx="22" fill="#c3fae8" stroke="#06b6d4" class="box"/><text x="967" y="592" class="label">PostgreSQL</text><text x="967" y="620" class="small">shared state · no host port</text><path d="M967 502 V555" class="arrow dash" stroke="#06b6d4" marker-end="url(#arrow)"/>
  <rect x="65" y="500" width="475" height="120" rx="24" fill="#ffd8a8" stroke="#f59e0b" class="box"/><text x="302" y="540" class="label">ยิงตรง replica IP เพื่อ toggle</text><text x="302" y="575" class="small">/fail → 503 · /ok → 200 · flag อยู่ใน memory</text><text x="302" y="603" class="small">container ไม่ถูก stop/restart</text><path d="M540 540 C660 500 710 380 825 306" class="arrow" stroke="#ef4444" marker-end="url(#arrow)"/>
</svg>
