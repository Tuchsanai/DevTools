<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Sales Analytics Event Pipeline</title><desc id="desc">FastAPI และ worker ส่ง ORDER_PLACED กับ ORDER_READY เข้า Kafka จากนั้น analytics อัปเดต sales_stats และ dashboard อ่านรายงาน ส่วน audit replay โดยไม่เขียนฐานข้อมูล</desc>
  <defs><style>text{font-family:Tahoma,"Noto Sans Thai",sans-serif;fill:#382018}.title{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#744838}.box{stroke-width:3}.label{font-size:20px;font-weight:700;text-anchor:middle}.small{font-size:16px;text-anchor:middle}.arrow{fill:none;stroke-width:4;stroke-linecap:round}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs>
  <rect width="1280" height="720" rx="32" fill="#fffdf8"/><text x="640" y="54" class="title" text-anchor="middle">Sales Analytics Event Pipeline</text><text x="640" y="86" class="sub" text-anchor="middle">งานชงใช้ RabbitMQ · ประวัติเหตุการณ์และแนวโน้มใช้ Kafka</text>
  <rect x="50" y="170" width="190" height="86" rx="20" fill="#a5d8ff" stroke="#4a9eed" class="box"/><text x="145" y="205" class="label">FastAPI</text><text x="145" y="234" class="small">ORDER_PLACED</text>
  <rect x="50" y="315" width="190" height="86" rx="20" fill="#ffd8a8" stroke="#f59e0b" class="box"/><text x="145" y="350" class="label">Worker</text><text x="145" y="379" class="small">ORDER_READY</text>
  <rect x="350" y="215" width="205" height="140" rx="24" fill="#d0bfff" stroke="#8b5cf6" class="box"/><text x="452" y="257" class="label">Kafka</text><text x="452" y="287" class="small">cafe.events</text><text x="452" y="316" class="small">3 partitions</text>
  <path d="M240 213 L350 260" class="arrow" stroke="#4a9eed" marker-end="url(#arrow)"/><text x="292" y="217" class="small">menu key</text><path d="M240 358 L350 315" class="arrow" stroke="#f59e0b" marker-end="url(#arrow)"/>
  <rect x="660" y="155" width="200" height="95" rx="22" fill="#eebefa" stroke="#ec4899" class="box"/><text x="760" y="195" class="label">Analytics group</text><text x="760" y="224" class="small">อ่านต่อเนื่อง</text><path d="M555 258 L660 207" class="arrow" stroke="#8b5cf6" marker-end="url(#arrow)"/>
  <rect x="660" y="330" width="200" height="95" rx="22" fill="#fff3bf" stroke="#f59e0b" class="box"/><text x="760" y="370" class="label">Audit group</text><text x="760" y="399" class="small">earliest · read-only</text><path d="M555 315 L660 375" class="arrow" stroke="#8b5cf6" marker-end="url(#arrow)"/>
  <rect x="1010" y="155" width="210" height="95" rx="22" fill="#c3fae8" stroke="#22c55e" class="box"/><text x="1115" y="195" class="label">sales_stats</text><text x="1115" y="224" class="small">UPDATE เฉพาะ PLACED</text><path d="M860 202 H1010" class="arrow" stroke="#22c55e" marker-end="url(#arrow)"/><text x="935" y="188" class="small">UPDATE</text>
  <rect x="1010" y="330" width="210" height="95" rx="22" fill="#a5d8ff" stroke="#4a9eed" class="box"/><text x="1115" y="370" class="label">Owner Dashboard</text><text x="1115" y="399" class="small">trend-level</text><path d="M1115 250 V330" class="arrow" stroke="#4a9eed" marker-end="url(#arrow)"/>
  <rect x="155" y="515" width="970" height="120" rx="24" fill="#fff3bf" stroke="#f59e0b" class="box"/><text x="640" y="555" class="label">สอง consumer group อ่านประวัติชุดเดียวกันโดยอิสระ</text><text x="640" y="589" class="small">analytics มี auto-commit และสะสมแนวโน้ม · audit ไม่ commit ไม่ต่อ DB และจบเองหลัง timeout</text><text x="640" y="617" class="small">ไม่มี outbox / exactly-once — รายงานนี้ไม่ใช้ปิดบัญชี</text>
</svg>
