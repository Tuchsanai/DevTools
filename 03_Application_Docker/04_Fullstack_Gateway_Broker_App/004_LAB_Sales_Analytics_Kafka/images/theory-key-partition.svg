<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Key to Partition to Consumer</title><desc id="desc">menu_code เดิมเลือก partition เดิม และ consumer สองตัวใน analytics group แบ่งสาม partitions หลัง rebalance</desc>
  <defs><style>text{font-family:Tahoma,"Noto Sans Thai",sans-serif;fill:#382018}.title{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#744838}.box{stroke-width:3}.label{font-size:20px;font-weight:700;text-anchor:middle}.small{font-size:16px;text-anchor:middle}.arrow{fill:none;stroke-width:4;stroke-linecap:round}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs>
  <rect width="1280" height="720" rx="32" fill="#fffdf8"/><text x="640" y="54" class="title" text-anchor="middle">Key → Partition → Consumer</text><text x="640" y="86" class="sub" text-anchor="middle">key เดิมลง partition เดิม · หนึ่ง partition มีสมาชิกเดียวต่อ consumer group</text>
  <rect x="55" y="145" width="235" height="95" rx="20" fill="#ffd8a8" stroke="#f59e0b" class="box"/><text x="172" y="183" class="label">mocha</text><text x="172" y="213" class="small">key bytes คงที่</text>
  <rect x="55" y="300" width="235" height="95" rx="20" fill="#b2f2bb" stroke="#22c55e" class="box"/><text x="172" y="338" class="label">matcha · cocoa</text><text x="172" y="368" class="small">key bytes คงที่</text>
  <rect x="55" y="455" width="235" height="110" rx="20" fill="#d0bfff" stroke="#8b5cf6" class="box"/><text x="172" y="492" class="label">latte · espresso</text><text x="172" y="522" class="label">americano</text><text x="172" y="550" class="small">key bytes คงที่</text>
  <rect x="440" y="140" width="230" height="105" rx="22" fill="#ffd8a8" stroke="#f59e0b" class="box"/><text x="555" y="184" class="label">Partition 0</text><text x="555" y="214" class="small">mocha events</text>
  <rect x="440" y="300" width="230" height="105" rx="22" fill="#b2f2bb" stroke="#22c55e" class="box"/><text x="555" y="344" class="label">Partition 1</text><text x="555" y="374" class="small">matcha + cocoa</text>
  <rect x="440" y="460" width="230" height="105" rx="22" fill="#d0bfff" stroke="#8b5cf6" class="box"/><text x="555" y="497" class="label">Partition 2</text><text x="555" y="527" class="small">latte + espresso + americano</text>
  <path d="M290 192 H440" class="arrow" stroke="#f59e0b" marker-end="url(#arrow)"/><path d="M290 348 H440" class="arrow" stroke="#22c55e" marker-end="url(#arrow)"/><path d="M290 510 H440" class="arrow" stroke="#8b5cf6" marker-end="url(#arrow)"/>
  <rect x="905" y="195" width="260" height="110" rx="22" fill="#eebefa" stroke="#ec4899" class="box"/><text x="1035" y="238" class="label">Analytics A</text><text x="1035" y="270" class="small">partition 0 + 1</text>
  <rect x="905" y="425" width="260" height="110" rx="22" fill="#a5d8ff" stroke="#4a9eed" class="box"/><text x="1035" y="468" class="label">Analytics B</text><text x="1035" y="500" class="small">partition 2</text>
  <path d="M670 192 L905 240" class="arrow" stroke="#f59e0b" marker-end="url(#arrow)"/><path d="M670 352 L905 270" class="arrow" stroke="#22c55e" marker-end="url(#arrow)"/><path d="M670 512 L905 480" class="arrow" stroke="#8b5cf6" marker-end="url(#arrow)"/>
  <rect x="235" y="620" width="810" height="65" rx="18" fill="#fff3bf" stroke="#f59e0b" class="box"/><text x="640" y="660" class="label">scale เป็น 2 members แล้ว rebalance: ทุก partition ยังมีเจ้าของเพียงคนเดียว</text>
</svg>
