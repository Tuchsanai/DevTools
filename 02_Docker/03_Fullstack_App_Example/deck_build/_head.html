<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusOps — จากโจทย์ลูกค้าสู่ระบบสามกล่องด้วย Docker</title>
<style>
:root{
  --paper:#fafafa; --card:#ffffff; --wash:#f4f4f5;
  --rail:#18181b; --rail2:#27272a; --rail3:#3f3f46;
  --rule:#e4e4e7; --rule2:#d4d4d8;
  --ink:#18181b; --ink2:#52525b; --ink3:#71717a;
  --acc:#1c5cab; --acc2:#2a78d6; --accw:#eaf2fd; --accl:#c6dbf6;
  --ok:#116b11; --okw:#e7f6e7; --okl:#c3e2ca;
  --warn:#86590a; --warnw:#fdf3dd; --warnl:#ecd8a8;
  --crit:#a32222; --critw:#fbeaea; --critl:#f0cccc;
  --code-bg:#18181b; --code-ink:#e4e4e7;
  --s:1;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:#0e0e11; overflow:hidden;
  font-family:"IBM Plex Sans Thai","Noto Sans Thai",Sarabun,"Leelawadee UI",Tahoma,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink); -webkit-font-smoothing:antialiased;
}
code,kbd,pre,.mono{font-family:ui-monospace,"DejaVu Sans Mono","Cascadia Code",Consolas,Menlo,monospace}
.num{font-variant-numeric:tabular-nums}

/* ---------- stage ---------- */
#stage{position:fixed; inset:0}
.slot{position:absolute; left:50%; top:50%; width:1280px; height:720px;
      margin-left:-640px; margin-top:-360px; transform:scale(var(--s)); display:none}
.slot.active{display:block}
.slide{width:1280px; height:720px; background:var(--card); position:relative; overflow:hidden;
       display:flex; flex-direction:column; box-shadow:0 24px 70px rgba(0,0,0,.55)}

/* ---------- head / body / foot ---------- */
.s-head{padding:32px 56px 0 56px; flex:0 0 auto}
.eyebrow{font-size:13px; font-weight:700; letter-spacing:.14em; color:var(--ink3); text-transform:uppercase}
.s-head h2{font-size:37px; line-height:1.28; font-weight:700; color:var(--ink); margin-top:6px; letter-spacing:-.01em}
.s-head h2 em{font-style:normal; color:var(--acc)}
.s-head .sub{font-size:18px; color:var(--ink2); margin-top:7px; line-height:1.5}
.s-head::after{content:""; display:block; height:2px; background:var(--rule2); margin-top:14px}
.s-body{flex:1 1 auto; padding:20px 56px 52px 56px; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:16px}
.s-body.top{justify-content:flex-start}
.s-foot{position:absolute; left:0; right:0; bottom:0; height:38px; padding:0 56px;
  display:flex; align-items:center; justify-content:space-between;
  font-size:12.5px; color:var(--ink3); border-top:1px solid var(--rule)}
.s-foot .pg{font-weight:700; color:var(--acc); font-variant-numeric:tabular-nums}

/* ---------- cover / section ---------- */
.slide.cover,.slide.section{background:var(--rail); color:#fafafa; justify-content:center}
.slide.cover .s-body,.slide.section .s-body{padding:0 78px}
.cover .k{font-size:14px; letter-spacing:.2em; text-transform:uppercase; color:#a1a1aa; font-weight:700}
.cover h1{font-size:60px; line-height:1.16; font-weight:800; letter-spacing:-.02em; margin-top:16px}
.cover .rule{width:104px; height:5px; background:var(--acc2); margin:24px 0}
.cover .m{font-size:20px; color:#d4d4d8; line-height:1.75}
.section .num-big{font-size:112px; font-weight:800; color:#3f3f46; line-height:1}
.section h1{font-size:48px; font-weight:800; margin-top:-8px; letter-spacing:-.01em}
.section .m{font-size:20px; color:#a1a1aa; margin-top:16px; line-height:1.7; max-width:78%}
.slide.cover .s-foot,.slide.section .s-foot{border-top:1px solid var(--rail3); color:#71717a}
.slide.cover .s-foot .pg,.slide.section .s-foot .pg{color:#86b6ef}

/* ---------- blocks ---------- */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
.g21{display:grid; grid-template-columns:1.25fr .75fr; gap:22px; align-items:start}
.g12{display:grid; grid-template-columns:.75fr 1.25fr; gap:22px; align-items:start}
.g11{display:grid; grid-template-columns:1fr 1fr; gap:22px; align-items:start}
.mid{align-items:center}

.card{border:1px solid var(--rule); background:var(--card); border-radius:10px; padding:15px 17px}
.card h4{font-size:18px; color:var(--ink); font-weight:700; margin-bottom:6px; line-height:1.35}
.card p{font-size:15.5px; line-height:1.6; color:var(--ink2)}
.card.a{border-color:var(--accl); background:var(--accw)} .card.a h4{color:var(--acc)}
.card.o{border-color:var(--okl); background:var(--okw)} .card.o h4{color:var(--ok)}
.card.w{border-color:var(--warnl); background:var(--warnw)} .card.w h4{color:var(--warn)}
.card.c{border-color:var(--critl); background:var(--critw)} .card.c h4{color:var(--crit)}
.card.d{border-color:var(--rule2); background:var(--wash)}
.card .n{display:inline-flex; width:24px; height:24px; align-items:center; justify-content:center;
  border-radius:6px; background:var(--acc); color:#fff; font-size:13px; font-weight:800; margin-right:8px; vertical-align:2px}
.card.c .n{background:var(--crit)} .card.o .n{background:var(--ok)} .card.w .n{background:var(--warn)}

ul.bul{list-style:none; font-size:18px; line-height:1.62}
ul.bul>li{position:relative; padding-left:22px; margin-bottom:10px}
ul.bul>li::before{content:""; position:absolute; left:2px; top:11px; width:7px; height:7px; border-radius:2px; background:var(--acc2)}
ul.bul>li:last-child{margin-bottom:0}
ul.bul .s{display:block; font-size:15px; color:var(--ink3); margin-top:1px}
ul.bul.sm{font-size:16px} ul.bul.sm>li{margin-bottom:7px} ul.bul.sm>li::before{top:9px}

pre.code{background:var(--code-bg); color:var(--code-ink); border-radius:9px; padding:14px 17px;
  font-size:15.5px; line-height:1.62; overflow:hidden; white-space:pre-wrap; word-break:break-word; flex:0 0 auto}
pre.code.sm{font-size:13.6px; line-height:1.56; padding:12px 15px}
pre.code.xs{font-size:12.4px; line-height:1.5; padding:11px 14px}
pre.code.lg{font-size:18px}
/* คำสั่งที่ผู้เรียนต้องคัดลอกทั้งบรรทัด — ห้ามตัดกลางชื่อโฟลเดอร์ */
pre.code.path{white-space:pre; word-break:normal; overflow-wrap:normal; font-size:12.4px; line-height:1.6}
.code .c{color:#a1a1aa; font-style:italic}
.code .k{color:#86b6ef}
.code .g{color:#7fd67f}
.code .y{color:#fbd67a}
.code .r{color:#f0a0a0}
.code .d{color:#a1a1aa}
.codecap{font-size:13px; color:var(--ink3); margin-top:-8px}

table.tbl{width:100%; border-collapse:collapse; font-size:16px}
.tbl th,.tbl td{padding:8px 12px; text-align:left; border-bottom:1px solid var(--rule); vertical-align:top}
.tbl th{background:var(--wash); color:var(--ink3); font-weight:700; font-size:12px; letter-spacing:.1em; text-transform:uppercase; border-bottom:2px solid var(--rule2)}
.tbl tr:last-child td{border-bottom:none}
.tbl.sm{font-size:14.2px} .tbl.sm th,.tbl.sm td{padding:6px 10px}
.tbl.xs{font-size:12.8px} .tbl.xs th,.tbl.xs td{padding:4px 9px}
.tbl code{background:var(--wash); border:1px solid var(--rule); padding:0 5px; border-radius:4px; font-size:.92em; color:var(--acc)}
.tbl td b{color:var(--ink)}
.tbl .req{color:var(--acc); font-weight:700; white-space:nowrap}
.tbl .mut{color:var(--ink3)}

.quote{border-left:4px solid var(--acc); background:var(--accw); border-radius:0 9px 9px 0; padding:16px 22px;
  font-size:20px; line-height:1.72; color:var(--ink)}
.quote.big{font-size:24px}
.quote .who{display:block; font-size:14px; color:var(--ink3); margin-top:10px; font-weight:700; letter-spacing:.04em}
.quote mark{background:linear-gradient(transparent 62%,#ffe08a 62%); padding:0 2px; color:inherit}

.note{border-left:4px solid var(--rule2); background:var(--wash); border-radius:0 9px 9px 0; padding:12px 18px; font-size:16px; line-height:1.6; color:var(--ink2)}
.note b{color:var(--ink)}
.note.a{border-color:var(--acc); background:var(--accw)} .note.a b{color:var(--acc)}
.note.o{border-color:var(--ok); background:var(--okw)} .note.o b{color:var(--ok)}
.note.w{border-color:#fab219; background:var(--warnw)} .note.w b{color:var(--warn)}
.note.c{border-color:#d03b3b; background:var(--critw)} .note.c b{color:var(--crit)}

.tag{display:inline-block; font-size:12px; font-weight:700; padding:2px 9px; border-radius:20px; letter-spacing:.03em; border:1px solid}
.tag.a{background:var(--accw); color:var(--acc); border-color:var(--accl)}
.tag.o{background:var(--okw); color:var(--ok); border-color:var(--okl)}
.tag.w{background:var(--warnw); color:var(--warn); border-color:var(--warnl)}
.tag.c{background:var(--critw); color:var(--crit); border-color:var(--critl)}
.tag.d{background:var(--wash); color:var(--ink2); border-color:var(--rule2)}

.stat{border:1px solid var(--rule); border-radius:10px; padding:13px 16px; background:var(--card)}
.stat .v{font-size:34px; font-weight:800; color:var(--acc); line-height:1.1; font-variant-numeric:tabular-nums}
.stat .v.c{color:var(--crit)} .stat .v.o{color:var(--ok)} .stat .v.d{color:var(--ink)}
.stat .l{font-size:13.5px; color:var(--ink3); margin-top:4px; line-height:1.45}

.fig{display:flex; align-items:center; justify-content:center; min-height:0; flex:1 1 auto}
.fig svg{max-width:100%; max-height:100%; height:auto; display:block}
.fig img{max-width:100%; max-height:100%; object-fit:contain; display:block}
.fig.shot img{border:1px solid var(--rule2); border-radius:8px}
.figcap{text-align:center; font-size:13px; color:var(--ink3); margin-top:6px}

/* ---------- สไลด์ที่ "รูปเป็นพระเอก" ----------
   หัวเรื่องเตี้ยลง · ระยะขอบแคบลง เพื่อคืนความสูงให้ไดอะแกรม/ภาพหน้าจอ
   ได้แสดงที่ขนาดจริง ไม่ต้องถูกย่อจนตัวหนังสือในรูปอ่านไม่ออก */
.slide.figs .s-head{padding:20px 56px 0}
.slide.figs .s-head h2{font-size:30px; line-height:1.24; margin-top:4px}
.slide.figs .s-head .sub{font-size:15.5px; margin-top:4px}
.slide.figs .s-head::after{margin-top:9px}
.slide.figs .s-body{padding:12px 56px 44px; gap:11px}
/* กล่องรูปที่ "ล็อกความสูง" ไว้ : รูปได้ความสูงเท่าที่ขอ ส่วนที่เหลือค่อยเป็นของข้อความ */
.fig.fix{flex:0 0 auto}
.fig.fix svg,.fig.fix img{height:100%; width:auto; max-width:100%}
.figrow{display:grid; gap:14px; align-items:start}
.figrow.c21{grid-template-columns:1.35fr .65fr}
.figrow.c11{grid-template-columns:1fr 1fr}
.figrow.c12{grid-template-columns:.65fr 1.35fr}
.figs pre.code.xs{font-size:12.2px; line-height:1.48}
.figs .note{padding:10px 15px}

.flow{display:flex; align-items:center; gap:10px; justify-content:center; flex-wrap:wrap}
.flow .b{border:1.5px solid var(--rule2); background:var(--card); border-radius:9px; padding:10px 16px; text-align:center; min-width:118px}
.flow .b .t{font-size:17px; font-weight:700; color:var(--ink)}
.flow .b .s{font-size:12.5px; color:var(--ink3); margin-top:2px}
.flow .b.a{border-color:var(--acc); background:var(--accw)} .flow .b.a .t{color:var(--acc)}
.flow .b.k{border-color:var(--rail3); background:var(--rail); } .flow .b.k .t{color:#fafafa} .flow .b.k .s{color:#a1a1aa}
.flow .ar{color:var(--ink3); font-size:20px; font-weight:700}

.kv{display:grid; grid-template-columns:auto 1fr; gap:8px 16px; font-size:16px; align-items:baseline}
.kv dt{font-weight:700; color:var(--acc); white-space:nowrap}
.kv dd{color:var(--ink2); line-height:1.5}

.agenda{display:grid; grid-template-columns:1fr 1fr; gap:10px 20px}
.agenda .it{display:flex; gap:12px; align-items:flex-start; padding:9px 12px; border:1px solid var(--rule); border-radius:9px; cursor:pointer; background:var(--card); transition:border-color .12s, background .12s}
.agenda .it:hover{border-color:var(--acc); background:var(--accw)}
.agenda .ix{flex:0 0 auto; width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:7px;
  background:var(--wash); color:var(--ink2); font-weight:800; font-size:13px; border:1px solid var(--rule)}
.agenda .it.lab .ix{background:var(--accw); color:var(--acc); border-color:var(--accl)}
.agenda .tt{line-height:1.35; font-size:17px; font-weight:600; padding-top:2px}
.agenda .tt s{display:block; font-size:13.5px; color:var(--ink3); text-decoration:none; font-weight:400; margin-top:2px}

/* ---------- chrome ---------- */
#bar{position:fixed; left:0; right:0; top:0; height:3px; background:rgba(255,255,255,.12); z-index:40}
#bar i{display:block; height:100%; background:var(--acc2); width:0; transition:width .2s}
/* ปุ่มควบคุมกับเลขหน้าลอย : ซ่อนตัวเองเมื่อไม่ขยับเมาส์ จะได้ไม่ทับท้ายสไลด์ */
#ctl,#counter{opacity:0; transition:opacity .25s; pointer-events:none}
body.ui-on #ctl,body.ui-on #counter{opacity:1; pointer-events:auto}
#ctl{position:fixed; right:16px; bottom:16px; display:flex; gap:7px; z-index:41}
#ctl button{background:rgba(255,255,255,.09); color:#d4d4d8; border:1px solid rgba(255,255,255,.16);
  width:38px; height:38px; border-radius:9px; font-size:16px; cursor:pointer; line-height:1}
#ctl button:hover{background:rgba(255,255,255,.2); color:#fff}
#counter{position:fixed; left:16px; bottom:16px; color:#a1a1aa; font-size:13px; z-index:41;
  background:rgba(255,255,255,.07); padding:6px 12px; border-radius:9px; border:1px solid rgba(255,255,255,.13); font-variant-numeric:tabular-nums}

/* ---------- overview ---------- */
#ov{position:fixed; inset:0; background:#0e0e11; z-index:50; display:none; overflow:auto; padding:26px 36px 30px}
#ov.on{display:block}
#ov h3{color:#fafafa; font-size:24px; font-weight:800; margin-bottom:4px}
#ov .oh{color:#a1a1aa; font-size:14px; margin-bottom:16px}
#ov .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(262px,1fr)); gap:13px; max-width:1320px; margin:0 auto}
#ov .oc{background:#18181b; border:1px solid #3f3f46; border-radius:12px; padding:13px 15px; cursor:pointer; transition:border-color .12s, background .12s}
#ov .oc:hover{border-color:#2a78d6; background:#1f1f24}
#ov .oc .n{font-size:12px; font-weight:800; letter-spacing:.14em; color:#86b6ef}
#ov .oc .t{font-size:17.5px; font-weight:700; color:#fafafa; margin-top:4px; line-height:1.3}
#ov .oc .d{font-size:13px; color:#a1a1aa; margin-top:6px; line-height:1.5}
#ov .oc .r{font-size:12px; color:#71717a; margin-top:7px; font-variant-numeric:tabular-nums}
#help{position:fixed; inset:0; background:rgba(8,8,11,.92); z-index:60; display:none; place-items:center; color:#e4e4e7}
#help.on{display:grid}
#help .box{background:#18181b; border:1px solid #3f3f46; border-radius:14px; padding:30px 38px; max-width:520px}
#help h3{color:#86b6ef; font-size:21px; margin-bottom:14px}
#help table{font-size:15px; line-height:1.95}
#help kbd{background:#27272a; border:1px solid #3f3f46; border-radius:5px; padding:1px 8px; font-size:13px; margin-right:4px}

/* ---------- print ---------- */
@page{size:1280px 720px; margin:0}

/* ---------- วิดีโอ Remotion (ฝังเป็น data URI · เล่นเฉพาะสไลด์ที่แสดง) ---------- */
.vidwrap{position:relative; border:1px solid var(--rule2); border-radius:10px; overflow:hidden;
  background:var(--wash); line-height:0}
.vidwrap video,.vidwrap img.vposter{display:block; width:100%; height:auto}
.vidwrap img.vposter{display:none}
.vidcap{font-size:13.5px; color:var(--ink3); margin-top:8px; line-height:1.5}
@media (prefers-reduced-motion: reduce){
  .vidwrap video{display:none}
  .vidwrap img.vposter{display:block}
}
@media print{
  .vidwrap video{display:none !important}
  .vidwrap img.vposter{display:block !important}
}

@media print{
  body{background:#fff; overflow:visible}
  #stage{position:static; display:block}
  .slot{position:relative; display:block !important; left:auto; top:auto; margin:0;
        width:1280px; height:720px; transform:none; page-break-after:always; break-after:page}
  .slide{box-shadow:none}
  #bar,#ctl,#counter,#help,#ov{display:none !important}
}
</style>
</head>
<body>
<div id="stage">
