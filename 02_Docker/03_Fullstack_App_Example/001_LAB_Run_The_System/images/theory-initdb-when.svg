<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ไฟล์ใน /docker-entrypoint-initdb.d รันตอนไหน</text>

  <!-- start -->
  <rect x="266" y="52" width="268" height="52" rx="26" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="400" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">docker run ... postgres:17-alpine</text>
  <text x="400" y="94" text-anchor="middle" font-size="12" fill="#1e3a8a">entrypoint เริ่มทำงาน</text>
  <path d="M 400 104 L 400 128" stroke="#64748b" stroke-width="2.5" marker-end="url(#a1)"/>

  <!-- decision diamond -->
  <path d="M 400 132 L 596 190 L 400 248 L 204 190 z" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="400" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">/var/lib/postgresql/data</text>
  <text x="400" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">ว่างหรือไม่</text>

  <!-- yes branch -->
  <path d="M 204 190 L 148 190 L 148 250" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a1)"/>
  <text x="152" y="180" font-size="13" font-weight="bold" fill="#047857">ว่าง</text>
  <rect x="24" y="254" width="248" height="118" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="148" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">สร้าง cluster ใหม่ แล้วรัน</text>
  <text x="148" y="302" text-anchor="middle" font-size="13" fill="#065f46">01-schema.sql → 02-seed.sql</text>
  <text x="148" y="322" text-anchor="middle" font-size="12" fill="#065f46">(เรียงตามชื่อไฟล์)</text>
  <text x="148" y="346" text-anchor="middle" font-size="12" fill="#334155">log : running /docker-entrypoint-</text>
  <text x="148" y="363" text-anchor="middle" font-size="12" fill="#334155">initdb.d/01-schema.sql</text>

  <!-- no branch -->
  <path d="M 596 190 L 652 190 L 652 250" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a1)"/>
  <text x="600" y="180" font-size="13" font-weight="bold" fill="#b91c1c">มีข้อมูลอยู่แล้ว</text>
  <rect x="528" y="254" width="248" height="118" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="652" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">ข้ามไฟล์ทั้งหมด</text>
  <text x="652" y="302" text-anchor="middle" font-size="13" fill="#991b1b">แก้ .sql กี่รอบก็ไม่มีผล</text>
  <text x="652" y="322" text-anchor="middle" font-size="12" fill="#991b1b">(ต่อให้ recreate กล่องใหม่)</text>
  <text x="652" y="346" text-anchor="middle" font-size="12" fill="#334155">log : Skipping initialization</text>
  <text x="652" y="363" text-anchor="middle" font-size="12" fill="#334155">แล้ว start ต่อจากข้อมูลเดิม</text>

  <!-- center note -->
  <rect x="296" y="268" width="208" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="400" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">ตัวตัดสินคือ</text>
  <text x="400" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">"data directory ว่างไหม"</text>
  <text x="400" y="338" text-anchor="middle" font-size="12" fill="#475569">ไม่ใช่ "กล่องใหม่หรือกล่องเก่า"</text>
</svg>
