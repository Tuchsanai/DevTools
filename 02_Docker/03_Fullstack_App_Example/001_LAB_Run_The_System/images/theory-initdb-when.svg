<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>
  <defs>
    <marker id="a1" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12.5" refY="5" orient="auto">
      <path d="M 0 0 L 13 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ไฟล์ใน /docker-entrypoint-initdb.d รันตอนไหน</text>

  <!-- start -->
  <rect x="266" y="52" width="268" height="52" rx="26" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="400" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">docker run ... postgres:17-alpine</text>
  <text x="400" y="94" text-anchor="middle" font-size="12" fill="#1e3a8a">entrypoint เริ่มทำงาน</text>
  <path d="M 400 105 L 400 148" stroke="#64748b" stroke-width="2.5" marker-end="url(#a1)"/>

  <!-- decision diamond -->
  <path d="M 400 152 L 596 210 L 400 268 L 204 210 z" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="400" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">/var/lib/postgresql/data</text>
  <text x="400" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">ว่างหรือไม่</text>

  <!-- yes branch -->
  <path d="M 204 210 L 148 210 L 148 270" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a1)"/>
  <text x="176" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">ว่าง</text>
  <rect x="24" y="274" width="248" height="118" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="148" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">สร้าง cluster ใหม่ แล้วรัน</text>
  <text x="148" y="322" text-anchor="middle" font-size="13" fill="#065f46">01-schema.sql → 02-seed.sql</text>
  <text x="148" y="342" text-anchor="middle" font-size="12" fill="#065f46">(เรียงตามชื่อไฟล์)</text>
  <text x="148" y="366" text-anchor="middle" font-size="12" fill="#334155">log : running /docker-entrypoint-</text>
  <text x="148" y="383" text-anchor="middle" font-size="12" fill="#334155">initdb.d/01-schema.sql</text>

  <!-- no branch -->
  <path d="M 596 210 L 652 210 L 652 270" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a1)"/>
  <text x="624" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">มีข้อมูลอยู่แล้ว</text>
  <rect x="528" y="274" width="248" height="118" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="652" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">ข้ามไฟล์ทั้งหมด</text>
  <text x="652" y="322" text-anchor="middle" font-size="13" fill="#991b1b">แก้ .sql กี่รอบก็ไม่มีผล</text>
  <text x="652" y="342" text-anchor="middle" font-size="12" fill="#991b1b">(ต่อให้ recreate กล่องใหม่)</text>
  <text x="652" y="366" text-anchor="middle" font-size="12" fill="#334155">log : Skipping initialization</text>
  <text x="652" y="383" text-anchor="middle" font-size="12" fill="#334155">แล้ว start ต่อจากข้อมูลเดิม</text>

  <!-- center note -->
  <rect x="296" y="288" width="208" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="400" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">ตัวตัดสินคือ</text>
  <text x="400" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">"data directory ว่างไหม"</text>
  <text x="400" y="358" text-anchor="middle" font-size="12" fill="#475569">ไม่ใช่ "กล่องใหม่หรือกล่องเก่า"</text>
</svg>
