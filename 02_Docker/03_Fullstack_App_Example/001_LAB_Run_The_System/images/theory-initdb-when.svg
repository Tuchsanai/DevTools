<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>
  <defs>
    <marker id="a1" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12.5" refY="5" orient="auto">
      <path d="M 0 0 L 13 5 L 0 10 z" fill="#52606d"/>
    </marker>
  </defs>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2933">ไฟล์ใน /docker-entrypoint-initdb.d รันตอนไหน</text>

  <!-- start -->
  <rect x="266" y="52" width="268" height="52" rx="26" fill="#eef6ff" stroke="#8fb8dc" stroke-width="2"/>
  <text x="400" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c4f80">docker run ... postgres:17-alpine</text>
  <text x="400" y="94" text-anchor="middle" font-size="12" fill="#1c4f80">entrypoint เริ่มทำงาน</text>
  <path d="M 400 105 L 400 148" stroke="#52606d" stroke-width="3" marker-end="url(#a1)"/>

  <!-- decision diamond -->
  <path d="M 400 152 L 596 210 L 400 268 L 204 210 z" fill="#fff4e5" stroke="#d98324" stroke-width="2.5"/>
  <text x="400" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#a35a10">/var/lib/postgresql/data</text>
  <text x="400" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#a35a10">ว่างหรือไม่</text>

  <!-- yes branch -->
  <path d="M 204 210 L 148 210 L 148 270" stroke="#52606d" stroke-width="3" fill="none" marker-end="url(#a1)"/>
  <text x="176" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e6b41">ว่าง</text>
  <rect x="24" y="274" width="248" height="118" rx="10" fill="#f2fbf5" stroke="#2e8b57" stroke-width="2"/>
  <text x="148" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e6b41">สร้าง cluster ใหม่ แล้วรัน</text>
  <text x="148" y="322" text-anchor="middle" font-size="13" fill="#1e6b41">01-schema.sql → 02-seed.sql</text>
  <text x="148" y="342" text-anchor="middle" font-size="12" fill="#1e6b41">(เรียงตามชื่อไฟล์)</text>
  <text x="148" y="366" text-anchor="middle" font-size="12" fill="#1f2933">log : running /docker-entrypoint-</text>
  <text x="148" y="383" text-anchor="middle" font-size="12" fill="#1f2933">initdb.d/01-schema.sql</text>

  <!-- no branch -->
  <path d="M 596 210 L 652 210 L 652 270" stroke="#52606d" stroke-width="3" fill="none" marker-end="url(#a1)"/>
  <text x="624" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f2020">มีข้อมูลอยู่แล้ว</text>
  <rect x="528" y="274" width="248" height="118" rx="10" fill="#fdf3f3" stroke="#c04a4a" stroke-width="2"/>
  <text x="652" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#8f2020">ข้ามไฟล์ทั้งหมด</text>
  <text x="652" y="322" text-anchor="middle" font-size="13" fill="#8f2020">แก้ .sql กี่รอบก็ไม่มีผล</text>
  <text x="652" y="342" text-anchor="middle" font-size="12" fill="#8f2020">(ต่อให้ recreate กล่องใหม่)</text>
  <text x="652" y="366" text-anchor="middle" font-size="12" fill="#1f2933">log : Skipping initialization</text>
  <text x="652" y="383" text-anchor="middle" font-size="12" fill="#1f2933">แล้ว start ต่อจากข้อมูลเดิม</text>

  <!-- center note -->
  <rect x="296" y="288" width="208" height="86" rx="10" fill="#f6f8fa" stroke="#9aa5b1" stroke-width="1"/>
  <text x="400" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">ตัวตัดสินคือ</text>
  <text x="400" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">"data directory ว่างไหม"</text>
  <text x="400" y="358" text-anchor="middle" font-size="12" fill="#52606d">ไม่ใช่ "กล่องใหม่หรือกล่องเก่า"</text>
</svg>
