<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="452" fill="#ffffff"/>

  <defs>
    <marker id="arC" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12.5" refY="5" orient="auto">
      <path d="M 0 0 L 13 5 L 0 10 z" fill="#1c4f80"/>
    </marker>
  </defs>

  <text x="450" y="32" fill="#1f2933" font-size="19" font-weight="bold" text-anchor="middle">multi-stage : ของที่ใช้ตอน build ไม่ต้องติดไปกับ image ที่ส่งมอบ</text>

  <!-- builder side -->
  <rect x="24" y="56" width="360" height="326" rx="10" fill="#fff4e5" stroke="#d98324" stroke-width="2"/>
  <text x="204" y="82" fill="#a35a10" font-size="14" font-weight="bold" text-anchor="middle">stage deps + builder — ถูกทิ้งทั้งก้อน</text>

  <rect x="42" y="96" width="324" height="48" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="56" y="117" fill="#1f2933" font-size="13">node_modules ครบทุกตัว (RUN npm ci)</text>
  <text x="56" y="136" fill="#8f2020" font-size="13" font-weight="bold">505 MB</text>

  <rect x="42" y="152" width="324" height="48" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="56" y="173" fill="#1f2933" font-size="13">devDependencies : typescript · tailwindcss</text>
  <text x="56" y="192" fill="#52606d" font-size="12">รวมอยู่ในก้อน 505 MB ข้างบน</text>

  <rect x="42" y="208" width="324" height="48" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="56" y="229" fill="#1f2933" font-size="13">source .tsx + cache ของ next build</text>
  <text x="56" y="248" fill="#8f2020" font-size="13" font-weight="bold">100 MB</text>

  <rect x="42" y="264" width="324" height="52" rx="8" fill="#eef6ff" stroke="#1c4f80" stroke-width="2"/>
  <text x="56" y="286" fill="#1c4f80" font-size="13">ผลลัพธ์ที่ต้องใช้จริงตอนรัน</text>
  <text x="56" y="306" fill="#1c4f80" font-size="12" font-weight="bold">.next/standalone · .next/static</text>

  <text x="204" y="342" fill="#a35a10" font-size="13" text-anchor="middle">ทุกอย่างในกรอบนี้อยู่แค่ตอน build</text>
  <text x="204" y="364" fill="#52606d" font-size="12" text-anchor="middle">ไม่มี layer ไหนของ 2 stage นี้ไปโผล่ใน docker history</text>

  <!-- arrow -->
  <path d="M388 290 L482 290" stroke="#1c4f80" stroke-width="3" fill="none" marker-end="url(#arC)"/>
  <text x="435" y="274" fill="#1c4f80" font-size="12" font-weight="bold" text-anchor="middle">COPY</text>
  <text x="435" y="314" fill="#1c4f80" font-size="12" text-anchor="middle">--from=builder</text>

  <!-- runner side -->
  <rect x="486" y="56" width="390" height="326" rx="10" fill="#f2fbf5" stroke="#2e8b57" stroke-width="2"/>
  <text x="681" y="82" fill="#1e6b41" font-size="14" font-weight="bold" text-anchor="middle">stage runner — image ที่ส่งให้ลูกค้า</text>

  <rect x="504" y="96" width="354" height="44" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="518" y="117" fill="#1f2933" font-size="13">base : node:22-alpine</text>
  <text x="518" y="134" fill="#52606d" font-size="12">232 MB (มี node ไว้รัน server.js)</text>

  <rect x="504" y="148" width="354" height="44" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="518" y="169" fill="#1f2933" font-size="13">.next/standalone (server.js + node_modules เท่าที่ใช้)</text>
  <text x="518" y="186" fill="#1e6b41" font-size="12" font-weight="bold">49.9 MB · node_modules เหลือ 12 รายการ</text>

  <rect x="504" y="200" width="354" height="44" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="518" y="221" fill="#1f2933" font-size="13">.next/static (JS + CSS ที่เบราว์เซอร์โหลด)</text>
  <text x="518" y="238" fill="#1e6b41" font-size="12" font-weight="bold">668 kB</text>

  <rect x="504" y="252" width="354" height="42" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="518" y="272" fill="#1f2933" font-size="13">USER webapp · CMD ["node","server.js"]</text>
  <text x="518" y="288" fill="#52606d" font-size="12">ไม่มี typescript · ไม่มี tailwindcss · ไม่มี .tsx</text>

  <rect x="504" y="302" width="354" height="42" rx="8" fill="#e6f5ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="681" y="329" fill="#1e6b41" font-size="15" font-weight="bold" text-anchor="middle">รวม 298 MB</text>

  <text x="681" y="364" fill="#1e6b41" font-size="12" text-anchor="middle">เทียบกับ stage เดียว 1.1 GB = เล็กลง ~73%</text>

  <text x="450" y="414" fill="#1f2933" font-size="13" text-anchor="middle">คำถามที่ใช้ตัดสินใจ : "ของชิ้นนี้ต้องมีตอนรันไหม" — ถ้าไม่ ก็ปล่อยให้ตายไปกับ stage build</text>
  <text x="450" y="436" fill="#52606d" font-size="12" text-anchor="middle">ตัวเลขทั้งหมดวัดจาก docker history และ docker image ls ในกล่องเรียนจริง</text>
</svg>
