<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" font-family="sans-serif">
  <rect x="0" y="0" width="860" height="480" fill="#ffffff"/>

  <defs>
    <marker id="arOk" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12.5" refY="5" orient="auto">
      <path d="M 0 0 L 13 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
    <marker id="arNo" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12.5" refY="5" orient="auto">
      <path d="M 0 0 L 13 5 L 0 10 z" fill="#c04a4a"/>
    </marker>
  </defs>

  <text x="430" y="32" fill="#1f2933" font-size="19" font-weight="bold" text-anchor="middle">กับดัก : Next.js 16 ไม่ได้วางไฟล์ CSS ไว้ที่ .next/static/css</text>

  <!-- what builder produced -->
  <rect x="24" y="52" width="812" height="100" rx="10" fill="#f6f8fa" stroke="#9aa5b1" stroke-width="2"/>
  <text x="44" y="76" fill="#1f2933" font-size="14" font-weight="bold">ของจริงที่ stage builder สร้างไว้ (ตรวจด้วย ls .next/static)</text>
  <rect x="44" y="88" width="252" height="48" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="58" y="108" fill="#1f2933" font-size="13">.next/static/chunks/</text>
  <text x="58" y="126" fill="#1c4f80" font-size="12">*.js และ *.css อยู่รวมกันที่นี่</text>
  <rect x="306" y="88" width="252" height="48" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="320" y="108" fill="#1f2933" font-size="13">.next/static/&lt;build-id&gt;/</text>
  <text x="320" y="126" fill="#52606d" font-size="12">ไฟล์ประจำรอบ build</text>
  <rect x="568" y="88" width="248" height="48" rx="8" fill="#fdf3f3" stroke="#c04a4a" stroke-width="2"/>
  <text x="582" y="108" fill="#8f2020" font-size="13" font-weight="bold">.next/static/css/</text>
  <text x="582" y="126" fill="#8f2020" font-size="12">ไม่มีโฟลเดอร์นี้อยู่จริง</text>

  <!-- connectors from the evidence boxes down to each verdict -->
  <path d="M170 154 L170 196" stroke="#2e8b57" stroke-width="3" fill="none" marker-end="url(#arOk)"/>
  <path d="M692 154 L692 196" stroke="#c04a4a" stroke-width="3" fill="none" stroke-dasharray="7 5" marker-end="url(#arNo)"/>

  <!-- good -->
  <rect x="24" y="200" width="404" height="206" rx="10" fill="#f2fbf5" stroke="#2e8b57" stroke-width="2"/>
  <text x="226" y="226" fill="#1e6b41" font-size="14" font-weight="bold" text-anchor="middle">คัดลอก .next/static ทั้งก้อน</text>
  <rect x="42" y="238" width="368" height="34" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="54" y="260" fill="#1e6b41" font-size="12">COPY --from=builder /app/.next/static ./.next/static</text>
  <text x="42" y="296" fill="#1f2933" font-size="13">HTML ที่ server ส่งออกมา :</text>
  <text x="42" y="318" fill="#1c4f80" font-size="12">&lt;link rel="stylesheet" href="/_next/static/chunks/xxx.css"&gt;</text>
  <rect x="42" y="332" width="368" height="34" rx="8" fill="#e6f5ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="226" y="354" fill="#1e6b41" font-size="13" font-weight="bold" text-anchor="middle">GET ไฟล์นั้น → HTTP 200 · 21048 bytes</text>
  <text x="226" y="390" fill="#1e6b41" font-size="13" text-anchor="middle">หน้าเว็บมีสี มีการ์ด มีตาราง ครบตามที่ออกแบบ</text>

  <!-- bad -->
  <rect x="436" y="200" width="400" height="206" rx="10" fill="#fdf3f3" stroke="#c04a4a" stroke-width="2"/>
  <text x="636" y="226" fill="#8f2020" font-size="14" font-weight="bold" text-anchor="middle">เจาะเฉพาะโฟลเดอร์ย่อยตามตำราเก่า</text>
  <rect x="454" y="238" width="364" height="34" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="466" y="260" fill="#8f2020" font-size="12">COPY --from=builder /app/.next/static/css ./.next/static/css</text>
  <text x="454" y="296" fill="#1f2933" font-size="13">ทางแรก : build ล้มทันที</text>
  <text x="454" y="318" fill="#8f2020" font-size="12">"/app/.next/static/css": not found</text>
  <rect x="454" y="332" width="364" height="34" rx="8" fill="#fdecec" stroke="#c04a4a" stroke-width="2"/>
  <text x="636" y="354" fill="#8f2020" font-size="13" font-weight="bold" text-anchor="middle">ทางที่แย่กว่า : เจาะ chunks เฉพาะ *.js</text>
  <text x="636" y="390" fill="#8f2020" font-size="13" text-anchor="middle">build ผ่าน · หน้าเว็บขึ้น 200 · แต่ไม่มี CSS เลย</text>

  <text x="430" y="440" fill="#1f2933" font-size="13" text-anchor="middle">อาการที่ผู้ใช้เห็น : ตัวหนังสือกองซ้อนกันขาวดำ ทั้งที่ทุกหน้าตอบ HTTP 200 และ log ไม่มี error</text>
  <text x="430" y="464" fill="#52606d" font-size="12" text-anchor="middle">วิธีตรวจที่สั้นที่สุด : หา &lt;link rel="stylesheet"&gt; ใน HTML แล้ว curl ไฟล์นั้นดูว่าได้ 200 หรือ 404</text>
</svg>
