<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="400" fill="#0f172a"/>

  <text x="400" y="30" fill="#e2e8f0" font-size="17" font-weight="bold" text-anchor="middle">เส้นเวลาเดียวกัน สองค่าที่ถูกกำหนดคนละจังหวะ</text>

  <!-- timeline -->
  <line x1="60" y1="90" x2="740" y2="90" stroke="#475569" stroke-width="3"/>
  <circle cx="150" cy="90" r="7" fill="#f59e0b"/>
  <circle cx="420" cy="90" r="7" fill="#94a3b8"/>
  <circle cx="640" cy="90" r="7" fill="#22c55e"/>
  <text x="150" y="72" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">docker build</text>
  <text x="420" y="72" fill="#cbd5e1" font-size="13" text-anchor="middle">image เสร็จ · เก็บไว้เฉย ๆ</text>
  <text x="640" y="72" fill="#86efac" font-size="13" font-weight="bold" text-anchor="middle">docker run</text>

  <!-- ARG lane -->
  <rect x="24" y="118" width="752" height="112" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="44" y="142" fill="#fbbf24" font-size="14" font-weight="bold">ARG NEXT_PUBLIC_SITE_NAME  →  ENV  →  npm run build</text>
  <text x="44" y="166" fill="#e2e8f0" font-size="13">ค่าถูก "ฝัง" ลงไฟล์ผลลัพธ์ตอน next build จึงกลายเป็นตัวหนังสือคงที่ในไฟล์ .js</text>
  <rect x="44" y="178" width="330" height="38" rx="6" fill="#334155"/>
  <text x="58" y="202" fill="#fca5a5" font-size="12">docker run -e NEXT_PUBLIC_SITE_NAME=... → ไม่มีผล</text>
  <rect x="392" y="178" width="330" height="38" rx="6" fill="#334155"/>
  <text x="406" y="202" fill="#86efac" font-size="12">docker build --build-arg NEXT_PUBLIC_SITE_NAME=... → เปลี่ยน</text>
  <path d="M150 100 L150 118" stroke="#f59e0b" stroke-width="2"/>

  <!-- ENV lane -->
  <rect x="24" y="246" width="752" height="112" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="44" y="270" fill="#86efac" font-size="14" font-weight="bold">ENV API_BASE_URL  →  process.env ตอนกล่องเริ่มทำงาน</text>
  <text x="44" y="294" fill="#e2e8f0" font-size="13">ค่าอยู่ในตัวแปรสภาพแวดล้อมของ process จึงอ่านใหม่ทุกครั้งที่สร้างกล่อง</text>
  <rect x="44" y="306" width="330" height="38" rx="6" fill="#334155"/>
  <text x="58" y="330" fill="#86efac" font-size="12">docker run -e API_BASE_URL=... → เปลี่ยนทันที</text>
  <rect x="392" y="306" width="330" height="38" rx="6" fill="#334155"/>
  <text x="406" y="330" fill="#94a3b8" font-size="12">ไม่ต้อง build ใหม่ · image ก้อนเดิมใช้ได้ทุกสภาพแวดล้อม</text>
  <path d="M640 100 L640 246" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 4"/>

  <text x="400" y="384" fill="#cbd5e1" font-size="13" text-anchor="middle">เส้นแบ่ง : ค่าที่ผู้ใช้ต้องเห็นในหน้าเว็บถูกฝังตอน build · ค่าที่ระบบใช้ต่อกันเองอ่านตอน run</text>
</svg>
