<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="430" fill="#ffffff"/>

  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2933">เส้นเวลาจริงของ docker compose up : db พร้อมก่อน api จึงเกิด</text>
  <text x="400" y="52" text-anchor="middle" font-size="13" fill="#52606d">ตัวเลขวินาทีมาจาก docker inspect ของรอบที่ใช้เขียนเอกสารนี้ ของแต่ละเครื่องจะไม่ตรงกัน</text>

  <defs>
    <marker id="tip" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12.5" refY="5" orient="auto">
      <path d="M 0 0 L 13 5 L 0 10 z" fill="#1f2933"/>
    </marker>
    <marker id="tipg" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12.5" refY="5" orient="auto">
      <path d="M 0 0 L 13 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
  </defs>

  <line x1="120" y1="360" x2="770" y2="360" stroke="#1f2933" stroke-width="3" marker-end="url(#tip)"/>
  <text x="770" y="382" text-anchor="end" font-size="12" fill="#1f2933">เวลา</text>

  <g font-size="12" fill="#52606d">
    <line x1="150" y1="96" x2="150" y2="366" stroke="#dde2e7" stroke-width="1"/>
    <text x="150" y="382" text-anchor="middle">14:08:15.5</text>
    <line x1="330" y1="96" x2="330" y2="366" stroke="#dde2e7" stroke-width="1"/>
    <text x="330" y="382" text-anchor="middle">14:08:17.3</text>
    <line x1="500" y1="96" x2="500" y2="366" stroke="#dde2e7" stroke-width="1"/>
    <text x="500" y="382" text-anchor="middle">14:08:21.2</text>
    <line x1="670" y1="96" x2="670" y2="366" stroke="#dde2e7" stroke-width="1"/>
    <text x="670" y="382" text-anchor="middle">14:08:26.9</text>
  </g>

  <text x="24" y="122" font-size="15" font-weight="bold" fill="#1e6b41">db</text>
  <rect x="150" y="104" width="180" height="34" rx="6" fill="#fff4e5" stroke="#d98324" stroke-width="1"/>
  <text x="240" y="126" text-anchor="middle" font-size="12" fill="#a35a10">initdb รัน 01-schema · 02-seed</text>
  <rect x="330" y="104" width="440" height="34" rx="6" fill="#f2fbf5" stroke="#2e8b57" stroke-width="2"/>
  <text x="550" y="126" text-anchor="middle" font-size="13" fill="#1e6b41">healthy · pg_isready ตอบ accepting connections</text>
  <text x="768" y="156" text-anchor="end" font-size="12" fill="#2e8b57">log บรรทัด init process complete โผล่ตรงนี้</text>

  <text x="24" y="202" font-size="15" font-weight="bold" fill="#4b3480">api</text>
  <rect x="150" y="184" width="350" height="34" rx="6" fill="#f6f8fa" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="325" y="206" text-anchor="middle" font-size="13" fill="#52606d">ยังไม่ถูกสร้างขึ้นเลย · compose ค้างที่บรรทัด "db Waiting"</text>
  <rect x="500" y="184" width="270" height="34" rx="6" fill="#f3f0fb" stroke="#6b4fa8" stroke-width="2"/>
