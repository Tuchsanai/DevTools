  <path d="M 330 140 C 380 156 420 168 496 186" fill="none" stroke="#2e8b57" stroke-width="3" marker-end="url(#tipg)"/>
  <text x="326" y="165" text-anchor="end" font-size="12" font-weight="bold" fill="#1e6b41">db healthy จึงปล่อย api</text>

  <path d="M 500 220 C 560 236 600 248 666 266" fill="none" stroke="#2e8b57" stroke-width="3" marker-end="url(#tipg)"/>
  <text x="496" y="245" text-anchor="end" font-size="12" font-weight="bold" fill="#1e6b41">api healthy จึงปล่อย web</text>

  <rect x="24" y="316" width="746" height="34" rx="8" fill="#eef6ff" stroke="#8fb8dc" stroke-width="1"/>
  <text x="40" y="338" font-size="13" fill="#1c4f80">healthcheck: คือคนตอบว่า "พร้อมหรือยัง" · depends_on: condition: service_healthy คือคนที่ยอมรออยู่ตรงนั้น</text>
</svg>
