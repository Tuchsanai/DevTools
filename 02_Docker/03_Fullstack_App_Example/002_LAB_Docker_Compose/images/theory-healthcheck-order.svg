  <text x="24" y="282" font-size="15" font-weight="bold" fill="#1c4f80">web</text>
  <rect x="150" y="264" width="520" height="34" rx="6" fill="#f6f8fa" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="410" y="286" text-anchor="middle" font-size="13" fill="#52606d">ยังไม่ถูกสร้างขึ้นเลย · compose ค้างที่บรรทัด "api Waiting"</text>
  <rect x="670" y="264" width="100" height="34" rx="6" fill="#eef6ff" stroke="#2f6fb2" stroke-width="2"/>
