# =====================================================================
# SkillSpace — Container สามรายการเริ่มด้วยคำสั่งเดียว (LAB 5)
#
#   ขึ้นระบบ :  docker compose -p skillspace up -d --build
#   ปิดระบบ  :  docker compose -p skillspace down        (ข้อมูลยังอยู่)
#   ล้างทิ้ง :  docker compose -p skillspace down -v     (ข้อมูลหายทั้งหมด)
#
# ทำไมต้องมีไฟล์นี้ : ลูกค้าบอกว่า "ไม่มีฝ่าย IT ประจำ ติดตั้งต้องง่าย ย้ายเครื่องต้องได้"
# NFR-1 (Non-Functional Requirement ข้อ 1) กำหนดให้คำสั่งเดียวเริ่มระบบครบสาม Container
#
# ไม่ตั้ง container_name ให้ Container ใด เพราะจะทำให้รันหลาย project พร้อมกันบน
# เครื่องเดียวไม่ได้ (ชื่อชนกัน) — ปล่อยให้ compose ตั้งชื่อเป็น <project>-<service>-<n>
# =====================================================================

services:
  # -------------------------------------------------------------------
  # db — ฐานข้อมูล : ไม่มี ports: เด็ดขาด (NFR-3)
  # -------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skillspace
      POSTGRES_USER: opsuser
      POSTGRES_PASSWORD: labpass
    volumes:
      # named volume — ข้อมูลอยู่นอกวงจรชีวิตของ container จึงรอด docker compose down (NFR-2)
      # ถ้าใช้ bind mount จากโฟลเดอร์บนเครื่องแทน จะย้ายเครื่องยากและสิทธิ์ไฟล์มักพัง
      - pgdata:/var/lib/postgresql/data
      # สคริปต์ใน /docker-entrypoint-initdb.d ทำงาน "ครั้งเดียว" ตอน volume ยังว่างเปล่าเท่านั้น
      # ถ้า volume มีข้อมูลอยู่แล้ว postgres จะข้ามทั้งโฟลเดอร์นี้ไป — เป็นพฤติกรรมที่เราต้องการ
      # (ไม่งั้น seed จะทับข้อมูลจริงของลูกค้าทุกครั้งที่ restart)
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # ระบุ -U/-d ให้ครบ เพราะ pg_isready แบบเปล่า ๆ จะใช้ user 'root' ของ container
      # แล้วได้ผลว่า "ไม่พร้อม" ทั้งที่ฐานข้อมูลขึ้นแล้ว
      test: ["CMD-SHELL", "pg_isready -U opsuser -d skillspace"]
      interval: 5s
      timeout: 3s
      retries: 12
      # ระหว่าง start_period ถ้าเช็กไม่ผ่านจะยังไม่นับเป็น unhealthy — เผื่อเวลารัน initdb ครั้งแรก
      start_period: 30s
    restart: unless-stopped

  # -------------------------------------------------------------------
  # api — FastAPI : ไม่ publish พอร์ตออกนอกเครื่อง
  # browser ไม่เคยเรียก api ตรง ๆ (web เรียกให้ฝั่ง server) จึงไม่ต้องเปิดพอร์ต
  # -------------------------------------------------------------------
  api:
    build:
      context: ./api
    environment:
      # เรียก db ด้วย "ชื่อ service" ไม่ใช่ IP — compose มี DNS ภายในเครือข่ายให้อยู่แล้ว
      # IP ของ container เปลี่ยนทุกครั้งที่สร้างใหม่ ชื่อไม่เปลี่ยน
      DATABASE_URL: postgresql://opsuser:labpass@db:5432/skillspace
    depends_on:
      db:
        # service_healthy = รอจน healthcheck ของ db ผ่านจริง ไม่ใช่แค่ "process ขึ้นแล้ว"
        # ถ้าใช้ depends_on แบบสั้น api จะสตาร์ตตอน postgres ยังรับ connection ไม่ได้
        condition: service_healthy
    healthcheck:
      # image ของ api เป็น python:3.12-slim ซึ่งไม่มี curl/wget ติดมา
      # จึงเช็กด้วย python เอง — /health ยิง SELECT 1 ไปที่ db จริง ๆ ไม่ใช่ตอบ ok ลอย ๆ
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # -------------------------------------------------------------------
  # web — Next.js standalone: Container เดียวที่เปิดพอร์ตออกนอก
  # -------------------------------------------------------------------
  web:
    build:
      context: ./web
      args:
        # NEXT_PUBLIC_* ถูกฝังลงไฟล์ผลลัพธ์ตั้งแต่ตอน build จึงต้องส่งเป็น build arg
        # ถ้าส่งเป็น environment: ตอนรัน ค่าจะไม่ไปโผล่ในหน้าเว็บ
        NEXT_PUBLIC_SITE_NAME: SkillSpace
    environment:
      API_BASE_URL: http://api:8000
    ports:
      # ซ้ายคือพอร์ตบนเครื่อง ขวาคือพอร์ตใน Container — มีเพียง Service เดียวที่ควรมีบรรทัดนี้
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # node:22-alpine มี wget ของ busybox ติดมา (ไม่มี curl)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  # ประกาศไว้เฉย ๆ ให้ compose สร้างให้เอง ชื่อจริงจะเป็น <project>_pgdata
  pgdata:
