<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" width="800" height="456" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="456" fill="#ffffff"/>

  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2933">ส่งมอบระบบให้ลูกค้า : จากโค้ดบนเครื่องเรา ไปเป็นกล่องที่รันบนเครื่องลูกค้า</text>
  <text x="400" y="52" text-anchor="middle" font-size="13" fill="#52606d">ลูกค้าไม่เคยได้ซอร์สโค้ด ไม่ต้องติดตั้ง Node หรือ Python เลย ได้แค่ image กับ compose.yaml</text>

  <defs>
    <marker id="a1" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12.5" refY="5" orient="auto">
      <path d="M 0 0 L 13 5 L 0 10 z" fill="#2f6fb2"/>
    </marker>
  </defs>

  <rect x="20" y="76" width="330" height="252" rx="10" fill="#f6f8fa" stroke="#9aa5b1" stroke-width="2"/>
  <text x="185" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">เครื่องของทีมพัฒนา</text>

  <rect x="40" y="112" width="290" height="48" rx="8" fill="#fff4e5" stroke="#d98324" stroke-width="1"/>
  <text x="54" y="132" font-size="13" font-weight="bold" fill="#a35a10">1 · build</text>
  <text x="316" y="132" text-anchor="end" font-size="12" fill="#a35a10">campusops-web</text>
  <text x="54" y="151" font-size="12" fill="#a35a10">docker compose -p campusops up -d --build</text>

  <rect x="40" y="168" width="290" height="64" rx="8" fill="#fff4e5" stroke="#d98324" stroke-width="1"/>
  <text x="54" y="188" font-size="13" font-weight="bold" fill="#a35a10">2 · tag</text>
  <text x="54" y="207" font-size="12" fill="#a35a10">docker tag campusops-web:latest</text>
  <text x="68" y="224" font-size="12" fill="#a35a10">localhost:5000/campusops-web:1.0</text>

  <rect x="40" y="240" width="290" height="48" rx="8" fill="#eef6ff" stroke="#8fb8dc" stroke-width="1"/>
  <text x="54" y="260" font-size="13" font-weight="bold" fill="#1c4f80">3 · push</text>
  <text x="54" y="279" font-size="12" fill="#1c4f80">docker push localhost:5000/campusops-web:1.0</text>

  <text x="185" y="310" text-anchor="middle" font-size="12" fill="#52606d">ซอร์สโค้ด web/ กับ api/ อยู่แค่ฝั่งนี้</text>

  <rect x="360" y="142" width="90" height="120" rx="10" fill="#f3f0fb" stroke="#6b4fa8" stroke-width="2"/>
  <text x="405" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#4b3480">registry</text>
  <text x="405" y="190" text-anchor="middle" font-size="12" fill="#4b3480">registry:2</text>
  <text x="405" y="208" text-anchor="middle" font-size="12" fill="#4b3480">พอร์ต 5000</text>
  <text x="405" y="232" text-anchor="middle" font-size="12" fill="#6b4fa8">คลังกลาง</text>
  <text x="405" y="248" text-anchor="middle" font-size="12" fill="#6b4fa8">ของ image</text>

  <rect x="460" y="76" width="320" height="252" rx="10" fill="#f2fbf5" stroke="#2e8b57" stroke-width="2"/>
  <text x="620" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e6b41">เครื่องที่คณะของลูกค้า</text>

  <rect x="478" y="112" width="286" height="48" rx="8" fill="#f2fbf5" stroke="#9ad0b0" stroke-width="1"/>
  <text x="492" y="132" font-size="13" font-weight="bold" fill="#1e6b41">4 · pull</text>
  <text x="492" y="151" font-size="12" fill="#1e6b41">docker pull localhost:5000/campusops-web:1.0</text>

  <rect x="478" y="168" width="286" height="64" rx="8" fill="#f2fbf5" stroke="#9ad0b0" stroke-width="1"/>
  <text x="492" y="196" font-size="13" font-weight="bold" fill="#1e6b41">5 · run</text>
  <text x="492" y="216" font-size="12" fill="#1e6b41">docker compose -p campusops up -d --no-build</text>

  <rect x="478" y="240" width="286" height="48" rx="8" fill="#ffffff" stroke="#9ad0b0" stroke-width="1"/>
  <text x="492" y="260" font-size="12" fill="#1e6b41">สามกล่องขึ้นครบ · เปิดเบราว์เซอร์ใช้งานได้</text>
  <text x="492" y="279" font-size="12" fill="#2e8b57">ไม่มี npm ci ไม่มี pip install บนเครื่องนี้เลย</text>

  <text x="620" y="310" text-anchor="middle" font-size="12" fill="#1e6b41">มีแค่ compose.yaml กับ db/initdb/ ติดมาด้วย</text>

  <path d="M 332 268 L 357 232" fill="none" stroke="#2f6fb2" stroke-width="3" marker-end="url(#a1)"/>
  <path d="M 452 200 L 475 154" fill="none" stroke="#2f6fb2" stroke-width="3" marker-end="url(#a1)"/>

  <rect x="20" y="344" width="760" height="98" rx="10" fill="#fff4e5" stroke="#d98324" stroke-width="2"/>
  <text x="36" y="368" font-size="13" font-weight="bold" fill="#a35a10">ชื่อเต็มของ image คือที่อยู่ ไม่ใช่แค่ชื่อเล่น</text>
  <text x="36" y="392" font-size="13" fill="#1f2933">localhost:5000 / campusops-web : 1.0</text>
  <text x="36" y="412" font-size="12" fill="#52606d">โฮสต์ของ registry · ชื่อ repository · แท็กเวอร์ชัน</text>
  <text x="36" y="432" font-size="12" fill="#52606d">ไม่มีส่วนหน้า docker จะเดาว่าเป็น docker.io เสมอ จึงต้อง docker tag ใหม่ก่อน push ทุกครั้ง</text>
</svg>
