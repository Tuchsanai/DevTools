<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" width="800" height="456" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="456" fill="#ffffff"/>

  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">ส่งมอบระบบให้ลูกค้า : จากโค้ดบนเครื่องเรา ไปเป็นกล่องที่รันบนเครื่องลูกค้า</text>
  <text x="400" y="52" text-anchor="middle" font-size="13" fill="#64748b">ลูกค้าไม่เคยได้ซอร์สโค้ด ไม่ต้องติดตั้ง Node หรือ Python เลย ได้แค่ image กับ compose.yaml</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="6.4" refX="8" refY="3.2" orient="auto">
      <path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect x="20" y="76" width="330" height="252" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="185" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">เครื่องของทีมพัฒนา</text>

  <rect x="40" y="112" width="290" height="48" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="54" y="132" font-size="13" font-weight="bold" fill="#9a3412">1 · build</text>
  <text x="316" y="132" text-anchor="end" font-size="11.5" fill="#a16207">campusops-web</text>
  <text x="54" y="151" font-size="11.5" fill="#7c2d12">docker compose -p campusops up -d --build</text>

  <rect x="40" y="168" width="290" height="64" rx="8" fill="#fefce8" stroke="#facc15" stroke-width="1.5"/>
  <text x="54" y="188" font-size="13" font-weight="bold" fill="#854d0e">2 · tag</text>
  <text x="54" y="207" font-size="11.5" fill="#713f12">docker tag campusops-web:latest</text>
  <text x="68" y="224" font-size="11.5" fill="#713f12">localhost:5000/campusops-web:1.0</text>

  <rect x="40" y="240" width="290" height="48" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="54" y="260" font-size="13" font-weight="bold" fill="#1e3a8a">3 · push</text>
  <text x="54" y="279" font-size="11.5" fill="#1e40af">docker push localhost:5000/campusops-web:1.0</text>

  <text x="185" y="310" text-anchor="middle" font-size="11.5" fill="#64748b">ซอร์สโค้ด web/ กับ api/ อยู่แค่ฝั่งนี้</text>

  <rect x="360" y="142" width="90" height="120" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="405" y="170" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4c1d95">registry</text>
  <text x="405" y="190" text-anchor="middle" font-size="11.5" fill="#5b21b6">registry:2</text>
  <text x="405" y="208" text-anchor="middle" font-size="11.5" fill="#5b21b6">พอร์ต 5000</text>
  <text x="405" y="232" text-anchor="middle" font-size="11" fill="#7c3aed">คลังกลาง</text>
  <text x="405" y="248" text-anchor="middle" font-size="11" fill="#7c3aed">ของ image</text>

  <rect x="460" y="76" width="320" height="252" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">เครื่องที่คณะของลูกค้า</text>

  <rect x="478" y="112" width="286" height="48" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="492" y="132" font-size="13" font-weight="bold" fill="#065f46">4 · pull</text>
  <text x="492" y="151" font-size="11.5" fill="#047857">docker pull localhost:5000/campusops-web:1.0</text>

  <rect x="478" y="168" width="286" height="64" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="492" y="196" font-size="13" font-weight="bold" fill="#065f46">5 · run</text>
  <text x="492" y="216" font-size="11.5" fill="#047857">docker compose -p campusops up -d --no-build</text>

  <rect x="478" y="240" width="286" height="48" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="492" y="260" font-size="12" fill="#166534">สามกล่องขึ้นครบ · เปิดเบราว์เซอร์ใช้งานได้</text>
  <text x="492" y="279" font-size="11.5" fill="#16a34a">ไม่มี npm ci ไม่มี pip install บนเครื่องนี้เลย</text>

  <text x="620" y="310" text-anchor="middle" font-size="11.5" fill="#15803d">มีแค่ compose.yaml กับ db/initdb/ ติดมาด้วย</text>

  <path d="M 332 268 L 357 232" fill="none" stroke="#0284c7" stroke-width="2.6" marker-end="url(#a1)"/>
  <path d="M 452 200 L 475 154" fill="none" stroke="#0284c7" stroke-width="2.6" marker-end="url(#a1)"/>

  <rect x="20" y="344" width="760" height="98" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
  <text x="36" y="368" font-size="13.5" font-weight="bold" fill="#92400e">ชื่อเต็มของ image คือที่อยู่ ไม่ใช่แค่ชื่อเล่น</text>
  <text x="36" y="392" font-size="13" fill="#0f172a">localhost:5000 / campusops-web : 1.0</text>
  <text x="36" y="412" font-size="12" fill="#78716c">โฮสต์ของ registry · ชื่อ repository · แท็กเวอร์ชัน</text>
  <text x="36" y="432" font-size="12" fill="#78716c">ไม่มีส่วนหน้า docker จะเดาว่าเป็น docker.io เสมอ จึงต้อง docker tag ใหม่ก่อน push ทุกครั้ง</text>
</svg>
