<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="sans-serif">
  <rect x="0" y="0" width="860" height="430" fill="#ffffff"/>
  <text x="24" y="34" font-size="19" font-weight="bold" fill="#1f2933">จุด `.` ท้ายคำสั่ง build คือ "โฟลเดอร์ที่ยกให้ daemon" ไม่ใช่ "ที่อยู่ของ Dockerfile"</text>
  <text x="24" y="58" font-size="14" fill="#52606d">docker build -t ops-api:1.0 .    ← สั่งจากในโฟลเดอร์ api/</text>

  <!-- context box -->
  <rect x="24" y="80" width="300" height="290" rx="10" fill="#eef6ff" stroke="#2f6fb2" stroke-width="2"/>
  <text x="40" y="106" font-size="15" font-weight="bold" fill="#1c4f80">โฟลเดอร์ api/ = build context</text>

  <rect x="40" y="120" width="268" height="30" rx="5" fill="#ffffff" stroke="#8fb8dc"/>
  <text x="52" y="140" font-size="13" fill="#1f2933">Dockerfile              2.54 kB</text>
  <rect x="40" y="156" width="268" height="30" rx="5" fill="#ffffff" stroke="#8fb8dc"/>
  <text x="52" y="176" font-size="13" fill="#1f2933">requirements.txt        374 B</text>
  <rect x="40" y="192" width="268" height="30" rx="5" fill="#ffffff" stroke="#8fb8dc"/>
  <text x="52" y="212" font-size="13" fill="#1f2933">main.py                 28.1 kB</text>

  <rect x="40" y="234" width="268" height="30" rx="5" fill="#fdecec" stroke="#d05353" stroke-dasharray="5 3"/>
  <text x="52" y="254" font-size="13" fill="#8f2020">smoke.sh      ✗ .dockerignore</text>
  <rect x="40" y="270" width="268" height="30" rx="5" fill="#fdecec" stroke="#d05353" stroke-dasharray="5 3"/>
  <text x="52" y="290" font-size="13" fill="#8f2020">api-debug.log ✗ .dockerignore</text>

  <text x="40" y="326" font-size="13" fill="#52606d">ทุกไฟล์ที่ไม่ถูก ignore ถูกมัดเป็นก้อนเดียว</text>
  <text x="40" y="346" font-size="13" fill="#52606d">แล้วส่งข้ามไปให้ daemon ก่อน build เริ่ม</text>
  <text x="40" y="364" font-size="13" font-weight="bold" fill="#1c4f80">รวมที่ส่งจริง : 28.54 kB</text>

  <!-- arrow -->
  <defs>
    <marker id="ar" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 z" fill="#2f6fb2"/>
    </marker>
  </defs>
  <line x1="330" y1="200" x2="490" y2="200" stroke="#2f6fb2" stroke-width="3" marker-end="url(#ar)"/>
  <text x="336" y="188" font-size="13" fill="#1c4f80">ส่ง context ไปให้ daemon</text>
  <text x="336" y="222" font-size="12" fill="#52606d">transferring context 28.54kB</text>

  <!-- daemon box -->
  <rect x="500" y="80" width="336" height="290" rx="10" fill="#f3f0fb" stroke="#6b4fa8" stroke-width="2"/>
  <text x="518" y="106" font-size="15" font-weight="bold" fill="#4b3480">dockerd + BuildKit (ผู้สร้าง image)</text>
  <text x="518" y="134" font-size="13" fill="#1f2933">1. อ่าน Dockerfile ทีละบรรทัด</text>
  <text x="518" y="158" font-size="13" fill="#1f2933">2. `COPY requirements.txt .` หยิบไฟล์</text>
  <text x="538" y="178" font-size="13" fill="#1f2933">จาก context ที่ได้รับมา</text>
  <text x="518" y="204" font-size="13" fill="#1f2933">3. `RUN pip install` ทำงานในกล่องชั่วคราว</text>
  <text x="518" y="230" font-size="13" fill="#1f2933">4. `COPY main.py .` หยิบไฟล์สุดท้าย</text>

  <rect x="518" y="248" width="300" height="106" rx="8" fill="#ffffff" stroke="#b3a4d6"/>
  <text x="532" y="272" font-size="13" font-weight="bold" fill="#4b3480">daemon เห็นเฉพาะของที่ส่งมาเท่านั้น</text>
  <text x="532" y="296" font-size="13" fill="#1f2933">COPY ../db/initdb .  → ทำไม่ได้</text>
  <text x="532" y="318" font-size="13" fill="#1f2933">เพราะอยู่นอกโฟลเดอร์ที่เป็น context</text>
  <text x="532" y="342" font-size="12" fill="#52606d">context ยิ่งใหญ่ = ส่งนาน = build ช้าตั้งแต่ยังไม่เริ่ม</text>

  <text x="24" y="400" font-size="13" fill="#52606d">`-t ops-api:1.0` = ชื่อและ tag ของ image ที่จะได้ · `.` = โฟลเดอร์ปัจจุบันคือ context · `-f` ใช้เมื่อชื่อไฟล์ไม่ใช่ Dockerfile</text>
</svg>
