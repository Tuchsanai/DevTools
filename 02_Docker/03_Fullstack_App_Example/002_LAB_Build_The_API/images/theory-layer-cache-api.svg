<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="24" y="32" font-size="19" font-weight="bold" fill="#1f2933">แก้ main.py 1 บรรทัด แล้ว build ใหม่ — ลำดับ COPY ตัดสินว่าต้อง pip install ซ้ำไหม</text>
  <text x="24" y="54" font-size="13" fill="#52606d">กฎเดียว : ขั้นไหนเปลี่ยน → ขั้นนั้นและทุกขั้นที่อยู่ใต้ลงไปต้องทำใหม่ทั้งหมด</text>

  <!-- LEFT : good -->
  <rect x="24" y="70" width="400" height="330" rx="10" fill="#f2fbf5" stroke="#2e8b57" stroke-width="2"/>
  <text x="40" y="96" font-size="15" font-weight="bold" fill="#1e6b41">api/Dockerfile (ลำดับที่ใช้จริง)</text>

  <rect x="40" y="110" width="368" height="34" rx="6" fill="#ffffff" stroke="#9ad0b0"/>
  <text x="54" y="132" font-size="13" fill="#1f2933">[1/6] FROM python:3.12-slim</text>
  <text x="330" y="132" font-size="12" font-weight="bold" fill="#1e6b41">CACHED</text>

  <rect x="40" y="150" width="368" height="34" rx="6" fill="#ffffff" stroke="#9ad0b0"/>
  <text x="54" y="172" font-size="13" fill="#1f2933">[3/6] COPY requirements.txt .</text>
  <text x="330" y="172" font-size="12" font-weight="bold" fill="#1e6b41">CACHED</text>

  <rect x="40" y="190" width="368" height="40" rx="6" fill="#e3f5ea" stroke="#2e8b57" stroke-width="2"/>
  <text x="54" y="215" font-size="13" font-weight="bold" fill="#1f2933">[4/6] RUN pip install  ← ขั้นแพงที่สุด</text>
  <text x="330" y="215" font-size="12" font-weight="bold" fill="#1e6b41">CACHED</text>

  <rect x="40" y="236" width="368" height="34" rx="6" fill="#fff4e5" stroke="#d98324" stroke-width="2"/>
  <text x="54" y="258" font-size="13" fill="#1f2933">[5/6] COPY main.py .  ← จุดที่ cache แตก</text>
  <text x="336" y="258" font-size="12" font-weight="bold" fill="#a35a10">DONE</text>

  <rect x="40" y="276" width="368" height="34" rx="6" fill="#fff4e5" stroke="#d98324"/>
  <text x="54" y="298" font-size="13" fill="#1f2933">[6/6] RUN useradd ... chown</text>
  <text x="336" y="298" font-size="12" font-weight="bold" fill="#a35a10">DONE</text>

  <text x="40" y="336" font-size="13" fill="#52606d">จุดแตกอยู่ "ใต้" ขั้น pip install → ขั้นแพงไม่ต้องทำซ้ำ</text>
  <text x="40" y="368" font-size="17" font-weight="bold" fill="#1e6b41">real 0m2.199s</text>
  <text x="160" y="368" font-size="13" fill="#52606d">ทำใหม่แค่ 2 ขั้นล่างสุด</text>

  <!-- RIGHT : bad -->
  <rect x="456" y="70" width="400" height="330" rx="10" fill="#fdf3f3" stroke="#c04a4a" stroke-width="2"/>
  <text x="472" y="96" font-size="15" font-weight="bold" fill="#8f2020">api/Dockerfile.bad (สลับแค่ลำดับ)</text>

  <rect x="472" y="110" width="368" height="34" rx="6" fill="#ffffff" stroke="#e0a5a5"/>
  <text x="486" y="132" font-size="13" fill="#1f2933">[1/5] FROM python:3.12-slim</text>
  <text x="762" y="132" font-size="12" font-weight="bold" fill="#1e6b41">CACHED</text>

  <rect x="472" y="150" width="368" height="34" rx="6" fill="#fdecec" stroke="#c04a4a" stroke-width="2"/>
  <text x="486" y="172" font-size="13" fill="#1f2933">[3/5] COPY . .  ← จุดที่ cache แตก</text>
  <text x="768" y="172" font-size="12" font-weight="bold" fill="#8f2020">DONE</text>

  <rect x="472" y="190" width="368" height="40" rx="6" fill="#fdecec" stroke="#c04a4a" stroke-width="2"/>
  <text x="486" y="215" font-size="13" font-weight="bold" fill="#1f2933">[4/5] RUN pip install  ← ทำใหม่ทั้งชุด</text>
  <text x="748" y="215" font-size="12" font-weight="bold" fill="#8f2020">DONE 8.9s</text>

  <rect x="472" y="236" width="368" height="34" rx="6" fill="#fdecec" stroke="#c04a4a"/>
  <text x="486" y="258" font-size="13" fill="#1f2933">[5/5] RUN useradd ... chown</text>
  <text x="768" y="258" font-size="12" font-weight="bold" fill="#8f2020">DONE</text>

  <text x="472" y="336" font-size="13" fill="#52606d">จุดแตกอยู่ "เหนือ" ขั้น pip install → ลากทุกขั้นใต้ลงไปด้วย</text>
  <text x="472" y="368" font-size="17" font-weight="bold" fill="#8f2020">real 0m12.672s</text>
  <text x="596" y="368" font-size="13" fill="#52606d">ทำใหม่ตั้งแต่ COPY . . ลงมา</text>

  <text x="24" y="428" font-size="13" fill="#1f2933">เนื้อหาของสองไฟล์เหมือนกันทุกบรรทัด ต่างกันแค่ว่า `COPY` ของ source code อยู่ก่อนหรือหลัง `RUN pip install`</text>
  <text x="24" y="450" font-size="13" fill="#52606d">เรียงจาก "เปลี่ยนน้อยที่สุด → เปลี่ยนบ่อยที่สุด" เสมอ : base image → รายการ dependency → ติดตั้ง → โค้ด</text>
</svg>
