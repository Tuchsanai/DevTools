<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" font-family="sans-serif">
  <rect x="0" y="0" width="860" height="440" fill="#ffffff"/>
  <text x="24" y="32" font-size="19" font-weight="bold" fill="#1f2933">EXPOSE = ป้ายบอกทาง · -p = ประตูที่เปิดจริง</text>
  <text x="24" y="54" font-size="13" fill="#52606d">ทั้งสองอย่างพูดถึงพอร์ต 8000 เหมือนกัน แต่มีอันเดียวที่ทำให้เข้าถึงได้จากนอกกล่อง</text>

  <defs>
    <marker id="ar2" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 z" fill="#2e8b57"/>
    </marker>
  </defs>

  <!-- CASE A : no -p -->
  <rect x="24" y="72" width="392" height="164" rx="10" fill="#fdf3f3" stroke="#c04a4a" stroke-width="2"/>
  <text x="40" y="98" font-size="14" font-weight="bold" fill="#8f2020">docker run -d --name ops-api ops-api:1.0   (ไม่ใส่ -p)</text>

  <rect x="40" y="112" width="150" height="96" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="56" y="136" font-size="13" font-weight="bold" fill="#1f2933">กล่องเรียน</text>
  <text x="56" y="160" font-size="13" fill="#1f2933">curl localhost:8088</text>
  <text x="56" y="190" font-size="13" font-weight="bold" fill="#8f2020">curl exit=7</text>

  <line x1="196" y1="160" x2="252" y2="160" stroke="#c04a4a" stroke-width="3"/>
  <line x1="252" y1="128" x2="252" y2="196" stroke="#c04a4a" stroke-width="5"/>
  <text x="206" y="148" font-size="12" fill="#8f2020">ไม่มีทางเข้า</text>

  <rect x="266" y="112" width="134" height="96" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="282" y="136" font-size="13" font-weight="bold" fill="#1f2933">กล่อง ops-api</text>
  <text x="282" y="158" font-size="12" fill="#1f2933">uvicorn ฟัง :8000</text>
  <text x="282" y="180" font-size="12" fill="#2e8b57">EXPOSE 8000 (ป้าย)</text>
  <text x="282" y="198" font-size="12" fill="#52606d">docker port = ว่าง</text>

  <!-- CASE B : with -p -->
  <rect x="444" y="72" width="392" height="164" rx="10" fill="#f2fbf5" stroke="#2e8b57" stroke-width="2"/>
  <text x="460" y="98" font-size="14" font-weight="bold" fill="#1e6b41">docker run -d --name ops-api -p 8088:8000 ops-api:1.0</text>

  <rect x="460" y="112" width="150" height="96" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="476" y="136" font-size="13" font-weight="bold" fill="#1f2933">กล่องเรียน</text>
  <text x="476" y="160" font-size="13" fill="#1f2933">curl localhost:8088</text>
  <text x="476" y="190" font-size="11" font-weight="bold" fill="#1e6b41">{"status":"ok","db":"up"}</text>

  <line x1="616" y1="160" x2="676" y2="160" stroke="#2e8b57" stroke-width="3" marker-end="url(#ar2)"/>
  <text x="612" y="148" font-size="12" fill="#1e6b41">ประตูที่ -p เปิดให้</text>

  <rect x="686" y="112" width="134" height="96" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="702" y="136" font-size="13" font-weight="bold" fill="#1f2933">กล่อง ops-api</text>
  <text x="702" y="158" font-size="12" fill="#1f2933">uvicorn ฟัง :8000</text>
  <text x="702" y="180" font-size="12" fill="#2e8b57">EXPOSE 8000 (ป้าย)</text>
  <text x="702" y="198" font-size="12" fill="#52606d">docker port มีบรรทัด</text>

  <!-- mapping detail -->
  <rect x="24" y="256" width="812" height="96" rx="10" fill="#eef6ff" stroke="#2f6fb2" stroke-width="2"/>
  <text x="44" y="282" font-size="15" font-weight="bold" fill="#1c4f80">อ่านเลขของ -p ให้ถูกด้าน</text>
  <text x="44" y="310" font-size="15" fill="#1f2933">-p  8088  :  8000</text>
  <text x="44" y="334" font-size="13" fill="#52606d">ซ้าย = พอร์ตของเครื่องที่รัน · ขวา = พอร์ตในกล่อง</text>
  <text x="400" y="310" font-size="13" fill="#1f2933">docker port ops-api  →  8000/tcp -> 0.0.0.0:8088</text>
  <text x="400" y="334" font-size="13" fill="#52606d">ใส่ EXPOSE แต่ไม่ใส่ -p = เข้าไม่ได้ · ไม่มี EXPOSE แต่ใส่ -p = เข้าได้</text>

  <text x="24" y="384" font-size="13" fill="#1f2933">EXPOSE มีประโยชน์ตรงที่เป็น "เอกสารในตัว image" — คนที่หยิบ image ไปใช้เปิด docker image inspect แล้วรู้ว่าต้อง map พอร์ตไหน</text>
  <text x="24" y="410" font-size="13" fill="#52606d">ฐานข้อมูลของระบบนี้จึงไม่เคยมี -p เลย (NFR-3) — image ของ postgres มี EXPOSE 5432 อยู่ก็จริง แต่ไม่มีใครเข้าถึงจากนอกเครื่องได้</text>
</svg>
