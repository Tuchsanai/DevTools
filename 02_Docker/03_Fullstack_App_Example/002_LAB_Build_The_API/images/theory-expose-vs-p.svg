<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="960" height="450" fill="#ffffff"/>
  <text text-anchor="middle" x="480" y="32" font-size="19" font-weight="bold" fill="#1f2933">EXPOSE = ป้ายบอกทาง · -p = ประตูที่เปิดจริง</text>
  <text text-anchor="middle" x="480" y="56" font-size="13" fill="#52606d">ทั้งสองอย่างระบุพอร์ต 8000 แต่มีเพียง -p ที่ทำให้เข้าถึงได้จากภายนอก Container</text>

  <defs>
    <marker id="arGreen" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12.5" refY="5" orient="auto">
      <path d="M 0 0 L 13 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
    <marker id="arRed" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12.5" refY="5" orient="auto">
      <path d="M 0 0 L 13 5 L 0 10 z" fill="#8f2020"/>
    </marker>
  </defs>

  <!-- CASE A : run without -p -->
  <rect x="24" y="76" width="440" height="176" rx="10" fill="#fdf3f3" stroke="#c04a4a" stroke-width="2"/>
  <text x="40" y="102" font-size="14" font-weight="bold" fill="#8f2020">docker run -d --name ops-api ops-api:1.0   (ไม่ใส่ -p)</text>

  <rect x="40" y="116" width="156" height="112" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="56" y="140" font-size="13" font-weight="bold" fill="#1f2933">Container สำหรับการเรียน</text>
  <text x="56" y="166" font-size="13" fill="#1f2933">curl localhost:8088</text>
  <text x="56" y="200" font-size="13" font-weight="bold" fill="#8f2020">curl exit=7</text>

  <line x1="200" y1="168" x2="250" y2="168" stroke="#8f2020" stroke-width="3" marker-end="url(#arRed)"/>
  <line x1="262" y1="126" x2="262" y2="218" stroke="#8f2020" stroke-width="10" stroke-linecap="round"/>
  <text x="262" y="244" font-size="13" font-weight="bold" fill="#8f2020" text-anchor="middle">ไม่มีทางเข้า</text>

  <rect x="300" y="116" width="148" height="112" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="316" y="140" font-size="13" font-weight="bold" fill="#1f2933">Container ops-api</text>
  <text x="316" y="164" font-size="12" fill="#1f2933">uvicorn ฟัง :8000</text>
  <text x="316" y="188" font-size="12" fill="#2e8b57">EXPOSE 8000 (ป้าย)</text>
  <text x="316" y="212" font-size="12" fill="#52606d">docker port = ว่าง</text>

  <!-- CASE B : run with -p -->
  <rect x="496" y="76" width="440" height="176" rx="10" fill="#f2fbf5" stroke="#2e8b57" stroke-width="2"/>
  <text x="512" y="102" font-size="14" font-weight="bold" fill="#1e6b41">docker run -d --name ops-api -p 8088:8000 ops-api:1.0</text>

  <rect x="512" y="116" width="156" height="112" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="528" y="140" font-size="13" font-weight="bold" fill="#1f2933">Container สำหรับการเรียน</text>
  <text x="528" y="166" font-size="13" fill="#1f2933">curl localhost:8088</text>
  <text x="524" y="200" font-size="12" font-weight="bold" fill="#1e6b41">{"status":"ok","db":"up"}</text>

  <line x1="672" y1="168" x2="768" y2="168" stroke="#2e8b57" stroke-width="3" marker-end="url(#arGreen)"/>
  <text x="720" y="244" font-size="13" font-weight="bold" fill="#1e6b41" text-anchor="middle">ประตูที่ -p เปิดให้</text>

  <rect x="772" y="116" width="148" height="112" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="788" y="140" font-size="13" font-weight="bold" fill="#1f2933">Container ops-api</text>
  <text x="788" y="164" font-size="12" fill="#1f2933">uvicorn ฟัง :8000</text>
  <text x="788" y="188" font-size="12" fill="#2e8b57">EXPOSE 8000 (ป้าย)</text>
  <text x="788" y="212" font-size="12" fill="#52606d">docker port มีบรรทัด</text>

  <!-- mapping detail -->
  <rect x="24" y="272" width="912" height="96" rx="10" fill="#eef6ff" stroke="#2f6fb2" stroke-width="2"/>
  <text x="44" y="298" font-size="15" font-weight="bold" fill="#1c4f80">อ่านเลขของ -p ให้ถูกด้าน</text>
  <text x="44" y="326" font-size="15" fill="#1f2933">-p  8088  :  8000</text>
  <text x="44" y="350" font-size="13" fill="#52606d">ซ้าย = Host port · ขวา = พอร์ตภายใน Container</text>
  <text x="460" y="326" font-size="13" fill="#1f2933">docker port ops-api  →  8000/tcp -> 0.0.0.0:8088</text>
  <text x="460" y="350" font-size="13" fill="#52606d">ใส่ EXPOSE แต่ไม่ใส่ -p = เข้าไม่ได้ · ไม่มี EXPOSE แต่ใส่ -p = เข้าได้</text>

  <text x="24" y="398" font-size="13" fill="#1f2933">EXPOSE มีประโยชน์ตรงที่เป็น "เอกสารในตัว image" — คนที่หยิบ image ไปใช้เปิด docker image inspect แล้วรู้ว่าต้อง map พอร์ตไหน</text>
  <text x="24" y="424" font-size="13" fill="#52606d">ฐานข้อมูลของระบบนี้จึงไม่เคยมี -p เลย (NFR-3) — image ของ postgres มี EXPOSE 5432 อยู่ก็จริง แต่ไม่มีใครเข้าถึงจากนอกเครื่องได้</text>
</svg>
