<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="sans-serif">
  <rect x="0" y="0" width="860" height="430" fill="#ffffff"/>
  <text x="24" y="32" font-size="19" font-weight="bold" fill="#1f2933">NFR-3 : ใครเข้าถึงฐานข้อมูลได้บ้าง</text>
  <text x="24" y="54" font-size="13" fill="#52606d">กล่องที่อยู่บน ops-net คุยกับ db ได้ · คนที่อยู่นอก network ไม่มีประตูเข้าเลยเพราะไม่เคยมี -p</text>

  <defs>
    <marker id="inArrow" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 z" fill="#2e8b57"/>
    </marker>
    <marker id="blockArrow" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 z" fill="#c04a4a"/>
    </marker>
  </defs>

  <!-- outside world -->
  <rect x="24" y="80" width="196" height="216" rx="10" fill="#fdf3f3" stroke="#c04a4a" stroke-width="2"/>
  <text x="40" y="104" font-size="14" font-weight="bold" fill="#8f2020">นอก network</text>
  <rect x="40" y="118" width="164" height="52" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="56" y="140" font-size="13" font-weight="bold" fill="#1f2933">เบราว์เซอร์ของเรา</text>
  <text x="56" y="158" font-size="12" fill="#52606d">localhost:8190</text>
  <rect x="40" y="182" width="164" height="70" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="56" y="204" font-size="13" font-weight="bold" fill="#1f2933">เชลล์ในกล่องเรียน</text>
  <text x="56" y="224" font-size="12" fill="#52606d">curl localhost:5432</text>
  <text x="56" y="242" font-size="12" font-weight="bold" fill="#8f2020">curl exit = 7</text>
  <text x="40" y="276" font-size="12" fill="#8f2020">docker port ops-db = ว่างเปล่า</text>

  <!-- ops-net -->
  <rect x="252" y="80" width="584" height="216" rx="10" fill="#f2fbf5" stroke="#2e8b57" stroke-width="2"/>
  <text x="268" y="104" font-size="14" font-weight="bold" fill="#1e6b41">ops-net  (user-defined bridge · มี DNS ในตัว)</text>

  <rect x="268" y="122" width="160" height="86" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="284" y="146" font-size="13" font-weight="bold" fill="#1f2933">ops-web</text>
  <text x="284" y="166" font-size="12" fill="#52606d">-p 3000:3000</text>
  <text x="284" y="186" font-size="12" fill="#1e6b41">ประตูเดียวของระบบ</text>

  <rect x="460" y="122" width="160" height="86" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="476" y="146" font-size="13" font-weight="bold" fill="#1f2933">ops-api</text>
  <text x="476" y="166" font-size="12" fill="#52606d">ไม่มี -p</text>
  <text x="476" y="186" font-size="12" fill="#52606d">8000/tcp เท่านั้น</text>

  <rect x="652" y="122" width="168" height="86" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
  <text x="668" y="146" font-size="13" font-weight="bold" fill="#1f2933">ops-db</text>
  <text x="668" y="166" font-size="12" fill="#52606d">ไม่มี -p</text>
  <text x="668" y="186" font-size="12" fill="#52606d">5432/tcp เท่านั้น</text>

  <line x1="432" y1="164" x2="454" y2="164" stroke="#2e8b57" stroke-width="3" marker-end="url(#inArrow)"/>
  <line x1="624" y1="164" x2="646" y2="164" stroke="#2e8b57" stroke-width="3" marker-end="url(#inArrow)"/>
  <text x="268" y="236" font-size="12" fill="#1f2933">http://ops-api:8000</text>
  <text x="460" y="236" font-size="12" fill="#1f2933">postgresql://...@ops-db:5432/campusops</text>
  <text x="268" y="264" font-size="12" fill="#52606d">เรียกกันด้วยชื่อกล่องล้วน ๆ ไม่มี IP โผล่ในคำสั่งไหนเลย</text>

  <!-- arrows from outside -->
  <line x1="206" y1="144" x2="262" y2="150" stroke="#2e8b57" stroke-width="3" marker-end="url(#inArrow)"/>
  <text x="196" y="120" font-size="11" fill="#1e6b41">ผ่านได้ทางเดียว</text>
  <line x1="206" y1="216" x2="244" y2="216" stroke="#c04a4a" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#blockArrow)"/>
  <line x1="248" y1="192" x2="248" y2="240" stroke="#c04a4a" stroke-width="6"/>

  <text x="24" y="330" font-size="13" font-weight="bold" fill="#1f2933">อ่านรูปนี้เป็นประโยคเดียว</text>
  <text x="24" y="354" font-size="12" fill="#52606d">ฐานข้อมูลถูกเปิดให้เฉพาะเพื่อนบ้านบน ops-net · โลกภายนอกเห็นแค่พอร์ต 3000 ของหน้าเว็บ</text>
  <text x="24" y="378" font-size="12" fill="#52606d">5432/tcp ในคอลัมน์ PORTS คือป้าย EXPOSE ที่ image ติดมา ไม่ใช่ประตูที่เปิดจริง (ของจริงต้องมี 0.0.0.0:...-&gt;)</text>
  <text x="24" y="402" font-size="12" fill="#52606d">ไม่ต้องตั้ง firewall เพิ่มเลย — แค่ไม่พิมพ์ -p ก็เป็นไปตาม NFR-3 แล้ว</text>
</svg>
