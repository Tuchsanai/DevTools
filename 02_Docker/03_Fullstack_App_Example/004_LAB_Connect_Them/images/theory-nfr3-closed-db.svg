<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" font-family="sans-serif">
  <rect x="0" y="0" width="920" height="430" fill="#ffffff"/>
  <text text-anchor="middle" x="460" y="32" font-size="19" font-weight="bold" fill="#1f2933">Non-Functional Requirement ข้อ 3: Database ต้องไม่มี Published Port</text>
  <text text-anchor="middle" x="460" y="54" font-size="13" fill="#52606d">ข้อกำหนดนี้เรียกย่อว่า NFR-3 · Container ภายใน Network ติดต่อ Database ได้ แต่ Host ติดต่อไม่ได้</text>

  <defs>
    <marker id="inArrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12.5" refY="5" orient="auto">
      <path d="M 0 0 L 13 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
    <marker id="blockArrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12.5" refY="5" orient="auto">
      <path d="M 0 0 L 13 5 L 0 10 z" fill="#c04a4a"/>
    </marker>
  </defs>

  <!-- outside world -->
  <rect x="24" y="80" width="196" height="216" rx="10" fill="#fdf3f3" stroke="#c04a4a" stroke-width="2"/>
  <text x="40" y="104" font-size="14" font-weight="bold" fill="#8f2020">นอก Network</text>
  <rect x="40" y="118" width="164" height="52" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="56" y="140" font-size="13" font-weight="bold" fill="#1f2933">เบราว์เซอร์ของเรา</text>
  <text x="56" y="158" font-size="12" fill="#52606d">localhost:8254</text>
  <rect x="40" y="182" width="164" height="70" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="56" y="204" font-size="13" font-weight="bold" fill="#1f2933">Shell ใน Container สำหรับเรียน</text>
  <text x="56" y="224" font-size="12" fill="#52606d">curl localhost:5432</text>
  <text x="56" y="242" font-size="12" font-weight="bold" fill="#8f2020">curl exit = 7</text>
  <text x="40" y="276" font-size="12" fill="#8f2020">docker port devtools-db = ว่างเปล่า</text>

  <!-- devtools-net -->
  <rect x="290" y="80" width="606" height="216" rx="10" fill="#f2fbf5" stroke="#2e8b57" stroke-width="2"/>
  <text x="306" y="104" font-size="14" font-weight="bold" fill="#1e6b41">devtools-net  (User-defined bridge · มี DNS ในตัว)</text>

  <rect x="306" y="122" width="158" height="86" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="322" y="146" font-size="13" font-weight="bold" fill="#1f2933">devtools-web</text>
  <text x="322" y="166" font-size="12" fill="#52606d">-p 3000:3000</text>
  <text x="322" y="186" font-size="12" fill="#1e6b41">ประตูเดียวของระบบ</text>

  <rect x="512" y="122" width="158" height="86" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="528" y="146" font-size="13" font-weight="bold" fill="#1f2933">devtools-api</text>
  <text x="528" y="166" font-size="12" fill="#52606d">ไม่มี -p</text>
  <text x="528" y="186" font-size="12" fill="#52606d">8000/tcp เท่านั้น</text>

  <rect x="718" y="122" width="162" height="86" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
  <text x="734" y="146" font-size="13" font-weight="bold" fill="#1f2933">devtools-db</text>
  <text x="734" y="166" font-size="12" fill="#52606d">ไม่มี -p</text>
  <text x="734" y="186" font-size="12" fill="#52606d">5432/tcp เท่านั้น</text>

  <line x1="468" y1="164" x2="508" y2="164" stroke="#2e8b57" stroke-width="3" marker-end="url(#inArrow)"/>
  <line x1="674" y1="164" x2="714" y2="164" stroke="#2e8b57" stroke-width="3" marker-end="url(#inArrow)"/>
  <text x="488" y="236" font-size="12" fill="#1f2933" text-anchor="middle">http://devtools-api:8000</text>
  <text x="694" y="236" font-size="12" fill="#1f2933" text-anchor="middle">postgresql://...@devtools-db:5432/campusops</text>
  <text x="306" y="264" font-size="12" fill="#52606d">เรียกกันด้วยชื่อ Container โดยไม่มี IP address ในคำสั่ง</text>

  <!-- arrows from outside -->
  <line x1="206" y1="148" x2="300" y2="150" stroke="#2e8b57" stroke-width="3" marker-end="url(#inArrow)"/>
  <text x="255" y="114" font-size="12" fill="#1e6b41" text-anchor="middle">ผ่านได้</text>
  <text x="255" y="130" font-size="12" fill="#1e6b41" text-anchor="middle">ทางเดียว</text>
  <line x1="206" y1="216" x2="268" y2="216" stroke="#c04a4a" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#blockArrow)"/>
  <rect x="279" y="182" width="10" height="68" rx="5" fill="#c04a4a"/>

  <text x="24" y="330" font-size="13" font-weight="bold" fill="#1f2933">อ่านรูปนี้เป็นประโยคเดียว</text>
  <text x="24" y="354" font-size="12" fill="#52606d">ฐานข้อมูลถูกเปิดให้เฉพาะเพื่อนบ้านบน devtools-net · โลกภายนอกเห็นแค่พอร์ต 3000 ของหน้าเว็บ</text>
  <text x="24" y="378" font-size="12" fill="#52606d">5432/tcp ในคอลัมน์ PORTS คือป้าย EXPOSE ที่ Image ติดมา ไม่ใช่ประตูที่เปิดจริง (ของจริงต้องมี 0.0.0.0:...-&gt;)</text>
  <text x="24" y="402" font-size="12" fill="#52606d">ไม่ต้องตั้ง firewall เพิ่มเลย — แค่ไม่พิมพ์ -p ก็เป็นไปตาม NFR-3 แล้ว</text>
</svg>
