<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 468.65" width="1210" height="468.65"><!-- svg-source:excalidraw --><metadata/><defs><style class="style-fonts">
      @font-face { font-family: Excalifont; src: url(data:font/woff2;base64,); }</style></defs><rect x="0" y="0" width="1210" height="468.65" fill="#ffffff"/><g transform="translate(10 10) rotate(0 434.1435546875 14.95)"><text x="0" y="21.9705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#1864ab" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ตั้งค่าซ้อนกัน 3 ชั้น — ชนกันแล้วใครชนะ? (ตัวอย่าง APP_ENV จากแล็บนี้)</text></g><g stroke-linecap="round" transform="translate(40 80) rotate(0 235 35)"><path d="M-0.04 -1.8 L470.27 -1.49 L470.42 69.8 L0.4 69.45" stroke="none" stroke-width="0" fill="#f1f3f5"/><path d="M0 0 C148.96 -0.01, 298.82 -0.48, 470 0 M0 0 C181.93 1.04, 364.51 0.25, 470 0 M470 0 C468.07 20.55, 470.56 41.86, 470 70 M470 0 C469.6 23.6, 469.75 47.39, 470 70 M470 70 C365.11 70.71, 258.48 71.68, 0 70 M470 70 C339 69.98, 208.3 70.36, 0 70 M0 70 C2.28 44.11, -1.29 17.02, 0 0 M0 70 C-0.55 46.44, -0.78 23.14, 0 0" stroke="#868e96" stroke-width="2" fill="none"/></g><g transform="translate(77.5 90) rotate(0 197.5 25)"><text x="197.5" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#868e96" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ชั้น 1 · ENV ใน Dockerfile (ฝังมากับ image)</text><text x="197.5" y="42.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#868e96" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ENV APP_ENV=development</text></g><g stroke-linecap="round" transform="translate(40 180) rotate(0 235 35)"><path d="M-1.8 0.27 L468.51 0.42 L469.8 70.4 L-0.55 71.58" stroke="none" stroke-width="0" fill="#e7f5ff"/><path d="M0 0 C161.52 1.1, 322.02 2.2, 470 0 M0 0 C137.04 1.55, 272.88 1.61, 470 0 M470 0 C469.54 20.59, 469.34 40.52, 470 70 M470 0 C470.2 22.33, 470.59 44.75, 470 70 M470 70 C350.59 71.72, 232.5 71.67, 0 70 M470 70 C311.3 68.68, 153.33 69.24, 0 70 M0 70 C0.7 52, 0.54 38.2, 0 0 M0 70 C-0.14 43.01, -0.12 16.4, 0 0" stroke="#1864ab" stroke-width="2" fill="none"/></g><g transform="translate(91.5 190) rotate(0 183.5 25)"><text x="183.5" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#1864ab" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ชั้น 2 · --env-file .env.lab (โหลดทั้งไฟล์)</text><text x="183.5" y="42.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#1864ab" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">APP_ENV=staging</text></g><g stroke-linecap="round" transform="translate(40 280) rotate(0 235 35)"><path d="M0.27 -1.49 L470.42 -0.2 L470.4 69.45 L1.58 70.5" stroke="none" stroke-width="0" fill="#d3f9d8"/><path d="M0 0 C153.02 -1.2, 307.45 -1.36, 470 0 M0 0 C126.71 -2.26, 253.5 -1.94, 470 0 M470 0 C470.04 24.83, 470.05 52.48, 470 70 M470 0 C469.17 21.63, 468.84 41.63, 470 70 M470 70 C305.27 69.78, 140.65 69.5, 0 70 M470 70 C321.77 68.45, 174.29 68.1, 0 70 M0 70 C-2.39 46.52, 0.03 22.94, 0 0 M0 70 C-0.22 49.86, -0.04 29.29, 0 0" stroke="#2f9e44" stroke-width="2" fill="none"/></g><g transform="translate(94.5 290) rotate(0 180.5 25)"><text x="180.5" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#2f9e44" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ชั้น 3 · -e ตอน docker run (ระบุรายตัว)</text><text x="180.5" y="42.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#2f9e44" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">-e APP_ENV=production</text></g><g transform="translate(530 105) rotate(0 77.56884765625 8.049999999999997)"><text x="0" y="11.830273437499999" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">แพ้ทุกคน (เป็นแค่ default)</text></g><g transform="translate(530 182) rotate(0 30.337890625 8.049999999999997)"><text x="0" y="11.830273437499999" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1864ab" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ชนะ ENV</text></g><g transform="translate(530 305) rotate(0 42.94482421875 8.050000000000011)"><text x="0" y="11.830273437499999" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#2f9e44" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ชนะทุกชั้น 🏆</text></g><g stroke-linecap="round" transform="translate(760 155) rotate(0 220 60)"><path d="M0.4 -0.55 L441.58 0.5 L438.06 121.39 L1.95 119.63" stroke="none" stroke-width="0" fill="#fff9db"/><path d="M0 0 C135.42 -0.54, 272.33 0.14, 440 0 M0 0 C93.69 -0.11, 186.43 0.51, 440 0 M440 0 C440.43 27.89, 440.8 57.25, 440 120 M440 0 C439.6 43.92, 438.7 85.91, 440 120 M440 120 C278.06 120.28, 115.07 120.4, 0 120 M440 120 C303.68 118.95, 167.14 118.06, 0 120 M0 120 C-0.71 78.79, -0.9 37.07, 0 0 M0 120 C0.16 86.01, 0.23 53.41, 0 0" stroke="#e67700" stroke-width="2" fill="none"/></g><g transform="translate(803 177.5) rotate(0 177 37.5)"><text x="177" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e67700" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">environment ที่โปรเซสในกล่องเห็นจริง :</text><text x="177" y="42.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e67700" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">APP_ENV=production</text><text x="177" y="67.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e67700" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">(ผู้ชนะถูกส่งเข้าไป "ค่าเดียว")</text></g><g stroke-linecap="round"><g transform="translate(518.4207155501065 149.9568390851215) rotate(0 116.57928444989352 16.10699070211254)"><path d="M0 0 C89.14 14.57, 180.71 24.1, 233.16 32.21" stroke="#868e96" stroke-width="2.5" fill="none" stroke-dasharray="8 10"/></g><g transform="translate(518.4207155501065 149.9568390851215) rotate(0 116.57928444989352 16.10699070211254)"><path d="M208.72 37.49 C216.71 37.28, 227.56 31.71, 233.16 32.21" stroke="#868e96" stroke-width="2.5" fill="none"/></g><g transform="translate(518.4207155501065 149.9568390851215) rotate(0 116.57928444989352 16.10699070211254)"><path d="M211.05 20.55 C218.12 26.91, 228.06 27.91, 233.16 32.21" stroke="#868e96" stroke-width="2.5" fill="none"/></g></g><mask/><g stroke-linecap="round"><g transform="translate(518.5 215.5) rotate(0 116.5 -0.4999999999999858)"><path d="M0 0 C69.23 1.08, 133.99 1.01, 233 -1" stroke="#1864ab" stroke-width="2.5" fill="none" stroke-dasharray="8 10"/></g><g transform="translate(518.5 215.5) rotate(0 116.5 -0.4999999999999858)"><path d="M209.65 7.93 C218.23 5.38, 221.5 3.06, 233 -1" stroke="#1864ab" stroke-width="2.5" fill="none"/></g><g transform="translate(518.5 215.5) rotate(0 116.5 -0.4999999999999858)"><path d="M209.37 -9.17 C217.98 -6.74, 221.33 -4.1, 233 -1" stroke="#1864ab" stroke-width="2.5" fill="none"/></g></g><mask/><g stroke-linecap="round"><g transform="translate(518.4207155501065 280.0431609148785) rotate(0 116.57928444989352 -16.10699070211254)"><path d="M0 0 C62.97 -11.9, 126.07 -19.37, 233.16 -32.21 M0 0 C87.1 -11.51, 173.68 -22.77, 233.16 -32.21" stroke="#2f9e44" stroke-width="2" fill="none"/></g><g transform="translate(518.4207155501065 280.0431609148785) rotate(0 116.57928444989352 -16.10699070211254)"><path d="M211.18 -20.3 C217.07 -25.46, 223.27 -27.23, 233.16 -32.21 M211.18 -20.3 C219.79 -25.2, 227.95 -28.79, 233.16 -32.21" stroke="#2f9e44" stroke-width="2" fill="none"/></g><g transform="translate(518.4207155501065 280.0431609148785) rotate(0 116.57928444989352 -16.10699070211254)"><path d="M208.66 -37.21 C215.11 -37.84, 221.98 -35.04, 233.16 -32.21 M208.66 -37.21 C218.05 -35.82, 227.15 -33.13, 233.16 -32.21" stroke="#2f9e44" stroke-width="2" fill="none"/></g></g><mask/><g transform="translate(40 400) rotate(0 414.03125 29.32499999999999)"><text x="0" y="14.365332031249999" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#495057" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">กติกา : Docker "ยุบชื่อซ้ำ" ให้เหลือผู้ชนะก่อนสร้างโปรเซส — แอปไม่เคยเห็นค่าที่แพ้ (getenv() จึงไม่ใช่คนตัดสิน)</text><text x="0" y="33.915332031249996" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#495057" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">-e ทับเป็น "รายตัวแปร" ไม่ใช่ทับทั้งไฟล์ — ตัวแปรอื่นใน .env.lab ที่ไม่ถูก -e ยังมีผลครบทุกตัว</text><text x="0" y="53.46533203124999" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#495057" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ARG คนละเรื่องกับ ENV : ARG มีชีวิตเฉพาะช่วง build และอาจทิ้งร่องรอยใน docker history — ห้ามใส่ secret ทั้งคู่</text></g></svg>