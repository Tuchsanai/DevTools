><mask/><g transform="translate(40 556) rotate(0 503.194580078125 19.55000000000001)"><text x="0" y="14.365332031249999" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#495057" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">อาการคลาสสิก : แก้ db/initdb/01-schema.sql แล้ว up -d --build ใหม่ ทำไมตาราง/ข้อมูลไม่เปลี่ยน? — เพราะ init รันเฉพาะตอน volume ว่างเท่านั้น</text><text x="0" y="33.915332031249996" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#495057" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ทางเลือก : docker compose down -v (ยอมล้างข้อมูล) หรือเข้าไปแก้เองด้วย docker compose exec db psql</text></g></svg>