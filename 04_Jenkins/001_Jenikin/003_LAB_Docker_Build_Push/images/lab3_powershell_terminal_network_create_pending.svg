<title id="t">Windows PowerShell (ภาพประกอบ ยังไม่ได้รัน): docker network create cicd-net</title>
<desc id="d">ภาพประกอบหน้าต่าง Windows PowerShell ที่พิมพ์คำสั่งรอไว้แต่ยังไม่ได้กด Enter ไม่มีผลลัพธ์ ไม่ใช่ภาพหน้าจอจริง คำสั่ง: docker network create cicd-net</desc>
