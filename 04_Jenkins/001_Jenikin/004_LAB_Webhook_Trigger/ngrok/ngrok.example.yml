# ngrok agent config (ทางเลือกแทน flag ยาว ๆ) — คัดลอกเป็น ngrok/ngrok.yml แล้วใส่ค่าจริง
# ngrok.yml มี authtoken: อยู่ใน .gitignore แล้ว ห้าม commit
version: 3
agent:
  authtoken: <NGROK_AUTHTOKEN>
  web_addr: 0.0.0.0:4040          # ให้ publish inspector ออกจาก container ได้ (host ผูกแค่ 127.0.0.1:4040)
endpoints:
  - name: jenkins-webhook
    url: https://<NGROK_DOMAIN>
    upstream:
      url: http://jenkins:8080
    # เงื่อนไขเดียวกับ traffic-policy.yml: ผ่านเฉพาะ POST /github-webhook/
    traffic_policy:
      on_http_request:
        - name: allow-only-github-webhook
          expressions:
            - "!(req.method == 'POST' && req.url.path == '/github-webhook/')"
          actions:
            - type: custom-response
              config:
                status_code: 403
                body: "blocked by ngrok traffic policy (LAB 4)"
