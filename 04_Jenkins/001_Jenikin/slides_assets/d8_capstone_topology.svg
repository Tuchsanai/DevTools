<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Topology CI/CD capstone</title><desc id="d">Browser Gitea Jenkins inner dockerd Docker Hub และ webapp พร้อม URL ตามผู้เรียก</desc>
  <defs><marker id="a8" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#147d92"/></marker><marker id="a8g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#169b72"/></marker></defs>
