<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 486" role="img" aria-labelledby="dt-d11 dd-d11">
<title id="dt-d11">ปล่อยของด้วยมือ เทียบกับ CI/CD</title><desc id="dd-d11">งานเท่ากันสี่ขั้น แต่แบบทำมือขั้นตอนอยู่ในหัวคนและไม่มีหลักฐาน ส่วน CI/CD ขั้นตอนอยู่ในไฟล์และเก็บหลักฐานทุกครั้ง</desc>
<defs><marker id="ah-d11" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" refX="13.5" refY="6" orient="auto"><path d="M0 0.5L15 6L0 11.5z" fill="#6f97a6"/></marker><marker id="ahw-d11" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" refX="13.5" refY="6" orient="auto"><path d="M0 0.5L15 6L0 11.5z" fill="#d99013"/></marker><marker id="ahr-d11" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" refX="13.5" refY="6" orient="auto"><path d="M0 0.5L15 6L0 11.5z" fill="#cf4b45"/></marker><marker id="ahg-d11" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" refX="13.5" refY="6" orient="auto"><path d="M0 0.5L15 6L0 11.5z" fill="#169b72"/></marker><marker id="ahb-d11" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" refX="13.5" refY="6" orient="auto"><path d="M0 0.5L15 6L0 11.5z" fill="#4b95cc"/></marker></defs>
<rect x="1" y="1" width="1198" height="484" rx="26" fill="#f7fbfd" stroke="#dcebf0" stroke-width="2"/>
<g font-family=""Leelawadee UI","Noto Sans Thai","Segoe UI",sans-serif">
<rect x="36" y="52" width="1128" height="166" rx="20" fill="none" stroke="#cf4b45" stroke-width="2.5" stroke-dasharray="9 7"/>
<rect x="62" y="37" width="259.4" height="30" rx="15" fill="#cf4b45"/>
<text x="191.7" y="57.5" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">ทำเอง — ขั้นตอนอยู่ในหัวคน</text>
<rect x="70.0" y="84" width="214" height="94" rx="18" fill="#ffece9" stroke="#cf4b45" stroke-width="3"/>
<text x="177.0" y="127.2" text-anchor="middle" font-size="21" font-weight="700" fill="#a2312c">แก้โค้ด</text>
<text x="177.0" y="154.9" text-anchor="middle" font-size="15" font-weight="400" fill="#57737f">บนเครื่องตัวเอง</text>
<rect x="352.0" y="84" width="214" height="94" rx="18" fill="#ffece9" stroke="#cf4b45" stroke-width="3"/>
<text x="459.0" y="127.2" text-anchor="middle" font-size="21" font-weight="700" fill="#a2312c">build เอง</text>
<text x="459.0" y="154.9" text-anchor="middle" font-size="15" font-weight="400" fill="#57737f">ต้องจำคำสั่งให้ครบ</text>
<path d="M294.0 131.0L344.0 131.0" fill="none" stroke="#cf4b45" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahr-d11)"/>
<rect x="634.0" y="84" width="214" height="94" rx="18" fill="#ffece9" stroke="#cf4b45" stroke-width="3"/>
<text x="741.0" y="126.3" text-anchor="middle" font-size="18.0" font-weight="700" fill="#a2312c">คัดลอกขึ้น server</text>
<text x="741.0" y="153.0" text-anchor="middle" font-size="15" font-weight="400" fill="#57737f">ลากไฟล์ / scp</text>
<path d="M576.0 131.0L626.0 131.0" fill="none" stroke="#cf4b45" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahr-d11)"/>
<rect x="916.0" y="84" width="214" height="94" rx="18" fill="#ffece9" stroke="#cf4b45" stroke-width="3"/>
<text x="1023.0" y="127.2" text-anchor="middle" font-size="21" font-weight="700" fill="#a2312c">ssh restart</text>
<text x="1023.0" y="154.9" text-anchor="middle" font-size="15" font-weight="400" fill="#57737f">แล้วเปิดดูเอง</text>
<path d="M858.0 131.0L908.0 131.0" fill="none" stroke="#cf4b45" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahr-d11)"/>
<text x="600.0" y="200" text-anchor="middle" font-size="17.5" font-weight="700" fill="#a2312c">ผลต่างกันตามคนและเครื่อง • ไม่มี log ย้อนหลัง • รู้ว่าพังตอนผู้ใช้เจอ</text>
<rect x="36" y="268" width="1128" height="166" rx="20" fill="none" stroke="#169b72" stroke-width="2.5" stroke-dasharray="9 7"/>
<rect x="62" y="253" width="381.6" height="30" rx="15" fill="#169b72"/>
<text x="252.8" y="273.5" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">CI/CD — ขั้นตอนอยู่ในไฟล์ที่ review ได้</text>
<rect x="70.0" y="300" width="214" height="94" rx="18" fill="#eaf4ff" stroke="#4b95cc" stroke-width="3"/>
<text x="177.0" y="343.2" text-anchor="middle" font-size="21" font-weight="700" fill="#12547f">git push</text>
<text x="177.0" y="370.9" text-anchor="middle" font-size="15" font-weight="400" fill="#57737f">จุดเริ่มเดียว</text>
<rect x="352.0" y="300" width="214" height="94" rx="18" fill="#dff1f5" stroke="#147d92" stroke-width="3"/>
<text x="459.0" y="342.7" text-anchor="middle" font-size="18.0" font-weight="700" fill="#0b5a6b">Jenkins รับ event</text>
<text x="459.0" y="368.6" text-anchor="middle" font-size="14.2" font-weight="400" fill="#57737f">ทุกครั้ง ไม่มีข้อยกเว้น</text>
<path d="M294.0 347.0L344.0 347.0" fill="none" stroke="#169b72" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahg-d11)"/>
<rect x="634.0" y="300" width="214" height="94" rx="18" fill="#e6fbf4" stroke="#169b72" stroke-width="3"/>
<text x="741.0" y="341.7" text-anchor="middle" font-size="16.1" font-weight="700" fill="#07795a">Build → Test → Push</text>
<text x="741.0" y="367.8" text-anchor="middle" font-size="15" font-weight="400" fill="#57737f">สูตรเดียวกันทุกครั้ง</text>
<path d="M576.0 347.0L626.0 347.0" fill="none" stroke="#169b72" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahg-d11)"/>
<rect x="916.0" y="300" width="214" height="94" rx="18" fill="#fff5d9" stroke="#d99013" stroke-width="3"/>
<text x="1023.0" y="343.0" text-anchor="middle" font-size="20.4" font-weight="700" fill="#95600b">Deploy + Verify</text>
<text x="1023.0" y="370.6" text-anchor="middle" font-size="15" font-weight="400" fill="#57737f">ตรวจว่าใช้ได้จริง</text>
<path d="M858.0 347.0L908.0 347.0" fill="none" stroke="#169b72" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahg-d11)"/>
<text x="600.0" y="416" text-anchor="middle" font-size="17.5" font-weight="700" fill="#07795a">ผลเหมือนเดิมทุกครั้ง • มี build number + console เป็นหลักฐาน • รู้ผลในไม่กี่นาที</text>
<text x="600.0" y="466" text-anchor="middle" font-size="19" font-weight="700" fill="#173d52">งานเหมือนกันทุกขั้น — ต่างกันที่ “ใครเป็นคนจำ” และ “เหลืออะไรไว้ให้ตรวจย้อนหลัง”</text>
</g>
</svg>
