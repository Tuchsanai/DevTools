<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">สายหลักฐานจาก GitHub SHA ถึง Docker image digest</title>
  <desc id="desc">GitHub ส่ง revision ให้ Jenkins ทดสอบ สร้างและ push image จากนั้น Docker Hub ส่ง digest กลับมาให้ Jenkins pull และรันทดสอบ</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbfc"/>
      <stop offset="1" stop-color="#e9fbf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#173d52" flood-opacity=".18"/>
    </filter>
    <marker id="arrow-lab4" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#147d92"/>
    </marker>
    <marker id="arrow-back-lab4" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#169b72"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="1100" height="420" rx="28" fill="url(#bg)" stroke="#cfe0e6" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="55" y="92" width="235" height="186" rx="22" fill="#10364a"/>
    <rect x="442" y="66" width="275" height="238" rx="22" fill="#fff" stroke="#83ccb6" stroke-width="3"/>
    <rect x="830" y="92" width="235" height="186" rx="22" fill="#147d92"/>
  </g>
  <text x="172" y="133" text-anchor="middle" fill="#9be4d2" font-size="18" font-weight="700" font-family="Noto Sans Thai, sans-serif">PUBLIC REPOSITORY</text>
  <text x="172" y="177" text-anchor="middle" fill="#fff" font-size="31" font-weight="800" font-family="Noto Sans Thai, sans-serif">GitHub</text>
  <text x="172" y="214" text-anchor="middle" fill="#d9edf2" font-size="18" font-family="Noto Sans Thai, sans-serif">main · anonymous read</text>
  <text x="172" y="246" text-anchor="middle" fill="#9be4d2" font-size="17" font-family="monospace">FULL_SHA</text>
  <text x="579" y="108" text-anchor="middle" fill="#087457" font-size="18" font-weight="700" font-family="Noto Sans Thai, sans-serif">JENKINS PIPELINE</text>
  <g font-family="Noto Sans Thai, sans-serif" font-size="19" font-weight="700" fill="#173d52">
    <rect x="478" y="130" width="202" height="38" rx="10" fill="#e9fbf6"/><text x="579" y="156" text-anchor="middle">1 · deterministic test</text>
    <rect x="478" y="179" width="202" height="38" rx="10" fill="#f0f8ff"/><text x="579" y="205" text-anchor="middle">2 · build + OCI label</text>
    <rect x="478" y="228" width="202" height="38" rx="10" fill="#fff7df"/><text x="579" y="254" text-anchor="middle">3 · push SHA tags</text>
  </g>
  <text x="947" y="133" text-anchor="middle" fill="#c8fff0" font-size="18" font-weight="700" font-family="Noto Sans Thai, sans-serif">PUBLIC IMAGE</text>
  <text x="947" y="177" text-anchor="middle" fill="#fff" font-size="30" font-weight="800" font-family="Noto Sans Thai, sans-serif">Docker Hub</text>
  <text x="947" y="213" text-anchor="middle" fill="#e9fbf6" font-size="17" font-family="monospace">:&lt;full SHA&gt;</text>
  <text x="947" y="240" text-anchor="middle" fill="#e9fbf6" font-size="17" font-family="monospace">:&lt;short SHA&gt;</text>
  <path d="M290 184H426" fill="none" stroke="#147d92" stroke-width="5" marker-end="url(#arrow-lab4)"/>
  <text x="358" y="165" text-anchor="middle" fill="#147d92" font-size="16" font-weight="700" font-family="Noto Sans Thai, sans-serif">checkout revision</text>
  <path d="M717 184H814" fill="none" stroke="#147d92" stroke-width="5" marker-end="url(#arrow-lab4)"/>
  <text x="765" y="165" text-anchor="middle" fill="#147d92" font-size="16" font-weight="700" font-family="Noto Sans Thai, sans-serif">push</text>
  <path d="M947 289C947 377 728 390 587 330" fill="none" stroke="#169b72" stroke-width="5" marker-end="url(#arrow-back-lab4)"/>
  <text x="828" y="370" text-anchor="middle" fill="#087457" font-size="18" font-weight="800" font-family="Noto Sans Thai, sans-serif">digest → pull → run</text>
  <rect x="190" y="340" width="390" height="52" rx="14" fill="#10364a"/>
  <text x="385" y="373" text-anchor="middle" fill="#fff" font-size="19" font-weight="700" font-family="Noto Sans Thai, sans-serif">FULL_SHA = OCI revision · content = DIGEST</text>
</svg>
