<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">กายวิภาค Jenkinsfile</title><desc id="d">โค้ด declarative pipeline พร้อมคำอธิบาย pipeline agent stages steps และ post</desc>
  <defs><marker id="a4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#147d92"/></marker></defs>
  <rect width="1200" height="520" rx="28" fill="#f7fbfc"/>
  <rect x="55" y="35" width="600" height="450" rx="20" fill="#122536"/>
  <g font-family="Cascadia Code,Consolas,monospace" font-size="22" fill="#dcecf3"><text x="90" y="82"><tspan fill="#7ee0ad">pipeline</tspan> {</text><text x="120" y="122"><tspan fill="#7ee0ad">agent</tspan> any</text><text x="120" y="162"><tspan fill="#7ee0ad">stages</tspan> {</text><text x="150" y="202"><tspan fill="#ffd479">stage</tspan>('Test') {</text><text x="180" y="242"><tspan fill="#7ee0ad">steps</tspan> {</text><text x="210" y="282">sh 'pytest -q'</text><text x="180" y="322">}</text><text x="150" y="362">}</text><text x="120" y="402">}</text><text x="120" y="442"><tspan fill="#7ee0ad">post</tspan> { always { echo 'done' } }</text><text x="90" y="475">}</text></g>
  <g font-family="Leelawadee UI,Segoe UI,sans-serif">
    <g fill="none" stroke="#147d92" stroke-width="4" marker-end="url(#a4)"><path d="M930 75H690"/><path d="M930 135H690"/><path d="M930 205H690"/><path d="M930 275H690"/><path d="M930 430H690"/></g>
    <text x="950" y="82" font-size="25" font-weight="800" fill="#125b8c">pipeline</text><text x="950" y="110" font-size="19" fill="#527080">กรอบ declarative ทั้งหมด</text>
    <text x="950" y="142" font-size="25" font-weight="800" fill="#125b8c">agent</text><text x="950" y="170" font-size="19" fill="#527080">ที่ที่งานจะรัน</text>
    <text x="950" y="212" font-size="25" font-weight="800" fill="#125b8c">stages / stage</text><text x="950" y="240" font-size="19" fill="#527080">แบ่งงานเป็นช่วงอ่านง่าย</text>
    <text x="950" y="282" font-size="25" font-weight="800" fill="#125b8c">steps</text><text x="950" y="310" font-size="19" fill="#527080">คำสั่งที่ลงมือจริง</text>
    <text x="950" y="437" font-size="25" font-weight="800" fill="#125b8c">post</text><text x="950" y="465" font-size="19" fill="#527080">ทำหลัง stages จบ</text>
  </g>
</svg>
