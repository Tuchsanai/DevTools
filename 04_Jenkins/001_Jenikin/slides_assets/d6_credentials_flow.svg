<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="t d">
  <title id="t">Credentials store และ masking flow</title><desc id="d">Token ถูกเก็บใน Jenkins credentials และ inject เฉพาะ stage ก่อนถูก masking ใน console</desc>
  <defs><marker id="a6" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#147d92"/></marker></defs>
  <rect width="1200" height="450" rx="28" fill="#f7fbfc"/>
  <g font-family="Leelawadee UI,Segoe UI,sans-serif" text-anchor="middle">
    <rect x="50" y="105" width="250" height="210" rx="24" fill="#fff7df" stroke="#d99013" stroke-width="4"/><text x="175" y="157" font-size="27" font-weight="800" fill="#a36200">Credentials store</text><text x="175" y="205" font-size="22" fill="#173d52">id: dockerhub</text><text x="175" y="245" font-size="21" fill="#527080">&lt;DOCKER_USER&gt;</text><text x="175" y="280" font-size="21" fill="#527080">&lt;DOCKER_TOKEN&gt;</text>
    <path d="M300 210H440" stroke="#147d92" stroke-width="7" marker-end="url(#a6)"/><text x="370" y="185" font-size="19" fill="#527080">inject ชั่วคราว</text>
    <rect x="450" y="75" width="310" height="270" rx="24" fill="#e9fbf6" stroke="#169b72" stroke-width="4"/><text x="605" y="125" font-size="27" font-weight="800" fill="#087457">withCredentials</text><text x="605" y="175" font-size="21" fill="#173d52">DOCKER_USER</text><text x="605" y="210" font-size="21" fill="#173d52">DOCKER_TOKEN</text><rect x="500" y="245" width="210" height="58" rx="12" fill="#fff" stroke="#67bc9f" stroke-width="3"/><text x="605" y="282" font-size="20" fill="#173d52">docker login --password-stdin</text>
    <path d="M760 210H880" stroke="#147d92" stroke-width="7" marker-end="url(#a6)"/><text x="820" y="185" font-size="19" fill="#527080">console</text>
    <rect x="890" y="105" width="260" height="210" rx="24" fill="#e8f4ff" stroke="#1676b8" stroke-width="4"/><text x="1020" y="157" font-size="27" font-weight="800" fill="#125b8c">Console Output</text><text x="1020" y="215" font-family="Cascadia Code,Consolas,monospace" font-size="28" fill="#173d52">****</text><text x="1020" y="258" font-size="20" fill="#527080">masking ลดโอกาสหลุด</text><text x="1020" y="288" font-size="18" fill="#a3322d">ไม่ใช่การันตีสัมบูรณ์</text>
    <text x="600" y="410" font-size="25" font-weight="800" fill="#173d52">ใช้เท่าที่ต้องใช้ • set +x • config ชั่วคราว • ล้างเสมอ</text>
  </g>
</svg>
