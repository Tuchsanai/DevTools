<text x="266" y="392" text-anchor="middle" font-size="19" font-weight="700" fill="#a2312c">release เลื่อนออกไป</text>
<text x="600" y="392" text-anchor="middle" font-size="19" font-weight="700" fill="#a2312c">ทำซ้ำให้เหมือนเดิมไม่ได้</text>
<text x="934" y="392" text-anchor="middle" font-size="19" font-weight="700" fill="#a2312c">พังแล้วตอบไม่ได้ว่าใครแก้อะไร</text>
