<text x="238.0" y="213.6" text-anchor="middle" font-size="16.6" font-weight="400" fill="#57737f">เขียนโค้ดเสร็จ • ทดสอบบนเครื่องตัวเอง</text>
<text x="238.0" y="236.2" text-anchor="middle" font-size="16.6" font-weight="400" fill="#57737f">ส่งมอบเป็นไฟล์ + เอกสารหนึ่งหน้า</text>
