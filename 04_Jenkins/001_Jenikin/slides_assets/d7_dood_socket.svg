<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="dt-d7 dd-d7">
<title id="dt-d7">Docker outside of Docker</title><desc id="dd-d7">Jenkins มีเฉพาะ Docker CLI แล้วส่งคำสั่งผ่าน socket ไปยัง dockerd ของ devtools คอนเทนเนอร์ที่ได้จึงเป็น sibling</desc>
<defs><marker id="ah-d7" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" refX="13.5" refY="6" orient="auto"><path d="M0 0.5L15 6L0 11.5z" fill="#6f97a6"/></marker><marker id="ahw-d7" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" refX="13.5" refY="6" orient="auto"><path d="M0 0.5L15 6L0 11.5z" fill="#d99013"/></marker><marker id="ahr-d7" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" refX="13.5" refY="6" orient="auto"><path d="M0 0.5L15 6L0 11.5z" fill="#cf4b45"/></marker><marker id="ahg-d7" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" refX="13.5" refY="6" orient="auto"><path d="M0 0.5L15 6L0 11.5z" fill="#169b72"/></marker><marker id="ahb-d7" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" refX="13.5" refY="6" orient="auto"><path d="M0 0.5L15 6L0 11.5z" fill="#4b95cc"/></marker></defs>
<rect x="1" y="1" width="1198" height="438" rx="26" fill="#f7fbfd" stroke="#dcebf0" stroke-width="2"/>
<g font-family=""Leelawadee UI","Noto Sans Thai","Segoe UI",sans-serif">
<rect x="36" y="62" width="1128" height="236" rx="20" fill="none" stroke="#147d92" stroke-width="2.5" stroke-dasharray="9 7"/>
<rect x="62" y="47" width="485.0" height="30" rx="15" fill="#147d92"/>
<text x="304.5" y="67.5" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">dockerd ของ devtools — daemon ตัวเดียวที่ทำงานจริง</text>
<rect x="72" y="106" width="292" height="148" rx="18" fill="#dff1f5" stroke="#147d92" stroke-width="3"/>
<text x="218.0" y="165.4" text-anchor="middle" font-size="23" font-weight="700" fill="#0b5a6b">jenkins</text>
<text x="218.0" y="194.7" text-anchor="middle" font-size="16" font-weight="400" fill="#57737f">มีแค่ Docker CLI 29.7.2</text>
<text x="218.0" y="216.7" text-anchor="middle" font-size="16" font-weight="400" fill="#57737f">image: jenkins-docker:2569</text>
<rect x="788" y="106" width="340" height="148" rx="18" fill="#e6fbf4" stroke="#169b72" stroke-width="3"/>
<text x="958.0" y="164.5" text-anchor="middle" font-size="20.4" font-weight="700" fill="#07795a">container ที่ build ออกมา</text>
<text x="958.0" y="193.1" text-anchor="middle" font-size="16" font-weight="400" fill="#57737f">อยู่ระดับเดียวกับ jenkins</text>
<text x="958.0" y="215.1" text-anchor="middle" font-size="16" font-weight="400" fill="#57737f">ไม่ได้ซ้อนอยู่ข้างใน</text>
<rect x="440" y="128" width="272" height="104" rx="18" fill="#ffffff" stroke="#7d97a3" stroke-width="3"/>
<text x="576" y="168" text-anchor="middle" font-size="19" font-weight="700" fill="#3d5865" font-family=""Cascadia Code",Consolas,monospace">/var/run/docker.sock</text>
<text x="576" y="196" text-anchor="middle" font-size="16" font-weight="400" fill="#57737f">bind mount เข้า jenkins</text>
<path d="M368 180L434 180" fill="none" stroke="#6f97a6" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ah-d7)"/>
<path d="M716 180L782 180" fill="none" stroke="#6f97a6" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ah-d7)"/>
<text x="400" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#57737f">สั่ง</text>
<text x="750" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#57737f">สร้าง</text>
<rect x="72" y="322" width="520" height="80" rx="18" fill="#ffece9" stroke="#cf4b45" stroke-width="3"/>
<text x="332.0" y="358.3" text-anchor="middle" font-size="22.9" font-weight="700" fill="#a2312c">socket ≈ สิทธิ์ root ของ inner host</text>
<text x="332.0" y="387.7" text-anchor="middle" font-size="16" font-weight="400" fill="#57737f">ใช้เฉพาะแล็บที่ทิ้งได้ — production ต้องแยก agent</text>
<rect x="624" y="322" width="504" height="80" rx="18" fill="#e6fbf4" stroke="#169b72" stroke-width="3"/>
<text x="876.0" y="358.4" text-anchor="middle" font-size="23" font-weight="700" fill="#07795a">แลกมาด้วยความเร็ว</text>
<text x="876.0" y="387.7" text-anchor="middle" font-size="16" font-weight="400" fill="#57737f">ใช้ image cache • network • lifecycle ชุดเดียวกัน</text>
</g>
