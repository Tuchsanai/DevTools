<text x="600.0" y="466" text-anchor="middle" font-size="19" font-weight="700" fill="#173d52">CI คือวินัยของทีม — “รวมโค้ดบ่อย แล้วให้ระบบ build + test ทุกครั้ง” ไม่ใช่แค่การติดตั้งเครื่องมือ</text>
