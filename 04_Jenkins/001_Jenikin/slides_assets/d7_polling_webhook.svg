<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="t d">
  <title id="t">เส้นเวลา Poll SCM กับ GitHub webhook ผ่าน smee.io</title><desc id="d">Jenkins poll GitHub ตามเวลา ส่วน GitHub webhook ส่ง event ผ่าน smee.io relay เข้า Jenkins ที่อยู่หลัง NAT</desc>
  <defs><marker id="a7b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#147d92"/></marker><marker id="a7g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#169b72"/></marker></defs>
  <rect width="1200" height="460" rx="28" fill="#f7fbfc"/>
  <g font-family="Leelawadee UI,Segoe UI,sans-serif">
    <text x="70" y="90" font-size="29" font-weight="800" fill="#125b8c">Poll SCM — Jenkins ถาม GitHub เป็นรอบ</text><line x1="90" y1="150" x2="1110" y2="150" stroke="#147d92" stroke-width="6" marker-end="url(#a7b)"/>
    <g fill="#e8f4ff" stroke="#1676b8" stroke-width="3"><circle cx="250" cy="150" r="22"/><circle cx="480" cy="150" r="22"/><circle cx="710" cy="150" r="22"/><circle cx="940" cy="150" r="22"/></g>
    <g font-size="18" fill="#527080" text-anchor="middle"><text x="250" y="195">ถาม: ไม่เปลี่ยน</text><text x="480" y="195">ถาม: ไม่เปลี่ยน</text><text x="710" y="195">push แล้ว</text><text x="940" y="195">รอบถัดไปจึง build</text></g>
    <path d="M710 115v70" stroke="#cf4b45" stroke-width="5" stroke-dasharray="7 6"/><text x="710" y="105" text-anchor="middle" font-size="19" font-weight="700" fill="#a3322d">commit</text>
    <text x="70" y="275" font-size="29" font-weight="800" fill="#087457">Webhook — GitHub แจ้ง event ผ่าน relay เข้าหลัง NAT</text>
    <rect x="105" y="310" width="220" height="76" rx="18" fill="#e8f4ff" stroke="#1676b8" stroke-width="4"/><text x="215" y="342" text-anchor="middle" font-size="22" font-weight="800" fill="#125b8c">GitHub.com</text><text x="215" y="369" text-anchor="middle" font-size="17" fill="#527080">push webhook</text>
    <path d="M325 348H435" stroke="#169b72" stroke-width="6" marker-end="url(#a7g)"/><text x="380" y="330" text-anchor="middle" font-size="16" fill="#527080">POST</text>
    <rect x="450" y="310" width="220" height="76" rx="18" fill="#fff7df" stroke="#d99013" stroke-width="4"/><text x="560" y="342" text-anchor="middle" font-size="22" font-weight="800" fill="#a36200">smee.io relay</text><text x="560" y="369" text-anchor="middle" font-size="17" fill="#527080">public channel</text>
    <path d="M670 348H780" stroke="#169b72" stroke-width="6" marker-end="url(#a7g)"/><text x="725" y="330" text-anchor="middle" font-size="16" fill="#527080">SSE → POST</text>
    <rect x="795" y="310" width="290" height="76" rx="18" fill="#e9fbf6" stroke="#169b72" stroke-width="4"/><text x="940" y="342" text-anchor="middle" font-size="22" font-weight="800" fill="#087457">Jenkins GWT → build</text><text x="940" y="369" text-anchor="middle" font-size="17" fill="#527080">token + main filter</text>
    <text x="600" y="430" text-anchor="middle" font-size="22" font-weight="700" fill="#173d52">Poll มี request ตอนเงียบ • Webhook ส่งเฉพาเมื่อเกิด event • filter กัน ping</text>
  </g>
