<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-labelledby="dt-d17 dd-d17">
<title id="dt-d17">ลำดับการทำงานของ LAB 1</title><desc id="dd-d17">หกขั้นตอนตั้งแต่สร้างคอนเทนเนอร์ ตรวจสถานะ เข้าใช้งาน ตั้งค่า สร้างงานแรก จนถึงการยืนยันสถานะปิดท้าย</desc>
