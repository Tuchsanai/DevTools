<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
  <title id="t">สถาปัตยกรรม Jenkins</title><desc id="d">controller ส่ง job ให้ executor สร้าง build ใน workspace และเก็บสถานะที่ jenkins home</desc>
