    <rect x="550" y="252" width="210" height="72" rx="14" fill="#fff" stroke="#67bc9f" stroke-width="3"/><text x="655" y="282" text-anchor="middle" font-size="24" fill="#173d52">workspace</text><text x="655" y="309" text-anchor="middle" font-size="18" fill="#527080">checkout • test • build</text>
