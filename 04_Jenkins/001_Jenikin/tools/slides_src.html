ตอน 1␟normal␟CI · นิยาม␟Continuous Integration คืออะไร␟<div class="quote" style="font-size:26px">สมาชิกทุกคนรวมงานเข้าสาขาหลักบ่อยครั้ง และ<b>ทุกการรวมถูก build และทดสอบโดยอัตโนมัติทันที</b></div><div class="grid3" style="margin-top:22px"><div class="card"><h3>วัตถุประสงค์</h3><p>ลดขนาดของการรวมแต่ละครั้ง และทำให้ข้อผิดพลาดถูกพบใกล้เวลาที่เขียนโค้ดที่สุด</p></div><div class="card g"><h3>เงื่อนไขที่ต้องมี</h3><p>repository เดียว • build ด้วยคำสั่งเดียว • ชุดทดสอบอัตโนมัติ • เครื่องกลางที่รันทุก commit • commit เข้า main ทุกวัน • รักษาให้ build เร็ว</p></div><div class="card a"><h3>ผลลัพธ์ที่ได้</h3><p>สถานะเขียวหรือแดงของทุก commit และ artifact ที่ผ่านการทดสอบแล้ว</p></div></div><div class="caption" style="text-align:left;margin-top:14px">อ้างอิง: Martin Fowler, “Continuous Integration” (2006) — พัฒนามาจาก practice หนึ่งของ Extreme Programming (Kent Beck, 1999)</div>
ตอน 1␟normal␟CI · Workflow␟หนึ่งรอบของ CI ทำอะไรบ้าง และผลกลับไปที่ใคร␟<div class="diagram" data-inline-svg="slides_assets/d16_ci_workflow.svg"></div>
ตอน 1␟normal␟CI · แก้ปัญหาอย่างไร␟ลดขนาดของการรวม แล้วให้เครื่องตรวจแทนความจำ␟<div class="diagram" style="height:404px" data-inline-svg="slides_assets/d12_integration_hell.svg"></div><div class="callout good" style="margin-top:12px"><strong>ตอบสถานการณ์ที่ 1 และ 2</strong> รวมเข้า main อย่างน้อยวันละครั้ง conflict จึงเล็กจนแก้ได้ทันที • build และ test ทำงานเองทุก commit จึงไม่มีของที่ยังไม่ได้ทดสอบหลุดออกไป</div>
ตอน 1␟normal␟ช่องว่างที่เหลือ␟มี CI แล้ว ยังเหลือปัญหาอะไรอยู่␟<div class="grid3"><div class="card g"><h3>สิ่งที่ CI ให้แล้ว</h3><p>artifact ที่ผ่านการทดสอบ พร้อมหลักฐานว่ามาจาก commit ใด</p></div><div class="card r"><h3>สิ่งที่ยังขาด</h3><p>ขั้นตอนนำ artifact นั้นขึ้นปลายทาง ยังทำด้วยมือและอยู่ในความทรงจำของคน</p></div><div class="card r"><h3>ผลที่ตามมา</h3><p>ของพร้อมปล่อยตั้งแต่เช้า แต่กว่าจะถึงผู้ใช้ยังต้องรอคิวและรอคน</p></div></div><div class="big" style="margin-top:26px">CI ทำให้ “ของพร้อม” แต่ยังไม่ได้ทำให้ “ของถึงผู้ใช้”<small>ช่องว่างนี้คือเหตุผลที่ต้องมี Continuous Delivery</small></div>
ตอน 1␟normal␟CD · นิยาม␟Continuous Delivery และ Continuous Deployment␟<div class="grid2"><div class="card g"><h3>Continuous Delivery</h3><p>ทุก build ที่ผ่าน CI อยู่ในสภาพที่ปล่อยขึ้น production ได้ทันที</p><p><b>อัตโนมัติถึง:</b> พร้อมติดตั้ง</p><p><b>คนยังตัดสินใจ:</b> จะปล่อยเมื่อใด</p></div><div class="card a"><h3>Continuous Deployment</h3><p>เมื่อผ่านเกณฑ์ตรวจครบถ้วน ระบบนำขึ้น production เองโดยไม่มีคนกด</p><p><b>อัตโนมัติถึง:</b> ผู้ใช้งานจริง</p><p><b>คนยังตัดสินใจ:</b> เฉพาะเกณฑ์ที่ใช้ตรวจ</p></div></div><div class="callout warn" style="margin-top:18px"><strong>หลักการสำคัญ — build once, deploy many</strong> artifact ถูกสร้างเพียงครั้งเดียวจาก commit หนึ่ง แล้วใช้ตัวเดิมทุกปลายทาง หาก build ใหม่ทุกปลายทาง สิ่งที่ทดสอบกับสิ่งที่ติดตั้งจะไม่ใช่ของชิ้นเดียวกัน</div><div class="caption" style="text-align:left;margin-top:10px">อ้างอิง: Jez Humble &amp; David Farley, “Continuous Delivery” (2010)</div>
ตอน 1␟normal␟CD · แก้ปัญหาอย่างไร␟เปลี่ยนการส่งมอบด้วยมือ ให้เป็นขั้นตอนที่ทำซ้ำได้␟<div class="diagram" style="height:368px" data-inline-svg="slides_assets/d11_manual_vs_auto.svg"></div><div class="callout good" style="margin-top:12px"><strong>ตอบสถานการณ์ที่ 3</strong> ขั้นตอนติดตั้งถูกเขียนเป็นโค้ดที่ review ได้ ทีม Dev และ Ops จึงอ่านสิ่งเดียวกัน และทุกครั้งที่ปล่อยของมี build number กำกับ</div><div class="caption" style="text-align:left;margin-top:8px">ตัวชี้วัดที่นิยมใช้ประเมินผลของ CD — DORA สี่ตัว: Deployment Frequency • Lead Time for Changes • Change Failure Rate • Time to Restore (Accelerate, 2018)</div>
ตอน 1␟normal␟CI/CD Workflow␟รวมเป็นสายพานเดียว เจ็ดขั้นจาก commit ถึงผู้ใช้␟<div class="diagram" style="height:374px" data-inline-svg="slides_assets/d1_cicd_pipeline.svg"></div><div class="chips" style="margin-top:12px"><span class="chip">ขั้น 1–2 · คนทำ</span><span class="chip g">ขั้น 3–5 · CI — ยืนยันว่าโค้ดยังใช้ได้</span><span class="chip a">ขั้น 6–7 · CD — ส่งของถึงผู้ใช้</span><span class="chip">ลำดับบังคับ · Build → Test → Push</span></div>
ตอน 1␟normal␟เครื่องมือ␟อะไรทำให้สายพานนี้เดินได้จริง␟<div class="grid2"><div class="card"><h3>สิ่งที่ระบบต้องทำได้</h3><p>รับเหตุการณ์จากการ push • เรียงลำดับงานและหยุดเมื่อขั้นใดล้มเหลว • รันในสภาพแวดล้อมเดิมทุกครั้ง • เก็บความลับแยกจากโค้ด • เก็บ log และประวัติทุก build • ต่อกับ Git, Docker และ registry ได้</p></div><div class="card g"><h3>เหตุผลที่บทเรียนนี้เลือก Jenkins</h3><p>เป็นซอฟต์แวร์เสรีที่ติดตั้งบนเครื่องของเราเองได้ ไม่ผูกกับผู้ให้บริการรายใด • มี plugin จำนวนมากสำหรับต่อกับเครื่องมืออื่น • รันเป็นคอนเทนเนอร์ได้ จึงทดลองซ้ำและล้างทิ้งได้</p></div></div><div class="grid4" style="margin-top:20px"><div class="card metric"><strong>Git</strong><span>เก็บโค้ด • จุดกำเนิดเหตุการณ์</span></div><div class="card metric g"><strong>Jenkins</strong><span>สั่งงานตามลำดับ • เก็บหลักฐาน</span></div><div class="card metric a"><strong>Docker</strong><span>build และ run ให้เหมือนกันทุกเครื่อง</span></div><div class="card metric"><strong>Registry</strong><span>เก็บ artifact ที่ผ่านการทดสอบ</span></div></div>
ตอน 2␟section␟2␟Jenkins คืออะไร<br>และทำงานอย่างไร␟ตอนที่แล้วสรุปว่าเครื่องมือต้องทำอะไรได้บ้าง ตอนนี้จึงดูว่า Jenkins คืออะไร และภายในเดินอย่างไร
ตอน 2␟normal␟DIAGRAM D2␟Jenkins ทำงานอย่างไร — จาก Developer ถึงการส่งมอบ␟<div class="diagram" data-inline-svg="slides_assets/d2_jenkins_position.svg"></div>
ตอน 2␟normal␟บทบาทของ Jenkins␟Automation / Orchestration Server ในสาย CI/CD␟<div class="grid4"><div class="card"><h3>1 · รับ trigger</h3><p>เหตุการณ์จากผู้ใช้ ตารางเวลา หรือ webhook จากระบบภายนอก</p></div><div class="card g"><h3>2 · ประสานลำดับขั้น</h3><p>กำหนดว่าขั้นใดทำก่อน–หลัง และหยุดทั้งชุดเมื่อขั้นใดล้มเหลว</p></div><div class="card a"><h3>3 · เรียกใช้เครื่องมือ</h3><p>สั่ง Git, ตัวรันทดสอบ, Docker และ registry ผ่านคำสั่งมาตรฐาน</p></div><div class="card"><h3>4 · บันทึกหลักฐาน</h3><p>console output สถานะของแต่ละขั้น และประวัติย้อนหลังของทุก build</p></div></div><div class="callout" style="margin-top:22px"><strong>ขอบเขตความรับผิดชอบ</strong> Jenkins ไม่ได้ทำหน้าที่แทนเครื่องมือเหล่านั้น — ไม่ใช่ระบบเก็บโค้ด ไม่ใช่ Docker daemon และไม่ใช่กรอบการทดสอบ แต่เป็นผู้เรียกใช้เครื่องมือแต่ละตัวตามลำดับ แล้วรวบรวมผลลัพธ์ไว้ที่เดียว</div><div class="caption" style="text-align:left;margin-top:10px">ความเข้าใจข้อนี้ทำให้ LAB 3–6 อ่านง่ายขึ้น เพราะจะเห็นชัดว่าขั้นตอนใดเป็นงานของ Jenkins และขั้นตอนใดเป็นงานของเครื่องมืออื่น</div>
ตอน 2␟normal␟ลำดับการทำงาน␟หนึ่ง build เดินผ่านห้าขั้นตอนนี้เสมอ␟<ol class="steps"><li><b>รับเหตุการณ์</b> — ผู้ใช้กด Build Now, ถึงรอบตรวจตามเวลา หรือมี webhook เข้ามา</li><li><b>ระบุ job ที่ผูกกับเหตุการณ์</b> แล้วอ่านนิยามงานจาก config หรือ Jenkinsfile</li><li><b>เข้าคิวและจองทรัพยากร</b> — รอ executor ว่าง แล้วจัดสรร workspace ให้ build นั้น</li><li><b>ดำเนินการทีละขั้น</b> — ขั้นใดคืนค่า exit code ไม่เท่ากับ 0 ระบบจะหยุด build ทันที</li><li><b>บันทึกผล</b> — เก็บ console output สถานะแต่ละขั้น และหมายเลข build ลงใน jenkins_home</li></ol><div class="callout good" style="margin-top:16px"><strong>ทั้งหกแล็บเปลี่ยนเพียงสองจุด</strong> คือ “เหตุการณ์ในขั้นที่ 1” และ “นิยามงานในขั้นที่ 2” — ขั้นตอนที่เหลือ Jenkins ดำเนินการเหมือนเดิมทุกครั้ง</div>

ตอน 2␟normal␟คำศัพท์␟สี่คำที่ใช้ตลอดภาคปฏิบัติ␟<div class="grid2"><div class="card"><h3>job</h3><p>นิยามงานหนึ่งชุดที่ Jenkins เก็บไว้ เช่น <b>first-freestyle</b> — แก้ไขได้โดยไม่กระทบผลการรันครั้งก่อน</p></div><div class="card g"><h3>build</h3><p>การดำเนินงานตามนิยามนั้นครั้งที่ N เช่น <b>#7</b> — แต่ละครั้งมีสาเหตุการเริ่มและผลลัพธ์ของตนเอง</p></div><div class="card a"><h3>workspace</h3><p>ไดเรกทอรีทำงานที่ Jenkins จัดสรรให้ build นั้นใช้ระหว่างดำเนินงาน</p></div><div class="card"><h3>executor</h3><p>ช่องประมวลผลที่รับ build ไปทำงาน — เมื่อเต็มทุกช่อง build ถัดไปต้องรอคิว</p></div></div><div class="callout" style="margin-top:22px"><strong>ความสัมพันธ์</strong> job หนึ่งรายการมีได้หลาย build • หนึ่ง build ครอบครอง executor หนึ่งช่องและ workspace หนึ่งไดเรกทอรี จนกว่าจะดำเนินการเสร็จ</div>

ตอน 3 · LAB 1␟normal␟LAB 1 • สภาพตั้งต้น (1/2)␟เตรียมคอนเทนเนอร์ของรายวิชาแล้วเข้าใช้งาน␟<div class="flow"><b>LAB 1</b><i>1 ยก Jenkins</i><i>2 ตรวจสถานะ</i><i>3 ปลดล็อก</i><i>4 Wizard</i><i>5 job แรก</i><i>6 ปิดท้าย</i></div><div class="callout"><strong>0.1 · สร้างคอนเทนเนอร์สภาพแวดล้อมของรายวิชา</strong> ต้องมี Docker, Git, อินเทอร์เน็ต และพื้นที่ว่างอย่างน้อย 5 GB</div><pre class="code sm" data-lang="bash" style="margin-top:8px">docker run -dit --name devtools-jenkins --privileged \&#10;  --tmpfs /run -v jenkins-dind:/var/lib/docker \&#10;  -p 2222:22 -p 8080:8080 -p 8000:8000 \&#10;  tuchsanai/devtools:2569_1</pre><div class="callout" style="margin-top:12px"><strong>0.2 · ตรวจว่าคอนเทนเนอร์ทำงานแล้วจึงเข้าใช้งาน</strong> รหัสผ่าน SSH คือ <span class="inline">passwd</span> — <b>ทุกการทดลองของแล็บนี้รันใน shell ของ <span class="inline">devtools-jenkins</span></b></div><pre class="code sm" data-lang="bash" style="margin-top:8px">docker ps&#10;ssh root@localhost -p 2222</pre><div class="callout good" style="margin-top:12px"><strong>✅ สิ่งที่ต้องเห็น</strong> แถวของ image <span class="inline">tuchsanai/devtools:2569_1</span> ชื่อ <span class="inline">devtools-jenkins</span> และ prompt <span class="inline">root@...:~#</span></div>
ตอน 3 · LAB 1␟normal␟LAB 1 • สภาพตั้งต้น (2/2)␟ดาวน์โหลดชุดไฟล์ของรายวิชาไว้ใน devtools␟<div class="flow"><b>LAB 1</b><i>1 ยก Jenkins</i><i>2 ตรวจสถานะ</i><i>3 ปลดล็อก</i><i>4 Wizard</i><i>5 job แรก</i><i>6 ปิดท้าย</i></div><div class="callout"><strong>0.3 · ดาวน์โหลดชุดไฟล์ของรายวิชา</strong> ไฟล์ชุดนี้ใช้ในการทดลองที่ 6 เพื่อรันสคริปต์ตรวจผลปิดท้าย</div><pre class="code sm" data-lang="bash" style="margin-top:8px">if [ -d &quot;$HOME/DevTools/.git&quot; ]; then&#10;  git -C &quot;$HOME/DevTools&quot; pull&#10;else&#10;  git clone --depth 1 https://github.com/Tuchsanai/DevTools.git &quot;$HOME/DevTools&quot;&#10;fi&#10;export COURSE_ROOT=&quot;$HOME/DevTools/04_Jenkins/001_Jenikin&quot;&#10;echo &#39;export COURSE_ROOT=&quot;$HOME/DevTools/04_Jenkins/001_Jenikin&quot;&#39; &gt; /etc/profile.d/course.sh</pre><div class="callout good" style="margin-top:12px"><strong>✅ สิ่งที่ต้องเห็น (รันครั้งแรก)</strong> ถ้ามี <span class="inline">~/DevTools</span> อยู่แล้วจะเห็นผลของ <span class="inline">git pull</span> เช่น <span class="inline">Already up to date.</span> แทน</div><pre class="code sm" data-lang="text" style="margin-top:8px">Cloning into &#39;/root/DevTools&#39;...</pre>
ตอน 3 · LAB 1␟normal␟LAB 1 • การทดลองที่ 1␟Start: สร้าง network และคอนเทนเนอร์ Jenkins␟<div class="flow"><b>LAB 1</b><i class="on">1 ยก Jenkins</i><i>2 ตรวจสถานะ</i><i>3 ปลดล็อก</i><i>4 Wizard</i><i>5 job แรก</i><i>6 ปิดท้าย</i></div><div class="callout"><strong>ทำอะไร</strong> สร้าง Docker network ของรายวิชา แล้วยกคอนเทนเนอร์ Jenkins ขึ้นบน network นั้น</div><pre class="code sm" data-lang="bash" style="margin-top:8px">docker network create cicd-net&#10;docker run -d --name jenkins --network cicd-net --restart unless-stopped \&#10;  -p 8080:8080 -v jenkins_home:/var/jenkins_home jenkins/jenkins:lts-jdk21</pre><table class="table" style="margin-top:12px"><tr><th>cicd-net</th><td>เครือข่ายที่คอนเทนเนอร์ของแล็บทุกตัวใช้ร่วมกันตั้งแต่ LAB 3 จึงสร้างไว้ตั้งแต่ต้น</td></tr><tr><th>-p 8080:8080</th><td>เปิดหน้าเว็บของ Jenkins ออกมายังเครื่องหลัก</td></tr><tr><th>-v jenkins_home:…</th><td>เก็บสถานะไว้นอกคอนเทนเนอร์ · <b>--restart unless-stopped</b> ทำให้กลับมาทำงานเองเมื่อ Docker เริ่มใหม่</td></tr></table><div class="callout good" style="margin-top:12px"><strong>✅ สิ่งที่ต้องเห็น</strong> คำสั่งแรกคืนรหัส network และคำสั่งที่สองคืนรหัสคอนเทนเนอร์ โดยไม่มีข้อความ error — 📝 ครั้งแรกต้องดาวน์โหลด image ให้รอจนคืน prompt ก่อนไปขั้นถัดไป</div>
ตอน 3 · LAB 1␟normal␟LAB 1 • การทดลองที่ 2␟Verify: ตรวจว่าคอนเทนเนอร์ทำงานสำเร็จ␟<div class="flow"><b>LAB 1</b><i>1 ยก Jenkins</i><i class="on">2 ตรวจสถานะ</i><i>3 ปลดล็อก</i><i>4 Wizard</i><i>5 job แรก</i><i>6 ปิดท้าย</i></div><div class="callout"><strong>ทำไมต้องอ่าน log ด้วย</strong> สถานะ <span class="inline">Up</span> บอกเพียงว่าคอนเทนเนอร์ทำงานอยู่ ยังไม่ได้แปลว่า Jenkins พร้อมให้บริการ — เปิดหน้าเว็บเร็วเกินไปจะได้ connection refused</div><pre class="code sm" data-lang="bash" style="margin-top:8px">docker ps&#10;docker logs jenkins</pre><div class="callout good" style="margin-top:12px"><strong>✅ สิ่งที่ต้องเห็น</strong> ผลของ <span class="inline">docker ps</span> มีแถวคอนเทนเนอร์ <span class="inline">jenkins</span></div><pre class="code sm" data-lang="text" style="margin-top:8px">CONTAINER ID   IMAGE                       ...   PORTS                    NAMES&#10;...            jenkins/jenkins:lts-jdk21   ...   0.0.0.0:8080-&gt;8080/tcp   jenkins</pre><div class="caption" style="margin-top:8px">และบรรทัดปิดท้ายของ log จาก <span class="inline">docker logs jenkins</span> ต้องมีข้อความ</div><pre class="code sm" data-lang="text" style="margin-top:4px">Jenkins is fully up and running</pre>
ตอน 3 · LAB 1␟normal␟LAB 1 • การทดลองที่ 3␟Access: อ่านรหัสปลดล็อกแล้วเปิดหน้าเว็บ␟<div class="flow"><b>LAB 1</b><i>1 ยก Jenkins</i><i>2 ตรวจสถานะ</i><i class="on">3 ปลดล็อก</i><i>4 Wizard</i><i>5 job แรก</i><i>6 ปิดท้าย</i></div><pre class="code sm" data-lang="bash">docker exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword</pre><div class="shotwrap"><div><div class="shot" style="height:417px"><img data-asset="slides_assets/lab1_s07_unlock.png" data-max-width="1360" alt="หน้า Unlock Jenkins พร้อมเครื่องหมายลำดับ"></div><div class="caption">① ช่อง Administrator password ② ปุ่ม Continue</div></div><ul class="look"><li><b>ทำอะไร</b> Jenkins สุ่มรหัสเก็บเป็นไฟล์ <b>ภายในคอนเทนเนอร์</b> จึงใช้ <span class="inline">docker exec</span> อ่านออกมา แล้วเปิด <span class="inline">http://localhost:8080</span> บนเครื่องหลัก วางรหัสแล้วกด Continue</li><li>✅ <b>สิ่งที่ต้องเห็น:</b> สตริงตัวอักษรและตัวเลข 32 ตัวหนึ่งบรรทัด โดยไม่มีข้อความอื่นนำหน้า (ค่าของแต่ละเครื่องจะต่างกัน)</li><li>📝 รหัสชุดนี้ใช้เฉพาะการปลดล็อกครั้งแรก หลังสร้างผู้ดูแลในการทดลองที่ 4 ให้เข้าสู่ระบบด้วย <span class="inline">admin</span> / <span class="inline">admin2569</span> เสมอ</li></ul></div>

ตอน 4␟normal␟stages + steps␟ชื่อ stage เล่า flow • steps ลงมือจริง␟<div class="split rev"><pre class="code" data-lang="groovy">stages {&#10;  stage('Checkout') { steps { echo 'Checkout (simulated)' } }&#10;  stage('Build') { steps { echo 'Build' } }&#10;  stage('Test') { steps { echo 'Tests passed' } }&#10;}</pre><ul class="bul"><li>stage = checkpoint ที่อ่านผลได้</li><li>step = คำสั่งที่รันจริง</li><li>Pipeline Graph สะท้อนโครงนี้ตรง ๆ</li><li>stage แดง = รู้ทันทีว่าพังช่วงไหน</li></ul></div>
ตอน 4␟normal␟environment + parameters␟ค่าที่ระบบให้ กับค่าที่ผู้กด Build เลือก␟<div class="grid2"><pre class="code" data-lang="groovy">environment { LAB_NAME = 'Declarative Pipeline' }&#10;echo "${env.LAB_NAME}: ${env.JOB_NAME} #${env.BUILD_NUMBER}"</pre><pre class="code" data-lang="groovy">parameters {&#10;  string(name: 'APP_ENV', defaultValue: 'dev', description: 'Environment to deploy')&#10;}&#10;echo "APP_ENV=${params.APP_ENV}"</pre></div><div class="callout warn" style="margin-top:20px"><strong>ต้อง Build Now หนึ่งครั้งหลัง Save</strong> Jenkins จึงจะอ่านบล็อก <span class="inline">parameters</span> แล้วขึ้นเมนู <b>Build with Parameters</b></div>
ตอน 4␟normal␟when + post␟เงื่อนไขระหว่างทาง • งานปิดท้ายทุกผลลัพธ์␟<div class="grid2"><pre class="code" data-lang="groovy">stage('Deploy') {&#10;  when { expression { params.APP_ENV == 'prod' } }&#10;  steps { echo "Deploying to ${params.APP_ENV}" }&#10;}</pre><pre class="code" data-lang="groovy">post {&#10;  always { echo "Finished ${env.JOB_NAME} #${env.BUILD_NUMBER}" }&#10;  success { echo 'Pipeline succeeded' }&#10;}</pre></div><div class="callout" style="margin-top:20px"><strong>skipped ≠ failed</strong> stage ที่ <span class="inline">when</span> ไม่ผ่านจะถูกข้าม และ build ยังเป็น SUCCESS</div>

ตอน 4 · LAB 2␟normal␟LAB 2 • สคริปต์ฉบับเต็ม␟ปลายทางของการทดลองที่ 1–6 — ตรงกับ Jenkinsfile ของแล็บ␟<pre class="code sm" data-lang="groovy" data-canonical="first-pipeline">pipeline {&#10;  agent any&#10;  parameters { string(name: 'APP_ENV', defaultValue: 'dev', description: 'Environment to deploy') }&#10;  environment { LAB_NAME = 'Declarative Pipeline' }&#10;  stages {&#10;    stage('Checkout') { steps { echo 'Checkout (simulated)'; sleep 1 } }&#10;    stage('Build') { steps { echo "Building ${env.LAB_NAME}: ${env.JOB_NAME} #${env.BUILD_NUMBER}"; sleep 1 } }&#10;    stage('Test') { steps { echo 'Tests passed'; sleep 1 } }&#10;    stage('Deploy') { when { expression { params.APP_ENV == 'prod' } }; steps { echo "Deploying to ${params.APP_ENV}"; sleep 1 } }&#10;  }&#10;  post { always { echo "Finished ${env.JOB_NAME} #${env.BUILD_NUMBER}" }; success { echo 'Pipeline succeeded' } }&#10;}</pre>

ตอน 5.1 · LAB 3␟normal␟LAB 3 • สภาพตั้งต้น␟ตรวจสถานะจบ LAB 2 และความพร้อมของบัญชี Docker Hub␟<div class="flow"><b>LAB 3</b><i>1 ไม่มี CLI</i><i>2 build image</i><i>3 recreate</i><i>4 credential</i><i>5 สร้าง job</i><i>6 Build Now</i><i>7 console</i><i>8 Hub tags</i></div><div class="callout"><strong>ต้องมีก่อนเริ่ม</strong> devtools ทำงานอยู่ · <span class="inline">cicd-net</span> · <span class="inline">jenkins</span> · <span class="inline">jenkins_home</span> · job จาก LAB 1–2</div><pre class="code sm" data-lang="bash" style="margin-top:12px">docker ps&#10;echo '&lt;DOCKER_TOKEN&gt;' | docker login -u '&lt;DOCKER_USER&gt;' --password-stdin&#10;docker logout&#10;curl -fsS -o /dev/null -w 'ci-demo: HTTP %{http_code}\n' 'https://hub.docker.com/r/&lt;DOCKER_USER&gt;/ci-demo'&#10;curl -fsS -o /dev/null -w 'cicd-webapp: HTTP %{http_code}\n' 'https://hub.docker.com/r/&lt;DOCKER_USER&gt;/cicd-webapp'</pre><div style="margin-top:12px" class="callout good"><strong>✅ สิ่งที่ต้องเห็น</strong> repository ทั้งสองต้องเป็น Public จึงตอบ HTTP 200 — ยังไม่มีสถานะ LAB 2 ให้กู้ด้วย <span class="inline">bash tools/bootstrap/up_to_lab2.sh</span></div><pre class="code sm" data-lang="text" style="margin-top:12px">jenkins    Up ...&#10;Login Succeeded&#10;Removing login credentials for https://index.docker.io/v1/&#10;ci-demo: HTTP 200&#10;cicd-webapp: HTTP 200</pre>
ตอน 5.1 · LAB 3␟normal␟LAB 3 • การทดลองที่ 1␟Jenkins image เดิมมี Docker CLI หรือไม่?␟<div class="flow"><b>LAB 3</b><i class="on">1 ไม่มี CLI</i><i>2 build image</i><i>3 recreate</i><i>4 credential</i><i>5 สร้าง job</i><i>6 Build Now</i><i>7 console</i><i>8 Hub tags</i></div><div class="callout"><strong>คำถาม</strong> Jenkins container จาก LAB 2 เรียกคำสั่ง Docker ได้แล้วหรือยัง? การตรวจ capability ก่อนเปลี่ยน image ทำให้แยกได้ชัดว่าปัญหาเกิดจากการไม่มี CLI ไม่ใช่การเชื่อมต่อ socket</div><pre class="code sm" data-lang="bash" style="margin-top:12px">docker exec jenkins sh -c 'docker version'&#10;printf 'exit=%s\n' &quot;$?&quot;</pre><div style="margin-top:12px" class="callout good"><strong>✅ สิ่งที่ต้องเห็น</strong></div><pre class="code sm" data-lang="text" style="margin-top:12px">sh: 1: docker: not found&#10;exit=127</pre><div style="margin-top:12px" class="callout"><strong>📝 บันทึก</strong> ผลลัพธ์นี้เป็นสถานะที่คาดหมายของ Jenkins image เดิม การ mount socket เพียงอย่างเดียวไม่ทำให้คำสั่ง <span class="inline">docker</span> ปรากฏใน container</div>
ตอน 5.1 · LAB 3␟normal␟LAB 3 • การทดลองที่ 2␟สร้าง image jenkins-docker:2569 ที่มี Docker CLI␟<div class="flow"><b>LAB 3</b><i>1 ไม่มี CLI</i><i class="on">2 build image</i><i>3 recreate</i><i>4 credential</i><i>5 สร้าง job</i><i>6 Build Now</i><i>7 console</i><i>8 Hub tags</i></div><div class="callout"><strong>คำถาม</strong> image ใหม่มี Docker CLI ตามที่ <span class="inline">Dockerfile.jenkins</span> กำหนดหรือไม่? การสร้าง image แยกทำให้ dependency ของ Jenkins ทำซ้ำได้ และไม่แก้ไข container ที่กำลังทำงานโดยตรง</div><pre class="code sm" data-lang="bash" style="margin-top:12px">cd &quot;$COURSE_ROOT&quot;&#10;docker build -t jenkins-docker:2569 -f 003_LAB_Docker_Build_Push/Dockerfile.jenkins 003_LAB_Docker_Build_Push&#10;docker run --rm --entrypoint docker jenkins-docker:2569 --version</pre><div style="margin-top:12px" class="callout good"><strong>✅ สิ่งที่ต้องเห็น</strong></div><pre class="code sm" data-lang="text" style="margin-top:12px">Docker version 29.7.2, build a7dcaa6</pre><div style="margin-top:12px" class="callout"><strong>ต่อไป</strong> image ใหม่พร้อมใช้งานแล้ว แต่ Jenkins service ยังใช้ image เดิม ขั้นถัดไปจะเปลี่ยน container โดยคง persistent state ไว้</div>
ตอน 5.1 · LAB 3␟normal␟LAB 3 • การทดลองที่ 3␟เปลี่ยน image โดยรักษาสถานะใน jenkins_home เดิม␟<div class="flow"><b>LAB 3</b><i>1 ไม่มี CLI</i><i>2 build image</i><i class="on">3 recreate</i><i>4 credential</i><i>5 สร้าง job</i><i>6 Build Now</i><i>7 console</i><i>8 Hub tags</i></div><div class="callout"><strong>คำถาม</strong> เมื่อสร้าง Jenkins container ใหม่ด้วย <span class="inline">jenkins_home</span> เดิม job จาก LAB 2 ยังอยู่หรือไม่? การ recreate แยก lifecycle ของ process ออกจากข้อมูลถาวร พร้อมเพิ่ม Docker socket ให้ container ใหม่ · service ใช้เวลาเริ่มประมาณ 20–40 วินาที</div><pre class="code sm" data-lang="bash" style="margin-top:12px">docker rm -f jenkins&#10;docker run -d --name jenkins --restart unless-stopped --network cicd-net -p 8080:8080 -u root -e JAVA_OPTS=-Djenkins.install.runSetupWizard=false -v jenkins_home:/var/jenkins_home -v /var/run/docker.sock:/var/run/docker.sock jenkins-docker:2569&#10;sleep 20&#10;curl -fsS -u admin:admin2569 'http://localhost:8080/job/first-pipeline/api/json?tree=name'</pre><div style="margin-top:12px" class="callout good"><strong>✅ สิ่งที่ต้องเห็น</strong></div><pre class="code sm" data-lang="text" style="margin-top:12px">jenkins&#10;...&#10;{&quot;_class&quot;:&quot;org.jenkinsci.plugins.workflow.job.WorkflowJob&quot;,&quot;name&quot;:&quot;first-pipeline&quot;}</pre>

ตอน 5.1 · LAB 3␟normal␟LAB 3 • การทดลองที่ 4 (3/3)␟ตรวจ credential ด้วย UI automation␟<div class="flow"><b>LAB 3</b><i>1 ไม่มี CLI</i><i>2 build image</i><i>3 recreate</i><i class="on">4 credential</i><i>5 สร้าง job</i><i>6 Build Now</i><i>7 console</i><i>8 Hub tags</i></div><div class="callout"><strong>ทำอะไร</strong> ส่งค่าลับผ่าน environment ของ process เท่านั้น ห้ามบันทึกลงไฟล์</div><pre class="code sm" data-lang="bash" style="margin-top:12px">JENKINS_BASE_URL=http://localhost:8080 DOCKER_USER='&lt;DOCKER_USER&gt;' DOCKER_TOKEN='&lt;DOCKER_TOKEN&gt;' python3 tools/ui/lab3_credential.py</pre><div style="margin-top:12px" class="callout good"><strong>✅ สิ่งที่ต้องเห็น</strong></div><pre class="code sm" data-lang="text" style="margin-top:12px">[ui]... assert: credential id dockerhub is listed&#10;[ui]... PASS</pre><div style="margin-top:12px" class="callout"><strong>📝 บันทึก</strong> Jenkins masking ลดการเปิดเผยโดยไม่ตั้งใจเท่านั้น ห้ามพิมพ์ token, ใช้ <span class="inline">printenv</span>, archive Docker config หรือเก็บ credential เป็น artifact</div>

ตอน 5.3 · LAB 5␟normal␟LAB 5 • การทดลองที่ 6 (1/2)␟ยิง endpoint ด้วย curl เพื่อทดสอบ filter␟<div class="flow"><b>LAB 5</b><i>1 ตรวจสภาพ</i><i>2 ติดตั้ง GWT</i><i>3 smee channel</i><i>4 รัน relay</i><i>5 ตั้ง GWT</i><i class="on">6 curl ทดสอบ</i><i>7 Add webhook</i><i>8 restart</i><i>9 push จริง</i></div><pre class="code sm" data-lang="bash">curl -s -X POST 'http://localhost:8080/generic-webhook-trigger/invoke?token=cicd2569-hello'</pre><pre class="code sm" data-lang="json" style="margin-top:12px">{"jobs":{"hello-ci-pipeline":{"triggered":false,&#10;  "resolvedVariables":{"after":"","ref":""}}},"message":"Triggered jobs."}</pre><pre class="code sm" data-lang="bash" style="margin-top:12px">curl -s -X POST -H 'Content-Type: application/json' \&#10;  -d '{"ref":"refs/heads/main","after":"0000000000000000000000000000000000000000"}' \&#10;  'http://localhost:8080/generic-webhook-trigger/invoke?token=cicd2569-hello'</pre><pre class="code sm" data-lang="json" style="margin-top:12px">{"jobs":{"hello-ci-pipeline":{"triggered":true}},"message":"Triggered jobs."}</pre><div class="callout good" style="margin-top:12px"><strong>✅ อ่านที่ resolvedVariables</strong> request แรกไม่มี body ค่า <span class="inline">ref</span> และ <span class="inline">after</span> จึงว่าง ไม่ตรง <span class="inline">^refs/heads/main$</span> · request ที่สองใส่ <span class="inline">ref=refs/heads/main</span> ค่าจึงถูก resolve ครบและผ่าน filter</div>
ตอน 5.3 · LAB 5␟normal␟LAB 5 • การทดลองที่ 6 (2/2)␟จด settled baseline ก่อนไปสร้าง webhook␟<div class="flow"><b>LAB 5</b><i>1 ตรวจสภาพ</i><i>2 ติดตั้ง GWT</i><i>3 smee channel</i><i>4 รัน relay</i><i>5 ตั้ง GWT</i><i class="on">6 curl ทดสอบ</i><i>7 Add webhook</i><i>8 restart</i><i>9 push จริง</i></div><pre class="code sm" data-lang="bash">until curl -gfsS -u admin:admin2569 \&#10;  'http://localhost:8080/job/hello-ci-pipeline/lastBuild/api/json?tree=building' | grep -q '"building":false'&#10;do&#10;  sleep 1&#10;done</pre><pre class="code sm" data-lang="bash" style="margin-top:12px">LAB5_BEFORE_PING="$(curl -gfsS -u admin:admin2569 \&#10;  'http://localhost:8080/job/hello-ci-pipeline/lastBuild/api/json?tree=number' \&#10;  | python3 -c 'import json,sys; print(json.load(sys.stdin)["number"])')"&#10;printf 'before ping: %s\n' "$LAB5_BEFORE_PING"</pre><div class="callout good" style="margin-top:12px"><strong>✅ สิ่งที่ต้องเห็น</strong> shell พิมพ์ <span class="inline">before ping: &lt;N&gt;</span> — จดเลขนี้ไว้เป็น settled baseline · ห้ามข้ามขั้นนี้ และห้ามกด Build Now ระหว่างขั้น Add webhook/ping เพราะจะทำให้ delta เพี้ยน</div>
ตอน 5.3 · LAB 5␟normal␟LAB 5 • การทดลองที่ 7 (1/3)␟เพิ่ม GitHub webhook ชี้ไปที่ smee channel␟<div class="flow"><b>LAB 5</b><i>1 ตรวจสภาพ</i><i>2 ติดตั้ง GWT</i><i>3 smee channel</i><i>4 รัน relay</i><i>5 ตั้ง GWT</i><i>6 curl ทดสอบ</i><i class="on">7 Add webhook</i><i>8 restart</i><i>9 push จริง</i></div><div class="shotwrap"><div class="shot" style="height:359px"><img data-asset="slides_assets/lab5_s06_github_add_webhook.png" data-max-width="1360" alt="หน้า Add webhook ของ repository hello-ci"></div><ul class="look"><li><b>ตรวจก่อน</b> tab smee ยังเปิด และ <span class="inline">docker logs smee-hello</span> มี Connected</li><li><b>repository hello-ci</b> → Settings → Webhooks → Add webhook</li><li><b>กรอก</b> Payload URL=&lt;SMEE_HELLO_URL&gt; · Content type=application/json · Secret=ว่าง · เปิด SSL verification</li></ul></div><div class="caption">ภาพจำลอง — UI จริงอาจต่างเล็กน้อย · เลือก Just the push event และเปิด Active ก่อนกด Add webhook</div><div class="callout good" style="margin-top:12px"><strong>✅ ต้องเห็น</strong> hook ถูกสร้างแบบ push-only และ Active — GitHub จะส่ง ping ทันที</div><div class="callout warn" style="margin-top:10px"><strong>ทำไม Secret จึงเว้นว่าง</strong> smee-client ส่งต่อ payload แต่<b>ไม่มีตัวรับในเส้นทางนี้ที่ตรวจ</b> <span class="inline">X-Hub-Signature-256</span> ใส่ secret จึงสร้างความมั่นใจผิด · production ต้องใช้ endpoint ของตัวเองบน HTTPS ตรวจ signature จำกัด source และ rate</div>
ตอน 5.3 · LAB 5␟normal␟LAB 5 • การทดลองที่ 7 (2/3)␟ping มาถึงจริงไหม ดูจาก tab smee␟<div class="flow"><b>LAB 5</b><i>1 ตรวจสภาพ</i><i>2 ติดตั้ง GWT</i><i>3 smee channel</i><i>4 รัน relay</i><i>5 ตั้ง GWT</i><i>6 curl ทดสอบ</i><i class="on">7 Add webhook</i><i>8 restart</i><i>9 push จริง</i></div><div class="shotwrap"><div class="shot" style="height:377px"><img data-asset="slides_assets/lab5_s07_smee_ping.png" data-max-width="1360" alt="ping event ใน tab smee"></div><ul class="look"><li><b>กลับไปที่ tab smee</b> ที่เปิดค้างไว้ตั้งแต่การทดลองที่ 3</li><li><b>Recent Deliveries</b> ของ GitHub ใช้เป็นหมายเหตุเสริม ไม่ใช่หลักฐานบังคับ</li></ul></div><div class="caption">ping event ปรากฏใน tab ที่เปิดค้าง — channel และชื่อบัญชีถูก mask ตอน capture</div><div class="callout good" style="margin-top:12px"><strong>✅ ต้องเห็น</strong> GitHub ping delivery เป็น 2xx และ tab smee มี ping event · ping ไม่มี <span class="inline">ref=refs/heads/main</span> จึงผ่าน relay ได้แต่ filter จะไม่สร้าง build</div>
ตอน 5.3 · LAB 5␟normal␟LAB 5 • การทดลองที่ 7 (3/3)␟ping ต้องไม่ทำให้เลข build เพิ่ม␟<div class="flow"><b>LAB 5</b><i>1 ตรวจสภาพ</i><i>2 ติดตั้ง GWT</i><i>3 smee channel</i><i>4 รัน relay</i><i>5 ตั้ง GWT</i><i>6 curl ทดสอบ</i><i class="on">7 Add webhook</i><i>8 restart</i><i>9 push จริง</i></div><pre class="code sm" data-lang="bash">docker logs --tail 20 smee-hello&#10;LAB5_AFTER_PING="$(curl -gfsS -u admin:admin2569 \&#10;  'http://localhost:8080/job/hello-ci-pipeline/lastBuild/api/json?tree=number' \&#10;  | python3 -c 'import json,sys; print(json.load(sys.stdin)["number"])')"&#10;test "$LAB5_AFTER_PING" -eq "$LAB5_BEFORE_PING"&#10;printf 'ping delta: %s -&gt; %s (+0)\n' "$LAB5_BEFORE_PING" "$LAB5_AFTER_PING"</pre><div class="callout good" style="margin-top:12px"><strong>✅ Ping acceptance</strong></div><pre class="code sm" data-lang="text" style="margin-top:12px">GitHub ping delivery: 2xx&#10;smee tab: ping event appears&#10;Jenkins build number before ping = after ping</pre><div class="callout" style="margin-top:12px"><strong>อ่าน log ให้ตรงจุด</strong> <span class="inline">docker logs --tail 20 smee-hello</span> ต้องมีบรรทัด POST ไป target พร้อม status 200 หลังเวลา delivery ของ ping ส่วน payload ของ ping ไม่มี <span class="inline">ref=refs/heads/main</span> filter จึงไม่สร้าง build</div>
ตอน 5.3 · LAB 5␟normal␟LAB 5 • การทดลองที่ 8␟restart relay แล้วต้องกลับเข้า channel เดิม␟<div class="flow"><b>LAB 5</b><i>1 ตรวจสภาพ</i><i>2 ติดตั้ง GWT</i><i>3 smee channel</i><i>4 รัน relay</i><i>5 ตั้ง GWT</i><i>6 curl ทดสอบ</i><i>7 Add webhook</i><i class="on">8 restart</i><i>9 push จริง</i></div><pre class="code sm" data-lang="bash">docker restart smee-hello&#10;RELAY_STARTED_AT="$(docker inspect -f '{{.State.StartedAt}}' smee-hello)"&#10;docker inspect -f '{{.Config.Image}} {{.HostConfig.RestartPolicy.Name}} {{json .NetworkSettings.Networks}} {{json .Config.Cmd}}' smee-hello&#10;docker logs --since "$RELAY_STARTED_AT" smee-hello</pre><div class="callout good" style="margin-top:12px"><strong>✅ สิ่งที่ต้องเห็น</strong> pinned digest เดิม · restart policy <span class="inline">unless-stopped</span> · network <span class="inline">cicd-net</span> · URL/target เดิม และมี <span class="inline">Connected</span> หลังเวลา StartedAt</div><div class="callout warn" style="margin-top:12px"><strong>เหตุการณ์ระหว่าง disconnect จะไม่ replay</strong> จึงต้องรอให้เห็น Connected ก่อนทำ push probe ในการทดลองที่ 9</div>
ตอน 5.3 · LAB 5␟normal␟LAB 5 • การทดลองที่ 9 (1/5)␟จด baseline แล้ว push commit ใหม่หนึ่งครั้ง␟<div class="flow"><b>LAB 5</b><i>1 ตรวจสภาพ</i><i>2 ติดตั้ง GWT</i><i>3 smee channel</i><i>4 รัน relay</i><i>5 ตั้ง GWT</i><i>6 curl ทดสอบ</i><i>7 Add webhook</i><i>8 restart</i><i class="on">9 push จริง</i></div><pre class="code sm" data-lang="bash">LAB5_BEFORE_PUSH="$(curl -gfsS -u admin:admin2569 \&#10;  'http://localhost:8080/job/hello-ci-pipeline/lastBuild/api/json?tree=number' \&#10;  | python3 -c 'import json,sys; print(json.load(sys.stdin)["number"])')"&#10;printf 'before push: %s\n' "$LAB5_BEFORE_PUSH"</pre><pre class="code sm" data-lang="bash" style="margin-top:12px">cd "$HOME/hello-ci"&#10;git pull --ff-only origin main&#10;git config user.name Student&#10;git config user.email student@example.invalid&#10;printf '\n# Webhook probe %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" &gt;&gt; hello.sh&#10;printf 'GitHub webhook payload proof\n' &gt; webhook-proof.txt&#10;git add hello.sh webhook-proof.txt&#10;git commit -m 'Verify immediate GitHub webhook build'&#10;time git push origin main</pre><div class="callout good" style="margin-top:12px"><strong>✅ ต้องเห็น</strong> push สำเร็จ · credential กรอก Username=&lt;GITHUB_USER&gt; Password=&lt;GITHUB_TOKEN&gt; ที่ prompt เท่านั้น</div><div class="callout warn" style="margin-top:10px"><strong>ห้าม</strong> เขียน token ลงใน URL ของ remote และห้ามใช้ <span class="inline">git config credential.helper store</span> เพราะ secret จะค้างบนดิสก์</div>
ตอน 5.3 · LAB 5␟normal␟LAB 5 • การทดลองที่ 9 (2/5)␟พิสูจน์ว่า push หนึ่งครั้ง = build เพิ่มหนึ่ง␟<div class="flow"><b>LAB 5</b><i>1 ตรวจสภาพ</i><i>2 ติดตั้ง GWT</i><i>3 smee channel</i><i>4 รัน relay</i><i>5 ตั้ง GWT</i><i>6 curl ทดสอบ</i><i>7 Add webhook</i><i>8 restart</i><i class="on">9 push จริง</i></div><pre class="code sm" data-lang="bash">until curl -gfsS -u admin:admin2569 \&#10;  'http://localhost:8080/job/hello-ci-pipeline/lastBuild/api/json?tree=building' | grep -q '"building":false'&#10;do&#10;  sleep 1&#10;done&#10;LAB5_AFTER_PUSH="$(curl -gfsS -u admin:admin2569 \&#10;  'http://localhost:8080/job/hello-ci-pipeline/lastBuild/api/json?tree=number' \&#10;  | python3 -c 'import json,sys; print(json.load(sys.stdin)["number"])')"&#10;test "$LAB5_AFTER_PUSH" -eq "$((LAB5_BEFORE_PUSH + 1))"</pre><div class="callout good" style="margin-top:12px"><strong>✅ สิ่งที่ต้องเห็น</strong> คำสั่ง <span class="inline">test</span> ผ่านโดยไม่คืน error และ printf รายงาน delta เพียง +1 — push หนึ่งครั้งต้องเพิ่ม build เพียงหนึ่งรายการ</div><pre class="code sm" data-lang="text" style="margin-top:12px">push delta: &lt;N&gt; -&gt; &lt;N+1&gt; (+1)</pre>

ตอน 6 · LAB 6␟normal␟LAB 6 • การทดลองที่ 6 (3/3)␟พิสูจน์ว่า ping ไม่เพิ่มเลข build␟<div class="flow"><b>LAB 6</b><i>1 ตรวจสภาพ</i><i>2 สร้าง repo</i><i>3 push v1</i><i>4 smee ช่อง2</i><i>5 ตั้ง job</i><i class="on">6 webhook</i><i>7 เดินครบวง</i><i>8 isolation</i><i>9 push v2</i><i>10 Hub tags</i></div><pre class="code sm" data-lang="bash">(&#10;  cd &quot;$COURSE_ROOT&quot;&#10;  python3 tools/ui/lab6_github_repo.py --action hook&#10;)&#10;WEBAPP_AFTER_PING=&quot;$(curl -gfsS -u admin:admin2569 &#39;http://localhost:8080/job/webapp-deploy/lastBuild/api/json?tree=number&#39; | python3 -c &#39;import json,sys; print(json.load(sys.stdin)[&quot;number&quot;])&#39;)&quot;&#10;test &quot;$WEBAPP_AFTER_PING&quot; -eq &quot;$WEBAPP_BEFORE_PING&quot;</pre><div class="callout good" style="margin-top:12px"><strong>✅ Ping acceptance</strong></div><pre class="code sm" data-lang="text" style="margin-top:10px">GitHub ping delivery: 2xx&#10;smee tab: ping event appears&#10;webapp-deploy build number before ping = after ping</pre>

ตอน 6 · LAB 6␟normal␟LAB 6 • การทดลองที่ 8 (1/3)␟Isolation ทิศที่สอง: push hello-ci␟<div class="flow"><b>LAB 6</b><i>1 ตรวจสภาพ</i><i>2 สร้าง repo</i><i>3 push v1</i><i>4 smee ช่อง2</i><i>5 ตั้ง job</i><i>6 webhook</i><i>7 เดินครบวง</i><i class="on">8 isolation</i><i>9 push v2</i><i>10 Hub tags</i></div><div class="callout"><strong>ทิศที่ 1 ผ่านแล้ว</strong> ผลเทียบหลัง push <span class="inline">webapp</span> คือ webapp-deploy +1 และ hello-ci-pipeline +0 • <strong>ทิศที่ 2</strong> จดเลขใหม่ก่อน push hello-ci</div><pre class="code sm" data-lang="bash" style="margin-top:12px">HELLO_BEFORE_HELLO=&quot;$(curl -gfsS -u admin:admin2569 &#39;http://localhost:8080/job/hello-ci-pipeline/lastBuild/api/json?tree=number&#39; | python3 -c &#39;import json,sys; print(json.load(sys.stdin)[&quot;number&quot;])&#39;)&quot;&#10;WEBAPP_BEFORE_HELLO=&quot;$(curl -gfsS -u admin:admin2569 &#39;http://localhost:8080/job/webapp-deploy/lastBuild/api/json?tree=number&#39; | python3 -c &#39;import json,sys; print(json.load(sys.stdin)[&quot;number&quot;])&#39;)&quot;</pre><pre class="code sm" data-lang="bash" style="margin-top:12px">cd &quot;$HOME/hello-ci&quot;&#10;git pull --ff-only origin main&#10;git config user.name Student&#10;git config user.email student@example.invalid&#10;git commit --allow-empty -m &#39;Verify reverse webhook isolation&#39;&#10;time git push origin main</pre><div class="callout good" style="margin-top:12px"><strong>✅ สิ่งที่ต้องเห็น</strong> ต้องอ่านเลขก่อน/หลังจาก <span class="inline">lastBuild.number</span> เท่านั้น และทดสอบครบทั้ง target <b>+1</b> กับ job ตรงข้าม <b>+0</b> ทุกทิศ</div>
ตอน 6 · LAB 6␟normal␟LAB 6 • การทดลองที่ 8 (2/3)␟รอจน build ของ hello-ci-pipeline จบจริง␟<div class="flow"><b>LAB 6</b><i>1 ตรวจสภาพ</i><i>2 สร้าง repo</i><i>3 push v1</i><i>4 smee ช่อง2</i><i>5 ตั้ง job</i><i>6 webhook</i><i>7 เดินครบวง</i><i class="on">8 isolation</i><i>9 push v2</i><i>10 Hub tags</i></div><pre class="code sm" data-lang="bash">while true&#10;do&#10;  HELLO_BUILD_STATE=&quot;$(curl -gfsS -u admin:admin2569 &#39;http://localhost:8080/job/hello-ci-pipeline/lastBuild/api/json?tree=number,building&#39;)&quot;&#10;  HELLO_CURRENT=&quot;$(printf &#39;%s&#39; &quot;$HELLO_BUILD_STATE&quot; | python3 -c &#39;import json,sys; print(json.load(sys.stdin)[&quot;number&quot;])&#39;)&quot;&#10;  HELLO_BUILDING=&quot;$(printf &#39;%s&#39; &quot;$HELLO_BUILD_STATE&quot; | python3 -c &#39;import json,sys; print(str(json.load(sys.stdin)[&quot;building&quot;]).lower())&#39;)&quot;&#10;  if [ &quot;$HELLO_CURRENT&quot; -ge &quot;$((HELLO_BEFORE_HELLO + 1))&quot; ]&#10;  then&#10;    if [ &quot;$HELLO_BUILDING&quot; = &#39;false&#39; ]&#10;    then&#10;      break&#10;    fi&#10;  fi&#10;  sleep 1&#10;done</pre><div class="callout good" style="margin-top:10px"><strong>✅ สิ่งที่ต้องเห็น</strong> loop จะหลุดเมื่อ hello-ci-pipeline มี build ใหม่และ <span class="inline">building=false</span></div>
