<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">LAB 7 image processing stack</title>
  <desc id="desc">Browser connects to Streamlit, which calls FastAPI and OpenCV by Docker DNS.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6741d9"/></marker></defs>
  <rect width="960" height="540" fill="#fff"/>
  <text x="480" y="55" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#16212f">LAB 7 — Image Processing Stack</text>
  <rect x="280" y="130" width="610" height="270" rx="22" fill="#e5dbff" fill-opacity=".45" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="305" y="165" font-family="sans-serif" font-size="18" fill="#5f3dc4">Docker network: vision-net</text>
  <rect x="55" y="210" width="170" height="100" rx="16" fill="#a5d8ff" stroke="#4a9eed" stroke-width="3"/>
  <text x="140" y="250" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">Browser</text><text x="140" y="280" text-anchor="middle" font-family="sans-serif" font-size="18">host :18501</text>
  <rect x="330" y="190" width="210" height="140" rx="16" fill="#dbe4ff" stroke="#4a9eed" stroke-width="3"/>
  <text x="435" y="240" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">Streamlit UI</text><text x="435" y="275" text-anchor="middle" font-family="monospace" font-size="17">ui:8501</text>
  <rect x="635" y="180" width="210" height="160" rx="16" fill="#d0bfff" stroke="#8b5cf6" stroke-width="3"/>
  <text x="740" y="225" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">FastAPI + OpenCV</text><text x="740" y="260" text-anchor="middle" font-family="monospace" font-size="17">api:8000</text><text x="740" y="294" text-anchor="middle" font-family="sans-serif" font-size="17">/health · /process</text>
  <line x1="225" y1="260" x2="330" y2="260" stroke="#6741d9" stroke-width="4" marker-end="url(#arrow)"/><text x="277" y="242" text-anchor="middle" font-family="sans-serif" font-size="16">upload</text>
  <line x1="540" y1="260" x2="635" y2="260" stroke="#6741d9" stroke-width="4" marker-end="url(#arrow)"/><text x="588" y="235" text-anchor="middle" font-family="sans-serif" font-size="16">HTTP + image</text>
  <rect x="180" y="445" width="600" height="54" rx="12" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><text x="480" y="480" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#9a5030">manual docker run  →  โครงเดิมใน compose.yaml</text>
</svg>
