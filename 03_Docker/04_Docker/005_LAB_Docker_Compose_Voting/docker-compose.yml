# ── Cats vs Dogs — mini voting stack ────────────────────────────────
# 3 services · 2 networks · 1 named volume · healthcheck + depends_on
#
#   [browser] ──8085──▶ vote ──┐
#                              ├──▶ redis (back-tier, มี volume เก็บคะแนน)
#   [browser] ──8086──▶ result ┘

services:

  vote:
    build: ./vote
    ports:
      - "8085:5000"
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - front-tier
      - back-tier
    # โบนัสท้ายแล็บ : รัน `docker compose up --watch`
    # แล้วลองแก้ vote/app.py — โค้ดจะถูก sync เข้า container ทันที
    develop:
      watch:
        - action: sync
          path: ./vote
          target: /app

  result:
    build: ./result
    ports:
      - "8086:5000"
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - front-tier
      - back-tier

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - vote-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - back-tier

volumes:
  vote-data:

networks:
  front-tier:
  back-tier:
