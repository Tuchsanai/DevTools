name: devtools-compose-radar

services:
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - radar-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  api:
    build: ./app
    environment:
      ROLE: api
      PORT: 8000
      REDIS_HOST: redis
    expose: ["8000"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=1)"]
      interval: 3s
      timeout: 2s
      retries: 10
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]

  web:
    build: ./app
    environment:
      ROLE: web
      PORT: 8080
      API_URL: http://api:8000
      DASHBOARD_TITLE: ${DASHBOARD_TITLE:-Compose Service Radar}
    ports: ["8080:8080"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1)"]
      interval: 3s
      timeout: 2s
      retries: 10
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [frontend, backend]

volumes:
  radar-data:

networks:
  frontend:
  backend:
    internal: true
