<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Container Detective</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:#eaf2ff;background:#07111f radial-gradient(circle at 75% 18%,#124e66 0,transparent 38%)}
    main{width:min(920px,92vw);padding:48px;border:1px solid #29445f;border-radius:28px;background:rgba(9,23,39,.86);box-shadow:0 28px 90px #0008}
    .eyebrow{color:#5eead4;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.badge{display:inline-flex;gap:10px;align-items:center;padding:8px 14px;border-radius:999px;background:#123629;color:#86efac;font-weight:750}.dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 16px #22c55e}
    h1{font-size:clamp(44px,7vw,82px);line-height:.95;margin:26px 0 18px;letter-spacing:-.06em}h1 span{color:#67e8f9}
    p{max-width:660px;color:#adc1d6;font-size:20px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:34px}.card{padding:18px;border-radius:18px;background:#0d2135;border:1px solid #203e59}.card b{display:block;color:#f8fafc;margin-bottom:8px}.card code{color:#67e8f9;font-size:14px}
    footer{margin-top:28px;color:#6f8aa5;font-size:14px}@media(max-width:680px){main{padding:30px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">LAB 01 · Docker lifecycle</div>
    <h1>Container<br><span>Detective</span></h1>
    <p>ถ้าหน้านี้เปิดได้ แปลว่าเส้นทาง <b>Browser → Host Port → DevTools → Nginx Container</b> ทำงานครบทุกช่วงแล้ว</p>
    <div class="badge"><i class="dot"></i> NGINX IS SERVING</div>
    <div class="grid">
      <div class="card"><b>Observe</b><code>docker ps</code></div>
      <div class="card"><b>Interrogate</b><code>docker inspect</code></div>
      <div class="card"><b>Collect evidence</b><code>docker logs</code></div>
    </div>
    <footer>หลักฐานจริงจาก bind mount แบบ read-only · nginx:1.29-alpine</footer>
  </main>
</body>
</html>
