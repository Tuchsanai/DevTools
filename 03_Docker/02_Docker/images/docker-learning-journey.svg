<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Docker Learning Journey</title>
  <desc id="desc">เส้นทาง 5 LAB จาก RUN ไป BUILD, DATA, COMPOSE และ DEBUG</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".24"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="520" rx="34" fill="#0b1324"/>
  <text x="600" y="74" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="38" font-weight="800">Docker Learning Journey</text>
  <text x="600" y="110" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="19">run → build → persist → connect → observe</text>
  <g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)">
    <path d="M230 248H270"/><path d="M450 248H490"/><path d="M670 248H710"/><path d="M890 248H930"/>
  </g>
  <g filter="url(#shadow)" font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="50" y="170" width="180" height="155" rx="22" fill="#17365d" stroke="#4a9eed" stroke-width="3"/>
    <text x="140" y="222" fill="#7dd3fc" font-size="18" font-weight="800">01 · RUN</text><text x="140" y="260" fill="#fff" font-size="25" font-weight="850">Container</text><text x="140" y="289" fill="#a9c2dc" font-size="16">lifecycle</text>
    <rect x="270" y="170" width="180" height="155" rx="22" fill="#553314" stroke="#f59e0b" stroke-width="3"/>
    <text x="360" y="222" fill="#fcd34d" font-size="18" font-weight="800">02 · BUILD</text><text x="360" y="260" fill="#fff" font-size="25" font-weight="850">Image</text><text x="360" y="289" fill="#d9b98c" font-size="16">Dockerfile + ENV</text>
    <rect x="490" y="170" width="180" height="155" rx="22" fill="#153e35" stroke="#22c55e" stroke-width="3"/>
    <text x="580" y="222" fill="#86efac" font-size="18" font-weight="800">03 · DATA</text><text x="580" y="260" fill="#fff" font-size="25" font-weight="850">Volume</text><text x="580" y="289" fill="#9fcabd" font-size="16">persistence</text>
    <rect x="710" y="170" width="180" height="155" rx="22" fill="#35265f" stroke="#8b5cf6" stroke-width="3"/>
    <text x="800" y="222" fill="#c4b5fd" font-size="18" font-weight="800">04 · COMPOSE</text><text x="800" y="260" fill="#fff" font-size="25" font-weight="850">Services</text><text x="800" y="289" fill="#b9add2" font-size="16">network + health</text>
    <rect x="930" y="170" width="180" height="155" rx="22" fill="#50203d" stroke="#ec4899" stroke-width="3"/>
    <text x="1020" y="222" fill="#f9a8d4" font-size="18" font-weight="800">05 · DEBUG</text><text x="1020" y="260" fill="#fff" font-size="25" font-weight="850">Evidence</text><text x="1020" y="289" fill="#d5aabd" font-size="16">health + logs</text>
  </g>
  <rect x="315" y="382" width="570" height="78" rx="20" fill="#362d13" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="431" text-anchor="middle" fill="#fde68a" font-family="system-ui,sans-serif" font-size="24" font-weight="750">Goal: explain every container with evidence</text>
</svg>
