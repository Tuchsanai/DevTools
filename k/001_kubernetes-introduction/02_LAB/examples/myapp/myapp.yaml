# myapp.yaml — Deployment + Service NodePort 30081 ใช้ image myapp:1.0 ที่ build เอง
#   ต้อง kind load docker-image myapp:1.0 --name lab ก่อน (node ไม่เห็น image ใน dockerd ของ container)
#   imagePullPolicy: IfNotPresent → ใช้ image ที่โหลดเข้า node แล้ว ไม่ไปดึงจาก registry
#   curl http://localhost:30081
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    app: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: myapp:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: myapp
spec:
  type: NodePort
  selector:
    app: myapp
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
