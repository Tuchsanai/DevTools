# LAB 9 ขั้น A: เด็กฝึกงาน intern (บัตรแถบเทา) — "ดูอย่างเดียว" Pod / log / ConfigMap / Deployment / StatefulSet
# ไม่มีสิทธิ์ใด ๆ กับ Secret และ pods/exec — ก่อนย้ายรหัสยังเห็นรหัสใน YAML ของ Deployment/StatefulSet, หลังย้ายเห็นแค่ชื่อซอง
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intern
  namespace: som-shop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: intern-read
  namespace: som-shop
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: intern-read
  namespace: som-shop
subjects:
  - kind: ServiceAccount
    name: intern
    namespace: som-shop
roleRef:
  kind: Role
  name: intern-read
  apiGroup: rbac.authorization.k8s.io
