# ไฟล์ตัวอย่าง — ห้ามใส่รหัสจริงในไฟล์นี้ และห้าม commit ไฟล์ Secret ที่มีค่าจริงลง git
# (ค่าข้างล่างเป็นรหัสตัวอย่างเพื่อการเรียนเท่านั้น)
#
# วิธีหลักของ LAB 9 คือ kubectl create secret generic ... --from-literal (ขั้น B) ไม่ใช้ไฟล์นี้
# ถ้าจะใช้ไฟล์: copy เป็น som-db.secret.yaml (ชื่อนี้ถูก .gitignore กันไว้) แก้ค่า แล้ว kubectl apply
# !!! kubectl apply + stringData → annotation kubectl.kubernetes.io/last-applied-configuration
#     เก็บ stringData ทั้งก้อนเป็น "ข้อความ" (ใครอ่าน Secret ได้ก็เห็นซ้ำอีกที่) ดู LAB 2
#     ทางเลี่ยง: kubectl create secret ... --dry-run=client -o yaml | kubectl apply -f -  หรือ  kubectl apply --server-side
# วางไว้นอกโฟลเดอร์ k8s/ ตั้งใจ — kubectl apply -f k8s/ จะได้ไม่เขียนรหัสตัวอย่างทับรหัสที่เปลี่ยนแล้ว
apiVersion: v1
kind: Secret
metadata:
  name: som-db-secret
  namespace: som-shop
type: Opaque
stringData:
  POSTGRES_PASSWORD: meow1234
  DATABASE_URL: postgres://som:meow1234@som-db-0.som-db:5432/catshop
