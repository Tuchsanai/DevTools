# LAB 3: Pod spod ใช้ Secret 3 แบบ (ต้องมี Secret demo จาก LAB 1 และ sd จาก LAB 2)
#   1) env ทีละ key   : DB_PASSWORD ← secretKeyRef demo/password
#   2) envFrom + prefix: ทุก key ของ sd → SD_PASSWORD, SD_USERNAME
#   3) volume          : ซองทั้งใบเป็นไฟล์ /etc/secret (ถาดฟองน้ำความจำ = tmpfs ใน RAM)
#                        และ /etc/secret400 แบบ defaultMode 0400 (เจ้าของอ่านได้คนเดียว)
apiVersion: v1
kind: Pod
metadata:
  name: spod
spec:
  terminationGracePeriodSeconds: 1     # sleep ไม่รับ SIGTERM → ลบเร็ว
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "86400"]
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: demo               # ชื่อ Secret
              key: password            # key ในซอง
      envFrom:
        - prefix: SD_
          secretRef:
            name: sd
      volumeMounts:
        - name: s
          mountPath: /etc/secret
          readOnly: true
        - name: s400
          mountPath: /etc/secret400
          readOnly: true
  volumes:
    - name: s
      secret:
        secretName: demo               # ทุก key = 1 ไฟล์ (/etc/secret/username, /etc/secret/password)
    - name: s400
      secret:
        secretName: demo
        defaultMode: 0400              # เลขฐานแปด → ไฟล์ -r--------
