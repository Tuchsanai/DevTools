# LAB 6: แฟ้มห่วงรวมเอกสาร (projected volume) — รวม 3 แหล่งไว้ในโฟลเดอร์เดียว /etc/som
#   configMap   → /etc/som/announcement.txt   (การ์ดจากกระดานประกาศ)
#   secret      → /etc/som/db/password        (ซองจาก Secret demo ของ LAB 1)
#   downwardAPI → /etc/som/pod-name           (ป้ายชื่อบูธ)
# defaultMode 0440 ใช้ร่วมกันทุกไฟล์ → -r--r-----
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-board
data:
  announcement.txt: |
    วันนี้ปลาทูสดมาก 🐟
---
apiVersion: v1
kind: Pod
metadata:
  name: proj
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "86400"]
      volumeMounts:
        - name: all
          mountPath: /etc/som
          readOnly: true
  volumes:
    - name: all
      projected:
        defaultMode: 0440
        sources:
          - configMap:
              name: shop-board
              items:
                - key: announcement.txt
                  path: announcement.txt
          - secret:
              name: demo
              items:
                - key: password
                  path: db/password          # สร้างโฟลเดอร์ย่อย db/ ให้
          - downwardAPI:
              items:
                - path: pod-name
                  fieldRef:
                    fieldPath: metadata.name
