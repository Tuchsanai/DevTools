# LAB 7: maker — ไม่มีสิทธิ์ get secrets เลย แต่ "สร้าง Pod ได้" → อ่าน Secret ทางอ้อมได้ (ดู peek.yaml)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-maker
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-maker
subjects:
  - kind: ServiceAccount
    name: maker
    namespace: default
roleRef:
  kind: Role
  name: pod-maker
  apiGroup: rbac.authorization.k8s.io
