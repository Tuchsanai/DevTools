# LAB 1: พนักงานต้อนรับประจำประตูหน้าท่าเรือ = Ingress controller (Traefik v3.7.13)
# ติดตั้งด้วยไฟล์ YAML ไฟล์เดียว (ไม่ใช้ Helm) — ต้อง apply traefik-crds-v3.7.13.yml "ก่อน" ไฟล์นี้เสมอ
#   kubectl apply -f ingress-controller/traefik-crds-v3.7.13.yml
#   kubectl apply -f ingress-controller/00-traefik.yaml
# ในไฟล์นี้: Namespace traefik → ServiceAccount + สิทธิ์อ่าน (RBAC) → Deployment → Service NodePort → IngressClass
#
# controller ก็คือ Deployment + Service ธรรมดาตัวหนึ่ง (อยู่ใน namespace ของตัวเอง)
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
# บัตรพนักงานของ Traefik (Pod ใช้บัตรนี้คุยกับ API server)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: traefik
---
# สิทธิ์ "อ่านอย่างเดียว" ทั้งคลัสเตอร์: ดูป้าย (Ingress), Service, EndpointSlice (รายชื่อ Pod ที่ Ready), Secret (ใบรับรอง/basic-auth)
# ต้นแบบจาก kubernetes-crd-rbac.yml ของ Traefik v3.7.13 (ตัด pods get ที่ใช้กับ OTel ออก)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik
rules:
  - apiGroups: [""]
    resources: [services, secrets, nodes, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]     # เขียนคอลัมน์ ADDRESS ของ kubectl get ing
    verbs: [update]
  - apiGroups: [traefik.io]           # CRD ของ Traefik (Middleware ฯลฯ) — ต้องมี CRD ก่อน ไม่งั้น log error ซ้ำ ๆ
    resources: [middlewares, middlewaretcps, ingressroutes, traefikservices, ingressroutetcps, ingressrouteudps, tlsoptions, tlsstores, serverstransports, serverstransporttcps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: traefik
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: traefik
  labels: {app: traefik}
spec:
  replicas: 1
  selector:
    matchLabels: {app: traefik}
  template:
    metadata:
      labels: {app: traefik}
    spec:
      serviceAccountName: traefik
      securityContext:                # ผ่าน Pod Security ระดับ restricted (บท 004)
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: traefik
          image: traefik:v3.7.13      # pin เวอร์ชันเสมอ (Node ของ kind ดึงจาก Docker Hub เองได้ ไม่ต้อง kind load)
          args:
            # entrypoint = ประตูที่ Traefik ฟัง (พอร์ตใน container ไม่ใช่ root จึงใช้ 8000/8443 แทน 80/443)
            - --entryPoints.web.address=:8000
            - --entryPoints.websecure.address=:8443
            - --entryPoints.traefik.address=:8080            # dashboard + /ping
            - --entryPoints.websecure.http.tls=true          # router บน websecure เป็น HTTPS (ไม่ใส่ = https ได้ 404)
            # อ่านป้าย Ingress มาตรฐาน networking.k8s.io/v1
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.strictPrefixMatching=true   # pathType Prefix ตรงทีละท่อนตามมาตรฐาน (/api ไม่จับ /apix)
            - --providers.kubernetesingress.allowEmptyServices=true     # Service ไม่มี Pod Ready → 503 (แทนการหายไปเป็น 404)
            - --providers.kubernetesingress.ingressendpoint.hostname=localhost   # ค่าในคอลัมน์ ADDRESS
            # อ่าน CRD ของ Traefik (Middleware: redirect, basicAuth, stripPrefix)
            - --providers.kubernetescrd=true
            # dashboard แบบไม่มีรหัส — ใช้เฉพาะใน LAB ห้ามเปิดแบบนี้ในงานจริง
            - --api.dashboard=true
            - --api.insecure=true
            - --ping=true                                    # /ping ใช้กับ readinessProbe
            - --accesslog=true                               # สมุดเยี่ยม: ทุก request 1 บรรทัดใน kubectl logs
            - --log.level=INFO
            - --global.checknewversion=false
            - --global.sendanonymoususage=false
          ports:
            - {name: web, containerPort: 8000}
            - {name: websecure, containerPort: 8443}
            - {name: dashboard, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /ping, port: dashboard}
            periodSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
# ประตูเดียวของทั้งคลัสเตอร์: kind map ออกมาแค่ 30080–30082 (ไม่มี 80/443)
#   http://localhost:30080  → web        https://localhost:30081 → websecure     http://localhost:30082/dashboard/ → dashboard
# ถ้ามี Service อื่นจองพอร์ตเหล่านี้อยู่ (เช่นร้านบท 011) จะได้ "provided port is already allocated"
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
spec:
  type: NodePort
  selector: {app: traefik}
  ports:
    - {name: web, port: 80, targetPort: web, nodePort: 30080}
    - {name: websecure, port: 443, targetPort: websecure, nodePort: 30081}
    - {name: dashboard, port: 8080, targetPort: dashboard, nodePort: 30082}
---
# ตราบนเสื้อกั๊ก: Ingress ที่ ingressClassName: traefik (หรือไม่ใส่ class เพราะเป็น default) → Traefik รับไปทำ
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"   # ดาวทอง: Ingress ที่ไม่ใส่ class ถูกเติม traefik ตอนสร้าง
spec:
  controller: traefik.io/ingress-controller
