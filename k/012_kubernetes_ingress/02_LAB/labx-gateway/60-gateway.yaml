# LAB เสริม: ลองชิม Gateway API (อาคารผู้โดยสารรุ่นใหม่) — ต้องติดตั้ง CRD Gateway API v1.6.2 ก่อน
#   GatewayClass = ชนิดของประตู (ใครเป็นคนทำ)   Gateway = ประตูจริง 1 บาน   HTTPRoute = ป้ายบอกทางที่ผูกกับประตู
# ตัวอย่างนี้แบ่งน้ำหนัก 90 : 10 ระหว่าง som-web กับ som-admin (Ingress มาตรฐานทำ weight ไม่ได้)
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: harbor
  namespace: som-shop
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 8000              # = พอร์ตใน container ของ entrypoint web (NodePort 30080)
      hostname: "gw.localhost"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary
  namespace: som-shop
spec:
  parentRefs: [{name: harbor}]
  hostnames: ["gw.localhost"]
  rules:
    - backendRefs:
        - {name: som-web, port: 80, weight: 90}
        - {name: som-admin, port: 80, weight: 10}
