# บท 013 LAB 11: หลังร้าน som-admin (เหมือนบท 012 ไม่เปลี่ยน, ไม่มี HPA) — หน้าเว็บเล็ก ๆ ของพนักงาน เข้าทาง https://admin.localhost:30081
#   /       หน้า "หลังร้านน้องส้ม (admin)"
#   /stats  ส่งต่อ (proxy) ไปถาม /api/stats ของหน้าร้าน som-web ภายในคลัสเตอร์ → เห็นยอดออเดอร์
# nginx-unprivileged รันเป็น uid 101 ฟังพอร์ต 8080 → ผ่าน Pod Security restricted (ไม่มี Warning แบบ som-https บท 011)
# ไม่มีรหัสผ่านในแอป — ด่านตรวจบัตร (basicAuth) อยู่ที่ประตู Traefik (50-ingress.yaml)
apiVersion: v1
kind: ConfigMap
metadata:
  name: som-admin-conf
  namespace: som-shop
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      location = /stats {
        proxy_pass http://som-web.som-shop.svc.cluster.local/api/stats;
      }
    }
  index.html: |
    <!doctype html><meta charset="utf-8"><title>หลังร้านน้องส้ม</title>
    <h1>หลังร้านน้องส้ม (admin)</h1><p><a href="/stats">ดูยอดออเดอร์</a></p>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: som-admin
  namespace: som-shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: som-admin}
  template:
    metadata:
      labels: {app: som-admin}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine   # Node ดึงจาก Docker Hub เอง
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /, port: http}
          volumeMounts:   # subPath = เอาแค่ไฟล์เดียวจาก ConfigMap มาวางทับ (บท 010)
            - {name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: conf, mountPath: /usr/share/nginx/html/index.html, subPath: index.html, readOnly: true}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: conf
          configMap: {name: som-admin-conf}
---
# ClusterIP ธรรมดา (ไม่มี NodePort) — port ชื่อ http ถูกอ้างจาก Ingress som-admin
apiVersion: v1
kind: Service
metadata:
  name: som-admin
  namespace: som-shop
spec:
  selector: {app: som-admin}
  ports: [{name: http, port: 80, targetPort: http}]
