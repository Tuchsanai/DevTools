# บท 013 LAB 11 ขั้น B: กระดานประกาศของโซน som-shop (ConfigMap 2 แผ่น) — ไม่มีรหัสผ่านอยู่บนกระดาน (รหัสอยู่ใน Secret)
# ต่างจากบท 012: SHOP_EYEBROW / SHOP_FOOTER บอกว่าเป็นบท 013 (HPA) — มีผลเมื่อได้ Pod ใหม่ (ขั้น B เปลี่ยน image 1.7 อยู่แล้ว)
# 1) som-web-config: ป้ายร้าน → web อ่านผ่าน envFrom (เปลี่ยนแล้วต้อง rollout restart)
apiVersion: v1
kind: ConfigMap
metadata:
  name: som-web-config
  namespace: som-shop
data:
  SHOP_NAME: "ร้านอาหารแมวน้องส้ม"
  SHOP_EYEBROW: "⚓ ท่าเรือ Kubernetes · HPA"
  # ห้ามใส่ $(POD_NAMESPACE) ในค่าของ ConfigMap — envFrom ไม่แทนค่าให้ (บท 010)
  SHOP_FOOTER: "Next.js + PostgreSQL · Kubernetes LAB 013 · บูธเพิ่ม-ลดเองด้วย HPA https://shop.localhost"
  APP_THEME: "harbor"              # harbor (น้ำเงิน) หรือ sunset (ส้ม) — ทับค่าเริ่มใน image ได้
  SHOP_PROMO: "🎉 วันลดราคา! ลูกค้าเยอะแค่ไหน HPA ก็เปิดบูธเพิ่มให้"   # ว่าง = ไม่แสดงแถบโปรโมชัน
---
# 2) som-announcement: ประกาศหน้าร้าน → mount เป็นไฟล์ /etc/som/announcement.txt (เปลี่ยนเองไม่ต้อง restart)
apiVersion: v1
kind: ConfigMap
metadata:
  name: som-announcement
  namespace: som-shop
data:
  announcement.txt: |
    วันนี้ปลาทูสดมาก 🐟
