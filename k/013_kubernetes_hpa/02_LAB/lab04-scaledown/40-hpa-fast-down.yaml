# LAB 4: ย่อเวลารอก่อนลดบูธ (เฉพาะ LAB) — ค่าเริ่มต้น scaleDown.stabilizationWindowSeconds = 300
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: php-apache
  namespace: hpa-demo
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: php-apache}
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 50}}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30   # นาฬิกาทราย 30 วิ: ค่าแนะนำต่ำสุดในช่วง 30 วิล่าสุด "ทั้งหมด" ต้องต่ำจริงจึงลด
