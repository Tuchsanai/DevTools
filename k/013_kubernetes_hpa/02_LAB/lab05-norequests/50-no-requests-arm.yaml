# LAB 5 (ทางสำรองเครื่อง ARM): เหมือน 50-no-requests.yaml แต่ใช้ som-shop-web:1.7 — "ลืม" resources.requests
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nores
  namespace: hpa-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: nores}
  template:
    metadata:
      labels: {app: nores}
    spec:
      containers:
        - name: php-apache
          image: som-shop-web:1.7
          imagePullPolicy: IfNotPresent
          # ไม่มี resources: → ไม่มี requests.cpu
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nores
  namespace: hpa-demo
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: nores}
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 50}}
