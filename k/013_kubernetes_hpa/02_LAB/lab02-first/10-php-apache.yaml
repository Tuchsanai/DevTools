# LAB 2: แอปตัวอย่างจากเอกสาร HPA ทางการ (php-apache): ทุก request ที่ / จะวนคำนวณ sqrt 1 ล้านรอบ แล้วตอบ "OK!"
# image registry.k8s.io/hpa-example มี tag เดียว (latest, digest sha256:581697a3...) และเป็น amd64 อย่างเดียว
#   เครื่อง ARM (Mac Apple Silicon) ใช้ 10-php-apache-arm.yaml แทน (som-shop-web:1.7 ที่ build ใน LAB 0)
# มี replicas: 1 โดยตั้งใจ — LAB 10 จะใช้ไฟล์นี้สาธิตกับดัก "replicas ใน YAML ทับ HPA"
apiVersion: v1
kind: Namespace
metadata:
  name: hpa-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-apache
  namespace: hpa-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: php-apache
  template:
    metadata:
      labels:
        app: php-apache
    spec:
      containers:
        - name: php-apache
          image: registry.k8s.io/hpa-example
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 100m }   # HPA คิด % จากค่านี้ (100m = 0.1 core)
            limits:   { cpu: 300m }
---
apiVersion: v1
kind: Service
metadata:
  name: php-apache
  namespace: hpa-demo
spec:
  selector:
    app: php-apache
  ports:
    - port: 80
