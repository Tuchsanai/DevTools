# LAB 3 (ทางสำรองเครื่อง ARM): ใช้คู่กับ lab02-first/10-php-apache-arm.yaml
# เหมือน 30-load.yaml ทุกอย่าง ต่างแค่ URL: /api/work?ms=20 (หน้า / ของร้านต้องใช้ db จึงไม่ใช้)
# เพิ่มลูกค้า: kubectl -n hpa-load scale deploy/load --replicas=2   หยุด: --replicas=0
apiVersion: v1
kind: Namespace
metadata:
  name: hpa-load
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load
  namespace: hpa-load
spec:
  replicas: 1
  selector:
    matchLabels: {app: load}
  template:
    metadata:
      labels: {app: load}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: load
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while sleep 0.01; do wget -q -T 2 -O- 'http://php-apache.hpa-demo/api/work?ms=20' >/dev/null; done"]
          resources:
            requests: {cpu: 20m, memory: 8Mi}
            limits: {cpu: 200m, memory: 32Mi}
