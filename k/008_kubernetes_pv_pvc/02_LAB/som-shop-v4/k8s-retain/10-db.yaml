# LAB 10 ขั้น H: db แบบเข้มขึ้น — เหมือน k8s/10-db.yaml แต่ PVC ใช้ class standard-retain + ReadWriteOncePod
# - Retain: ลบ PVC แล้วตู้ (PV) และข้อมูลยังอยู่ → กู้คืนได้ด้วย pvc-rescue.yaml
# - ReadWriteOncePod: ใช้ได้ทีละ Pod เดียว → scale เป็น 2 แล้ว Pod ที่ 2 ค้าง Pending (ไม่มี db 2 ตัวบนข้อมูลเดียวกัน)
# ต้อง apply sc-retain.yaml ก่อน
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: som-db-data
  namespace: som-shop
spec:
  storageClassName: standard-retain  # class ที่สร้างจาก sc-retain.yaml (Retain)
  accessModes: [ReadWriteOncePod]    # ใช้ได้ทีละ Pod เดียว (GA ตั้งแต่ Kubernetes 1.29)
  resources:
    requests:
      storage: 1Gi                 # ขนาดที่ขอ (local-path ไม่ได้บังคับขนาดจริง)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: som-db
  namespace: som-shop
  labels:
    app: som-db
spec:
  # replicas 1 — ถ้า scale เป็น 2 ตัวที่ 2 จะ Pending เพราะ ReadWriteOncePod
  replicas: 1
  # Recreate จำเป็นมากกับ RWOP: RollingUpdate จะสร้าง Pod ใหม่ก่อน → Pod ใหม่ Pending รอตัวเก่า → rollout ค้าง
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: som-db
  template:
    metadata:
      labels:
        app: som-db
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 70                  # คงไว้ตามบท 007 — แต่ไม่มีผลกับ local-path (โฟลเดอร์เป็น drwxrwxrwx root อยู่แล้ว)
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # ตู้เซฟของร้าน: อ้างใบเบิก (PVC) ด้วยชื่อ — Pod ไม่ต้องรู้ว่าตู้อยู่ที่ไหน
        - name: db-data
          persistentVolumeClaim:
            claimName: som-db-data
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          securityContext:
            runAsUser: 70            # uid ของ postgres ใน image alpine
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_USER
              value: som
            - name: POSTGRES_PASSWORD
              value: meow1234        # เพื่อการเรียนเท่านั้น (ของจริงใช้ Secret — บทหลัง)
            - name: POSTGRES_DB
              value: catshop
            - name: PGDATA           # ใช้โฟลเดอร์ย่อย pgdata (postgres ต้องการโฟลเดอร์ 0700 ของตัวเอง)
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres         # Service อ้าง targetPort: postgres
              containerPort: 5432
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:            # พร้อมรับงาน = pg_isready ผ่าน (ใช้ 127.0.0.1 ใน container เดียวกัน)
            exec:
              command: ["pg_isready", "-U", "som", "-d", "catshop", "-h", "127.0.0.1"]
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
# ประภาคารของครัว: ClusterIP เท่านั้น (ใช้ภายในคลัสเตอร์ — ไม่เปิด NodePort ให้ db)
apiVersion: v1
kind: Service
metadata:
  name: som-db
  namespace: som-shop
spec:
  type: ClusterIP
  selector:
    app: som-db
  ports:
    - port: 5432
      targetPort: postgres
