# LAB 5: ReadWriteOncePod — ใช้ได้ทีละ "Pod เดียว" ทั้งคลัสเตอร์ (GA ตั้งแต่ Kubernetes 1.29)
# ใบเบิกแบบ RWOP
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: single
spec:
  accessModes: [ReadWriteOncePod]
  resources:
    requests:
      storage: 10Mi
---
# Pod ตัวแรกได้ตู้ไป
apiVersion: v1
kind: Pod
metadata:
  name: rwop-a
spec:
  terminationGracePeriodSeconds: 1   # ลบเร็ว (sleep ไม่รับ SIGTERM)
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits:   { cpu: 100m, memory: 64Mi }
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: single
