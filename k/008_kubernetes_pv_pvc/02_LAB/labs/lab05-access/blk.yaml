# LAB 5: volumeMode: Block — ได้ "ดิสก์ดิบ" ไม่มีระบบไฟล์ (ฐานข้อมูลบางตัวใช้) — local-path ทำไม่ได้
# ใบเบิกแบบ Block
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blk
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Block                # ค่า default คือ Filesystem
  resources:
    requests:
      storage: 10Mi
---
# Pod ที่ใช้ Block ต้องใช้ volumeDevices (ไม่ใช่ volumeMounts) → Pending ตลอดเพราะไม่มีตู้
apiVersion: v1
kind: Pod
metadata:
  name: use-blk
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeDevices:
        - name: data
          devicePath: /dev/xvda      # ดิสก์ดิบจะโผล่เป็นอุปกรณ์ตรงนี้
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits:   { cpu: 100m, memory: 64Mi }
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: blk
