# LAB 5: Pod ตัวที่ 2 ขอใช้ใบเบิก RWOP เดียวกัน → ค้าง Pending (ประตูตู้เปิดให้ทีละ Pod)
apiVersion: v1
kind: Pod
metadata:
  name: rwop-b
spec:
  terminationGracePeriodSeconds: 1   # ลบเร็ว (sleep ไม่รับ SIGTERM)
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits:   { cpu: 100m, memory: 64Mi }
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: single
