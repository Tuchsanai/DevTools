# LAB 7: ใบเบิกจาก class local-expand (อนุญาตขยาย) — patch เป็น 20Mi ผ่าน แต่ขนาดจริงไม่เปลี่ยน
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ex
spec:
  storageClassName: local-expand
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Mi
---
# Pod ที่ใช้ใบเบิก ex (class แบบ WaitForFirstConsumer ต้องมี Pod ก่อนจึงได้ตู้)
apiVersion: v1
kind: Pod
metadata:
  name: ex-user
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits:   { cpu: 100m, memory: 64Mi }
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ex
