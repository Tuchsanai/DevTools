# LAB 7: ใบเบิกจาก class standard (ไม่อนุญาตขยาย) — ใช้ลอง kubectl patch ขยายแล้วโดนปฏิเสธ
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: std
spec:
  storageClassName: standard
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Mi
---
# Pod ที่ใช้ใบเบิก std (class แบบ WaitForFirstConsumer ต้องมี Pod ก่อนจึงได้ตู้)
apiVersion: v1
kind: Pod
metadata:
  name: std-user
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits:   { cpu: 100m, memory: 64Mi }
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: std
