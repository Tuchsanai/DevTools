# LAB 6: Service web (ClusterIP) — ระหว่าง rollout พัง ยังส่งลูกค้าไป Pod รุ่นเก่าที่พร้อม
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: broken-lab
spec:
  selector:
    app: web                       # เลือกทั้ง Pod รุ่นเก่าและรุ่นใหม่ (มี app=web เหมือนกัน)
  ports:
    - port: 80
      targetPort: http
