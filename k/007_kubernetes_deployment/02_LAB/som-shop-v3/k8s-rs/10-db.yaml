# LAB 10 (จุดเริ่ม = สำเนาจากบท 006 ไม่แก้): ครัวกลาง (ฐานข้อมูล) — ReplicaSet som-db 1 ตัว + Service ClusterIP som-db:5432
# web ทุก Pod เรียก db ด้วยชื่อ "som-db" → Pod db เกิดใหม่ IP เปลี่ยน แต่ชื่อ/ClusterIP เดิม
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: som-db
  namespace: som-shop
  labels:
    app: som-db
spec:
  # replicas ต้องเป็น 1 — postgres 2 ตัว "ไม่แชร์ข้อมูลกัน" (Service จะสุ่มส่งไปคนละ db)
  replicas: 1
  selector:
    matchLabels:
      app: som-db
  template:
    metadata:
      labels:
        app: som-db
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 70                  # emptyDir เป็นของกลุ่ม 70 = postgres เขียนได้
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # !!! emptyDir = ข้อมูลอยู่กับ Pod นี้เท่านั้น → Pod db ถูกลบ/เกิดใหม่ = ข้อมูลหายหมด
        # (ตั้งใจให้เห็นใน LAB — บทหลังใช้ PersistentVolumeClaim)
        - name: db-data
          emptyDir: {}
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          securityContext:
            runAsUser: 70            # uid ของ postgres ใน image alpine
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_USER
              value: som
            - name: POSTGRES_PASSWORD
              value: meow1234        # เพื่อการเรียนเท่านั้น (ของจริงใช้ Secret — บทหลัง)
            - name: POSTGRES_DB
              value: catshop
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres         # Service อ้าง targetPort: postgres
              containerPort: 5432
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:            # พร้อมรับงาน = pg_isready ผ่าน (ใช้ 127.0.0.1 ใน container เดียวกัน)
            exec:
              command: ["pg_isready", "-U", "som", "-d", "catshop", "-h", "127.0.0.1"]
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
# ประภาคารของครัว: ClusterIP เท่านั้น (ใช้ภายในคลัสเตอร์ — ไม่เปิด NodePort ให้ db)
apiVersion: v1
kind: Service
metadata:
  name: som-db
  namespace: som-shop
spec:
  type: ClusterIP
  selector:
    app: som-db
  ports:
    - port: 5432
      targetPort: postgres
