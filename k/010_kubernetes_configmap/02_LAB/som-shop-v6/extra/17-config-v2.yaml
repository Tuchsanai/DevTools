# LAB 10 ขั้น E: ป้ายร้านชุดใหม่แบบ "ชื่อใหม่ + immutable" (กระดานเคลือบ)
# แก้ไม่ได้อีก → อยากเปลี่ยนต้องสร้าง -v3 แล้วชี้ Deployment ไปชื่อใหม่ (ชื่อเปลี่ยน = template เปลี่ยน = rollout เอง)
apiVersion: v1
kind: ConfigMap
metadata:
  name: som-web-config-v2
