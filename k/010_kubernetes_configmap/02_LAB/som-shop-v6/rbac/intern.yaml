# LAB 10 ขั้น F: เด็กฝึกงาน (ServiceAccount intern) ได้สิทธิ์ "ดูอย่างเดียว" Pod / ConfigMap / Deployment / StatefulSet
# ไม่มีสิทธิ์ดู Secret เลย — แต่ยังเห็นรหัสผ่าน db เพราะรหัสอยู่ใน YAML ของ Deployment/StatefulSet (ปัญหาส่งต่อบท 011)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intern
  namespace: som-shop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: intern-read
  namespace: som-shop
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: intern-read
  namespace: som-shop
subjects:
  - kind: ServiceAccount
    name: intern
    namespace: som-shop
roleRef:
  kind: Role
  name: intern-read
  apiGroup: rbac.authorization.k8s.io
