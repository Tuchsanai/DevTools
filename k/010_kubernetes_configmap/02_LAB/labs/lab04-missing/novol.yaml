# LAB 4: mount ConfigMap ที่ไม่มีอยู่เป็น volume → ค้าง ContainerCreating (event FailedMount)
apiVersion: v1
kind: Pod
metadata:
  name: novol
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "86400"]
      volumeMounts:
        - name: v
          mountPath: /etc/x
  volumes:
    - name: v
      configMap:
        name: not-here
