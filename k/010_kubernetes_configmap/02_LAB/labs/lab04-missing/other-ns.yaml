# LAB 4: Pod ใน namespace other อ้าง shop-config (ซึ่งอยู่ใน default)
# configMapRef ไม่มีช่อง namespace → หาใน namespace ของ Pod เองเท่านั้น → CreateContainerConfigError
# ต้อง kubectl create ns other ก่อน
apiVersion: v1
kind: Pod
metadata:
  name: x
  namespace: other
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "86400"]
      envFrom:
        - configMapRef:
            name: shop-config
