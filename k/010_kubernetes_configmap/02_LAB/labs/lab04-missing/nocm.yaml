# LAB 4: อ้าง ConfigMap ที่ "ไม่มีอยู่" ผ่าน envFrom → CreateContainerConfigError
apiVersion: v1
kind: Pod
metadata:
  name: nocm
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "86400"]
      envFrom:
        - configMapRef:
            name: not-here                 # ยังไม่มี ConfigMap ชื่อนี้
