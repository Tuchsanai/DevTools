# LAB 4: ConfigMap มีอยู่ (shop-config จาก LAB 2) แต่ "ไม่มี key" ที่อ้าง → CreateContainerConfigError
apiVersion: v1
kind: Pod
metadata:
  name: nokey
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "86400"]
      env:
        - name: X
          valueFrom:
            configMapKeyRef:
              name: shop-config
              key: NOPE                    # ไม่มี key นี้ในกระดาน
