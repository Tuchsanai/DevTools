# LAB 7: Deployment plain — nginx ตัวเดียวกันแต่เป็น Deployment
# แก้ ConfigMap แล้วไม่ต้อง reload เอง: rollout restart (หรือเปลี่ยน annotation checksum/config)
# = เปลี่ยน Pod template → ได้ Pod ใหม่ที่อ่านไฟล์ล่าสุดตั้งแต่เริ่ม
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plain
  template:
    metadata:
      labels:
        app: plain
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: nginx-conf
