# LAB 7: Pod ngx — nginx อ่าน /etc/nginx/conf.d/default.conf จาก ConfigMap nginx-conf
# ไฟล์ในโฟลเดอร์อัปเดตเองได้ แต่ nginx อ่านไฟล์แค่ตอนเริ่ม → ต้องสั่ง nginx -s reload เอง
# (nginx:1.27-alpine รันเป็น root ฟัง port 80 — ใช้ใน namespace default ที่ไม่มีป้าย Pod Security)
apiVersion: v1
kind: Pod
metadata:
  name: ngx
  labels:
    app: ngx
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf.d     # mount ทับทั้งโฟลเดอร์ (ไม่ใช้ subPath จึงอัปเดตเองได้)
  volumes:
    - name: conf
      configMap:
        name: nginx-conf
