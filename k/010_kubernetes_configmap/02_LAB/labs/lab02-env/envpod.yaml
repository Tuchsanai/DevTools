# LAB 2: Pod envpod — หยิบการ์ดทีละใบจากกระดานมาติดอก (env.valueFrom.configMapKeyRef)
# แล้วใช้ $(ชื่อ env) ใน args — ตัวที่ไม่มีจริงอย่าง $(NOPE) จะค้างเป็นข้อความเดิม
apiVersion: v1
kind: Pod
metadata:
  name: envpod
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 1     # sleep ไม่รับ SIGTERM → ลบเร็ว
  containers:
    - name: c
      image: busybox:1.36
      # $0 = args ตัวแรก, $1 = ตัวที่สอง (sh -c "<สคริปต์>" arg0 arg1)
      command: ["sh", "-c", "echo SHOP_NAME=$SHOP_NAME; echo APP_THEME=$APP_THEME; echo ARGS: $0 $1; sleep 86400"]
      args: ["$(SHOP_NAME)", "$(NOPE)"]
      env:
        - name: SHOP_NAME                  # ชื่อ env ใน container
          valueFrom:
            configMapKeyRef:
              name: shop-config            # ชื่อ ConfigMap
              key: SHOP_NAME               # key ในกระดาน
        - name: APP_THEME
          valueFrom:
            configMapKeyRef:
              name: shop-config
              key: APP_THEME
