# LAB 9: Deployment kz-web อ้าง web-config "ชื่อสั้น" — kustomize เติม -<hash> ให้ตอน build
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kz-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kz-web
  template:
    metadata:
      labels:
        app: kz-web
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: c
          image: busybox:1.36
          command: ["sleep", "86400"]
          envFrom:
            - configMapRef:
                name: web-config   # → web-config-<hash>
