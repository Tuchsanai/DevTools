# LAB 5: Pod volpod — mount shop-config (LAB 2) เป็นไฟล์ 3 แบบ
#   /etc/all   : ทุก key = 1 ไฟล์ (กระดานเล็กในบูธ อัปเดตเองได้)
#   /etc/some  : เลือกเฉพาะ key menu.txt ไปไว้ที่ menu/today.txt สิทธิ์ 0400
#   /etc/som/announcement.txt : subPath = ไฟล์เดียว ไม่ทับโฟลเดอร์ แต่ "ไม่อัปเดต" (LAB 6)
apiVersion: v1
kind: Pod
metadata:
  name: volpod
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "86400"]
      volumeMounts:
        - name: all
          mountPath: /etc/all
        - name: some
          mountPath: /etc/some
        - name: all
          mountPath: /etc/som/announcement.txt
          subPath: announcement.txt        # หยิบไฟล์เดียวจาก volume all
  volumes:
    - name: all
      configMap:
        name: shop-config
    - name: some
      configMap:
        name: shop-config
        defaultMode: 0400                  # เลขฐานแปด (นำด้วย 0) → -r--------
        items:
          - key: menu.txt
            path: menu/today.txt           # ตั้งชื่อ/โฟลเดอร์ย่อยเองได้
