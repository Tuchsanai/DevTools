apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: som-db-replica
  namespace: som-shop
spec:
  serviceName: som-db
  replicas: 1
  selector: {matchLabels: {app: som-db-replica}}
  template:
    metadata: {labels: {app: som-db-replica}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      initContainers:
      - name: clone-from-primary
        image: postgres:17.11-alpine
        securityContext: {runAsUser: 70, runAsGroup: 70, allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
        env:
        - {name: PGPASSWORD, value: meow1234}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        command: [sh, -c, "if [ -s $PGDATA/PG_VERSION ]; then echo already-cloned; else pg_basebackup -h som-db-0.som-db -U som -D $PGDATA -R -X stream -P && echo cloned; fi"]
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      containers:
      - name: postgres
        image: postgres:17.11-alpine
        securityContext: {runAsUser: 70, runAsGroup: 70, allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
        env:
        - {name: POSTGRES_PASSWORD, value: meow1234}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        ports: [{name: postgres, containerPort: 5432}]
        readinessProbe: {exec: {command: [pg_isready, -U, som, -d, catshop, -h, 127.0.0.1]}, periodSeconds: 3}
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec: {storageClassName: standard, accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
