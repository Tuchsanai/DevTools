apiVersion: v1
kind: Service
metadata:
  name: som-db
  namespace: som-shop
spec:
  clusterIP: None
  selector:
    app: som-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# LAB 10: ครัวกลาง (ฐานข้อมูล) แบบใหม่ — Deployment som-db 1 ตัว (Recreate) + Service ClusterIP som-db:5432 เดิม
# ชื่อและ selector (app: som-db) เท่าบท 006 → Pod spec เหมือนเดิมทุกอย่าง เปลี่ยนแค่ "ใครเป็นผู้ดูแล"
# ตอนแปลงจาก k8s-rs/: template เหมือน ReplicaSet som-db เดิมทุกตัวอักษร → Deployment "รับเลี้ยง" RS เดิมเป็นรุ่นปัจจุบัน
# ไม่สร้าง Pod db ใหม่ ข้อมูลจึงยังอยู่ (strategy อยู่นอก template — Recreate มีผลเมื่อเปลี่ยนรุ่น/rollout restart ครั้งถัดไป)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: som-db
  namespace: som-shop
  labels:
    app: som-db
spec:
  # replicas ต้องเป็น 1 — postgres 2 ตัว "ไม่แชร์ข้อมูลกัน" (Service จะสุ่มส่งไปคนละ db)
  replicas: 1
  # Recreate = ปิด Pod db เดิมให้หมดก่อน แล้วค่อยสร้างตัวใหม่ → ไม่มีช่วงที่ postgres 2 ตัวอยู่พร้อมกัน
  # (RollingUpdate จะเปิดตัวใหม่ก่อน แล้ว Service som-db จะส่ง web ไปคนละฐานข้อมูล)
  # แลกกับ: ระหว่างเปลี่ยนรุ่น db ร้านใช้ฐานข้อมูลไม่ได้ชั่วครู่
  serviceName: som-db
  selector:
    matchLabels:
      app: som-db
  template:
    metadata:
      labels:
        app: som-db
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 70                  # emptyDir เป็นของกลุ่ม 70 = postgres เขียนได้
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          securityContext:
            runAsUser: 70            # uid ของ postgres ใน image alpine
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_USER
              value: som
            - name: POSTGRES_PASSWORD
              value: meow1234        # เพื่อการเรียนเท่านั้น (ของจริงใช้ Secret — บทหลัง)
            - name: POSTGRES_DB
              value: catshop
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres         # Service อ้าง targetPort: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:            # พร้อมรับงาน = pg_isready ผ่าน (ใช้ 127.0.0.1 ใน container เดียวกัน)
            exec:
              command: ["pg_isready", "-U", "som", "-d", "catshop", "-h", "127.0.0.1"]
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: standard
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
