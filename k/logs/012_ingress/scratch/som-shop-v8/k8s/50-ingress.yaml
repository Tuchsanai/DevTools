apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: som-shop
spec:
  redirectScheme:
    scheme: https
    port: "30081"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-auth
  namespace: som-shop
spec:
  basicAuth:
    secret: som-admin-auth
    removeHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: som-shop
  namespace: som-shop
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: som-shop-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [shop.localhost]
      secretName: som-tls
  rules:
    - host: shop.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: som-web, port: {number: 80}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: som-admin
  namespace: som-shop
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: som-shop-redirect-https@kubernetescrd,som-shop-admin-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [admin.localhost]
      secretName: som-tls
  rules:
    - host: admin.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: som-admin, port: {name: http}}
