apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lost
  namespace: demo
spec:
  defaultBackend:
    service: {name: admin, port: {number: 80}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wrongclass
  namespace: demo
spec:
  ingressClassName: nginx
  rules:
    - host: wrong.localhost
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: menu, port: {number: 80}}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: typo
  namespace: demo
spec:
  rules:
    - host: typo.localhost
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: menuu, port: {number: 80}}}}
          - {path: /port, pathType: Prefix, backend: {service: {name: menu, port: {number: 8080}}}}
