apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: harbor
  namespace: som-shop
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      hostname: "gw.localhost"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary
  namespace: som-shop
spec:
  parentRefs: [{name: harbor}]
  hostnames: ["gw.localhost"]
  rules:
    - backendRefs:
        - {name: som-web, port: 80, weight: 90}
        - {name: som-admin, port: 80, weight: 10}
