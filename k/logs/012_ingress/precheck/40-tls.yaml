apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: demo
spec:
  tls:
    - hosts: [shop.localhost, admin.localhost]
      secretName: som-tls
  rules:
    - host: shop.localhost
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: menu, port: {number: 80}}}}
          - {path: /api, pathType: Prefix, backend: {service: {name: api, port: {name: http}}}}
    - host: admin.localhost
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: admin, port: {number: 80}}}}
