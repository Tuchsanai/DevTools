apiVersion: apps/v1
kind: Deployment
metadata: {name: kz-web}
spec:
  replicas: 1
  selector: {matchLabels: {app: kz-web}}
  template:
    metadata: {labels: {app: kz-web}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: c
        image: busybox:1.36
        command: ["sleep","3600"]
        envFrom: [{configMapRef: {name: web-config}}]
