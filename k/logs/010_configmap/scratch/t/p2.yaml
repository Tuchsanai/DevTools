apiVersion: v1
kind: ConfigMap
metadata: {name: shop-config}
data:
  SHOP_NAME: "ร้านน้องส้ม"
  APP_THEME: "sunset"
  shop.name: "dot-key"
  1bad: "starts-with-digit"
  announcement.txt: |
    วันนี้ปลาทูสด
  menu.txt: |
    ขนมปลาทูน่า
---
apiVersion: v1
kind: Pod
metadata: {name: envpod}
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
  - name: c
    image: busybox:1.36
    command: ["sh","-c","env | sort | grep -E 'SHOP|THEME|CFG_|bad|shop' ; echo ARGS: $0 $1; sleep 3600", "$(SHOP_NAME)", "$(NOPE)"]
    env:
    - name: SHOP_NAME
      valueFrom: {configMapKeyRef: {name: shop-config, key: SHOP_NAME}}
    envFrom:
    - prefix: CFG_
      configMapRef: {name: shop-config}
---
apiVersion: v1
kind: Pod
metadata: {name: volpod}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep","3600"]
    volumeMounts:
    - {name: all, mountPath: /etc/all}
    - {name: some, mountPath: /etc/some}
    - {name: all, mountPath: /etc/som/announcement.txt, subPath: announcement.txt}
  volumes:
  - name: all
    configMap: {name: shop-config}
  - name: some
    configMap:
      name: shop-config
      defaultMode: 0400
      items:
      - {key: menu.txt, path: menu/today.txt}
