apiVersion: v1
kind: ConfigMap
metadata: {name: nginx-conf}
data:
  default.conf: |
    server { listen 80; location / { default_type text/plain; return 200 "menu v1\n"; } }
---
apiVersion: v1
kind: Pod
metadata: {name: ngx, labels: {app: ngx}}
spec:
  containers:
  - name: nginx
    image: nginx:1.27-alpine
    volumeMounts: [{name: conf, mountPath: /etc/nginx/conf.d}]
  volumes: [{name: conf, configMap: {name: nginx-conf}}]
