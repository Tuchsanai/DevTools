apiVersion: v1
kind: Pod
metadata: {name: nocm}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep","3600"]
    envFrom: [{configMapRef: {name: not-here}}]
---
apiVersion: v1
kind: Pod
metadata: {name: nokey}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep","3600"]
    env:
    - name: X
      valueFrom: {configMapKeyRef: {name: shop-config, key: NOPE}}
---
apiVersion: v1
kind: Pod
metadata: {name: optpod}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: c
    image: busybox:1.36
    command: ["sh","-c","echo X=[$X]; ls /etc/opt-cm; sleep 3600"]
    env:
    - name: X
      valueFrom: {configMapKeyRef: {name: shop-config, key: NOPE, optional: true}}
    envFrom: [{configMapRef: {name: not-here, optional: true}}]
    volumeMounts: [{name: v, mountPath: /etc/opt-cm}]
  volumes:
  - name: v
    configMap: {name: not-here, optional: true}
---
apiVersion: v1
kind: Pod
metadata: {name: novol}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep","3600"]
    volumeMounts: [{name: v, mountPath: /etc/x}]
  volumes:
  - name: v
    configMap: {name: not-here}
