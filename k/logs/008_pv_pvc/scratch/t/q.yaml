apiVersion: v1
kind: Namespace
metadata: {name: qtest}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: storage, namespace: qtest}
spec:
  hard:
    persistentvolumeclaims: "2"
    requests.storage: 1Gi
    standard.storageclass.storage.k8s.io/requests.storage: 500Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: p1, namespace: qtest}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 400Mi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: p2, namespace: qtest}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 200Mi}}}
