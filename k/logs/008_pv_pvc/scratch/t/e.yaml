apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: {name: local-expand}
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: {name: local-immediate}
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: ex}
spec: {storageClassName: local-expand, accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Mi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: imm}
spec: {storageClassName: local-immediate, accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Mi}}}
---
apiVersion: v1
kind: Pod
metadata: {name: ex}
spec:
  containers: [{name: c, image: busybox:1.36, command: [sleep,"3600"], volumeMounts: [{name: d, mountPath: /data}]}]
  volumes: [{name: d, persistentVolumeClaim: {claimName: ex}}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: rw1}
spec: {accessModes: [ReadWriteOncePod], resources: {requests: {storage: 10Mi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rw1}
spec:
  replicas: 1
  selector: {matchLabels: {app: rw1}}
  template:
    metadata: {labels: {app: rw1}}
    spec:
      terminationGracePeriodSeconds: 1
      containers: [{name: c, image: busybox:1.36, command: [sleep,"3600"], volumeMounts: [{name: d, mountPath: /data}]}]
      volumes: [{name: d, persistentVolumeClaim: {claimName: rw1}}]
