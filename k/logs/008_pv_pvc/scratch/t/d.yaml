apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: reuse}
spec:
  storageClassName: standard
  volumeName: pvc-f376cbb6-3ec2-484f-b5e6-5a071e45ebb8
  accessModes: [ReadWriteOncePod]
  resources: {requests: {storage: 10Mi}}
---
apiVersion: v1
kind: Pod
metadata: {name: fsg}
spec:
  securityContext: {fsGroup: 70, runAsUser: 70, runAsGroup: 70}
  containers:
  - name: c
    image: busybox:1.36
    command: [sh,-c,"id; ls -ldn /data /data/sub /eph; cat /data/k.txt; touch /ro/x || echo READONLY-OK; sleep 3600"]
    volumeMounts:
    - {name: d, mountPath: /data}
    - {name: d, mountPath: /ro, readOnly: true}
    - {name: d, mountPath: /data/sub, subPath: sub}
    - {name: e, mountPath: /eph}
  volumes:
  - name: d
    persistentVolumeClaim: {claimName: reuse}
  - name: e
    ephemeral:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 5Mi}}
