apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: shared}
spec:
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 10Mi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: single}
spec:
  accessModes: [ReadWriteOncePod]
  resources: {requests: {storage: 10Mi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: blk}
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Block
  resources: {requests: {storage: 10Mi}}
---
apiVersion: v1
kind: Pod
metadata: {name: use-rwx}
spec:
  containers: [{name: c, image: busybox:1.36, command: [sleep,"3600"], volumeMounts: [{name: d, mountPath: /data}]}]
  volumes: [{name: d, persistentVolumeClaim: {claimName: shared}}]
---
apiVersion: v1
kind: Pod
metadata: {name: use-rwop}
spec:
  containers: [{name: c, image: busybox:1.36, command: [sleep,"3600"], volumeMounts: [{name: d, mountPath: /data}]}]
  volumes: [{name: d, persistentVolumeClaim: {claimName: single}}]
---
apiVersion: v1
kind: Pod
metadata: {name: use-blk}
spec:
  containers: [{name: c, image: busybox:1.36, command: [sleep,"3600"], volumeDevices: [{name: d, devicePath: /dev/xvda}]}]
  volumes: [{name: d, persistentVolumeClaim: {claimName: blk}}]
