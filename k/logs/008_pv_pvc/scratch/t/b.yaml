apiVersion: v1
kind: Pod
metadata: {name: writer2}
spec:
  containers: [{name: c, image: busybox:1.36, command: [sh,-c,"cat /data/log.txt; sleep 3600"], volumeMounts: [{name: d, mountPath: /data}]}]
  volumes: [{name: d, persistentVolumeClaim: {claimName: notes}}]
---
apiVersion: v1
kind: Pod
metadata: {name: use-rwop2}
spec:
  containers: [{name: c, image: busybox:1.36, command: [sleep,"3600"], volumeMounts: [{name: d, mountPath: /data}]}]
  volumes: [{name: d, persistentVolumeClaim: {claimName: single}}]
