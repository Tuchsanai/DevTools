apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: nd-data}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Mi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: nd}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: nd}}
  template:
    metadata: {labels: {app: nd}}
    spec:
      tolerations:
      - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      containers: [{name: c, image: busybox:1.36, command: [sleep,"3600"], volumeMounts: [{name: d, mountPath: /data}]}]
      volumes: [{name: d, persistentVolumeClaim: {claimName: nd-data}}]
