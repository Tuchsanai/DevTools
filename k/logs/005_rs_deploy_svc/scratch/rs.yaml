apiVersion: apps/v1
kind: ReplicaSet
metadata: {name: snack-rs}
spec:
  replicas: 3
  selector: {matchLabels: {app: snack}}
  template:
    metadata: {labels: {app: snack}}
    spec:
      terminationGracePeriodSeconds: 1
      containers: [{name: app, image: busybox:1.36, command: ["sleep","3600"]}]
