apiVersion: v1
kind: ConfigMap
metadata: {name: som-https-conf, namespace: som-shop}
data:
  default.conf: |
    server {
      listen 8443 ssl;
      ssl_certificate     /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      location / { proxy_pass http://som-web.som-shop.svc.cluster.local:80; proxy_set_header Host $host; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: som-https, namespace: som-shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: som-https}}
  template:
    metadata: {labels: {app: som-https}}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports: [{name: https, containerPort: 8443}]
        volumeMounts:
        - {name: conf, mountPath: /etc/nginx/conf.d, readOnly: true}
        - {name: tls, mountPath: /etc/nginx/tls, readOnly: true}
      volumes:
      - {name: conf, configMap: {name: som-https-conf}}
      - {name: tls, secret: {secretName: som-tls, defaultMode: 0400}}
---
apiVersion: v1
kind: Service
metadata: {name: som-https, namespace: som-shop}
spec:
  type: NodePort
  selector: {app: som-https}
  ports: [{port: 443, targetPort: https, nodePort: 30082}]
