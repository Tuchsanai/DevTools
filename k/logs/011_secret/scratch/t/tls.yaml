apiVersion: v1
kind: ConfigMap
metadata: {name: ngx-tls-conf}
data:
  default.conf: |
    server {
      listen 443 ssl;
      ssl_certificate     /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      location / { default_type text/plain; return 200 "HTTPS ร้านน้องส้ม\n"; }
    }
---
apiVersion: v1
kind: Pod
metadata: {name: ngx-tls, labels: {app: ngx-tls}}
spec:
  containers:
  - name: nginx
    image: nginx:1.27-alpine
    ports: [{containerPort: 443, name: https}]
    volumeMounts:
    - {name: conf, mountPath: /etc/nginx/conf.d}
    - {name: tls, mountPath: /etc/nginx/tls, readOnly: true}
  volumes:
  - {name: conf, configMap: {name: ngx-tls-conf}}
  - {name: tls, secret: {secretName: shop-tls, defaultMode: 0400}}
---
apiVersion: v1
kind: Service
metadata: {name: ngx-tls}
spec:
  type: NodePort
  selector: {app: ngx-tls}
  ports: [{port: 443, targetPort: https, nodePort: 30081}]
---
apiVersion: v1
kind: Pod
metadata: {name: proj}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep","3600"]
    volumeMounts: [{name: all, mountPath: /etc/som, readOnly: true}]
  volumes:
  - name: all
    projected:
      defaultMode: 0440
      sources:
      - configMap: {name: shop-config, items: [{key: announcement.txt, path: announcement.txt}]}
      - secret: {name: demo, items: [{key: password, path: db/password}]}
      - downwardAPI: {items: [{path: pod-name, fieldRef: {fieldPath: metadata.name}}]}
