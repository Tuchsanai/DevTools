apiVersion: v1
kind: Secret
metadata: {name: sd}
type: Opaque
data:
  PASSWORD: bWVvdzEyMzQ=
stringData:
  PASSWORD: override-by-stringData
  USERNAME: som
---
apiVersion: v1
kind: Pod
metadata: {name: spod}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep","3600"]
    env:
    - name: DB_PASSWORD
      valueFrom: {secretKeyRef: {name: demo, key: password}}
    envFrom: [{prefix: SD_, secretRef: {name: sd}}]
    volumeMounts:
    - {name: s, mountPath: /etc/secret, readOnly: true}
    - {name: s4, mountPath: /etc/secret400, readOnly: true}
  volumes:
  - {name: s, secret: {secretName: demo}}
  - {name: s4, secret: {secretName: demo, defaultMode: 0400}}
