---
# Source: som-shop/templates/db.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: som-db
  labels:
    app.kubernetes.io/name: som-shop
    app.kubernetes.io/instance: som
    app.kubernetes.io/version: "1.7"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: som-shop-0.1.0
spec:
  serviceName: som-db
  replicas: 1
  selector:
    matchLabels:
      app: som-db
  template:
    metadata:
      labels:
        app: som-db
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          env:
            - name: POSTGRES_USER
              value: "som"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: som-db-secret, key: POSTGRES_PASSWORD}
            - name: POSTGRES_DB
              value: "catshop"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - {name: postgres, containerPort: 5432}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "som", "-d", "catshop", "-h", "127.0.0.1"]
            periodSeconds: 3
          livenessProbe:
            tcpSocket: {port: postgres}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: standard
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi

