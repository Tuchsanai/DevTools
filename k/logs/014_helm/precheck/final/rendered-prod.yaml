# Source: som-shop/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: som-web
  labels:
    app.kubernetes.io/name: som-shop
    app.kubernetes.io/instance: som
    app.kubernetes.io/version: "1.7"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: som-shop-0.1.0
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: som-prod-som-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["shop.localhost"]
      secretName: som-tls
  rules:
    - host: "shop.localhost"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: som-web
                port: {name: http}

