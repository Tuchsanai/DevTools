# Source: som-shop/templates/tests/test-health.yaml
# ผู้ตรวจรับร้าน: helm test <release> → Pod นี้ต้อง Succeeded
apiVersion: v1
kind: Pod
metadata:
  name: som-test-health
  labels:
    app.kubernetes.io/name: som-shop
    app.kubernetes.io/instance: som
    app.kubernetes.io/version: "1.7"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: som-shop-0.1.0
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: curl
      image: curlimages/curl:8.22.0
      command: ["sh", "-c"]
      args:
        - |
          set -e
          echo "health:   $(curl -sf http://som-web/api/health)"
          echo "whoami:   $(curl -sf http://som-web/api/whoami)"
          curl -sf http://som-web/api/products | grep -q . && echo "products: ok"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}

---
# Source: som-shop/templates/seed-job.yaml
# hook: ขั้นตอนพิเศษหลังเปิดร้าน/ปรับปรุงร้าน — เติมสินค้าเข้าชั้น (สร้างตาราง + สินค้าตั้งต้น ทำซ้ำได้)
apiVersion: batch/v1
kind: Job
metadata:
  name: som-seed
  labels:
    app.kubernetes.io/name: som-shop
    app.kubernetes.io/instance: som
    app.kubernetes.io/version: "1.7"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: som-shop-0.1.0
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-for-db
          image: postgres:17.11-alpine
          command: ["sh", "-c", "until pg_isready -h som-db-0.som-db -p 5432; do echo waiting for db; sleep 2; done"]
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      containers:
        - name: seed
          image: som-shop-web:1.7
          imagePullPolicy: IfNotPresent
          command: ["node", "scripts/seed.mjs"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: som-db-secret, key: DATABASE_URL}

