# Source: som-shop/templates/web.yaml
# หน้าร้าน: Deployment + Service ClusterIP
apiVersion: apps/v1
kind: Deployment
metadata:
  name: som-web
  labels:
    app.kubernetes.io/name: som-shop
    app.kubernetes.io/instance: som
    app.kubernetes.io/version: "1.7"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: som-shop-0.1.0
spec:
  revisionHistoryLimit: 5
  minReadySeconds: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app: som-web
  template:
    metadata:
      labels:
        app: som-web
      annotations:
        # แก้กระดานประกาศ/ซอง → ค่า checksum เปลี่ยน → ได้ Pod ใหม่เอง (ไม่ต้อง rollout restart)
        checksum/config: 828f240613eb221462dd62f76997754752c8d31e2a74d510109d11b24f80090d
        checksum/secret: 97f731ed46fbd5621ab2ef2728fbac41663f980649ee012c1b8c3240e5c3ee42
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-for-db
          image: postgres:17.11-alpine
          command: ["sh", "-c", "until pg_isready -h som-db-0.som-db -p 5432; do echo waiting for db; sleep 2; done"]
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: announcement
          configMap:
            name: som-announcement
      containers:
        - name: web
          image: som-shop-web:1.7
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: som-db-secret, key: DATABASE_URL}
            - {name: PORT, value: "3000"}
            - {name: HOSTNAME, value: "0.0.0.0"}
          envFrom:
            - configMapRef:
                name: som-web-config
          volumeMounts:
            - {name: announcement, mountPath: /etc/som, readOnly: true}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /api/live, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 192Mi

