{{- $fn := include "som-shop.fullname" . }}
# หน้าร้าน: Deployment + Service ClusterIP
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-web
  labels:
    {{- include "som-shop.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- /* hpa.enabled=true → ไม่ใส่ replicas ให้ HPA ดูแล (บท 013: กับดัก replicas ทับ HPA) */}}
  {{- end }}
  revisionHistoryLimit: 5
  minReadySeconds: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app: {{ $fn }}-web
  template:
    metadata:
      labels:
        app: {{ $fn }}-web
      annotations:
        # แก้กระดานประกาศ/ซอง → ค่า checksum เปลี่ยน → ได้ Pod ใหม่เอง (ไม่ต้อง rollout restart)
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      {{- if .Values.db.enabled }}
      initContainers:
        - name: wait-for-db
          image: {{ .Values.db.image }}
          command: ["sh", "-c", "until pg_isready -h {{ $fn }}-db-0.{{ $fn }}-db -p 5432; do echo waiting for db; sleep 2; done"]
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      {{- end }}
      volumes:
        - name: announcement
          configMap:
            name: {{ $fn }}-announcement
      containers:
        - name: web
          image: {{ include "som-shop.webImage" . }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ $fn }}-db-secret, key: DATABASE_URL}
            - {name: PORT, value: "3000"}
            - {name: HOSTNAME, value: "0.0.0.0"}
          envFrom:
            - configMapRef:
                name: {{ $fn }}-web-config
          volumeMounts:
            - {name: announcement, mountPath: /etc/som, readOnly: true}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /api/live, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-web
  labels:
    {{- include "som-shop.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ $fn }}-web
  ports:
    - {name: http, port: 80, targetPort: http}
