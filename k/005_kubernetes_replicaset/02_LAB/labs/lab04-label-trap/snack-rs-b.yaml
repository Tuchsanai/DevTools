# LAB 4 (ทางเลือก): หัวหน้ากะคนที่สองที่ selector ซ้ำกับ snack-rs (ห้ามทำในงานจริง)
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: snack-rs-b
  namespace: rs-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: snack
  template:
    metadata:
      labels:
        app: snack
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo บูธของ snack-rs-b; sleep 3600"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
