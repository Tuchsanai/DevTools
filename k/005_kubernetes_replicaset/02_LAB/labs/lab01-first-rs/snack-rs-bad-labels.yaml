# LAB 1: ตั้งใจพิมพ์ป้ายผิด (snak) → label ของ template ไม่ตรง selector → API server ปฏิเสธ
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: snack-rs-bad
  namespace: rs-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: snack
  template:
    metadata:
      labels:
        app: snak            # ← พิมพ์ผิด ไม่ตรงกับ selector
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
