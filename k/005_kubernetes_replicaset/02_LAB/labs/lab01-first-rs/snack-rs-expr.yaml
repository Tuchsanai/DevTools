# LAB 1: selector แบบ matchExpressions — นับ Pod ที่ tier เป็น snack หรือ drink และต้องไม่มีป้าย track
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: snack-rs-expr
  namespace: rs-lab
spec:
  replicas: 2
  selector:
    matchExpressions:
      - { key: tier, operator: In, values: [snack, drink] }
      - { key: track, operator: DoesNotExist }
  template:
    metadata:
      labels:
        tier: drink          # อยู่ในรายการ In → ผ่าน และไม่มีป้าย track → ผ่าน
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
