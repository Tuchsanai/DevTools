# LAB 7: ขอ 6 บูธ แต่ใบงบให้ 4 Pod → RS สร้างได้ 4 ตัว ที่เหลือ FailedCreate
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: quota-rs
  namespace: rs-quota
spec:
  replicas: 6
  selector:
    matchLabels:
      app: quota
  template:
    metadata:
      labels:
        app: quota
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          # ไม่ระบุ resources → LimitRange เติมค่า default ให้
