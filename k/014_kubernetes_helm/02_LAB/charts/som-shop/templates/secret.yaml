{{- $fn := include "som-shop.fullname" . -}}
{{- $pw := include "som-shop.dbPassword" . -}}
# ซองปิดผนึก: รหัสฐานข้อมูล + DATABASE_URL (Helm เก็บค่านี้ใน release Secret ด้วย — ถอดได้!)
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fn }}-db-secret
  labels:
    {{- include "som-shop.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pw | quote }}
  {{- if .Values.db.enabled }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-db-0.%s-db:5432/%s" .Values.db.user $pw $fn $fn .Values.db.name | quote }}
  {{- else }}
  DATABASE_URL: {{ required "db.enabled=false ต้องตั้ง externalDatabase.url" .Values.externalDatabase.url | quote }}
  {{- end }}
