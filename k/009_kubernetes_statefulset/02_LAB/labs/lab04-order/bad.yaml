# LAB 4: OrderedReady (ค่า default) — bad-0 ไม่ Ready จนกว่าจะมีไฟล์ /tmp/ready → bad-1 ยังไม่เกิด
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bad
spec:
  serviceName: web
  replicas: 3
  selector:
    matchLabels:
      app: bad
  template:
    metadata:
      labels:
        app: bad
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: c
          image: busybox:1.36
          command: ["sleep", "3600"]
          readinessProbe:              # Ready เมื่อ cat /tmp/ready สำเร็จ (สร้างด้วย kubectl exec ... touch)
            exec:
              command: ["cat", "/tmp/ready"]
            periodSeconds: 2
