# LAB 4: Parallel — สร้าง/ลบทุกบูธพร้อมกัน ไม่รอกันตามลำดับ
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: par
spec:
  serviceName: web
  podManagementPolicy: Parallel      # ค่า default คือ OrderedReady
  replicas: 3
  selector:
    matchLabels:
      app: par
  template:
    metadata:
      labels:
        app: par
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: c
          image: busybox:1.36
          command: ["sleep", "3600"]
