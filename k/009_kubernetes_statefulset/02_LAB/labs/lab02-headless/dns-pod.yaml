# LAB 2: Pod เครื่องมือ (busybox) ไว้ถาม DNS ด้วย kubectl exec dns -- nslookup ...
# (ทางเลือกแทน kubectl run -it สำหรับคนที่ terminal ไม่รองรับโหมดโต้ตอบ)
apiVersion: v1
kind: Pod
metadata:
  name: dns
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: dns
      image: busybox:1.36
      command: ["sleep", "3600"]
