# LAB 10 (ขั้น A): หน้าร้านสภาพท้ายบท 008 — web ต่อ db ผ่าน Service ClusterIP "som-db"
# (เหมือนบท 008 ทุกอย่าง เปลี่ยนแค่ footer เป็น LAB 009)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: som-web
  namespace: som-shop
  labels:
    app: som-web
  annotations:
    # บันทึกเหตุผลของ revision นี้ลงสมุด (แสดงในคอลัมน์ CHANGE-CAUSE ของ rollout history)
    kubernetes.io/change-cause: "1.2 ร้านจำได้ (db ใช้ PVC)"
spec:
  replicas: 3
  revisionHistoryLimit: 5          # เก็บ ReplicaSet รุ่นเก่าไว้ย้อนได้ 5 รุ่น
  progressDeadlineSeconds: 60      # rollout ไม่คืบหน้าเกิน 60 วิ = ล้มเหลว
  minReadySeconds: 3               # Pod ใหม่ต้องพร้อมต่อเนื่อง 3 วิ ถึงนับว่าใช้ได้
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                  # เปิดบูธใหม่เกินได้ 1 ตัว
      maxUnavailable: 0            # ห้ามบูธที่พร้อมลดลงเลย → ลูกค้าไม่เจอร้านว่าง
  selector:
    matchLabels:
      app: som-web
  template:
    metadata:
      labels:
        app: som-web
    spec:
      terminationGracePeriodSeconds: 30   # เวลาปิดร้านอย่างสุภาพ (preStop + SIGTERM) ก่อนโดน SIGKILL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # 1) รอจน Service som-db มี db ที่พร้อม
        - name: wait-for-db
          image: postgres:17.11-alpine
          command:
            - sh
            - -c
            - until pg_isready -h som-db -p 5432 -U som -d catshop; do echo "รอฐานข้อมูล som-db..."; sleep 2; done; echo "ฐานข้อมูลพร้อมแล้ว"
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
        # 2) เติมสินค้าเข้าชั้น (สร้างตาราง + สินค้าตั้งต้น) — ทุก Pod รัน แต่มี advisory lock กันชน
        - name: db-seed
          image: som-shop-web:1.2
          imagePullPolicy: IfNotPresent
          command: ["node", "scripts/seed.mjs"]
          securityContext:
            runAsUser: 1000          # USER node ของ image เป็น "ชื่อ" → ใส่เลขให้ runAsNonRoot ตรวจได้
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATABASE_URL
              value: postgres://som:meow1234@som-db:5432/catshop
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 256Mi }
      containers:
        - name: web
          image: som-shop-web:1.2    # รุ่นและธีมฝังอยู่ใน image (APP_VERSION/APP_THEME)
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POD_NAMESPACE    # Downward API (บท 003)
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SHOP_NAME
              value: "ร้านอาหารแมวน้องส้ม"
            - name: SHOP_FOOTER
              value: "Next.js + PostgreSQL · Kubernetes LAB 009 · namespace $(POD_NAMESPACE)"
            - name: DATABASE_URL     # เรียก db ด้วยชื่อ Service (ไม่ใช่ IP ของ Pod db)
              value: postgres://som:meow1234@som-db:5432/catshop
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:            # ต่อ db ได้ไหม (SELECT 1) → ไม่ผ่าน = Service ไม่ส่งลูกค้ามา
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:                 # ถูกสั่งปิดแล้วยังเสิร์ฟต่อ 5 วิ ระหว่างที่ทุก Node ลบบูธนี้ออกจากรายชื่อ
              sleep:
                seconds: 5
          livenessProbe:             # process ยังไม่ค้าง (ไม่แตะ db)
            httpGet:
              path: /api/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
# ประภาคารของหน้าร้าน: NodePort 30080 → เปิด http://localhost:30080 บนเครื่องนักศึกษา
apiVersion: v1
kind: Service
metadata:
  name: som-web
  namespace: som-shop
spec:
  type: NodePort
  selector:
    app: som-web
  ports:
    - port: 80
      targetPort: http       # = 3000 ของ container web
      nodePort: 30080
