# LAB 8: 2 container ใน Pod เดียว ใช้ network ร่วมกัน (IP เดียว คุยกันผ่าน localhost)
apiVersion: v1
kind: Pod
metadata:
  name: shared-localhost-pod
spec:
  containers:
    - name: web                 # container หลัก: nginx ฟัง port 80
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
    - name: helper              # container ผู้ช่วย: ไม่มีเว็บของตัวเอง
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
