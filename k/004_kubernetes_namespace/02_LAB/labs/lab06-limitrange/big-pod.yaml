# LAB 6: ขอ limit cpu 1 core ซึ่งเกิน max 500m ของ LimitRange → ถูกปฏิเสธ
apiVersion: v1
kind: Pod
metadata:
  name: big
  namespace: budget
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: 100m, memory: 64Mi }
        limits:   { cpu: "1", memory: 128Mi }
