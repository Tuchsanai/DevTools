# LAB 5/6: Pod ที่ไม่ระบุ resources เลย
# LAB 5 (มีแต่ quota) → ถูกปฏิเสธ "must specify ..."; LAB 6 (เพิ่ม LimitRange) → ผ่าน เพราะได้ค่า default
apiVersion: v1
kind: Pod
metadata:
  name: no-request
  namespace: budget
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
