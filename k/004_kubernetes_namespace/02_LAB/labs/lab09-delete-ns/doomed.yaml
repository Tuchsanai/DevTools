# LAB 9: โซนที่จะถูกลบทั้งก้อน — ใส่ของหลายชนิดไว้ดูว่าหายตามไปหมด
apiVersion: v1
kind: Namespace
metadata:
  name: doomed
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: menu
  namespace: doomed
data:
  today: "ปลาทูน่า"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleaner
  namespace: doomed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cleaner-role
  namespace: doomed
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleaner-binding
  namespace: doomed
subjects:
  - kind: ServiceAccount
    name: cleaner
    namespace: doomed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cleaner-role
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: doomed-quota
  namespace: doomed
spec:
  hard:
    pods: "5"
---
# Pod 2 ตัว: sleep เป็น PID 1 ไม่ตอบ SIGTERM → รอครบ grace 15 วิ
# โซนจึงค้าง Terminating นานพอให้ลองสร้างของใหม่ระหว่างลบ
apiVersion: v1
kind: Pod
metadata:
  name: crate-1
  namespace: doomed
spec:
  terminationGracePeriodSeconds: 15
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: crate-2
  namespace: doomed
spec:
  terminationGracePeriodSeconds: 15
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
