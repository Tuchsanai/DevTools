document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; padding: 0; height: 100%; background: #eef0f4; }\n  a { color: #f0503c; text-decoration: none; }\n  a:hover { color: #ff7a66; text-decoration: underline; }\n<\u002Fstyle>\n<script src=\"563c88d5-a7e6-46ac-a929-6e23eff48dbf\"><\u002Fscript>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n<section data-label=\"Title\" data-speaker-notes=\"แนะนำหัวข้อ: วันนี้จะพูดถึง git worktree ฟีเจอร์ที่อยู่ใน git มาตั้งแต่เวอร์ชัน 2.5 (ปี 2015) แต่คนใช้กันน้อยมาก ทั้งที่แก้ปัญหาที่ dev เจอทุกวัน\" style=\"background: #ffffff; color: #1b1f27; font-family: 'IBM Plex Sans Thai', sans-serif; display: flex; flex-direction: column; justify-content: center; padding: 100px 130px 80px; box-sizing: border-box;\">\n  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 26px; color: #f0503c; letter-spacing: 2px; margin-bottom: 36px;\">$ git --version 2.5+<\u002Fdiv>\n  <h1 style=\"margin: 0; font-size: 130px; font-weight: 700; letter-spacing: -3px; line-height: 1.05;\"><span>Git Worktree<\u002Fspan><\u002Fh1>\n  <p style=\"margin: 40px 0 0; font-size: 42px; font-weight: 400; color: #5c6472; line-height: 1.5; max-width: 1200px;\"><span>ทำงานหลาย branch พร้อมกัน โดยไม่ต้องสลับไปมา<\u002Fspan><\u002Fp>\n  <div style=\"margin-top: 90px; background: #f4f5f8; border: 1px solid #d8dce4; border-radius: 12px; padding: 28px 40px; font-family: 'JetBrains Mono', monospace; font-size: 27px; line-height: 1.7; width: fit-content;\">\n    <div style=\"display: flex; gap: 18px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span style=\"color: #1b1f27;\">git worktree add ../hotfix -b hotfix/login main<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Pain\" data-speaker-notes=\"เปิดด้วยสถานการณ์ที่ทุกคนเคยเจอ: ทำ feature อยู่ครึ่งทาง แล้วมีงานด่วนแทรก ต้อง commit งานที่ยังไม่เสร็จทิ้งไว้ก่อน (WIP commit) สลับ branch แล้ว build ใหม่ เสียทั้งเวลาและสมาธิ\" style=\"background: #ffffff; color: #1b1f27; font-family: 'IBM Plex Sans Thai', sans-serif; display: flex; flex-direction: column; padding: 100px 110px 80px; box-sizing: border-box;\">\n  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #f0503c; letter-spacing: 2px; margin-bottom: 20px;\">01 · THE PROBLEM<\u002Fdiv>\n  <h2 style=\"margin: 0 0 56px; font-size: 58px; font-weight: 700; letter-spacing: -1px;\"><span>ต้นทุนของการสลับ branch<\u002Fspan><\u002Fh2>\n  <div style=\"display: grid; grid-template-columns: 1fr 1.1fr; gap: 80px; align-items: start;\">\n    <div style=\"display: flex; flex-direction: column; gap: 36px; font-size: 33px; line-height: 1.55;\">\n      <p style=\"margin: 0;\"><span>กำลังทำ feature อยู่ครึ่งทาง — มี hotfix ด่วนเข้ามา ต้องสลับไปแก้บน branch อื่น<\u002Fspan><\u002Fp>\n      <p style=\"margin: 0; color: #5c6472;\"><span>งานที่ยังไม่เสร็จต้องถูก commit ทิ้งไว้ก่อน (WIP commit) แล้วค่อยแกะกลับมาทำต่อภายหลัง<\u002Fspan><\u002Fp>\n      <p style=\"margin: 0; color: #5c6472;\"><span>dependencies และ build cache ถูกเขียนทับทุกครั้งที่ checkout ข้าม branch<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background: #f4f5f8; border: 1px solid #d8dce4; border-radius: 12px; padding: 36px 44px; font-family: 'JetBrains Mono', monospace; font-size: 26px; line-height: 2.0;\">\n      <div style=\"display: flex; gap: 16px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>git branch --show-current<\u002Fspan><\u002Fdiv>\n      <div style=\"color: #5c6472; padding-left: 34px;\"><span>feature/checkout-v2<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; gap: 16px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>git commit -am \"WIP: ยังไม่เสร็จ\"<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; gap: 16px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>git checkout hotfix/login<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; gap: 16px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>npm install &amp;&amp; npm run build<\u002Fspan><\u002Fdiv>\n      <div style=\"color: #8a92a0; padding-left: 34px;\"><span># ...รอ build 10 นาที<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; gap: 16px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>git checkout feature/checkout-v2<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; gap: 16px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>git reset HEAD~1<\u002Fspan><\u002Fdiv>\n      <div style=\"color: #8a92a0; padding-left: 34px;\"><span># ...แล้ว context เมื่อกี้อยู่ไหนนะ<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"What\" data-speaker-notes=\"นิยาม: worktree คือ working directory เพิ่มเติมของ repo เดิม ทุก worktree ใช้ .git database ร่วมกัน — ไม่ใช่การ clone ใหม่\" style=\"background: #ffffff; color: #1b1f27; font-family: 'IBM Plex Sans Thai', sans-serif; display: flex; flex-direction: column; padding: 100px 110px 80px; box-sizing: border-box;\">\n  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #f0503c; letter-spacing: 2px; margin-bottom: 20px;\">02 · CONCEPT<\u002Fdiv>\n  <h2 style=\"margin: 0 0 64px; font-size: 58px; font-weight: 700; letter-spacing: -1px;\"><span>Git Worktree คืออะไร<\u002Fspan><\u002Fh2>\n  <p style=\"margin: 0 0 72px; font-size: 44px; line-height: 1.5; max-width: 1500px; font-weight: 500;\"><span>1 repository → หลาย working directory ที่ checkout branch ต่างกัน และทำงานพร้อมกันได้<\u002Fspan><\u002Fp>\n  <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 40px;\">\n    <div style=\"background: #f8f9fb; border: 1px solid #d8dce4; border-radius: 14px; padding: 40px 44px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 26px; color: #f0503c; margin-bottom: 20px;\">SHARED<\u002Fdiv>\n      <p style=\"margin: 0; font-size: 30px; line-height: 1.55; color: #3a4150;\"><span>ทุก worktree ใช้ object database และ refs ชุดเดียวกัน — commit จากที่หนึ่ง เห็นได้ทันทีจากอีกที่<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background: #f8f9fb; border: 1px solid #d8dce4; border-radius: 14px; padding: 40px 44px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 26px; color: #f0503c; margin-bottom: 20px;\">ISOLATED<\u002Fdiv>\n      <p style=\"margin: 0; font-size: 30px; line-height: 1.55; color: #3a4150;\"><span>แต่ละ directory มีไฟล์, index และ HEAD ของตัวเอง — แก้ไขงานคนละ branch โดยไม่รบกวนกัน<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background: #f8f9fb; border: 1px solid #d8dce4; border-radius: 14px; padding: 40px 44px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 26px; color: #f0503c; margin-bottom: 20px;\">CHEAP<\u002Fdiv>\n      <p style=\"margin: 0; font-size: 30px; line-height: 1.55; color: #3a4150;\"><span>ไม่ต้อง clone ซ้ำ — สร้างได้ในไม่กี่วินาที ใช้พื้นที่เพิ่มเฉพาะไฟล์ working copy<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Structure\" data-speaker-notes=\"อธิบาย diagram: repo หลักคือ main worktree ส่วน worktree ที่เพิ่มเข้ามาเรียกว่า linked worktree ทั้งหมดชี้กลับไปที่ .git เดียวกัน กติกาสำคัญ: หนึ่ง branch checkout ได้ในหนึ่ง worktree เท่านั้น\" style=\"background: #ffffff; color: #1b1f27; font-family: 'IBM Plex Sans Thai', sans-serif; display: flex; flex-direction: column; padding: 100px 110px 80px; box-sizing: border-box;\">\n  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #f0503c; letter-spacing: 2px; margin-bottom: 20px;\">03 · CONCEPT<\u002Fdiv>\n  <h2 style=\"margin: 0 0 70px; font-size: 58px; font-weight: 700; letter-spacing: -1px;\"><span>โครงสร้างของ worktree<\u002Fspan><\u002Fh2>\n  <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; column-gap: 48px; max-width: 1560px; margin: 0 auto; width: 100%;\">\n    <div style=\"background: #f8f9fb; border: 1px solid #d8dce4; border-radius: 14px; padding: 34px 40px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; margin-bottom: 14px;\">~/my-app<\u002Fdiv>\n      <div style=\"display: flex; gap: 14px; align-items: center;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #1f9d55;\">[main]<\u002Fspan><span style=\"font-size: 24px; color: #5c6472;\">main worktree<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background: #fff5f3; border: 1px solid #f0503c; border-radius: 14px; padding: 34px 40px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; margin-bottom: 14px;\">~/my-app-hotfix<\u002Fdiv>\n      <div style=\"display: flex; gap: 14px; align-items: center;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #1f9d55;\">[hotfix/login]<\u002Fspan><span style=\"font-size: 24px; color: #5c6472;\">linked worktree<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background: #fff5f3; border: 1px solid #f0503c; border-radius: 14px; padding: 34px 40px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; margin-bottom: 14px;\">~/my-app-pr-123<\u002Fdiv>\n      <div style=\"display: flex; gap: 14px; align-items: center;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #1f9d55;\">[pr-123]<\u002Fspan><span style=\"font-size: 24px; color: #5c6472;\">linked worktree<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; justify-content: center;\"><div style=\"width: 2px; height: 48px; background: #c3c9d4;\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"display: flex; justify-content: center;\"><div style=\"width: 2px; height: 48px; background: #c3c9d4;\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"display: flex; justify-content: center;\"><div style=\"width: 2px; height: 48px; background: #c3c9d4;\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"grid-column: 1 / 4; height: 2px; background: #c3c9d4; margin: 0 calc((100% - 96px) / 6);\"><\u002Fdiv>\n    <div style=\"grid-column: 1 / 4; display: flex; justify-content: center;\"><div style=\"width: 2px; height: 48px; background: #c3c9d4;\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"grid-column: 1 / 4; display: flex; justify-content: center;\">\n      <div style=\"background: #f4f5f8; border: 1px solid #d8dce4; border-radius: 14px; padding: 34px 70px; text-align: center;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; color: #f0503c; margin-bottom: 12px;\">.git<\u002Fdiv>\n        <div style=\"font-size: 26px; color: #5c6472;\"><span>object database + refs + config — ใช้ร่วมกันทุก worktree<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin: 64px auto 0; font-size: 30px; color: #5c6472; max-width: 1560px; width: 100%;\"><span>กติกาสำคัญ: หนึ่ง branch ถูก checkout ได้ในหนึ่ง worktree เท่านั้น — ป้องกันการแก้ไข branch เดียวกันซ้อนกันสองที่<\u002Fspan><\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Add\" data-speaker-notes=\"คำสั่งหลักตัวแรก: git worktree add มี 3 รูปแบบที่ใช้บ่อย — checkout branch เดิม, สร้าง branch ใหม่ด้วย -b, และ detached HEAD สำหรับทดลอง ชี้ให้เห็นว่า path กับ branch เป็นคนละเรื่องกัน\" style=\"background: #ffffff; color: #1b1f27; font-family: 'IBM Plex Sans Thai', sans-serif; display: flex; flex-direction: column; padding: 100px 110px 80px; box-sizing: border-box;\">\n  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #f0503c; letter-spacing: 2px; margin-bottom: 20px;\">04 · COMMANDS<\u002Fdiv>\n  <h2 style=\"margin: 0 0 56px; font-size: 58px; font-weight: 700; letter-spacing: -1px;\"><span>การสร้าง worktree — git worktree add<\u002Fspan><\u002Fh2>\n  <div style=\"display: flex; flex-direction: column; gap: 32px; max-width: 1560px;\">\n    <div style=\"background: #f4f5f8; border: 1px solid #d8dce4; border-radius: 12px; padding: 32px 44px; font-family: 'JetBrains Mono', monospace; font-size: 27px; line-height: 1.8;\">\n      <div style=\"display: flex; gap: 16px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>git worktree add ../hotfix hotfix/login<\u002Fspan><\u002Fdiv>\n      <div style=\"color: #8a92a0; padding-left: 34px;\"><span># checkout branch ที่มีอยู่แล้ว ไปยัง directory ใหม่<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background: #f4f5f8; border: 1px solid #d8dce4; border-radius: 12px; padding: 32px 44px; font-family: 'JetBrains Mono', monospace; font-size: 27px; line-height: 1.8;\">\n      <div style=\"display: flex; gap: 16px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>git worktree add -b fix/crash ../fix-crash main<\u002Fspan><\u002Fdiv>\n      <div style=\"color: #8a92a0; padding-left: 34px;\"><span># สร้าง branch ใหม่ชื่อ fix/crash จาก main พร้อม directory<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background: #f4f5f8; border: 1px solid #d8dce4; border-radius: 12px; padding: 32px 44px; font-family: 'JetBrains Mono', monospace; font-size: 27px; line-height: 1.8;\">\n      <div style=\"display: flex; gap: 16px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>git worktree add --detach ../experiment HEAD~3<\u002Fspan><\u002Fdiv>\n      <div style=\"color: #8a92a0; padding-left: 34px;\"><span># detached HEAD — เหมาะกับการทดสอบ commit เก่าแบบชั่วคราว<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin: 48px 0 0; font-size: 30px; color: #5c6472;\"><span>รูปแบบคำสั่ง: git worktree add &lt;path&gt; &lt;branch&gt; — path คือที่อยู่ directory, branch คือสิ่งที่จะ checkout<\u002Fspan><\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Manage\" data-speaker-notes=\"สามคำสั่งจัดการ: list ดูว่ามี worktree อะไรบ้าง, remove ลบอย่างถูกวิธี, prune เก็บกวาด metadata ตกค้าง เดโม่ live ตรงนี้ได้ถ้ามีเวลา\" style=\"background: #ffffff; color: #1b1f27; font-family: 'IBM Plex Sans Thai', sans-serif; display: flex; flex-direction: column; padding: 100px 110px 80px; box-sizing: border-box;\">\n  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #f0503c; letter-spacing: 2px; margin-bottom: 20px;\">05 · COMMANDS<\u002Fdiv>\n  <h2 style=\"margin: 0 0 56px; font-size: 58px; font-weight: 700; letter-spacing: -1px;\"><span>การจัดการ worktree — list / remove / prune<\u002Fspan><\u002Fh2>\n  <div style=\"display: flex; flex-direction: column; gap: 32px; max-width: 1560px;\">\n    <div style=\"background: #f4f5f8; border: 1px solid #d8dce4; border-radius: 12px; padding: 32px 44px; font-family: 'JetBrains Mono', monospace; font-size: 27px; line-height: 1.8;\">\n      <div style=\"display: flex; gap: 16px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>git worktree list<\u002Fspan><\u002Fdiv>\n      <div style=\"color: #5c6472; padding-left: 34px;\"><span>/Users/dev/my-app&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;a1b2c3d [main]<\u002Fspan><\u002Fdiv>\n      <div style=\"color: #5c6472; padding-left: 34px;\"><span>/Users/dev/my-app-hotfix&nbsp;&nbsp;e4f5a6b [hotfix/login]<\u002Fspan><\u002Fdiv>\n      <div style=\"color: #5c6472; padding-left: 34px;\"><span>/Users/dev/my-app-pr-123&nbsp;&nbsp;c7d8e9f [pr-123]<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background: #f4f5f8; border: 1px solid #d8dce4; border-radius: 12px; padding: 32px 44px; font-family: 'JetBrains Mono', monospace; font-size: 27px; line-height: 1.8;\">\n      <div style=\"display: flex; gap: 16px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>git worktree remove ../my-app-hotfix<\u002Fspan><\u002Fdiv>\n      <div style=\"color: #8a92a0; padding-left: 34px;\"><span># ลบ worktree ที่เลิกใช้ — มีไฟล์ค้างอยู่ต้องใช้ --force<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background: #f4f5f8; border: 1px solid #d8dce4; border-radius: 12px; padding: 32px 44px; font-family: 'JetBrains Mono', monospace; font-size: 27px; line-height: 1.8;\">\n      <div style=\"display: flex; gap: 16px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>git worktree prune<\u002Fspan><\u002Fdiv>\n      <div style=\"color: #8a92a0; padding-left: 34px;\"><span># เก็บกวาด metadata ของ worktree ที่ directory ถูกลบไปแล้ว<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Hands-on\" data-speaker-notes=\"Workflow จริงตั้งแต่ต้นจนจบ: รับ hotfix → สร้าง worktree → แก้ push → กลับมางานเดิมที่ไม่ถูกแตะเลย → เก็บกวาด ย้ำว่างาน feature เปิดค้างไว้ใน editor ได้ตลอด\" style=\"background: #ffffff; color: #1b1f27; font-family: 'IBM Plex Sans Thai', sans-serif; display: flex; flex-direction: column; padding: 100px 110px 80px; box-sizing: border-box;\">\n  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #f0503c; letter-spacing: 2px; margin-bottom: 20px;\">06 · HANDS-ON<\u002Fdiv>\n  <h2 style=\"margin: 0 0 56px; font-size: 58px; font-weight: 700; letter-spacing: -1px;\"><span>Workflow ตัวอย่าง — hotfix ด่วน<\u002Fspan><\u002Fh2>\n  <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 36px; max-width: 1640px;\">\n    <div style=\"background: #f8f9fb; border: 1px solid #d8dce4; border-radius: 14px; padding: 36px 40px;\">\n      <div style=\"display: flex; gap: 20px; align-items: baseline; margin-bottom: 18px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 30px; color: #f0503c; font-weight: 700;\">1<\u002Fspan><span style=\"font-size: 30px; font-weight: 600;\">สร้าง worktree จาก main<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 25px; color: #5c6472; line-height: 1.7;\"><span>$ git worktree add ../hotfix -b hotfix/login main<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background: #f8f9fb; border: 1px solid #d8dce4; border-radius: 14px; padding: 36px 40px;\">\n      <div style=\"display: flex; gap: 20px; align-items: baseline; margin-bottom: 18px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 30px; color: #f0503c; font-weight: 700;\">2<\u002Fspan><span style=\"font-size: 30px; font-weight: 600;\">แก้ไข ทดสอบ และ push จากใน worktree<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 25px; color: #5c6472; line-height: 1.7;\"><span>$ cd ../hotfix<\u002Fspan><br><span>$ git commit -am \"fix: login redirect\"<\u002Fspan><br><span>$ git push -u origin hotfix/login<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background: #f8f9fb; border: 1px solid #d8dce4; border-radius: 14px; padding: 36px 40px;\">\n      <div style=\"display: flex; gap: 20px; align-items: baseline; margin-bottom: 18px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 30px; color: #f0503c; font-weight: 700;\">3<\u002Fspan><span style=\"font-size: 30px; font-weight: 600;\">กลับไปทำ feature ต่อได้ทันที<\u002Fspan><\u002Fdiv>\n      <p style=\"margin: 0; font-size: 27px; color: #5c6472; line-height: 1.6;\"><span>directory เดิมไม่ถูกแตะต้อง — ไฟล์ที่แก้ค้างไว้, dependencies และ build cache อยู่ครบทุกอย่าง<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background: #f8f9fb; border: 1px solid #d8dce4; border-radius: 14px; padding: 36px 40px;\">\n      <div style=\"display: flex; gap: 20px; align-items: baseline; margin-bottom: 18px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 30px; color: #f0503c; font-weight: 700;\">4<\u002Fspan><span style=\"font-size: 30px; font-weight: 600;\">เสร็จแล้วเก็บกวาด<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 25px; color: #5c6472; line-height: 1.7;\"><span>$ git worktree remove ../hotfix<\u002Fspan><br><span>$ git branch -d hotfix/login<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"AI Agents\" data-speaker-notes=\"Use case ที่กำลังมาแรง: รัน AI coding agent หลายตัวขนานกัน แต่ละตัวได้ directory + branch ของตัวเอง ไม่แย่งเขียนไฟล์กัน เสร็จแล้วค่อย review และ merge ทีละ branch\" style=\"background: #ffffff; color: #1b1f27; font-family: 'IBM Plex Sans Thai', sans-serif; display: flex; flex-direction: column; padding: 100px 110px 80px; box-sizing: border-box;\">\n  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #f0503c; letter-spacing: 2px; margin-bottom: 20px;\">07 · USE CASE<\u002Fdiv>\n  <h2 style=\"margin: 0 0 48px; font-size: 58px; font-weight: 700; letter-spacing: -1px;\"><span>Use case — รัน AI coding agent หลายตัวพร้อมกัน<\u002Fspan><\u002Fh2>\n  <p style=\"margin: 0 0 48px; font-size: 32px; line-height: 1.55; color: #3a4150; max-width: 1500px;\"><span>แต่ละ agent ได้ working directory และ branch ของตัวเอง — ทำงานขนานกันโดยไม่แย่งเขียนไฟล์ แล้วค่อย review และ merge ทีละ branch<\u002Fspan><\u002Fp>\n  <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 36px; max-width: 1640px;\">\n    <div style=\"background: #f4f5f8; border: 1px solid #d8dce4; border-radius: 12px; overflow: hidden;\">\n      <div style=\"background: #eceef3; padding: 16px 28px; font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #5c6472; border-bottom: 1px solid #d8dce4;\">~/agent-auth<\u002Fdiv>\n      <div style=\"padding: 28px 32px; font-family: 'JetBrains Mono', monospace; font-size: 24px; line-height: 1.8;\">\n        <div style=\"color: #1f9d55;\"><span>[agent/auth]<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; gap: 14px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>claude \"แก้ระบบ OAuth\"<\u002Fspan><\u002Fdiv>\n        <div style=\"color: #8a92a0;\"><span># agent 1 กำลังทำงาน...<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background: #f4f5f8; border: 1px solid #d8dce4; border-radius: 12px; overflow: hidden;\">\n      <div style=\"background: #eceef3; padding: 16px 28px; font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #5c6472; border-bottom: 1px solid #d8dce4;\">~/agent-search<\u002Fdiv>\n      <div style=\"padding: 28px 32px; font-family: 'JetBrains Mono', monospace; font-size: 24px; line-height: 1.8;\">\n        <div style=\"color: #1f9d55;\"><span>[agent/search]<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; gap: 14px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>claude \"เพิ่ม fuzzy search\"<\u002Fspan><\u002Fdiv>\n        <div style=\"color: #8a92a0;\"><span># agent 2 กำลังทำงาน...<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background: #f4f5f8; border: 1px solid #d8dce4; border-radius: 12px; overflow: hidden;\">\n      <div style=\"background: #eceef3; padding: 16px 28px; font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #5c6472; border-bottom: 1px solid #d8dce4;\">~/agent-tests<\u002Fdiv>\n      <div style=\"padding: 28px 32px; font-family: 'JetBrains Mono', monospace; font-size: 24px; line-height: 1.8;\">\n        <div style=\"color: #1f9d55;\"><span>[agent/tests]<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; gap: 14px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>claude \"เขียน test ให้ครบ\"<\u002Fspan><\u002Fdiv>\n        <div style=\"color: #8a92a0;\"><span># agent 3 กำลังทำงาน...<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top: 44px; background: #f4f5f8; border: 1px solid #d8dce4; border-radius: 12px; padding: 26px 40px; font-family: 'JetBrains Mono', monospace; font-size: 25px; line-height: 1.7; width: fit-content;\">\n    <div style=\"display: flex; gap: 16px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>git worktree add ../agent-auth -b agent/auth main<\u002Fspan><\u002Fdiv>\n    <div style=\"color: #8a92a0; padding-left: 34px;\"><span># ทำซ้ำต่อ agent หนึ่งตัว — หนึ่ง worktree หนึ่ง branch<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Compare\" data-speaker-notes=\"เทียบสามทาง: สลับ branch ใน directory เดียว (วิธีเดิม), clone repo หลายชุด, และ worktree ชี้ว่า worktree ได้ความขนานแบบ clone แต่เร็วและ sync refs อัตโนมัติเพราะเป็น repo เดียวกัน\" style=\"background: #ffffff; color: #1b1f27; font-family: 'IBM Plex Sans Thai', sans-serif; display: flex; flex-direction: column; padding: 100px 110px 80px; box-sizing: border-box;\">\n  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #f0503c; letter-spacing: 2px; margin-bottom: 20px;\">08 · COMPARISON<\u002Fdiv>\n  <h2 style=\"margin: 0 0 56px; font-size: 58px; font-weight: 700; letter-spacing: -1px;\"><span>Worktree เทียบกับทางเลือกอื่น<\u002Fspan><\u002Fh2>\n  <sc-raw-table style=\"width: 100%; max-width: 1700px; border-collapse: collapse; font-size: 28px; line-height: 1.45;\">\n    <sc-raw-thead>\n      <sc-raw-tr>\n        <sc-raw-th style=\"text-align: left; padding: 22px 28px; border-bottom: 2px solid #c3c9d4; color: #5c6472; font-weight: 500;\"><\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align: left; padding: 22px 28px; border-bottom: 2px solid #c3c9d4; font-weight: 600;\"><span>สลับ branch ใน directory เดียว<\u002Fspan><\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align: left; padding: 22px 28px; border-bottom: 2px solid #c3c9d4; font-weight: 600;\"><span>clone หลายชุด<\u002Fspan><\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align: left; padding: 22px 28px; border-bottom: 2px solid #c3c9d4; font-weight: 700; color: #f0503c; background: rgba(240, 80, 60, 0.06);\"><span>git worktree<\u002Fspan><\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding: 22px 28px; border-bottom: 1px solid #d8dce4; color: #5c6472;\"><span>ทำงานหลาย branch พร้อมกัน<\u002Fspan><\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 22px 28px; border-bottom: 1px solid #d8dce4;\"><span>ไม่ได้<\u002Fspan><\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 22px 28px; border-bottom: 1px solid #d8dce4;\"><span>ได้<\u002Fspan><\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 22px 28px; border-bottom: 1px solid #d8dce4; background: rgba(240, 80, 60, 0.06);\"><span>ได้<\u002Fspan><\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding: 22px 28px; border-bottom: 1px solid #d8dce4; color: #5c6472;\"><span>เวลา setup<\u002Fspan><\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 22px 28px; border-bottom: 1px solid #d8dce4;\"><span>ทันที<\u002Fspan><\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 22px 28px; border-bottom: 1px solid #d8dce4;\"><span>ช้า — ดาวน์โหลดทั้ง repo<\u002Fspan><\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 22px 28px; border-bottom: 1px solid #d8dce4; background: rgba(240, 80, 60, 0.06);\"><span>ไม่กี่วินาที<\u002Fspan><\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding: 22px 28px; border-bottom: 1px solid #d8dce4; color: #5c6472;\"><span>disk space<\u002Fspan><\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 22px 28px; border-bottom: 1px solid #d8dce4;\"><span>น้อยที่สุด<\u002Fspan><\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 22px 28px; border-bottom: 1px solid #d8dce4;\"><span>เต็ม repo ต่อชุด<\u002Fspan><\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 22px 28px; border-bottom: 1px solid #d8dce4; background: rgba(240, 80, 60, 0.06);\"><span>เฉพาะ working copy<\u002Fspan><\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding: 22px 28px; border-bottom: 1px solid #d8dce4; color: #5c6472;\"><span>branch / refs ตรงกันเสมอ<\u002Fspan><\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 22px 28px; border-bottom: 1px solid #d8dce4;\"><span>ใช่ — repo เดียว<\u002Fspan><\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 22px 28px; border-bottom: 1px solid #d8dce4;\"><span>ต้อง fetch / push เอง<\u002Fspan><\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 22px 28px; border-bottom: 1px solid #d8dce4; background: rgba(240, 80, 60, 0.06);\"><span>ใช่ — แชร์ refs กัน<\u002Fspan><\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding: 22px 28px; color: #5c6472;\"><span>เหมาะกับ<\u002Fspan><\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 22px 28px;\"><span>งานเดี่ยวตามลำดับ<\u002Fspan><\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 22px 28px;\"><span>โปรเจกต์แยกขาดถาวร<\u002Fspan><\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 22px 28px; background: rgba(240, 80, 60, 0.06);\"><span>งานขนานใน repo เดิม<\u002Fspan><\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n<\u002Fsection>\n\n<section data-label=\"Caveats\" data-speaker-notes=\"ข้อควรระวัง 4 ข้อ: branch ซ้ำไม่ได้, untracked files ไม่ตามไป (node_modules/.env ต้อง setup ใหม่), ห้ามลบ folder ตรงๆ ให้ใช้ remove, และ submodule รองรับจำกัด\" style=\"background: #ffffff; color: #1b1f27; font-family: 'IBM Plex Sans Thai', sans-serif; display: flex; flex-direction: column; padding: 100px 110px 80px; box-sizing: border-box;\">\n  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #f0503c; letter-spacing: 2px; margin-bottom: 20px;\">09 · CAVEATS<\u002Fdiv>\n  <h2 style=\"margin: 0 0 56px; font-size: 58px; font-weight: 700; letter-spacing: -1px;\"><span>ข้อควรระวังและข้อจำกัด<\u002Fspan><\u002Fh2>\n  <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 36px; max-width: 1640px;\">\n    <div style=\"background: #f8f9fb; border: 1px solid #d8dce4; border-radius: 14px; padding: 40px 44px;\">\n      <div style=\"font-size: 31px; font-weight: 600; margin-bottom: 16px;\"><span>หนึ่ง branch ต่อหนึ่ง worktree<\u002Fspan><\u002Fdiv>\n      <p style=\"margin: 0; font-size: 27px; line-height: 1.55; color: #5c6472;\"><span>checkout branch ที่ถูกใช้อยู่ใน worktree อื่นจะได้ error: 'branch is already checked out'<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background: #f8f9fb; border: 1px solid #d8dce4; border-radius: 14px; padding: 40px 44px;\">\n      <div style=\"font-size: 31px; font-weight: 600; margin-bottom: 16px;\"><span>untracked files ไม่ตามไปด้วย<\u002Fspan><\u002Fdiv>\n      <p style=\"margin: 0; font-size: 27px; line-height: 1.55; color: #5c6472;\"><span>node_modules, .env และไฟล์ config ต้อง setup ใหม่ในแต่ละ worktree — เผื่อเวลา install ไว้ด้วย<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background: #f8f9fb; border: 1px solid #d8dce4; border-radius: 14px; padding: 40px 44px;\">\n      <div style=\"font-size: 31px; font-weight: 600; margin-bottom: 16px;\"><span>อย่าลบ directory ตรง ๆ<\u002Fspan><\u002Fdiv>\n      <p style=\"margin: 0; font-size: 27px; line-height: 1.55; color: #5c6472;\"><span>ลบด้วย rm จะเหลือ metadata ค้างใน .git — ใช้ git worktree remove หรือตามด้วย prune เสมอ<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background: #f8f9fb; border: 1px solid #d8dce4; border-radius: 14px; padding: 40px 44px;\">\n      <div style=\"font-size: 31px; font-weight: 600; margin-bottom: 16px;\"><span>submodules รองรับได้จำกัด<\u002Fspan><\u002Fdiv>\n      <p style=\"margin: 0; font-size: 27px; line-height: 1.55; color: #5c6472;\"><span>repo ที่พึ่งพา submodule หนัก ๆ ควรทดสอบ workflow ก่อนใช้จริง<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Summary\" data-speaker-notes=\"สรุป: worktree ให้ความขนานโดยไม่เสีย context สี่คำสั่งที่ต้องจำ ชวนให้ลองครั้งหน้าที่มี hotfix แทรก — สร้าง worktree แทนการสลับ branch\" style=\"background: #ffffff; color: #1b1f27; font-family: 'IBM Plex Sans Thai', sans-serif; display: flex; flex-direction: column; padding: 100px 130px 80px; box-sizing: border-box;\">\n  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #f0503c; letter-spacing: 2px; margin-bottom: 20px;\">10 · SUMMARY<\u002Fdiv>\n  <h2 style=\"margin: 0 0 40px; font-size: 58px; font-weight: 700; letter-spacing: -1px;\"><span>สรุปและ cheat sheet<\u002Fspan><\u002Fh2>\n  <p style=\"margin: 0 0 56px; font-size: 36px; line-height: 1.5; max-width: 1400px; font-weight: 500;\"><span>ครั้งหน้าที่มีงานด่วนแทรก — สร้าง worktree แทนการสลับ branch แล้วงานเดิมจะอยู่ตรงที่เราทิ้งไว้เสมอ<\u002Fspan><\u002Fp>\n  <div style=\"background: #f4f5f8; border: 1px solid #d8dce4; border-radius: 12px; padding: 40px 48px; font-family: 'JetBrains Mono', monospace; font-size: 27px; line-height: 2.1; max-width: 1500px;\">\n    <div style=\"display: flex; gap: 18px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>git worktree add &lt;path&gt; &lt;branch&gt;<\u002Fspan><span style=\"color: #8a92a0;\"># checkout branch เดิม<\u002Fspan><\u002Fdiv>\n    <div style=\"display: flex; gap: 18px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>git worktree add -b &lt;new&gt; &lt;path&gt; &lt;base&gt;<\u002Fspan><span style=\"color: #8a92a0;\"># สร้าง branch ใหม่<\u002Fspan><\u002Fdiv>\n    <div style=\"display: flex; gap: 18px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>git worktree list<\u002Fspan><span style=\"color: #8a92a0;\"># ดู worktree ทั้งหมด<\u002Fspan><\u002Fdiv>\n    <div style=\"display: flex; gap: 18px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>git worktree remove &lt;path&gt;<\u002Fspan><span style=\"color: #8a92a0;\"># ลบอย่างถูกวิธี<\u002Fspan><\u002Fdiv>\n    <div style=\"display: flex; gap: 18px;\"><span style=\"color: #f0503c;\">$<\u002Fspan><span>git worktree prune<\u002Fspan><span style=\"color: #8a92a0;\"># เก็บกวาด metadata<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
