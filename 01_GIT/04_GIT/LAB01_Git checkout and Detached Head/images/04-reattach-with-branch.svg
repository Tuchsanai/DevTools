<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="350" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="32" font-size="15" font-weight="bold" fill="#0f172a">4. `git switch -c experiment` — re-attach HEAD and keep your work</text>
  <text x="24" y="52" font-size="12" fill="#475569">A branch now points at the new commit, so it is reachable and safe. HEAD is attached again.</text>

  <!-- HEAD -> experiment -> bc16120 -->
  <rect x="440" y="66" width="80" height="30" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="480" y="86" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">HEAD</text>
  <line x1="480" y1="96" x2="480" y2="106" stroke="#64748b" stroke-width="2"/>
  <polygon points="475,106 485,106 480,114" fill="#64748b"/>
  <rect x="429" y="114" width="102" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="480" y="134" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">experiment</text>
  <line x1="480" y1="144" x2="480" y2="150" stroke="#64748b" stroke-width="2"/>
  <polygon points="475,150 485,150 480,158" fill="#64748b"/>

  <line x1="370" y1="257" x2="453" y2="200" stroke="#16a34a" stroke-width="2"/>
  <polygon points="460,195 456,204 450,196" fill="#16a34a"/>
  <circle cx="480" cy="182" r="24" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
  <text x="480" y="187" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">C3'</text>
  <text x="516" y="180" font-size="11" font-family="Consolas, monospace" fill="#334155">bc16120</text>
  <text x="516" y="196" font-size="11" fill="#15803d">reachable &#8212; safe from garbage collection</text>

  <!-- main -> C5 -->
  <rect x="571" y="210" width="80" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="611" y="230" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">main</text>
  <line x1="611" y1="240" x2="611" y2="238" stroke="#64748b" stroke-width="2"/>
  <polygon points="606,238 616,238 611,246" fill="#64748b"/>

  <!-- commit chain -->
  <line x1="90" y1="270" x2="177" y2="270" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="177,265 177,275 185,270" fill="#94a3b8"/>
  <line x1="220" y1="270" x2="307" y2="270" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="307,265 307,275 315,270" fill="#94a3b8"/>
  <line x1="350" y1="270" x2="437" y2="270" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="437,265 437,275 445,270" fill="#94a3b8"/>
  <line x1="480" y1="270" x2="567" y2="270" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="567,265 567,275 575,270" fill="#94a3b8"/>

  <circle cx="90" cy="270" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="275" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">C1</text>
  <text x="90" y="314" font-size="11" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">c58d7a9</text>

  <circle cx="220" cy="270" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="275" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">C2</text>
  <text x="220" y="314" font-size="11" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">684754d</text>

  <circle cx="350" cy="270" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="350" y="275" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">C3</text>
  <text x="350" y="314" font-size="11" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">39848d6</text>

  <circle cx="480" cy="270" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="275" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">C4</text>
  <text x="480" y="314" font-size="11" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">1f4bdd1</text>

  <circle cx="611" cy="270" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="611" y="275" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">C5</text>
  <text x="611" y="314" font-size="11" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">38681ca</text>

  <text x="24" y="340" font-size="11" font-family="Consolas, monospace" fill="#15803d">git checkout 39848d6  &#8594;  git switch -c experiment  &#8594;  git commit -am "..."   (HEAD is attached to a branch again)</text>
</svg>
