<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="470" fill="#ffffff" rx="8"/>

  <text x="580" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#24292f">เมื่อ git revert เจอ conflict ต้องทำอย่างไร</text>
  <text x="580" y="58" text-anchor="middle" font-size="13.5" fill="#57606a" font-style="italic">The revert pauses on a conflict — fix the file, git add, then git revert --continue</text>

  <!-- step 1 -->
  <rect x="40" y="95" width="320" height="120" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5" rx="10"/>
  <circle cx="70" cy="125" r="14" fill="#0969da"/>
  <text x="70" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="200" y="132" text-anchor="middle" font-size="14.5" font-weight="bold" font-family="Consolas, monospace" fill="#0969da">git revert &lt;hash&gt;</text>
  <text x="200" y="160" text-anchor="middle" font-size="13" fill="#24292f">Git พยายามสร้าง commit</text>
  <text x="200" y="180" text-anchor="middle" font-size="13" fill="#24292f">ที่ย้อนการแก้ไขของ commit นั้น</text>
  <line x1="360" y1="155" x2="416" y2="155" stroke="#57606a" stroke-width="2" marker-end="url(#arrowC)"/>

  <!-- step 2 -->
  <rect x="420" y="95" width="320" height="120" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5" rx="10"/>
  <circle cx="450" cy="125" r="14" fill="#cf222e"/>
  <text x="450" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="580" y="132" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#cf222e">CONFLICT (content)!</text>
  <text x="580" y="160" text-anchor="middle" font-size="13" fill="#24292f">การ revert หยุดรอ — ในไฟล์จะมี</text>
  <text x="580" y="180" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#cf222e">&lt;&lt;&lt;&lt;&lt;&lt;&lt;  =======  &gt;&gt;&gt;&gt;&gt;&gt;&gt;</text>
  <line x1="740" y1="155" x2="796" y2="155" stroke="#57606a" stroke-width="2" marker-end="url(#arrowC)"/>

  <!-- step 3 -->
  <rect x="800" y="95" width="320" height="120" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5" rx="10"/>
  <circle cx="830" cy="125" r="14" fill="#9a6700"/>
  <text x="830" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="960" y="132" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#9a6700">แก้ไขไฟล์ที่ conflict</text>
  <text x="960" y="160" text-anchor="middle" font-size="13" fill="#24292f">ลบเครื่องหมาย conflict ทั้งหมด</text>
  <text x="960" y="180" text-anchor="middle" font-size="13" fill="#24292f">เหลือไว้เฉพาะบรรทัดที่ต้องการเก็บ</text>

  <!-- down arrow from step 3 to step 4 -->
  <line x1="960" y1="215" x2="960" y2="266" stroke="#57606a" stroke-width="2" marker-end="url(#arrowC)"/>

  <!-- step 4 (bottom right) -->
  <rect x="800" y="270" width="320" height="120" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5" rx="10"/>
  <circle cx="830" cy="300" r="14" fill="#0969da"/>
  <text x="830" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">4</text>
  <text x="960" y="307" text-anchor="middle" font-size="14.5" font-weight="bold" font-family="Consolas, monospace" fill="#0969da">git add .</text>
  <text x="960" y="335" text-anchor="middle" font-size="13" fill="#24292f">บอก Git ว่าไฟล์นี้</text>
  <text x="960" y="355" text-anchor="middle" font-size="13" fill="#24292f">แก้ conflict เสร็จแล้ว</text>
  <line x1="796" y1="330" x2="744" y2="330" stroke="#57606a" stroke-width="2" marker-end="url(#arrowC)"/>

  <!-- step 5 (bottom middle) -->
  <rect x="420" y="270" width="320" height="120" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5" rx="10"/>
  <circle cx="450" cy="300" r="14" fill="#0969da"/>
  <text x="450" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">5</text>
  <text x="580" y="307" text-anchor="middle" font-size="14.5" font-weight="bold" font-family="Consolas, monospace" fill="#0969da">git revert --continue</text>
  <text x="580" y="335" text-anchor="middle" font-size="13" fill="#24292f">editor จะเปิดขึ้นมาให้ยืนยัน</text>
  <text x="580" y="355" text-anchor="middle" font-size="13" fill="#24292f">ข้อความ commit &#8594; บันทึกแล้วปิด</text>
  <line x1="416" y1="330" x2="364" y2="330" stroke="#57606a" stroke-width="2" marker-end="url(#arrowC)"/>

  <!-- step 6 (bottom left) -->
  <rect x="40" y="270" width="320" height="120" fill="#dafbe1" stroke="#2da44e" stroke-width="2" rx="10"/>
  <circle cx="70" cy="300" r="14" fill="#2da44e"/>
  <text x="70" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">6</text>
  <text x="200" y="307" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2da44e">&#10003; สำเร็จ</text>
  <text x="200" y="335" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#24292f">[master 88f51a2]</text>
  <text x="200" y="355" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#24292f">Revert "Update file1"</text>

  <text x="580" y="435" text-anchor="middle" font-size="13" fill="#57606a" font-style="italic">ถ้าไม่อยาก revert ต่อแล้ว ใช้ git revert --abort เพื่อยกเลิกและกลับสู่สถานะก่อนเริ่ม revert ได้เสมอ</text>
</svg>
