<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" font-family="Segoe UI, Sarabun, Noto Sans Thai, sans-serif">
  <rect x="0" y="0" width="980" height="390" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e2430">สรุป 4 รูปแบบของ git restore</text>

  <!-- header -->
  <rect x="25" y="52" width="330" height="36" rx="6" fill="#2d3748"/>
  <text x="40" y="76" font-size="13" font-weight="bold" fill="#ffffff">คำสั่ง</text>
  <rect x="359" y="52" width="185" height="36" rx="6" fill="#2d3748"/>
  <text x="451" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">แหล่งข้อมูล (source)</text>
  <rect x="548" y="52" width="185" height="36" rx="6" fill="#2d3748"/>
  <text x="640" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">แก้อะไร</text>
  <rect x="737" y="52" width="218" height="36" rx="6" fill="#2d3748"/>
  <text x="846" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">ใช้เมื่อไหร่</text>

  <!-- row 1 -->
  <rect x="25" y="94" width="330" height="60" rx="6" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.4"/>
  <text x="40" y="122" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#1a365d">git restore &lt;file&gt;</text>
  <text x="40" y="142" font-size="11.5" fill="#4a5568">ทิ้งการแก้ที่ยังไม่ได้ add</text>
  <rect x="359" y="94" width="185" height="60" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="451" y="130" text-anchor="middle" font-size="12" fill="#2d3748">Staging Area (index)</text>
  <rect x="548" y="94" width="185" height="60" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="640" y="130" text-anchor="middle" font-size="12" fill="#2d3748">Working Directory</text>
  <rect x="737" y="94" width="218" height="60" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="846" y="122" text-anchor="middle" font-size="11.5" fill="#2d3748">แก้ไฟล์มั่วจนพัง</text>
  <text x="846" y="140" text-anchor="middle" font-size="11.5" fill="#2d3748">อยากกลับไปจุดที่ดีล่าสุด</text>

  <!-- row 2 -->
  <rect x="25" y="160" width="330" height="60" rx="6" fill="#f0fff4" stroke="#2f855a" stroke-width="1.4"/>
  <text x="40" y="188" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#22543d">git restore --source=HEAD &lt;file&gt;</text>
  <text x="40" y="208" font-size="11.5" fill="#4a5568">ดึงเวอร์ชันของ commit ล่าสุด</text>
  <rect x="359" y="160" width="185" height="60" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="451" y="196" text-anchor="middle" font-size="12" fill="#2d3748">commit HEAD</text>
  <rect x="548" y="160" width="185" height="60" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="640" y="196" text-anchor="middle" font-size="12" fill="#2d3748">Working Directory</text>
  <rect x="737" y="160" width="218" height="60" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="846" y="188" text-anchor="middle" font-size="11.5" fill="#2d3748">ระบุชัดเจนว่าเอาเวอร์ชัน</text>
  <text x="846" y="206" text-anchor="middle" font-size="11.5" fill="#2d3748">ของ commit ล่าสุดมาทับ</text>

  <!-- row 3 -->
  <rect x="25" y="226" width="330" height="60" rx="6" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.4"/>
  <text x="40" y="254" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#44337a">git restore --source=HEAD~N &lt;file&gt;</text>
  <text x="40" y="274" font-size="11.5" fill="#4a5568">ย้อนไฟล์กลับไป N commit</text>
  <rect x="359" y="226" width="185" height="60" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="451" y="262" text-anchor="middle" font-size="12" fill="#2d3748">commit ย้อนหลัง N ขั้น</text>
  <rect x="548" y="226" width="185" height="60" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="640" y="262" text-anchor="middle" font-size="12" fill="#2d3748">Working Directory</text>
  <rect x="737" y="226" width="218" height="60" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="846" y="254" text-anchor="middle" font-size="11.5" fill="#2d3748">อยากได้โค้ดเวอร์ชันเก่า</text>
  <text x="846" y="272" text-anchor="middle" font-size="11.5" fill="#2d3748">มาเทียบหรือมาใช้ต่อ</text>

  <!-- row 4 -->
  <rect x="25" y="292" width="330" height="60" rx="6" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.4"/>
  <text x="40" y="320" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#7b341e">git restore --staged &lt;file&gt;</text>
  <text x="40" y="340" font-size="11.5" fill="#4a5568">ถอย git add (unstage)</text>
  <rect x="359" y="292" width="185" height="60" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="451" y="328" text-anchor="middle" font-size="12" fill="#2d3748">commit HEAD</text>
  <rect x="548" y="292" width="185" height="60" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="640" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#c05621">Staging Area เท่านั้น</text>
  <text x="640" y="340" text-anchor="middle" font-size="11" fill="#718096">(ไฟล์บนดิสก์ไม่เปลี่ยน)</text>
  <rect x="737" y="292" width="218" height="60" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="846" y="320" text-anchor="middle" font-size="11.5" fill="#2d3748">เผลอ git add ไฟล์ผิด</text>
  <text x="846" y="338" text-anchor="middle" font-size="11.5" fill="#2d3748">ก่อนจะ commit</text>

  <text x="490" y="376" text-anchor="middle" font-size="12.5" fill="#9b2c2c">⚠️ git restore ที่แตะ Working Directory <tspan font-weight="bold">กู้คืนไม่ได้</tspan> เพราะการแก้ไขนั้นยังไม่เคยถูก commit</text>
</svg>
