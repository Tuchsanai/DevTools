<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="Segoe UI, Sarabun, Noto Sans Thai, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="440" fill="#ffffff"/>
  <text x="470" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e2430">git restore ทำงานตรงไหนใน 3 พื้นที่ของ Git</text>
  <text x="470" y="52" text-anchor="middle" font-size="13" fill="#4a5568">ลูกศรสีเทา = เดินหน้า (add / commit) &#160;&#160;•&#160;&#160; ลูกศรสีแดง = ย้อนกลับด้วย git restore</text>

  <!-- Working Directory -->
  <rect x="40" y="80" width="240" height="120" rx="12" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="160" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6cb0">Working Directory</text>
  <text x="160" y="133" text-anchor="middle" font-size="12.5" fill="#4a5568">ไฟล์จริงบนดิสก์ที่เราแก้อยู่</text>
  <text x="160" y="163" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#1e2430">file1.txt file2.txt file3.txt</text>
  <text x="160" y="185" text-anchor="middle" font-size="11.5" fill="#718096">แก้แล้วยังไม่ git add</text>

  <!-- Staging Area -->
  <rect x="350" y="80" width="240" height="120" rx="12" fill="#fff3e8" stroke="#dd6b20" stroke-width="2.5"/>
  <text x="470" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#c05621">Staging Area</text>
  <text x="470" y="133" text-anchor="middle" font-size="12.5" fill="#4a5568">ที่พักก่อน commit (index)</text>
  <text x="470" y="163" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#1e2430">Changes to be committed</text>
  <text x="470" y="185" text-anchor="middle" font-size="11.5" fill="#718096">git add แล้ว แต่ยังไม่ commit</text>

  <!-- Repository -->
  <rect x="660" y="80" width="240" height="120" rx="12" fill="#f0fff4" stroke="#2f855a" stroke-width="2.5"/>
  <text x="780" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#276749">Repository (.git)</text>
  <text x="780" y="133" text-anchor="middle" font-size="12.5" fill="#4a5568">ประวัติ commit ถาวร</text>
  <text x="780" y="163" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#1e2430">HEAD → HEAD~1 → HEAD~2 …</text>
  <text x="780" y="185" text-anchor="middle" font-size="11.5" fill="#718096">commit แล้ว ปลอดภัย</text>

  <!-- forward arrows -->
  <line x1="284" y1="140" x2="344" y2="140" stroke="#4a5568" stroke-width="2" marker-end="url(#ar)"/>
  <text x="314" y="132" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#2d3748">git add</text>
  <line x1="594" y1="140" x2="654" y2="140" stroke="#4a5568" stroke-width="2" marker-end="url(#ar)"/>
  <text x="624" y="132" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#2d3748">git commit</text>

  <!-- restore A: index -> worktree -->
  <path d="M 470 200 C 470 262, 160 262, 160 200" fill="none" stroke="#c53030" stroke-width="2.2" marker-end="url(#arR)"/>
  <rect x="228" y="238" width="284" height="26" rx="6" fill="#fff5f5" stroke="#c53030" stroke-width="1.2"/>
  <text x="370" y="256" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#9b2c2c">git restore &lt;file&gt;</text>

  <!-- restore B: HEAD -> index -->
  <path d="M 780 200 C 780 325, 470 325, 470 200" fill="none" stroke="#c53030" stroke-width="2.2" marker-end="url(#arR)"/>
  <rect x="480" y="298" width="290" height="26" rx="6" fill="#fff5f5" stroke="#c53030" stroke-width="1.2"/>
  <text x="625" y="316" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#9b2c2c">git restore --staged &lt;file&gt;</text>

  <!-- restore C: commit -> worktree -->
  <path d="M 780 200 C 780 408, 160 408, 160 200" fill="none" stroke="#c53030" stroke-width="2.2" marker-end="url(#arR)"/>
  <rect x="300" y="368" width="340" height="26" rx="6" fill="#fff5f5" stroke="#c53030" stroke-width="1.2"/>
  <text x="470" y="386" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#9b2c2c">git restore --source=HEAD~N &lt;file&gt;</text>

  <text x="80" y="256" font-size="11" fill="#9b2c2c">ทิ้งการแก้ไข</text>
  <text x="820" y="316" font-size="11" fill="#9b2c2c">เอาออกจาก staging</text>
  <text x="700" y="386" font-size="11" fill="#9b2c2c">ดึงเวอร์ชันเก่ามาทับ</text>
</svg>
