<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1f6feb"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8250df"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="500" fill="#ffffff" rx="8"/>

  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#24292f">ภาพรวมคำสั่ง git restore ที่ใช้ใน LAB นี้</text>

  <!-- git add / git commit (top, gray) -->
  <text x="305" y="60" text-anchor="middle" font-size="13" fill="#57606a" font-family="Consolas, monospace">git add</text>
  <line x1="280" y1="88" x2="328" y2="88" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="595" y="60" text-anchor="middle" font-size="13" fill="#57606a" font-family="Consolas, monospace">git commit</text>
  <line x1="570" y1="88" x2="618" y2="88" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Working Directory -->
  <rect x="40" y="70" width="240" height="130" rx="10" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/>
  <text x="160" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a7f37">Working Directory</text>
  <text x="160" y="128" text-anchor="middle" font-size="13" fill="#57606a" font-family="Consolas, monospace">file1.txt file2.txt file3.txt</text>
  <text x="160" y="152" text-anchor="middle" font-size="13" fill="#57606a">(ไฟล์ที่นักศึกษากำลังแก้ไข)</text>

  <!-- Staging Area -->
  <rect x="330" y="70" width="240" height="130" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="2"/>
  <text x="450" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#9a6700">Staging Area (index)</text>
  <text x="450" y="128" text-anchor="middle" font-size="13" fill="#57606a">ไฟล์ที่ git add แล้ว</text>
  <text x="450" y="152" text-anchor="middle" font-size="13" fill="#57606a">รอการ commit</text>

  <!-- Repository with the lab's commit history -->
  <rect x="620" y="70" width="240" height="130" rx="10" fill="#ddf4ff" stroke="#218bff" stroke-width="2"/>
  <text x="740" y="96" text-anchor="middle" font-size="17" font-weight="bold" fill="#0969da">Repository</text>
  <text x="740" y="120" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#cf222e">f9a01b8  (HEAD)</text>
  <text x="740" y="139" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#24292f">9f170ba  (HEAD~1)</text>
  <text x="740" y="158" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#24292f">&#8942;</text>
  <text x="740" y="177" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#24292f">8cdace8  (HEAD~6)</text>
  <text x="740" y="194" text-anchor="middle" font-size="11.5" font-style="italic" fill="#57606a">commit ทั้ง 7 ครั้งจากขั้นตอน Setup</text>

  <!-- Task 4 : git restore staged (orange, label only) -->
  <text x="480" y="248" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#d29922" font-family="Consolas, monospace">Task 4:  git restore --staged file3.txt</text>
  <text x="480" y="267" text-anchor="middle" font-size="12.5" fill="#57606a">ถอน file3.txt ออกจาก staging area — เนื้อหาไฟล์ใน Working Directory ไม่เปลี่ยน</text>

  <!-- Task 2 : git restore source HEAD (blue) Repository to Working Directory -->
  <polyline points="720,200 720,330 200,330 200,207" fill="none" stroke="#1f6feb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="460" y="352" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f6feb" font-family="Consolas, monospace">Task 2:  git restore --source=HEAD file1.txt</text>
  <text x="460" y="371" text-anchor="middle" font-size="12.5" fill="#57606a">ทิ้งการแก้ไขที่ยังไม่ commit — ดึง file1.txt จาก commit ล่าสุด (HEAD) กลับมาทับ</text>

  <!-- Task 3 : git restore source HEAD~N (purple) Repository to Working Directory -->
  <polyline points="780,200 780,408 120,408 120,207" fill="none" stroke="#8250df" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="460" y="430" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8250df" font-family="Consolas, monospace">Task 3:  git restore --source=HEAD~N file2.txt</text>
  <text x="460" y="449" text-anchor="middle" font-size="12.5" fill="#57606a">ย้อน file2.txt กลับไปเป็นเวอร์ชันของ commit ที่ N ครั้งก่อน HEAD (ลองเปลี่ยน N = 1, 2, 3, ...)</text>

  <text x="450" y="482" text-anchor="middle" font-size="12.5" font-style="italic" fill="#57606a">HEAD = commit ล่าสุด, HEAD~N = commit ที่อยู่ก่อน HEAD ไป N ครั้ง (ดูรายละเอียดในรูปประกอบของ Task 3)</text>
</svg>
