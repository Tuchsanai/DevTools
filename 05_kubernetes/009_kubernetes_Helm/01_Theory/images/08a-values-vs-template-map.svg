<rect width="1250" height="946" fill="#ffffff"/>
<text x="625" y="42" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="24" font-weight="700" fill="#0f172a" xml:space="preserve">template ดึงค่าจาก values.yaml ตามชื่อและการเยื้อง</text>
<text x="625" y="74" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="400" fill="#475569" xml:space="preserve">วงสีเดียวกัน = ช่องในแม่พิมพ์ กับค่าที่มาเติม  ·  .Values.image.tag = เดินเข้า image แล้วหา tag</text>
