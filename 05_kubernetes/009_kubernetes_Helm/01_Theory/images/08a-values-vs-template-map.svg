<text x="850" y="258" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="15" font-weight="700" fill="#64748b" xml:space="preserve">ชื่อตอน helm install ไม่ได้มาจาก values</text>
<circle cx="230" cy="332" r="14" fill="#64748b" stroke="#fff" stroke-width="2"/>
<text x="230" y="338" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">5</text>
<text x="250" y="338" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="15" font-weight="700" fill="#64748b" xml:space="preserve">ใช้ใน service.yaml</text>
<circle cx="455" cy="238" r="15" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<text x="455" y="244" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">1</text>
<text x="455" y="271" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="14" font-weight="700" fill="#ea580c" xml:space="preserve">.Values.replicas</text>
<circle cx="472" cy="465" r="15" fill="#7c3aed" stroke="#fff" stroke-width="2"/>
<text x="472" y="471" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">3</text>
<text x="472" y="498" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="14" font-weight="700" fill="#7c3aed" xml:space="preserve">.Values.message</text>
<circle cx="401" cy="294" r="15" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<text x="401" y="299" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">2</text>
<text x="401" y="327" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="14" font-weight="700" fill="#2563eb" xml:space="preserve">.Values.image.*</text>
<circle cx="48" cy="746" r="14" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<text x="48" y="752" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">1</text>
<text x="86" y="752" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">{{ .Values.replicas }} = ค่าของ key replicas ใน values.yaml → replicas: 2</text>
<circle cx="48" cy="782" r="14" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<text x="48" y="788" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">2</text>
<text x="86" y="788" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">{{ .Values.image.tag }} เดินตามการเยื้อง: เข้า image แล้วหา tag → &quot;traefik/whoami:v1.11.0&quot; (หัวข้อ 6.2)</text>
<circle cx="48" cy="818" r="14" fill="#7c3aed" stroke="#fff" stroke-width="2"/>
<text x="48" y="824" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">3</text>
<text x="86" y="824" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">{{ .Values.message | quote }} = hello-v1 แล้วใส่ &quot; &quot; ให้ → [&quot;--name&quot;, &quot;hello-v1&quot;] (หัวข้อ 6.4)</text>
<circle cx="48" cy="854" r="14" fill="#64748b" stroke="#fff" stroke-width="2"/>
<text x="48" y="860" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">4</text>
<text x="86" y="860" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">{{ .Release.Name }} มาจากชื่อตอน helm install hello ... ไม่ได้มาจาก values ใช้ช่องเดียวกัน 3 ที่ ป้ายจึงตรงกันเสมอ</text>
<circle cx="48" cy="890" r="14" fill="#64748b" stroke="#fff" stroke-width="2"/>
<text x="48" y="896" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">5</text>
<text x="86" y="896" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">service.nodePort ใช้ในไฟล์ templates/service.yaml ส่วน key ที่ส่งมาผิดชื่อ Helm ไม่ฟ้อง แค่ไม่มีช่องไหนหยิบไปใช้ (หัวข้อ 10)</text>
</svg>