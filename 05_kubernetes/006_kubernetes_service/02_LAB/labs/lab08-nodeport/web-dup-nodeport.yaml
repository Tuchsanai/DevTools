# LAB 8 (ตั้งใจผิด): ขอ nodePort 30080 ซ้ำ — 1 เลขใช้ได้ Service เดียวทั้งคลัสเตอร์
apiVersion: v1
kind: Service
metadata:
  name: web-dup            # ชื่อไม่ซ้ำ แต่เลข nodePort ซ้ำ
  namespace: shop
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: http
      nodePort: 30080      # ← ซ้ำกับ web-nodeport
