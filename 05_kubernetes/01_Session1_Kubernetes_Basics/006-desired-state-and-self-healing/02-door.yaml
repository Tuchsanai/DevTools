apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web # ส่ง request ไปยัง Pod ที่ ReplicaSet ดูแล
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  ingressClassName: nginx
  rules:
    - http: # ไม่ใส่ host เพื่อเปิดผ่าน localhost ได้ตรง ๆ
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
