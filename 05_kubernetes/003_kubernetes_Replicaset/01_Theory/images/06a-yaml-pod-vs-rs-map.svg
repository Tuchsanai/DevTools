<text x="48" y="832" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">4</text>
<text x="86" y="833" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">spec ของ Pod (containers ทั้งก้อน) ย้ายเข้าไปอยู่ใต้ template.spec โดยเยื้องลึกขึ้น</text>
<circle cx="48" cy="863" r="14" fill="#16a34a" stroke="#fff" stroke-width="2"/>
<text x="48" y="868" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">5</text>
<text x="86" y="869" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">replicas / selector เพิ่มใหม่ เป็นของ ReplicaSet เอง: อยากได้กี่ตัว และนับ Pod จากป้ายไหน</text>
<circle cx="48" cy="899" r="14" fill="#dc2626" stroke="#fff" stroke-width="2"/>
<text x="48" y="904" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">6</text>
<text x="86" y="905" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">ป้ายใน selector ต้องตรงกับป้ายใน template ทุกตัวอักษร ไม่งั้น apply ไม่ผ่าน</text>
