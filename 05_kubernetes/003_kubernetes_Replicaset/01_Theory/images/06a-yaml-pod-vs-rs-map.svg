<circle cx="48" cy="791" r="14" fill="#7c3aed" stroke="#fff" stroke-width="2"/>
<text x="48" y="796" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">3</text>
