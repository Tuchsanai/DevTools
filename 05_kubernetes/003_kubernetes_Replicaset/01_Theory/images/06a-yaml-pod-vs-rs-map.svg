<circle cx="48" cy="755" r="14" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<text x="48" y="760" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">2</text>
