---
apiVersion: v1
kind: Pod
metadata:
  name: pantry
  labels:
    lab: "03"
    group: pantry
spec:
  nodeSelector:
    kubernetes.io/hostname: lab-worker   # ครัวเก็บของอยู่บนเรือที่จะเข้าอู่
  volumes:
    - name: scratch
      emptyDir: {}                 # ข้อมูลอยู่บน node → drain ต้องยืนยันด้วย --delete-emptydir-data
  containers:
    - name: web
      image: nginx:1.27-alpine
      volumeMounts:
        - name: scratch
          mountPath: /scratch
