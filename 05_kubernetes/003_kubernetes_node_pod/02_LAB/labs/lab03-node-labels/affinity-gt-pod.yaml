# LAB 3: operator Gt — เลือกเรือที่ป้าย deck มีค่ามากกว่า 3 (ค่าใน label เป็นข้อความ แต่ Gt/Lt ตีความเป็นจำนวนเต็ม)
apiVersion: v1
kind: Pod
metadata:
  name: affinity-gt-pod
  labels:
    lab: "03"
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: deck             # label deck=5 (lab-worker2) / deck=2 (lab-worker)
                operator: Gt          # Greater than: ผ่านเฉพาะเรือที่ deck > 3
                values: ["3"]         # ต้องใส่ค่าเดียว และเป็นตัวเลขในเครื่องหมายคำพูด
  containers:
    - name: web
      image: nginx:1.27-alpine
