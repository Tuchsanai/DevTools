<text x="277" y="420" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="15" font-weight="700" fill="#16a34a" xml:space="preserve">ขอเท่าไร แบบไหน</text>
