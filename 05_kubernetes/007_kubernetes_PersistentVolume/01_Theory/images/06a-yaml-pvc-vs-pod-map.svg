<text x="545" y="446" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="14" font-weight="700" fill="#dc2626" xml:space="preserve">ต้องตรงกัน</text>
<circle cx="48" cy="638" r="14" fill="#dc2626" stroke="#fff" stroke-width="2"/>
<text x="48" y="644" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">1</text>
<text x="86" y="644" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">claimName ต้องตรงกับชื่อ PVC ทุกตัวอักษร ไม่ตรง (หรือยังไม่มี PVC) = Pod ค้าง Pending</text>
<circle cx="48" cy="674" r="14" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<text x="48" y="680" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">2</text>
<text x="86" y="680" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">ชื่อ volume ใต้ volumes ต้องตรงกับชื่อใต้ volumeMounts เหมือน emptyDir ในบทที่ 2</text>
<circle cx="48" cy="710" r="14" fill="#0d9488" stroke="#fff" stroke-width="2"/>
<text x="48" y="716" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">3</text>
<text x="86" y="716" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">mountPath: /data = โฟลเดอร์ที่แอปเห็น ไฟล์ที่เขียนใต้ /data ไปอยู่บนที่เก็บของ PVC (รอดแม้ลบ Pod)</text>
<circle cx="48" cy="746" r="14" fill="#16a34a" stroke="#fff" stroke-width="2"/>
<text x="48" y="752" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">4</text>
<text x="86" y="752" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">accessModes / storage อยู่ฝั่ง PVC เท่านั้น: ขอพื้นที่ 100Mi เขียนได้จาก Node เดียว (หัวข้อ 4)</text>
<circle cx="48" cy="782" r="14" fill="#64748b" stroke="#fff" stroke-width="2"/>
<text x="48" y="788" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">5</text>
<text x="86" y="788" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">ชื่อ Pod notes-pvc-pod คล้ายชื่อ PVC แต่ไม่เกี่ยวกัน ที่ต้องตรงคือ claimName เท่านั้น</text>
