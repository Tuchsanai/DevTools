# LAB 1–3: โซน (namespace) deploy-lab — ใช้ต่อเนื่อง LAB 1 → 3 แล้วลบทิ้งตอนจบ LAB 3
apiVersion: v1
kind: Namespace
metadata:
  name: deploy-lab             # ทุกคำสั่งของ LAB นี้ใช้ -n deploy-lab และลบทั้งโซนตอนจบ
  labels:
    team: som                  # label ไว้จัดกลุ่ม/ค้นหา ไม่มีผลต่อการทำงาน
