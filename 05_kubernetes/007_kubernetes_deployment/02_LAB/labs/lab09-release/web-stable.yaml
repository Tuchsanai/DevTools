# LAB 9 canary: รุ่นเสถียร 4 replicas (track=stable)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-stable
  namespace: release-lab
spec:
  replicas: 4
  selector:
    matchLabels:
      app: web
      track: stable
  template:
    metadata:
      labels:
        app: web                   # ป้ายร่วม — Service แบบไม่ระบุรุ่นเลือกได้ทุกตัว
        track: stable
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          env:
            - name: VERSION
              value: stable
          command: ["sh", "-c", "echo \"web $VERSION from $(hostname)\" > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 2
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
