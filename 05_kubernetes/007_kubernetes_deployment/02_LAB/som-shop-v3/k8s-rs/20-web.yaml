# LAB 10 (จุดเริ่ม = สำเนาจากบท 006 ค่าไม่แก้ เพิ่มแค่คอมเมนต์): หน้าร้าน — ReplicaSet som-web 3 บูธ + Service NodePort som-web (30080)
# ทุกบูธต่อ db กลางตัวเดียวผ่านชื่อ Service som-db → ออเดอร์จากทุกบูธรวมที่เดียว (แก้ปัญหาบท 005)
apiVersion: apps/v1
kind: ReplicaSet               # ไม่มีผู้จัดการ — ขั้น 10.4 ให้ Deployment som-web มารับเลี้ยง
metadata:
  name: som-web
  namespace: som-shop
  labels:
    app: som-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: som-web
  template:
    metadata:
      labels:
        app: som-web
    spec:
      terminationGracePeriodSeconds: 30  # ยังไม่มี preStop → ตอนแปลง (10.4) บูธเดิมถูกปิดทันที อาจเห็น error
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # 1) รอจน Service som-db มี db ที่พร้อม
        - name: wait-for-db
          image: postgres:17.11-alpine
          command:
            - sh
            - -c
            - until pg_isready -h som-db -p 5432 -U som -d catshop; do echo "รอฐานข้อมูล som-db..."; sleep 2; done; echo "ฐานข้อมูลพร้อมแล้ว"
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
        # 2) เติมสินค้าเข้าชั้น (สร้างตาราง + สินค้าตั้งต้น) — ทุก Pod รัน แต่มี advisory lock กันชน
        - name: db-seed
          image: som-shop-web:1.2
          imagePullPolicy: IfNotPresent
          command: ["node", "scripts/seed.mjs"]
          securityContext:
            runAsUser: 1000          # USER node ของ image เป็น "ชื่อ" → ใส่เลขให้ runAsNonRoot ตรวจได้
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATABASE_URL
              value: postgres://som:meow1234@som-db:5432/catshop
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 256Mi }
      containers:
        - name: web
          image: som-shop-web:1.2    # รุ่นและธีมฝังอยู่ใน image (APP_VERSION/APP_THEME)
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POD_NAMESPACE    # Downward API (บท 003)
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SHOP_NAME
              value: "ร้านอาหารแมวน้องส้ม"
            - name: SHOP_FOOTER
              value: "Next.js + PostgreSQL · Kubernetes LAB 006 · namespace $(POD_NAMESPACE)"
            - name: DATABASE_URL     # เรียก db ด้วยชื่อ Service (ไม่ใช่ IP ของ Pod db)
              value: postgres://som:meow1234@som-db:5432/catshop
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:            # ต่อ db ได้ไหม (SELECT 1) → ไม่ผ่าน = Service ไม่ส่งลูกค้ามา
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 3
            failureThreshold: 2  # ล้ม 2 ครั้งติด (~6 วิ) = not ready
          livenessProbe:             # process ยังไม่ค้าง (ไม่แตะ db)
            httpGet:
              path: /api/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
# ประภาคารของหน้าร้าน: NodePort 30080 → เปิด http://localhost:30080 บนเครื่องนักศึกษา
apiVersion: v1
kind: Service
metadata:
  name: som-web
  namespace: som-shop
spec:
  type: NodePort
  selector:
    app: som-web
  ports:
    - port: 80
      targetPort: http       # = 3000 ของ container web
      nodePort: 30080          # จองได้ทีละ Service ทั้งคลัสเตอร์
