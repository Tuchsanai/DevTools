<text x="843" y="419" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">5</text>
<text x="863" y="420" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="15" font-weight="700" fill="#0d9488" xml:space="preserve">port ของ Service เอง</text>
<circle cx="194" cy="306" r="14" fill="#64748b" stroke="#fff" stroke-width="2"/>
<text x="194" y="311" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">6</text>
<text x="214" y="312" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="15" font-weight="700" fill="#64748b" xml:space="preserve">Service ไม่มีส่วนนี้</text>
<circle cx="585" cy="184" r="15" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<text x="585" y="190" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">1</text>
<text x="585" y="217" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="14" font-weight="700" fill="#ea580c" xml:space="preserve">คนละกลุ่ม</text>
<circle cx="585" cy="252" r="15" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<text x="585" y="257" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">2</text>
<text x="585" y="284" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="14" font-weight="700" fill="#2563eb" xml:space="preserve">ชื่อซ้ำได้</text>
<circle cx="585" cy="427" r="15" fill="#dc2626" stroke="#fff" stroke-width="2"/>
<text x="585" y="432" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">3</text>
<text x="585" y="460" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="14" font-weight="700" fill="#dc2626" xml:space="preserve">ต้องตรงกัน</text>
<circle cx="585" cy="562" r="15" fill="#db2777" stroke="#fff" stroke-width="2"/>
<text x="585" y="568" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">4</text>
<text x="585" y="595" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="14" font-weight="700" fill="#db2777" xml:space="preserve">ต้องตรงกัน</text>
<circle cx="48" cy="746" r="14" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<text x="48" y="752" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">1</text>
<text x="86" y="752" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">apiVersion / kind: Service อยู่กลุ่มหลัก v1 (เหมือน Pod) ไม่ใช่ apps/v1 แบบ Deployment</text>
<circle cx="48" cy="782" r="14" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<text x="48" y="788" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">2</text>
<text x="86" y="788" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">name ซ้ำกันได้เพราะคนละชนิด ชื่อ Service = ชื่อที่ Pod อื่นใช้เรียก (http://web)</text>
<circle cx="48" cy="818" r="14" fill="#dc2626" stroke="#fff" stroke-width="2"/>
<text x="48" y="824" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">3</text>
<text x="86" y="824" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">selector ของ Service ต้องตรงกับป้ายใน template ของ Deployment (= ป้ายบนตัว Pod) และไม่มี matchLabels</text>
<circle cx="48" cy="854" r="14" fill="#db2777" stroke="#fff" stroke-width="2"/>
<text x="48" y="860" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">4</text>
<text x="86" y="860" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">targetPort ต้องตรงกับ containerPort = port ที่แอปใน Pod ฟังจริง</text>
<circle cx="48" cy="890" r="14" fill="#0d9488" stroke="#fff" stroke-width="2"/>
<text x="48" y="896" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">5</text>
<text x="86" y="896" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">port: 80 = port ของ Service เอง ที่คนเรียกใช้ (คนละเลขกับ targetPort ก็ได้ หัวข้อ 5)</text>
<circle cx="48" cy="926" r="14" fill="#64748b" stroke="#fff" stroke-width="2"/>
<text x="48" y="932" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">6</text>
<text x="86" y="932" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">replicas / template (เส้นประสีเทา) มีแค่ฝั่ง Deployment: Service ไม่สร้าง Pod ลบ Service แล้ว Pod ยังอยู่</text>
</svg>