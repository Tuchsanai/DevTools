<text x="560" y="42" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="24" font-weight="700" fill="#0f172a" xml:space="preserve">Service ไม่สร้าง Pod แค่ชี้ไปหา Pod ด้วยป้าย และส่งต่อไปที่ port</text>
<text x="560" y="74" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="400" fill="#475569" xml:space="preserve">วงสีเดียวกัน = ส่วนที่ต้องตรงกัน  ·  ลูกศรบอกว่า Service เอาค่ามาจากไหนใน Deployment</text>
