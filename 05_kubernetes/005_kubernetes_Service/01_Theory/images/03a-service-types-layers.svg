<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
<defs><marker id="morange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="mgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="mred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="mblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mnavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="mgray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="mteal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="mpurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="msky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker><marker id="mslate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="600" fill="#ffffff"/>
<text x="600" y="44" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="27" font-weight="700" fill="#0f172a" xml:space="preserve">Service มี 3 แบบ (ค่าของ type:) — ซ้อนกันเป็นชั้น</text>
<text x="600" y="78" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#475569" xml:space="preserve">แบบที่อยู่ชั้นนอกได้ทุกอย่างของแบบที่อยู่ข้างใน แล้วเพิ่มทางเข้าจากนอกคลัสเตอร์อีกชั้น</text>
<rect x="30" y="110" width="1140" height="460" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
<text x="54" y="148" text-anchor="start" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#7c3aed" xml:space="preserve">LoadBalancer</text>
<text x="235" y="147" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#334155" xml:space="preserve">= NodePort + load balancer ของคลาวด์ (EXTERNAL-IP)</text>
<rect x="945" y="129" width="205" height="25" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="1048" y="147" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="14" font-weight="700" fill="#7c3aed" xml:space="preserve">ใช้บนคลาวด์ · ลองใน LAB 3</text>
<rect x="70" y="200" width="1060" height="350" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="94" y="238" text-anchor="start" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#ea580c" xml:space="preserve">NodePort</text>
<text x="221" y="237" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#334155" xml:space="preserve">= ClusterIP + nodePort 30000–32767 บน Node ทุกตัว</text>
<rect x="1041" y="219" width="69" height="25" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
<text x="1076" y="237" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="14" font-weight="700" fill="#ea580c" xml:space="preserve">LAB 3–4</text>
<rect x="110" y="290" width="980" height="240" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="134" y="328" text-anchor="start" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#2563eb" xml:space="preserve">ClusterIP</text>
<text x="274" y="327" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#334155" xml:space="preserve">ชื่อ DNS + IP ภายในคลัสเตอร์ (ค่าเริ่มต้น)</text>
<rect x="1001" y="309" width="69" height="25" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="1036" y="327" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="14" font-weight="700" fill="#2563eb" xml:space="preserve">LAB 1–2</text>
<rect x="140" y="360" width="920" height="140" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
<text x="600" y="392" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="700" fill="#0d9488" xml:space="preserve">ใครเรียกได้</text>
<text x="300" y="424" text-anchor="start" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#2563eb" xml:space="preserve">ClusterIP</text>
<text x="450" y="424" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="400" fill="#334155" xml:space="preserve">Pod ในคลัสเตอร์เท่านั้น  →  http://som-menu</text>
<text x="300" y="452" text-anchor="start" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#ea580c" xml:space="preserve">NodePort</text>
<text x="450" y="452" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="400" fill="#334155" xml:space="preserve">+ เครื่องนอกคลัสเตอร์  →  &lt;Node IP ตัวไหนก็ได้&gt;:30080</text>
<text x="300" y="480" text-anchor="start" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#7c3aed" xml:space="preserve">LoadBalancer</text>
<text x="450" y="480" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="400" fill="#334155" xml:space="preserve">+ ผู้ใช้บนอินเทอร์เน็ต  →  &lt;EXTERNAL-IP&gt;:80 ที่อยู่เดียว</text>
</svg>