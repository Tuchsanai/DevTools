# LAB 4: Pod หลงที่ติดป้าย app=snack เหมือนบูธของ snack-rs แต่ทำงานคนละอย่าง (command ต่าง)
apiVersion: v1
kind: Pod
metadata:
  name: stray
  namespace: rs-lab
  labels:
    app: snack               # ป้ายตรง selector ของ snack-rs → หัวหน้ากะนับรวม
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo ฉันคือ stray ไม่ได้มาจากแบบพิมพ์; sleep 3600"]
