# LAB 8: anti-affinity แบบขอร้อง — พยายามแยกเรือ ถ้าไม่ได้ก็ยอมอยู่ด้วยกัน (คาด 2+1)
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: spread-pref
  namespace: rs-spread
spec:
  replicas: 3   # 3 บูธบน worker 2 ลำ
  selector:
    matchLabels:
      app: spread-pref
  template:
    metadata:
      labels:
        app: spread-pref
    spec:
      terminationGracePeriodSeconds: 1
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:   # ขอร้อง: ทำตามไม่ได้ก็ยังวางได้
            - weight: 100   # น้ำหนักสูงสุด (1–100) ตอนให้คะแนน Node
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: spread-pref
                topologyKey: kubernetes.io/hostname   # 1 เรือ = 1 โดเมน
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
