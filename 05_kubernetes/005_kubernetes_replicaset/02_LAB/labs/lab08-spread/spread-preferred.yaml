# LAB 8: anti-affinity แบบขอร้อง — พยายามแยกเรือ ถ้าไม่ได้ก็ยอมอยู่ด้วยกัน (คาด 2+1)
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: spread-pref
  namespace: rs-spread
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spread-pref
  template:
    metadata:
      labels:
        app: spread-pref
    spec:
      terminationGracePeriodSeconds: 1
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: spread-pref
                topologyKey: kubernetes.io/hostname
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
