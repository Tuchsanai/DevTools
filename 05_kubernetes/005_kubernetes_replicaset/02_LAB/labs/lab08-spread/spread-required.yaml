# LAB 8: anti-affinity แบบบังคับ — ห้ามบูธ app=spread-req อยู่เรือเดียวกัน (worker มีแค่ 2 ลำ → ตัวที่ 3 Pending)
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: spread-req
  namespace: rs-spread
spec:
  replicas: 3   # 3 บูธ แต่ worker มีแค่ 2 ลำ
  selector:
    matchLabels:
      app: spread-req
  template:
    metadata:
      labels:
        app: spread-req
    spec:
      terminationGracePeriodSeconds: 1
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:   # บังคับ: ทำตามไม่ได้ = ไม่วาง (Pending)
            - labelSelector:
                matchLabels:
                  app: spread-req   # ห้ามอยู่เรือเดียวกับ Pod ป้ายนี้ (รวมพวกเดียวกันเอง)
              topologyKey: kubernetes.io/hostname   # 1 เรือ = 1 โดเมน
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
