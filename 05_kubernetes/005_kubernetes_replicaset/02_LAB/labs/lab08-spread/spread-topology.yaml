# LAB 8: topologySpreadConstraints — จำนวนบูธต่อเรือต่างกันได้ไม่เกิน 1 (4 บูธ → 2+2, 5 บูธ → 2+3 หรือ 3+2)
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: spread-topo
  namespace: rs-spread
spec:
  replicas: 4   # 4 บูธ → 2+2 (ขั้นที่ 3 scale เป็น 5)
  selector:
    matchLabels:
      app: spread-topo
  template:
    metadata:
      labels:
        app: spread-topo
    spec:
      terminationGracePeriodSeconds: 1
      topologySpreadConstraints:
        - maxSkew: 1                           # ต่างกันได้ไม่เกิน 1 ตัว
          topologyKey: kubernetes.io/hostname   # นับต่อเรือ
          whenUnsatisfiable: DoNotSchedule     # ถ้าทำไม่ได้ → ไม่จัดลง (Pending)
          nodeTaintsPolicy: Honor              # ไม่นับ control-plane (มี taint) — บท 003 LAB 5
          labelSelector:   # นับเฉพาะ Pod ป้าย app=spread-topo
            matchLabels:
              app: spread-topo
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
