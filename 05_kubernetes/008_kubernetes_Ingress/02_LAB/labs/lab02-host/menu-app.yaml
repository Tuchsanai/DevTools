# LAB 2, 3: แอป "menu" 2 Pod + Service แบบ ClusterIP (ไม่เปิด NodePort เอง — ให้ Ingress พาลูกค้ามา)
# image whoami ตอบกลับว่า Pod ไหนรับ และได้คำขอหน้าตาแบบไหน (path, Host)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: menu
  template:
    metadata:
      labels:
        app: menu
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          args: ["--name", "menu"]   # บรรทัดแรกของคำตอบจะเป็น Name: menu
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: menu
spec:
  selector:
    app: menu
  ports:
    - port: 80
      targetPort: 80
