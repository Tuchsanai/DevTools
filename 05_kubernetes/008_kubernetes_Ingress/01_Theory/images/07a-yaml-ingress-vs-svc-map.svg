<text x="585" y="433" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="14" font-weight="700" fill="#dc2626" xml:space="preserve">ชื่อ Service</text>
<circle cx="585" cy="494" r="15" fill="#db2777" stroke="#fff" stroke-width="2"/>
<text x="585" y="500" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">2</text>
<text x="585" y="528" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="14" font-weight="700" fill="#db2777" xml:space="preserve">port ของ Service</text>
<circle cx="48" cy="719" r="14" fill="#dc2626" stroke="#fff" stroke-width="2"/>
<text x="48" y="724" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">1</text>
<text x="86" y="725" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">service.name ต้องตรงกับชื่อ Service ผิดแล้ว apply ผ่านเงียบ ๆ แต่ลูกค้าได้ 404 (หัวข้อ 10)</text>
<circle cx="48" cy="755" r="14" fill="#db2777" stroke="#fff" stroke-width="2"/>
<text x="48" y="760" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">2</text>
<text x="86" y="761" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">port.number ต้องตรงกับ port ของ Service (ไม่ใช่ targetPort และไม่ใช่ containerPort)</text>
<circle cx="48" cy="791" r="14" fill="#64748b" stroke="#fff" stroke-width="2"/>
<text x="48" y="796" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">3</text>
<text x="86" y="797" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">targetPort เป็นเรื่องระหว่าง Service กับ Pod (บทที่ 5) Ingress ไม่ต้องรู้</text>
<circle cx="48" cy="827" r="14" fill="#0d9488" stroke="#fff" stroke-width="2"/>
<text x="48" y="832" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">4</text>
<text x="86" y="833" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">host = ชื่อที่ลูกค้าพิมพ์ใน browser เขียนแค่ชื่อ ไม่มี http:// และไม่มี port</text>
<circle cx="48" cy="863" r="14" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<text x="48" y="868" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">5</text>
<text x="86" y="869" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">ingressClassName ต้องตรงกับชื่อใน kubectl get ingressclass ไม่งั้นไม่มียามคนไหนอ่านป้ายนี้</text>
