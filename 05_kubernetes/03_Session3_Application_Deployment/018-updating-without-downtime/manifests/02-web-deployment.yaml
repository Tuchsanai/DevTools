apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab018
spec:
  replicas: 3
  minReadySeconds: 5
  # เพิ่มใหม่ได้ 1 และห้ามลด Pod พร้อมใช้งานระหว่าง rollout
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: k8s-lab-web:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: web-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # Service ส่ง request ให้เมื่อ endpoint นี้ผ่านเท่านั้น
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 2
            timeoutSeconds: 1
