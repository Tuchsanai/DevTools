<text x="48" y="778" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">1</text>
<text x="86" y="779" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">name ต้องเหมือนเดิม apply แล้วจึงเป็นการแก้ Deployment ตัวเดิม (configured) เปลี่ยนชื่อ = ได้ Deployment ใหม่อีกตัว</text>
<circle cx="48" cy="809" r="14" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<text x="48" y="814" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">2</text>
<text x="86" y="815" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">change-cause แก้เป็นข้อความของรุ่นใหม่ ไปโผล่ใน rollout history (ขั้นที่ 6) แก้คู่กับ image เสมอ</text>
<circle cx="48" cy="845" r="14" fill="#dc2626" stroke="#fff" stroke-width="2"/>
<text x="48" y="850" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">3</text>
<text x="86" y="851" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">image อยู่ใต้ template: แม่พิมพ์เปลี่ยน → hash ใหม่ → ReplicaSet ใหม่ → ทยอยเปลี่ยน Pod (revision 2)</text>
<circle cx="48" cy="881" r="14" fill="#7c3aed" stroke="#fff" stroke-width="2"/>
<text x="48" y="886" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">4</text>
<text x="86" y="887" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">selector และป้ายใน template ห้ามแก้ selector ของ Deployment แก้ไม่ได้หลังสร้าง (apply แล้วขึ้น field is immutable)</text>
<circle cx="48" cy="917" r="14" fill="#0369a1" stroke="#fff" stroke-width="2"/>
<text x="48" y="922" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">5</text>
<text x="86" y="923" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">แก้อะไรก็ได้ใต้ template (เส้นประ) = เปลี่ยนรุ่น ส่วน replicas แก้แล้วแค่ scale ไม่เกิดรุ่นใหม่</text>
</svg>