services:
  db:
    image: k8s-lab-db:v1
    environment:
      POSTGRES_DB: skillspace
      POSTGRES_USER: opsuser
      POSTGRES_PASSWORD: labpass
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsuser -d skillspace && psql -U opsuser -d skillspace -Atc 'SELECT 1 FROM assets LIMIT 1'"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 15s

  api:
    image: k8s-lab-api:v1
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: skillspace
      DB_USER: opsuser
      DB_PASSWORD: labpass
      APP_VERSION: v1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    image: k8s-lab-web:v1
    environment:
      API_BASE_URL: http://api:8000
      SITE_NAME: SkillSpace
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/readyz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
