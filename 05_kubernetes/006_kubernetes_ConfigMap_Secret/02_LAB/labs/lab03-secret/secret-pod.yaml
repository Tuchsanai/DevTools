# LAB 3: Pod ที่อ่านรหัสผ่านจาก Secret admin-secret มาเป็นตัวแปร env
apiVersion: v1
kind: Pod
metadata:
  name: secret-pod
spec:
  containers:
    - name: busybox
      image: busybox:1.37
      command: ["sleep", "3600"]
      env:
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:              # เหมือน configMapKeyRef แต่ดึงจาก Secret
              name: admin-secret
              key: ADMIN_PASSWORD
