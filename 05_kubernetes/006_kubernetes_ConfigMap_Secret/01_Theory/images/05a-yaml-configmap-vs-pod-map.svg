<text x="48" y="698" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">1</text>
<text x="86" y="698" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">name: shop-config ทั้ง 2 ที่ใน Pod ต้องตรงกับชื่อ ConfigMap ไม่ตรง = ไม่มีแฟ้มนี้ container ไม่ยอมเริ่ม (หัวข้อ 5)</text>
<circle cx="48" cy="728" r="14" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<text x="48" y="734" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">2</text>
<text x="86" y="734" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">configMapKeyRef: key ต้องตรงกับชื่อ key ใต้ data ทุกตัวอักษร (หยิบทีละ key)</text>
<circle cx="48" cy="764" r="14" fill="#7c3aed" stroke="#fff" stroke-width="2"/>
<text x="48" y="770" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">3</text>
<text x="86" y="770" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">envFrom: ทุก key ใต้ data กลายเป็นตัวแปร ชื่อตัวแปร = ชื่อ key (ได้ครบ 3 ตัว)</text>
<circle cx="48" cy="800" r="14" fill="#64748b" stroke="#fff" stroke-width="2"/>
<text x="48" y="806" text-anchor="middle" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="16" font-weight="700" fill="#fff" xml:space="preserve">4</text>
<text x="86" y="806" text-anchor="start" font-family="'Noto Sans Thai', 'Leelawadee UI', Tahoma, Thonburi, sans-serif" font-size="17" font-weight="400" fill="#1e293b" xml:space="preserve">name: SHOP_NAME ใต้ env คือชื่อตัวแปรที่แอปเห็น ตั้งเองได้ ไม่ต้องตรงกับ key</text>
