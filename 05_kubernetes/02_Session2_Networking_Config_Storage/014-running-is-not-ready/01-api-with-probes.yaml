apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lab014
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: k8s-lab-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "5432" # ใช้เลขพอร์ตสำหรับ connection string
            - name: DB_NAME
              value: skillspace
            - name: DB_USER
              value: opsuser
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /ready # เช็ก dependency ด้วย SELECT 1
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health # เช็กเฉพาะ process ของ API
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lab014
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: http
