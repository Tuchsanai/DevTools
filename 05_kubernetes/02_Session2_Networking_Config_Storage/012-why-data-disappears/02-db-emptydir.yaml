apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: lab012
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: k8s-lab-db:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres # Service เดิมอ้าง targetPort ด้วยชื่อนี้
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: skillspace
            - name: POSTGRES_USER
              value: opsuser
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {} # อยู่รอดเมื่อ container restart แต่หายพร้อม Pod
