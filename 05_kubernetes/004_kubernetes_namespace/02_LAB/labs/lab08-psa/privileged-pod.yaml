# LAB 8: ขอสิทธิ์ privileged (เข้าถึงเครื่องได้เกือบทั้งหมด) → baseline ปฏิเสธ
apiVersion: v1
kind: Pod
metadata:
  name: privileged
  namespace: secure
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
