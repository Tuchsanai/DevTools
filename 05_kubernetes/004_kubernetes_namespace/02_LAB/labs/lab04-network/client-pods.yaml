# LAB 4: ตัวทดสอบ (busybox มี wget) โซนละ 1 ตัว บนเรือ lab-worker ทั้งคู่
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: team-a
  labels:
    app: client
    lab: net
spec:
  nodeSelector:
    kubernetes.io/hostname: lab-worker
  terminationGracePeriodSeconds: 1
  containers:
    - name: sh
      image: busybox:1.36
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: client                   # ชื่อเดียวกันได้ เพราะอยู่คนละ namespace
  namespace: team-b
  labels:
    app: client
    lab: net
spec:
